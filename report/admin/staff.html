<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>운영자 콘솔 · 인연의 광장</title>
<!-- 7단계 관리자 권한 분리: 운영자 열쇠(mts_…)로 들어오는 화면. 관리자 비밀번호 화면(/report/admin/)과 따로 둔다.
     열쇠 확인 → /api/community/staff?view=me 로 역할 → v2-community.js 가 역할에 맞는 카드만 그린다(서버도 같은 권한을 다시 확인).
     스타일은 관리자 화면(index.html)과 같다. 열쇠는 이 탭(sessionStorage)에만 둔다. -->
<style>
:root { --bg:#0A0C14; --bg2:#10131E; --panel:#141828; --line:#262C42; --ink:#ECE7DB; --ink2:#B7B2A6; --ink3:#8A8678; --gold:#E0BC74; --gold-d:#A98846; --red:#FF8A78; --green:#62C2AE; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
h1,h2,h3 { margin:0; font-family:"Noto Serif KR","Nanum Myeongjo",serif; }
.wrap { max-width:1100px; margin:0 auto; padding:0 16px 64px; }
header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 0; flex-wrap:wrap; }
header h1 { font-size:1.2rem; color:var(--gold); }
button, select, input, textarea { font:inherit; color:var(--ink); }
button { cursor:pointer; border:1px solid var(--line); background:var(--panel); padding:7px 14px; border-radius:6px; }
button:hover { border-color:var(--gold-d); }
a.navbtn { display:inline-block; text-decoration:none; color:var(--ink); border:1px solid var(--line); background:var(--panel); padding:7px 14px; border-radius:6px; white-space:nowrap; }
a.navbtn:hover { border-color:var(--gold-d); color:var(--gold); }
button.pri { background:linear-gradient(180deg,#F0D08A,#C9A257); color:#1A1308; border-color:var(--gold); font-weight:700; }
button.danger { color:var(--red); }
button:disabled { opacity:.5; cursor:default; }
input[type=text], input[type=password], input[type=number], input[type=url], input:not([type]), input[type=search], input[type=email], input[type=date], input[type=time], select, textarea { background:var(--bg); color:inherit; border:1px solid var(--line); border-radius:6px; padding:7px 10px; width:100%; }
textarea { resize:vertical; min-height:60px; }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
body:not([data-pane="lib"]) #saveBtn, body:not([data-pane="lib"]) #saveState { display:none; }
.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap; }
.tabs button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--ink2); padding:10px 16px; }
.tabs .tg { align-self:center; font-size:.68rem; letter-spacing:.12em; color:var(--ink3); padding:0 6px 0 14px; border-left:1px solid var(--line); margin-left:6px; }
.tabs button.on { color:var(--gold); border-color:var(--gold); }
#grpBar { margin-bottom:6px; } #grpBar button { font-weight:600; }
.tabs.sub { margin-top:0; } .tabs.sub button { padding:7px 14px; font-size:.9rem; }
.tabs [hidden] { display:none !important; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
.row > label { display:grid; gap:4px; font-size:.82rem; color:var(--ink2); }
.muted { color:var(--ink3); font-size:.85rem; }
.err { color:var(--red); } .ok { color:var(--green); }
.chip { display:inline-block; font-size:.74rem; padding:1px 8px; border-radius:999px; background:#1E2440; color:var(--gold); margin:1px 2px 1px 0; white-space:nowrap; }
.chip.gray { background:#1B1F30; color:var(--ink3); }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--ink3); font-weight:500; font-size:.8rem; }
.hide { display:none !important; }
.hmgrid { display:grid; grid-template-columns:minmax(360px,470px) minmax(0,1fr); gap:16px; align-items:start; }
.hmleft { display:flex; flex-direction:column; height:calc(100vh - 140px); min-height:480px; min-width:0; }
.hmed { flex:1; min-height:0; overflow:auto; padding-right:6px; }
.hmsel { max-height:44%; overflow:auto; margin:6px 0 8px; padding:10px 12px; flex:none; }
.hmsel .g2 { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; } .hmsel .g2 .hmf { margin:4px 0; }
.hmthumb { width:34px; height:34px; object-fit:cover; border-radius:4px; border:1px solid var(--line); background:#000; flex:none; }
.hmimg { display:flex; gap:6px; align-items:center; } .hmimg input[type=text] { flex:1; min-width:0; } .hmimg input[type=file] { display:none; }
.hmpv { position:sticky; top:8px; }
#hmBox { height:calc(100vh - 170px); min-height:420px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#000; position:relative; }
#hmFrame { border:0; position:absolute; top:0; left:0; transform-origin:0 0; background:#080A11; }
.hmf { display:grid; gap:3px; font-size:.8rem; color:var(--ink2); margin:8px 0; }
.hmf.chk { display:flex; align-items:center; gap:8px; } .hmf.chk input { width:auto; }
.hmitem { border:1px solid var(--line); border-radius:8px; padding:4px 10px 8px; margin:8px 0; background:var(--bg); }
.hmitem > .hmh { display:flex; gap:6px; align-items:center; padding:4px 0; }
.hmh b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; font-size:.85rem; }
.hmh button, summary button.sm { padding:2px 8px; font-size:.78rem; }
details.hmg { margin:8px 0; } details.hmg > summary { display:flex; align-items:center; gap:6px; }
details.hmg > summary > span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hmsec { margin:14px 0 4px; color:var(--gold); font-family:"Noto Serif KR",serif; }
@media (max-width:1000px) { .hmgrid { grid-template-columns:1fr; } .hmleft { height:auto; } .hmed { max-height:none; } .hmpv { position:static; } }
.login { max-width:340px; margin:18vh auto 0; display:grid; gap:12px; }

dialog.wide { width:min(1120px, 96vw); }
.dlgcols { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start; }
.dlgleft { display:grid; gap:14px; min-width:0; }
.dlgright { position:sticky; top:0; }
@media (max-width:900px) { .dlgcols { grid-template-columns:1fr; } .dlgright { position:static; } }
.pvp { width:100%; max-height:none; }
dialog { background:var(--bg2); color:var(--ink); border:1px solid var(--gold-d); border-radius:12px; padding:0; width:min(760px, 94vw); max-height:92vh; }
dialog::backdrop { background:rgba(0,0,0,.6); }
dialog form { display:grid; gap:14px; padding:20px; max-height:92vh; overflow:auto; }
details { border:1px solid var(--line); border-radius:8px; padding:6px 12px; background:var(--panel); }
summary { cursor:pointer; padding:4px 0; }
.checks { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:4px 8px; padding:8px 0; }
.checks label { display:flex; gap:5px; align-items:center; font-size:.86rem; cursor:pointer; }
.pbar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; } .pbar i { display:block; height:100%; width:0; background:var(--gold); }

.player { background:#000; border-radius:10px; overflow:hidden; aspect-ratio:9/16; max-height:70vh; margin:0 auto; position:relative; display:grid; place-items:center; }
.player video { width:100%; height:100%; object-fit:contain; background:#000; }
.player .ph { padding:24px; text-align:center; color:var(--ink2); }
.cap { margin-top:8px; padding:8px 12px; border-left:2px solid var(--gold); background:var(--panel); min-height:2.4em; }
.grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,340px); gap:16px; }
@media (max-width:820px) { .grid2 { grid-template-columns:1fr; } }
.seq { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.seq li { border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--panel); cursor:pointer; }
.seq li.cur { border-color:var(--gold); }
.seq li.gap { border-style:dashed; color:var(--ink3); }
.seq b { font-weight:500; }
.facts { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin-top:12px; }
.facts label { display:grid; gap:3px; font-size:.78rem; color:var(--ink3); }

.libwrap { display:grid; grid-template-columns:300px minmax(0,1fr); gap:12px; align-items:start; }
@media (max-width:820px) { .libwrap { grid-template-columns:1fr; } }
.flist { list-style:none; margin:0; padding:0; display:grid; gap:2px; }
.flist li { display:flex; align-items:center; gap:4px; padding:5px 8px; border-radius:6px; cursor:pointer; border:1px solid transparent; }
.flist li:hover { background:var(--bg2); }
.flist li.on { background:#1E2440; color:var(--gold); }
.flist li.over { border-color:var(--gold); background:#2A2A1E; }
.flist li.dz-before { box-shadow:0 -2px 0 var(--gold); } .flist li.dz-after { box-shadow:0 2px 0 var(--gold); } .flist li.dz-in { background:#2A2A1E; outline:1px solid var(--gold); }
.flist li .tg { width:14px; text-align:center; color:var(--ink3); cursor:pointer; flex:none; } .flist li .pri { color:var(--gold); font-size:.74rem; flex:none; }
.flist li button { padding:0 3px; }
.flist li .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.flist li .ct { color:var(--ink3); font-size:.78rem; }
.flist li button { padding:0 5px; font-size:.75rem; border-color:transparent; background:none; color:var(--ink3); }
.flist li button:hover { color:var(--gold); }
.flist li { flex-wrap:wrap; }
.flist li button { display:none; } .flist li button.always { display:inline-block; font-size:.9rem; }
.flist li .acts { display:none; flex-basis:100%; gap:2px; justify-content:flex-end; padding:2px 0 0; } .flist li:hover .acts, .flist li.on .acts { display:flex; }
.flist li .acts button { display:inline-block; border:1px solid var(--line); border-radius:5px; padding:1px 7px; }
#libBody tr[draggable=true] { cursor:grab; }
#libBody tr.drag { opacity:.4; }
.grip { cursor:grab; color:var(--ink3); user-select:none; padding:0 4px; font-size:1.05rem; line-height:1; }
.grip:hover { color:var(--gold); }
.dragging { opacity:.35; }
.chrow { display:grid; grid-template-columns:20px minmax(0,1fr) auto auto auto; gap:6px; margin-bottom:6px; align-items:center; }
.chrow button { padding:6px 10px; }
.labrow { display:grid; grid-template-columns:150px minmax(0,1fr) auto auto auto; gap:6px; margin-bottom:6px; align-items:center; }
.labrow button { padding:6px 10px; white-space:nowrap; }
.cue { display:grid; grid-template-columns:20px 78px 78px minmax(0,1fr) auto auto auto; gap:6px; margin-bottom:6px; align-items:center; }
.cue button { padding:6px 10px; white-space:nowrap; }
.cue textarea { min-height:0; resize:none; overflow:hidden; line-height:1.4; padding:7px 10px; }
.cue .stale { color:var(--red); }
.fxgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:8px; padding:8px 0; }
.fxgrid label button { white-space:nowrap; } .fxgrid label.wide { grid-column:span 2; } .fxgrid label.hide { display:none; }
.fxgrid label { display:grid; gap:3px; font-size:.78rem; color:var(--ink3); }
#fxPrev { width:min(236px,60vw); max-height:none; }
.cov { overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:8px; }
.cov table { min-width:700px; font-size:.82rem; }
.cov th, .cov td { padding:3px 8px; text-align:center; }
.cov td.z { color:#5A5C6A; } .cov td.hit { background:#2A3320; color:var(--green); } .cov td.gen { background:#1E2440; color:var(--gold); }
.cov td:first-child, .cov th:first-child { text-align:left; position:sticky; left:0; background:var(--bg2); }
.login { max-width:340px; margin:18vh auto 0; display:grid; gap:12px; }
.hide { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loginBox" class="login">
    <h1 style="color:var(--gold);font-size:1.2rem">운영자 콘솔</h1>
    <p class="muted" style="margin:0">관리자에게 받은 운영자 열쇠(mts_로 시작)를 넣어 주세요. 역할에 맞는 화면만 열립니다.</p>
    <input type="text" id="name" placeholder="이름(화면 표시용)" autocomplete="username" class="hide">
    <input type="password" id="key" placeholder="운영자 열쇠" autocomplete="current-password">
    <button class="pri" id="go">들어가기</button>
    <p class="muted err" id="msg"></p>
  </div>
  <div id="app" class="hide">
    <header><h1>인연의 광장 · 운영자 콘솔</h1><div class="row" style="align-items:center"><span class="muted" id="who"></span><button id="out">나가기</button></div></header>
    <div id="t-community"></div>
  </div>
</div>
<script src="v2-community.js?v=20261116-stage9"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var get = function () { try { return sessionStorage.getItem('mt_staff_key') || ''; } catch (e) { return ''; } };
  var put = function (v) { try { if (v) sessionStorage.setItem('mt_staff_key', v); else sessionStorage.removeItem('mt_staff_key'); } catch (e) { } };
  function enter(key) {
    $('msg').textContent = '';
    return fetch('/api/community/staff?view=me', { cache: 'no-store', headers: { authorization: 'Bearer ' + key } })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok || !d.role) throw new Error(d.error || '열쇠를 확인하지 못했습니다'); return d; }); })
      .then(function (d) {
        put(key); $('loginBox').classList.add('hide'); $('app').classList.remove('hide');
        $('who').textContent = d.name + ' · ' + d.label;
        window.V2Community.open(key, d.role);
      })
      .catch(function (e) { put(''); $('msg').textContent = e.message; });
  }
  $('go').onclick = function () { var k = $('key').value.trim(); if (!/^mts_[0-9a-f]{32}$/.test(k)) { $('msg').textContent = '열쇠 형식이 맞지 않습니다'; return; } enter(k); };
  $('key').onkeydown = function (e) { if (e.key === 'Enter') $('go').click(); };
  $('out').onclick = function () { put(''); location.reload(); };
  var saved = get(); if (saved) enter(saved);
})();
</script>
</body>
</html>
