<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>봉인 장면 검수 미리보기</title><link rel="stylesheet" href="../v2/viewer.css"><link rel="stylesheet" href="../v2/seal-reader.css"><link rel="stylesheet" href="../v2/seal-topics.css"><style>body{margin:0;background:#111421;color:#f6ead4;font-family:system-ui,sans-serif}.preview-label{padding:16px;background:#302917;color:#ffe9b6}.chap{max-width:740px;margin:auto}button,input,textarea{font:inherit}article{overflow-wrap:anywhere}</style><body><p class="preview-label" role="status">운영 게시와 분리된 미리보기입니다.</p><details class="preview-comparison" style="max-width:740px;margin:16px auto;padding:12px"><summary>대표 명식·시간 미상·보정 옵션 계산 비교</summary><p>고정된 가상 명식을 기존 엔진으로 계산합니다. 이 표는 문안 선택 결과가 아니며, 실제 문안은 관리자의 선택 완료 챕터 JSON으로 검수하세요.</p><button type="button" id="compareCalculations">기존 엔진으로 4개 조건 비교</button><div id="calculationComparison" style="overflow-x:auto" role="status"></div></details><details style="max-width:740px;margin:auto;padding:12px"><summary>실제 사용자 조건의 미디어 선택·제외 이유</summary><pre id="selectionReasons" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></details><article class="chap"></article><script src="/engine.js"></script><script src="../v2/saju-data.js"></script><script src="../v2/reading-media.js"></script><script src="../v2/reading-text.js"></script><script src="../v2/seal-topics.js"></script><script src="../v2/seal-reader.js"></script><script>
window.renderSealPreview=function(chapter,metadata,media){var R=window.ReportV2,el=document.querySelector('article'),demo=!chapter;R.SealReader.unmount(el);var c=chapter||{id:metadata.chapterId,title:metadata.question,readingCore:{title:'가상 레이아웃 예시입니다.',reality:'이 문장은 봉인 장면 배치를 확인하기 위한 예시입니다.',strength:'긴 문장과 짧은 문장의 표시 호흡을 확인합니다.',risk:'실제 계산이나 사용자에 대한 풀이를 뜻하지 않습니다.',reinforce:'검수 시 선택 완료된 챕터 JSON을 입력하세요.',practice:'오늘 기록할 실천을 이 칸에서 확인합니다.',why:'근거 영역의 접근성을 검토합니다.',evidence:'운영 문안의 근거는 실제 응답으로 따로 확인합니다.'}};c=JSON.parse(JSON.stringify(c));c.sealPresentation=Object.assign({},metadata,{status:'published',version:'preview'});c.readingMedia=R.SealReader.media(media,c,c.readingVisualData||{});c.readingBackground=R.ReadingMedia.background?R.ReadingMedia.background(media,c,c.readingVisualData||{}):null;document.getElementById('selectionReasons').textContent=JSON.stringify(R.ReadingMedia.explain(media,c,c.readingVisualData||{},c.readingMedia),null,2);el.innerHTML=R.ReadingText.html(c,0);R.SealReader.mount(el,c,0,{identity:'admin-preview',reduce:true,saveData:true});document.querySelector('.preview-label').textContent=demo?'가상 레이아웃 예시 · 실제 명식 풀이가 아닙니다.':'입력한 선택 완료 문안 · 실제 사용자와 같은 ReadingText·SealReader 렌더러입니다.';};
document.getElementById('compareCalculations').onclick=function(){var cases=[['대표 남성',{}],['대표 여성',{gender:'F'}],['시간 미상',{hour:null}],['합·조후 보정 미적용',{combinationMode:'off',climatePalaceMode:'off'}]],rows=cases.map(function(entry){var input=Object.assign({year:1990,month:5,day:15,hour:14,minute:30,gender:'M',calendar:'solar',lon:126.98,timeMode:'lmt',jasi:'jeong',school: 'auto',combinationMode:'auto',climatePalaceMode:'auto'},entry[1]),sd=ReportV2.SajuData.build(Manse.compute(input),{now:Date.UTC(2026,9,29,3)});return [entry[0],sd.dayPillar.ko,sd.strength.band,sd.birth.hourKnown?'알려짐':'미상',JSON.stringify(sd.groups),sd.elementAdjustments&&sd.elementAdjustments.summary||'보정 없음'];});var table=document.createElement('table');table.style.cssText='width:100%;border-collapse:collapse;font-size:12px';var tr=document.createElement('tr');['조건','일주','강약','시간','십성 구성','보정 설명'].forEach(function(t){var th=document.createElement('th');th.textContent=t;th.style.padding='8px';tr.appendChild(th);});table.appendChild(tr);rows.forEach(function(row){var tr=document.createElement('tr');row.forEach(function(value){var td=document.createElement('td');td.textContent=value;td.style.cssText='border:1px solid #75664d;padding:8px;min-width:70px';tr.appendChild(td);});table.appendChild(tr);});var box=document.getElementById('calculationComparison');box.textContent='';box.appendChild(table);};
