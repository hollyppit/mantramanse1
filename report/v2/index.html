<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>運路 · 만트라 사주 무빙툰</title>
<meta name="description" content="사주를 입력하면 내 운이 흐르는 길을 한 편의 영화처럼 — 타고난 명(命)부터 10년마다 달라지는 운, 움직일 때와 준비할 때까지 이어집니다.">
<meta name="theme-color" content="#080A11">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="cinema.css">
<link rel="stylesheet" href="reader.css">
<link rel="stylesheet" href="life.css">
</head>
<body>
<noscript><p style="padding:30vh 20px;color:#E9E4D8">이 페이지는 자바스크립트가 필요합니다.</p></noscript>

<div id="app" data-view="input">
  <!-- 사주 입력 -->
  <section id="v-input" class="view" aria-label="사주 입력">
    <div class="wrapin">
      <p class="kicker">MANTRA · 運路</p>
      <h1 class="h-xl">運路<br>운이 흐르는 길을<br>시작하기 전에</h1>
      <p class="sub">태어난 때를 알려 주세요. 입력한 정보는 이 기기 안에서만 계산되고 서버로 보내지 않습니다.</p>
      <form id="form" novalidate autocomplete="off">
        <label class="f"><span>이름 (선택)</span><input type="text" name="name" maxlength="20" autocomplete="off"></label>
        <div class="f seg" role="radiogroup" aria-label="성별"><span>성별</span><label><input type="radio" name="gender" value="F"><i>여</i></label><label><input type="radio" name="gender" value="M"><i>남</i></label></div>
        <div class="f seg" role="radiogroup" aria-label="달력"><span>달력</span><label><input type="radio" name="calendar" value="solar" checked><i>양력</i></label><label><input type="radio" name="calendar" value="lunar"><i>음력</i></label><label class="leap" hidden><input type="checkbox" name="leap"><i>윤달</i></label></div>
        <div class="f row3"><span>생년월일</span><select name="year" aria-label="년"></select><select name="month" aria-label="월"></select><select name="day" aria-label="일"></select></div>
        <div class="f"><span>태어난 시간</span><div class="inl"><input type="time" name="time" value="12:00"><label class="chk"><input type="checkbox" name="unknown"><i>모릅니다</i></label></div></div>
        <label class="f"><span>태어난 곳</span><select name="city"></select></label>
        <p class="msg" id="msg" role="alert"></p>
        <button type="submit" class="btn big">내 운의 길 시작하기</button>
      </form>
      <p class="fine">사주는 참고용 콘텐츠이며 미래를 단정하지 않습니다.</p>
    </div>
  </section>

  <!-- 단계형 로딩 (실제 진행률 숫자는 보여주지 않는다) -->
  <section id="v-load" class="view" aria-live="polite" hidden>
    <div class="loadbox"><img class="orb" src="/report/v2/lantern.webp" alt="" aria-hidden="true" width="120" height="120" decoding="async"><p id="loadText" class="loadtext"></p></div>
  </section>

  <!-- 탭해서 시작: 배경음악이 있을 때만. 사용자의 터치가 있어야 소리를 낼 수 있어서 일간 소개 직전에 한 번 받는다 -->
  <section id="v-gate" class="view" aria-label="시작" hidden><button type="button" id="gateBtn" class="gate"><span class="g-h" aria-hidden="true">運路</span><span class="g-n" id="gateName"></span><span class="g-t">화면을 탭해서 시작</span><span class="g-s">♪ 소리와 함께 보면 더 좋아요</span></button></section>

  <!-- 캐릭터 소개 영상 (있을 때만) -->
  <section id="v-awk" class="view" aria-label="캐릭터 영상" hidden>
    <div class="awk">
      <div class="awk-media" id="awkMedia"></div>
      <div class="awk-shade" aria-hidden="true"></div>
      <div class="awk-top"><button type="button" id="awkSound" class="chipbtn" hidden aria-pressed="false">🔇 소리 켜기</button><button type="button" id="awkSkip" class="chipbtn">SKIP ›</button></div>
      <div class="awk-cap" id="awkCap"></div>
      <button type="button" id="awkStart" class="btn big gold" hidden>운의 길을 시작한다</button>
    </div>
  </section>

  <!-- 시네마틱 프롤로그 · 엔딩 -->
  <section id="v-cinema" class="view" aria-label="운의 흐름을 영화처럼 보는 장면" hidden><div id="cnStage"></div></section>

  <!-- 리포트 -->
  <section id="v-reader" class="view" hidden>
    <header id="bar" class="bar">
      <button type="button" id="barBtn" class="barbtn" aria-haspopup="dialog" aria-label="전체 챕터 목록 열기">
        <span class="b1"><em id="barAct">ACT I</em> · <span id="barTitle"></span></span>
        <span class="b2"><b id="barNo">01</b> / <span id="barTot">20</span></span>
      </button>
      <div class="prog" id="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="진행률"><i id="progFill"></i></div>
    </header>
    <main id="chapter" tabindex="-1"></main>
  </section>

  <!-- 인생 지도 흐름(?flow=life) -->
  <section id="v-life" class="view lf" aria-label="인생 지도" hidden></section>

  <!-- 최종 화면 -->
  <section id="v-final" class="view" hidden></section>
</div>

<!-- 챕터 목록 -->
<dialog id="drawer" aria-label="챕터 목록"><div class="dr"><div class="drh"><b>전체 챕터</b><button type="button" id="drClose" class="chipbtn" aria-label="닫기">닫기</button></div><ol id="drList"></ol></div></dialog>
<button type="button" id="lifeBack" class="chipbtn" hidden>‹ 내 이야기 목록</button>
<div id="toast" class="toast" role="status" hidden></div>

<script src="/engine.js"></script>
<script src="chapters.js"></script>
<script src="saju-data.js"></script>
<script src="rules.js"></script>
<script src="narrator.js"></script>
<script src="cinema.js"></script>
<script src="reality.js"></script>
<script src="epic-intro.js"></script>
<script src="translator.js"></script>
<script src="content.js"></script>
<script src="content-pro.js"></script>
<script src="content-pro2.js"></script>
<script src="topics.js"></script>
<script src="terms.js"></script>
<script src="verdict.js"></script>
<script src="remedy.js"></script>
<script src="media.js"></script>
<script src="scenes.js"></script>
<script src="director.js"></script>
<script src="compose.js"></script>
<script src="intro-text.js"></script>
<script src="charts.js"></script>
<script src="../story/content.js"></script>
<script src="../story/fonts.js"></script>
<script src="textstyle.js"></script>
<script src="analytics.js"></script>
<script src="pdf.js"></script>
<script src="sharecard.js"></script>
<script src="bgm.js"></script>
<script src="story-director.js"></script>
<script src="life.js"></script>
<script src="reader.js"></script>
<script src="cinema-render.js"></script>
<script src="viewer.js"></script>
<script>
// 재방문자는 공용 인트로를 생략한다 (첫 방문에만 /api/intro 영상 재생). 인트로 영상은 관리자 "입장 인트로" 탭에서 설정.
try { if (localStorage.getItem('mt_v2_seen') === '1') sessionStorage.setItem('mt_intro', '1'); } catch (e) {}
</script>
<script src="../story/intro.js"></script>
</body>
</html>
