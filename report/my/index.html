<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>내 구매 내역 · 만트라 사주 무빙툰</title>
<link rel="stylesheet" href="/report/legal/legal.css">
<style>
  .who { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--ink-2); font-size: 14px; margin: 0 0 14px; }
  .btn { display: inline-block; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .btn.kakao { background: #FEE500; border-color: #FEE500; color: #191600; font-weight: 700; }
  .btn.google { background: #fff; color: #1f1f1f; font-weight: 700; }
  .btn.naver { background: #03C75A; border-color: #03C75A; color: #fff; font-weight: 700; }
  .login { display: grid; gap: 8px; max-width: 320px; margin: 14px 0; }
  .owned { display: grid; gap: 8px; margin: 8px 0 4px; }
  .owned .row { background: var(--bg); border-radius: 12px; padding: 10px 14px; }
  .owned b { display: block; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .chip { font-size: 13px; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 1px 10px; }
  .orders { display: grid; gap: 10px; margin: 8px 0; }
  .order { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .order h3 { margin: 0; font-size: 1rem; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .amt { color: var(--accent); white-space: nowrap; }
  .order dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0 0; font-size: 14px; }
  .order dt { color: var(--ink-2); }
  .order dd { margin: 0; overflow-wrap: anywhere; }
  .st { font-size: 12px; border-radius: 999px; padding: 1px 9px; margin-left: 6px; vertical-align: 2px; border: 1px solid var(--line); color: var(--ink-2); font-weight: 600; }
  .st.paid { border-color: #2f8f5b; color: #2f8f5b; }
  .st.canceled, .st.partial_canceled { border-color: var(--ink-2); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .muted { color: var(--ink-2); font-size: 13px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body data-legal-footer>
<div class="wrap">
  <div class="top"><a href="/report/">← 무빙툰으로 돌아가기</a>
    <nav class="tabs" aria-label="안내"><a href="/report/legal/products.html">상품 안내</a><a href="/report/legal/refund.html">환불정책</a></nav></div>
  <article>
    <h1>내 구매 내역</h1>
    <p class="meta"><span data-biz="service"></span></p>
    <div id="app" aria-live="polite"><p class="muted">불러오는 중입니다…</p></div>
  </article>
</div>
<script src="/report/legal/business.js"></script>
<script>
/* 로그인한 회원의 구매 내역. 로그인은 무빙툰 구매 창과 같은 Supabase 세션을 쓴다(같은 주소라 로그인 상태가 이어진다).
   서버: POST /api/commerce/access(공개 키) · POST /api/commerce/mine(내 주문). 환불은 메일·전화로 받는다(환불정책). */
(function () {
  'use strict';
  var SB_SDK = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
  var app = document.getElementById('app'), B = window.MANTRA_BUSINESS || {};
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var won = function (n) { return (+n || 0).toLocaleString('ko-KR') + '원'; };
  var when = function (t) { if (!t) return ''; try { return new Date(t).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return t; } };
  var DEF = { w1: '종합풀이', w2: '재물운 심화', w7: '커리어운 심화', w3: '인연운 심화' }, NAMES = DEF;
  var ST = { paid: '결제 완료', canceled: '환불(취소) 완료', partial_canceled: '부분 환불', pending: '결제 확인 중' };
  var sb = null, NAVER = false;
  function show(h) { app.innerHTML = h; }
  function script(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { no(new Error('load')); }; document.head.appendChild(s); }); }
  function fail(t) { show('<p>' + esc(t) + '</p><p class="muted">문제가 계속되면 ' + esc(B.phone || '') + ' · ' + esc(B.email || '') + '로 알려 주세요.</p>'); }

  fetch('/api/commerce/access', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{"sd":null}' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var k = d && d.keys;
      if (!d || !d.configured || !d.configured.login || !k || !k.supabaseUrl) return fail('지금은 로그인을 준비하고 있습니다.');
      NAVER = !!d.configured.naver;
      return (window.supabase ? Promise.resolve() : script(SB_SDK)).then(function () {
        sb = window.supabase.createClient(k.supabaseUrl, k.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' } });
        return naverReturn().then(function () { return sb.auth.getSession(); });
      }).then(function (r) {
        var s = r && r.data && r.data.session;
        if (!s) return loginView();
        return load(s.access_token);
      });
    })
    .catch(function () { fail('구매 내역을 불러오지 못했습니다. 잠시 후 다시 열어 주세요.'); });

  function loginView() {
    show('<p>구매 내역은 구매할 때 쓴 계정으로 로그인하면 볼 수 있습니다.</p>' +
      '<div class="login"><button type="button" class="btn kakao" data-login="kakao">카카오로 로그인</button><button type="button" class="btn google" data-login="google">구글로 로그인</button>' + (NAVER ? '<button type="button" class="btn naver" data-login="naver">네이버로 로그인</button>' : '') + '</div>' +
      '<p class="muted">무빙툰에서 구매할 때 로그인한 계정과 같은 계정을 골라 주세요.</p>');
    app.querySelectorAll('[data-login]').forEach(function (b) {
      b.onclick = function () { if (b.dataset.login === 'naver') { location.href = '/api/auth/naver/start?next=' + encodeURIComponent(location.pathname); return; } sb.auth.signInWithOAuth({ provider: b.dataset.login, options: { redirectTo: location.origin + location.pathname } }).catch(function () { alert('로그인을 시작하지 못했습니다. 잠시 후 다시 시도해 주세요.'); }); };
    });
  }

  // 네이버 로그인에서 돌아왔으면(?naver_login=1) 서버가 맡아 둔 세션을 받아 로그인 상태로 만든다
  function naverReturn() {
    var u = new URL(location.href), v = u.searchParams.get('naver_login'); if (!v) return Promise.resolve();
    u.searchParams.delete('naver_login'); try { history.replaceState(null, '', u.pathname + u.search); } catch (e) { }
    if (v !== '1') return Promise.resolve();
    var claim = function (n) { return fetch('/api/auth/naver/claim', { method: 'POST', credentials: 'same-origin' }).then(function (r) { if (r.ok) return r.json(); if (n < 2) return new Promise(function (ok) { setTimeout(ok, 700); }).then(function () { return claim(n + 1); }); return null; }); };
    return claim(0).then(function (s) { if (s && s.access_token) return sb.auth.setSession({ access_token: s.access_token, refresh_token: s.refresh_token }); }).catch(function () { });
  }
  function load(token) {
    return fetch('/api/commerce/mine', { method: 'POST', headers: { 'content-type': 'application/json', 'x-member-token': token }, body: '{}' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (x) {
        if (x.status === 401) return loginView();
        if (!x.ok) return fail('구매 내역을 불러오지 못했습니다. 잠시 후 다시 열어 주세요.');
        render(x.j);
      });
  }

  function render(d) {
    NAMES = Object.assign({}, DEF, d.worldNames || {}); var orders = d.orders || [];
    var nm = function (w) { return NAMES[w] || w; };
    var h = '<div class="who"><span>' + esc(d.member && d.member.email || '') + ' 로그인 중</span><button type="button" class="linkbtn" id="logout">로그아웃</button></div>';
    // 지금 열려 있는 주제: 결제 완료 주문을 사주(이름표)별로 모은다
    var bySaju = {};
    orders.forEach(function (o) { if (o.status !== 'paid') return; var who = o.saju_label || '이름 없는 사주'; (bySaju[who] = bySaju[who] || {}); (o.worlds || []).forEach(function (w) { bySaju[who][w] = 1; }); });
    var sajus = Object.keys(bySaju);
    h += '<h2>지금 열려 있는 주제</h2>';
    h += sajus.length ? '<div class="owned">' + sajus.map(function (who) { return '<div class="row"><b>' + esc(who) + '</b><div class="chips">' + Object.keys(bySaju[who]).map(function (w) { return '<span class="chip">' + esc(nm(w)) + '</span>'; }).join('') + '</div></div>'; }).join('') + '</div>' +
      '<p class="muted">구매한 주제는 <b>그 사주</b>로 무빙툰을 열면 잠금 없이 보입니다. 같은 생년월일·태어난 시각·성별을 입력하고 같은 계정으로 로그인해 주세요.</p>'
      : '<p class="muted">아직 열려 있는 주제가 없습니다.</p>';
    h += '<h2>결제 기록</h2>';
    if (!orders.length) h += '<p class="muted">구매 기록이 없습니다. <a href="/report/">무빙툰</a>에서 각 주제의 첫 장을 무료로 읽어 볼 수 있어요.</p>';
    else h += '<div class="orders">' + orders.map(orderHtml).join('') + '</div>';
    h += '<h2>환불 안내</h2><p>구매 후 <b>7일 이내</b>이고 산 주제의 <b>유료 장을 열지 않았다면</b> 전액 환불해 드립니다. 아래 <b>환불 요청</b> 버튼을 누르면 주문번호가 들어간 메일이 열립니다. 전화(' + esc(B.phone || '') + ')로 주문번호를 알려 주셔도 됩니다. 자세한 기준은 <a href="/report/legal/refund.html">환불정책</a>을 확인해 주세요.</p>';
    show(h);
    app.querySelector('#logout').onclick = function () { sb.auth.signOut().then(function () { loginView(); }); };
    app.querySelectorAll('[data-copy]').forEach(function (b) { b.onclick = function () { var t = b.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.textContent = '복사됨'; }).catch(function () { prompt('주문번호', t); }); }; });
  }

  function orderHtml(o) {
    var paidAt = o.paid_at || o.created_at, days = (Date.now() - Date.parse(paidAt)) / 86400000;
    var mail = function (kind, last) { return 'mailto:' + (B.email || '') + '?subject=' + encodeURIComponent('[' + kind + '] 주문번호 ' + o.order_id) +
      '&body=' + encodeURIComponent('주문번호: ' + o.order_id + '\n상품: ' + o.product_name + ' (' + won(o.amount) + ')\n결제 일시: ' + when(paidAt) + '\n로그인 계정: (구매할 때 쓴 카카오·구글 계정 이메일)\n' + last + ': \n'); };
    var acts = '<button type="button" class="btn" data-copy="' + esc(o.order_id) + '">주문번호 복사</button>';
    // 7일 이내 결제 완료 주문만 '환불 요청'. 7일이 지났으면 문의(콘텐츠 오류 등 회사 잘못은 기간과 상관없이 환불)
    if (o.status === 'paid') acts += days <= 7 ? '<a class="btn main" href="' + esc(mail('환불 요청', '환불 사유')) + '">환불 요청</a>' : '<a class="btn" href="' + esc(mail('문의', '문의 내용')) + '">문의하기</a>';
    return '<div class="order"><h3><span>' + esc(o.product_name) + '<span class="st ' + esc(o.status) + '">' + esc(ST[o.status] || o.status) + '</span></span><span class="amt">' + won(o.amount) + '</span></h3><dl>' +
      '<dt>사주</dt><dd>' + esc(o.saju_label || '-') + '</dd>' +
      '<dt>열리는 주제</dt><dd>' + esc((o.worlds || []).map(function (w) { return NAMES[w] || w; }).join(' · ') || '-') + '</dd>' +
      '<dt>결제 일시</dt><dd>' + esc(when(paidAt)) + (o.method ? ' · ' + esc(o.method) : '') + '</dd>' +
      (o.canceled_at ? '<dt>환불 일시</dt><dd>' + esc(when(o.canceled_at)) + '</dd>' : '') +
      '<dt>주문번호</dt><dd>' + esc(o.order_id) + '</dd></dl><div class="acts">' + acts + '</div></div>';
  }
})();
</script>
</body>
</html>
