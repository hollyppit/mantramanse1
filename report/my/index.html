<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>내 구매 내역 · 만트라 사주 무빙툰</title>
<link rel="stylesheet" href="/report/legal/legal.css">
<style>
  .who { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--ink-2); font-size: 14px; margin: 0 0 14px; }
  .btn { display: inline-block; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .btn.kakao { background: #FEE500; border-color: #FEE500; color: #191600; font-weight: 700; }
  .btn.google { background: #fff; color: #1f1f1f; font-weight: 700; }
  .btn.naver { background: #03C75A; border-color: #03C75A; color: #fff; font-weight: 700; }
  .last { display: block; font-size: 12px; font-weight: 500; opacity: .85; margin-top: 2px; }
  .flash { border: 1px solid var(--accent); border-radius: 12px; padding: 10px 14px; margin: 0 0 14px; }
  .suggest { background: var(--bg); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; margin: 0 0 16px; }
  .logins { display: grid; gap: 8px; margin: 8px 0; }
  .logins .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--bg); border-radius: 12px; padding: 10px 14px; }
  .ok { color: #2f8f5b; font-weight: 600; font-size: 14px; }
  .login { display: grid; gap: 8px; max-width: 320px; margin: 14px 0; }
  .owned { display: grid; gap: 8px; margin: 8px 0 4px; }
  .owned .row { background: var(--bg); border-radius: 12px; padding: 10px 14px; }
  .owned b { display: block; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .chip { font-size: 13px; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 1px 10px; }
  .orders { display: grid; gap: 10px; margin: 8px 0; }
  .order { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .order h3 { margin: 0; font-size: 1rem; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .amt { color: var(--accent); white-space: nowrap; }
  .order dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0 0; font-size: 14px; }
  .order dt { color: var(--ink-2); }
  .order dd { margin: 0; overflow-wrap: anywhere; }
  .st { font-size: 12px; border-radius: 999px; padding: 1px 9px; margin-left: 6px; vertical-align: 2px; border: 1px solid var(--line); color: var(--ink-2); font-weight: 600; }
  .st.paid { border-color: #2f8f5b; color: #2f8f5b; }
  .st.canceled, .st.partial_canceled { border-color: var(--ink-2); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .muted { color: var(--ink-2); font-size: 13px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body data-legal-footer>
<div class="wrap">
  <div class="top"><a href="/report/">← 무빙툰으로 돌아가기</a>
    <nav class="tabs" aria-label="안내"><a href="/report/legal/products.html">상품 안내</a><a href="/report/legal/refund.html">환불정책</a></nav></div>
  <article>
    <h1>내 구매 내역</h1>
    <p class="meta"><span data-biz="service"></span></p>
    <div id="app" aria-live="polite"><p class="muted">불러오는 중입니다…</p></div>
  </article>
</div>
<script src="/report/legal/business.js"></script>
<script>
/* 로그인한 회원의 구매 내역. 로그인은 무빙툰 구매 창과 같은 Supabase 세션을 쓴다(같은 주소라 로그인 상태가 이어진다).
   서버: POST /api/commerce/access(공개 키) · POST /api/commerce/mine(내 주문). 환불은 메일·전화로 받는다(환불정책). */
(function () {
  'use strict';
  var SB_SDK = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
  var app = document.getElementById('app'), B = window.MANTRA_BUSINESS || {};
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var won = function (n) { return (+n || 0).toLocaleString('ko-KR') + '원'; };
  var when = function (t) { if (!t) return ''; try { return new Date(t).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return t; } };
  var DEF = { w1: '종합풀이', w2: '재물운 심화', w7: '커리어운 심화', w3: '인연운 심화' }, NAMES = DEF;
  var ST = { paid: '결제 완료', canceled: '환불(취소) 완료', partial_canceled: '부분 환불', pending: '결제 확인 중' };
  var sb = null, NAVER = false, TOKEN = '', FLASH = '';
  var LN = { kakao: '카카오', google: '구글', naver: '네이버' };
  // 이 기기에서 마지막으로 쓴 로그인 방법(구매한 계정을 헷갈리지 않게 버튼에 표시)
  var lastLogin = function () { try { return localStorage.getItem('mt_last_login') || ''; } catch (e) { return ''; } };
  var setLast = function (p) { try { localStorage.setItem('mt_last_login', p); } catch (e) { } };
  function show(h) { app.innerHTML = h; }
  function script(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { no(new Error('load')); }; document.head.appendChild(s); }); }
  function fail(t) { show('<p>' + esc(t) + '</p><p class="muted">문제가 계속되면 ' + esc(B.phone || '') + ' · ' + esc(B.email || '') + '로 알려 주세요.</p>'); }

  fetch('/api/commerce/access', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{"sd":null}' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var k = d && d.keys;
      if (!d || !d.configured || !d.configured.login || !k || !k.supabaseUrl) return fail('지금은 로그인을 준비하고 있습니다.');
      NAVER = !!d.configured.naver;
      return (window.supabase ? Promise.resolve() : script(SB_SDK)).then(function () {
        sb = window.supabase.createClient(k.supabaseUrl, k.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' } });
        return naverReturn().then(function () { return sb.auth.getSession(); });
      }).then(function (r) {
        var s = r && r.data && r.data.session;
        if (!s) { sessionStorage.removeItem('mt_link'); return loginView(); }
        return finishLinkIfAny(s).then(load);
      });
    })
    .catch(function () { fail('구매 내역을 불러오지 못했습니다. 잠시 후 다시 열어 주세요.'); });

  function loginView() {
    show('<p>구매 내역은 구매할 때 쓴 계정으로 로그인하면 볼 수 있습니다.</p>' +
      '<div class="login">' + ['kakao', 'google'].concat(NAVER ? ['naver'] : []).map(function (p) { return '<button type="button" class="btn ' + p + '" data-login="' + p + '">' + LN[p] + '로 로그인' + (lastLogin() === p ? '<span class="last">이 기기에서 지난번에 쓴 방법</span>' : '') + '</button>'; }).join('') + '</div>' +
      '<p class="muted">무빙툰에서 구매할 때 로그인한 계정과 같은 계정을 골라 주세요.</p>');
    app.querySelectorAll('[data-login]').forEach(function (b) {
      b.onclick = function () { loginWith(b.dataset.login, false); };
    });
  }

  function loginWith(p, linkMode) {
    setLast(p);
    var path = location.pathname + (linkMode ? '?link=1' : '');
    if (p === 'naver') { location.href = '/api/auth/naver/start?next=' + encodeURIComponent(path); return; }
    sb.auth.signInWithOAuth({ provider: p, options: { redirectTo: location.origin + path } }).catch(function () { sessionStorage.removeItem('mt_link'); alert('로그인을 시작하지 못했습니다. 잠시 후 다시 시도해 주세요.'); });
  }
  // 로그인 방법 연결: 지금 회원(A)에 연결표를 만들고 그 방법(B)으로 로그인 → 돌아와서 finishLinkIfAny 가 B 를 A 에 합친다
  function startLink(p) {
    fetch('/api/account/link', { method: 'POST', headers: { 'content-type': 'application/json', 'x-member-token': TOKEN }, body: JSON.stringify({ action: 'start', provider: p }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ticket) { alert('연결을 시작하지 못했습니다. 잠시 후 다시 시도해 주세요.'); return; }
        try { sessionStorage.setItem('mt_link', JSON.stringify({ ticket: j.ticket, provider: p })); } catch (e) { }
        loginWith(p, true);
      }).catch(function () { alert('연결을 시작하지 못했습니다. 잠시 후 다시 시도해 주세요.'); });
  }
  function finishLinkIfAny(s) {
    var raw = null; try { raw = sessionStorage.getItem('mt_link'); sessionStorage.removeItem('mt_link'); } catch (e) { }
    try { var u = new URL(location.href); if (u.searchParams.has('link')) { u.searchParams.delete('link'); history.replaceState(null, '', u.pathname + u.search); } } catch (e) { }
    var t = null; try { t = raw && JSON.parse(raw); } catch (e) { t = null; }
    if (!t || !t.ticket) return Promise.resolve(s.access_token);
    var name = LN[t.provider] || '';
    return fetch('/api/account/link', { method: 'POST', headers: { 'content-type': 'application/json', 'x-member-token': s.access_token }, body: JSON.stringify({ action: 'finish', ticket: t.ticket }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        if (x.ok && x.j.session) {
          FLASH = name + ' 로그인을 연결했어요. 이제 어느 방법으로 들어와도 같은 구매 내역이 보입니다.';
          return sb.auth.setSession(x.j.session).then(function () { return x.j.session.access_token; });
        }
        if (x.ok && x.j.same) { FLASH = '이미 같은 계정으로 연결돼 있어요.'; return s.access_token; }
        FLASH = x.j.error === 'same-provider' ? '두 계정에 모두 ' + (LN[x.j.provider] || '') + ' 로그인이 있어서 자동으로 합칠 수 없어요. 고객센터로 알려 주시면 도와드릴게요. 지금은 방금 로그인한 계정으로 보고 있어요.'
          : x.j.error === 'expired' ? '연결 시간이 지났어요. 다시 시도해 주세요. 지금은 방금 로그인한 계정으로 보고 있어요.'
          : '연결하지 못했어요. 잠시 후 다시 시도해 주세요. 지금은 방금 로그인한 계정으로 보고 있어요.';
        return s.access_token;
      }).catch(function () { FLASH = '연결 중 연결이 끊겼어요. 다시 시도해 주세요.'; return s.access_token; });
  }
  // 네이버 로그인에서 돌아왔으면(?naver_login=1) 서버가 맡아 둔 세션을 받아 로그인 상태로 만든다
  function naverReturn() {
    var u = new URL(location.href), v = u.searchParams.get('naver_login'); if (!v) return Promise.resolve();
    u.searchParams.delete('naver_login'); try { history.replaceState(null, '', u.pathname + u.search); } catch (e) { }
    if (v !== '1') return Promise.resolve();
    var claim = function (n) { return fetch('/api/auth/naver/claim', { method: 'POST', credentials: 'same-origin' }).then(function (r) { if (r.ok) return r.json(); if (n < 2) return new Promise(function (ok) { setTimeout(ok, 700); }).then(function () { return claim(n + 1); }); return null; }); };
    return claim(0).then(function (s) { if (s && s.access_token) return sb.auth.setSession({ access_token: s.access_token, refresh_token: s.refresh_token }); }).catch(function () { });
  }
  function load(token) {
    TOKEN = token;
    return fetch('/api/commerce/mine', { method: 'POST', headers: { 'content-type': 'application/json', 'x-member-token': token }, body: '{}' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (x) {
        if (x.status === 401) return loginView();
        if (!x.ok) return fail('구매 내역을 불러오지 못했습니다. 잠시 후 다시 열어 주세요.');
        render(x.j);
      });
  }

  function render(d) {
    NAMES = Object.assign({}, DEF, d.worldNames || {}); var orders = d.orders || [];
    var nm = function (w) { return NAMES[w] || w; };
    var h = (FLASH ? '<p class="flash" role="status">' + esc(FLASH) + '</p>' : '') + '<div class="who"><span>' + (lastLogin() && LN[lastLogin()] ? LN[lastLogin()] + ' · ' : '') + esc(d.member && d.member.email || '') + ' 로그인 중</span><button type="button" class="linkbtn" id="logout">로그아웃</button></div><div id="suggest"></div>';
    FLASH = '';
    // 지금 열려 있는 주제: 결제 완료 주문을 사주(이름표)별로 모은다
    var bySaju = {};
    orders.forEach(function (o) { if (o.status !== 'paid') return; var who = o.saju_label || '이름 없는 사주'; (bySaju[who] = bySaju[who] || {}); (o.worlds || []).forEach(function (w) { bySaju[who][w] = 1; }); });
    var sajus = Object.keys(bySaju);
    // 구매한 사주(계정에 저장됨): 출생 정보를 다시 입력하지 않고 바로 연다. 저장본이 없는 예전 주문은 이름표로만 보여 준다
    var saved = d.sajus || [];
    if (saved.length) {
      h += '<h2>구매한 사주</h2><div class="owned">' + saved.map(function (s, i) {
        var b = s.birth || {}, when = b.year ? b.year + '년 ' + b.month + '월 ' + b.day + '일' + (b.calendar === 'lunar' ? '(음력)' : '') + (Number.isInteger(b.hour) ? ' ' + b.hour + '시' : ' · 시각 모름') : '';
        return '<div class="row"><b>' + esc(s.label || '이름 없는 사주') + '</b><span class="muted">' + esc(when) + (b.gender ? ' · ' + (b.gender === 'F' ? '여' : '남') : '') + '</span><div class="chips">' + (s.worlds || []).map(function (w) { return '<span class="chip">' + esc(nm(w)) + '</span>'; }).join('') + '</div>' +
          '<div class="acts"><button type="button" class="btn main" data-open="' + i + '">이 사주로 바로 읽기</button><button type="button" class="btn" data-forget="' + i + '">저장 삭제</button></div></div>';
      }).join('') + '</div><p class="muted">다른 기기에서도 이 버튼으로 출생 정보를 다시 입력하지 않고 바로 열 수 있어요. 저장을 지워도 구매한 주제는 그대로이며, 무빙툰에서 출생 정보를 입력하면 열립니다.</p>';
    }
    h += '<h2>' + (saved.length ? '열려 있는 주제(주문별)' : '지금 열려 있는 주제') + '</h2>';
    h += sajus.length ? '<div class="owned">' + sajus.map(function (who) { return '<div class="row"><b>' + esc(who) + '</b><div class="chips">' + Object.keys(bySaju[who]).map(function (w) { return '<span class="chip">' + esc(nm(w)) + '</span>'; }).join('') + '</div></div>'; }).join('') + '</div>' +
      '<p class="muted">구매한 주제는 <b>그 사주</b>로 무빙툰을 열면 잠금 없이 보입니다. 같은 생년월일·태어난 시각·성별을 입력하고 같은 계정으로 로그인해 주세요.</p>'
      : '<p class="muted">아직 열려 있는 주제가 없습니다.</p>';
    h += '<h2>결제 기록</h2>';
    if (!orders.length) h += '<p class="muted">구매 기록이 없습니다. <a href="/report/">무빙툰</a>에서 각 주제의 첫 장을 무료로 읽어 볼 수 있어요.</p>';
    else h += '<div class="orders">' + orders.map(orderHtml).join('') + '</div>';
    h += '<h2>환불 안내</h2><p>구매 후 <b>7일 이내</b>이고 산 주제의 <b>유료 장을 열지 않았다면</b> 전액 환불해 드립니다. 아래 <b>환불 요청</b> 버튼을 누르면 주문번호가 들어간 메일이 열립니다. 전화(' + esc(B.phone || '') + ')로 주문번호를 알려 주셔도 됩니다. 자세한 기준은 <a href="/report/legal/refund.html">환불정책</a>을 확인해 주세요.</p>';
    h += '<h2>로그인 방법</h2><div class="logins" id="logins"><p class="muted">불러오는 중…</p></div><p class="muted">여러 방법을 연결하면 카카오·구글·네이버 중 어느 것으로 로그인해도 같은 구매 내역이 보입니다. 연결할 계정에 이미 구매 내역이 있으면 함께 합쳐집니다.</p>';
    // 회원 탈퇴: 접어 두고, '탈퇴' 를 직접 입력해야 진행(실수 방지). 처리 내용은 functions/_account.js
    var anyRefundable = orders.some(function (o) { return o.status === 'paid' && !o.viewed_at && (Date.now() - Date.parse(o.paid_at || o.created_at)) / 86400000 <= 7; });
    h += '<details class="box" style="margin-top:22px"><summary style="cursor:pointer;font-weight:600">회원 탈퇴</summary>' +
      '<ul><li>로그인 정보(이메일·이름·소셜 계정 연결)와 저장한 사주가 <b>바로 삭제</b>됩니다.</li>' +
      '<li>구매한 주제는 <b>더 이상 열리지 않습니다.</b> 같은 계정으로 다시 가입해도 되살아나지 않습니다.</li>' +
      '<li>주문·결제 기록은 전자상거래법에 따라 5년간 회원 정보와 분리해 보관한 뒤 파기합니다.</li>' +
      (anyRefundable ? '<li><b>환불받을 수 있는 구매가 있습니다.</b> 환불을 원하면 탈퇴하기 전에 먼저 환불을 요청해 주세요.</li>' : '') + '</ul>' +
      '<p class="muted">계속하려면 아래 칸에 <b>탈퇴</b>라고 입력해 주세요.</p>' +
      '<div class="acts"><input id="wdConfirm" type="text" autocomplete="off" placeholder="탈퇴" style="padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;width:120px">' +
      '<button type="button" class="btn" id="wdGo" disabled>회원 탈퇴</button></div><p class="muted" id="wdMsg" aria-live="polite"></p></details>';
    show(h);
    var wdIn = app.querySelector('#wdConfirm'), wdGo = app.querySelector('#wdGo'), wdMsg = app.querySelector('#wdMsg');
    wdIn.oninput = function () { wdGo.disabled = wdIn.value.trim() !== '탈퇴'; };
    wdGo.onclick = function () {
      if (!confirm('정말 탈퇴할까요? 구매한 주제가 더 이상 열리지 않으며 되돌릴 수 없습니다.')) return;
      wdGo.disabled = true; wdMsg.textContent = '탈퇴 처리 중입니다…';
      fetch('/api/account/withdraw', { method: 'POST', headers: { 'content-type': 'application/json', 'x-member-token': TOKEN }, body: JSON.stringify({ confirm: '탈퇴' }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (x) {
          if (!x.ok || !x.j.ok) { wdGo.disabled = false; wdMsg.textContent = '탈퇴하지 못했습니다. 잠시 후 다시 시도하거나 ' + (B.phone || '') + '로 알려 주세요.'; return; }
          return sb.auth.signOut().catch(function () { }).then(function () { show('<p><b>탈퇴가 완료되었습니다.</b> 그동안 이용해 주셔서 감사합니다.</p><p class="muted">로그인 정보는 삭제되었고, 결제 기록은 법정 기간 동안 회원 정보와 분리해 보관한 뒤 파기합니다.</p><p><a class="btn" href="/report/">무빙툰으로 돌아가기</a></p>'); });
        })
        .catch(function () { wdGo.disabled = false; wdMsg.textContent = '연결이 끊겼습니다. 잠시 후 다시 시도해 주세요.'; });
    };
    app.querySelector('#logout').onclick = function () { sb.auth.signOut().then(function () { loginView(); }); };
    loadLogins();
    app.querySelectorAll('[data-forget]').forEach(function (b) {
      b.onclick = function () {
        var s = saved[+b.dataset.forget]; if (!s || !confirm('이 사주의 저장된 출생 정보를 지울까요? 구매한 주제는 그대로 남습니다.')) return;
        fetch('/api/commerce/mine', { method: 'POST', headers: { 'content-type': 'application/json', 'x-member-token': TOKEN }, body: JSON.stringify({ action: 'forget', ref: s.ref }) })
          .then(function (r) { if (!r.ok) throw new Error(); FLASH = '저장된 출생 정보를 지웠어요.'; return load(TOKEN); })
          .catch(function () { alert('지우지 못했습니다. 잠시 후 다시 시도해 주세요.'); });
      };
    });
    app.querySelectorAll('[data-open]').forEach(function (b) {
      b.onclick = function () {
        var s = saved[+b.dataset.open]; if (!s || !s.birth) return;
        // 무빙툰 화면이 시작할 때 읽는 이어 읽기 값(report/v2/viewer.js handoff)
        try { sessionStorage.setItem('mt_v2_input', JSON.stringify({ inp: s.birth, name: s.label || '', interest: '', resumeChapter: null })); } catch (e) { alert('이 브라우저에서는 바로 열 수 없어요. 무빙툰에서 출생 정보를 입력해 주세요.'); return; }
        location.href = '/report/v2/?from=my';
      };
    });
    app.querySelectorAll('[data-copy]').forEach(function (b) { b.onclick = function () { var t = b.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.textContent = '복사됨'; }).catch(function () { prompt('주문번호', t); }); }; });
  }

  // 로그인 방법 목록과 안내: 구매 내역이 없는데 같은 이메일로 다른 방법에 가입한 계정이 있으면 그 방법으로 합치도록 안내
  function loadLogins() {
    fetch('/api/account/logins', { method: 'POST', headers: { 'content-type': 'application/json', 'x-member-token': TOKEN }, body: '{}' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var box = app.querySelector('#logins'), sg = app.querySelector('#suggest'); if (!box || !d) { if (box) box.innerHTML = '<p class="muted">로그인 방법을 불러오지 못했습니다.</p>'; return; }
        var list = ['kakao', 'google'].concat(NAVER || d.linked.indexOf('naver') >= 0 ? ['naver'] : []);
        box.innerHTML = list.map(function (p) {
          var on = d.linked.indexOf(p) >= 0;
          return '<div class="row"><b>' + LN[p] + '</b>' + (on ? '<span class="ok">✓ 연결됨</span>' : '<button type="button" class="btn" data-link="' + p + '">' + LN[p] + ' 연결하기</button>') + '</div>';
        }).join('');
        box.querySelectorAll('[data-link]').forEach(function (b) { b.onclick = function () { startLink(b.dataset.link); }; });
        if (d.suggest && d.linked.indexOf(d.suggest.provider) < 0) {
          var n = LN[d.suggest.provider] || '';
          sg.innerHTML = '<div class="suggest"><b>' + n + '로 가입한 계정' + (d.suggest.hasPurchases ? '에 구매 내역이 있어요.' : '이 있어요.') + '</b><p style="margin:4px 0 8px">같은 이메일로 ' + n + '에도 가입돼 있습니다. 같은 분이라면 ' + n + '로 한 번 로그인해 두 계정을 합치세요. 합치면 어느 방법으로 들어와도 같은 구매 내역이 보입니다.</p><button type="button" class="btn main" id="sgGo">' + n + '로 로그인해서 합치기</button></div>';
          sg.querySelector('#sgGo').onclick = function () { startLink(d.suggest.provider); };
        } else if (!d.hasPurchases) {
          sg.innerHTML = '<p class="muted" style="margin:0 0 14px">구매한 주제가 안 보이나요? 다른 방법(카카오·구글·네이버)으로 산 적이 있다면 그 방법으로 로그인하거나, 아래 <b>로그인 방법</b>에서 연결해 주세요.</p>';
        }
      }).catch(function () { });
  }

  function orderHtml(o) {
    var paidAt = o.paid_at || o.created_at, days = (Date.now() - Date.parse(paidAt)) / 86400000;
    var mail = function (kind, last) { return 'mailto:' + (B.email || '') + '?subject=' + encodeURIComponent('[' + kind + '] 주문번호 ' + o.order_id) +
      '&body=' + encodeURIComponent('주문번호: ' + o.order_id + '\n상품: ' + o.product_name + ' (' + won(o.amount) + ')\n결제 일시: ' + when(paidAt) + '\n로그인 계정: (구매할 때 쓴 카카오·구글 계정 이메일)\n' + last + ': \n'); };
    var acts = '<button type="button" class="btn" data-copy="' + esc(o.order_id) + '">주문번호 복사</button>';
    // 환불 요청은 7일 이내·유료 장 미열람일 때만. 그 밖에는 문의(콘텐츠 오류 등 회사 잘못은 기간·열람과 상관없이 환불)
    var refundable = o.status === 'paid' && days <= 7 && !o.viewed_at;
    if (o.status === 'paid') acts += refundable ? '<a class="btn main" href="' + esc(mail('환불 요청', '환불 사유')) + '">환불 요청</a>' : '<a class="btn" href="' + esc(mail('문의', '문의 내용')) + '">문의하기</a>';
    return '<div class="order"><h3><span>' + esc(o.product_name) + '<span class="st ' + esc(o.status) + '">' + esc(ST[o.status] || o.status) + '</span></span><span class="amt">' + won(o.amount) + '</span></h3><dl>' +
      '<dt>사주</dt><dd>' + esc(o.saju_label || '-') + '</dd>' +
      '<dt>열리는 주제</dt><dd>' + esc((o.worlds || []).map(function (w) { return NAMES[w] || w; }).join(' · ') || '-') + '</dd>' +
      '<dt>결제 일시</dt><dd>' + esc(when(paidAt)) + (o.method ? ' · ' + esc(o.method) : '') + '</dd>' +
      (o.canceled_at ? '<dt>환불 일시</dt><dd>' + esc(when(o.canceled_at)) + '</dd>' : '') +
      (o.status === 'paid' ? '<dt>환불</dt><dd>' + (o.viewed_at ? '유료 장 열람 시작(' + esc(when(o.viewed_at)) + ') · 환불 제한' : days > 7 ? '구매 후 7일 지남 · 환불 제한' : '가능(7일 이내·유료 장 미열람)') + '</dd>' : '') +
      '<dt>주문번호</dt><dd>' + esc(o.order_id) + '</dd></dl><div class="acts">' + acts + '</div></div>';
  }
})();
</script>
</body>
</html>
