<style>

}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 16px; line-height: 1.8; overflow-x: hidden; word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; }
#app { opacity: 0; transition: opacity .8s ease; }

em { font-style: normal; background: linear-gradient(180deg, var(--gold-l), var(--gold-d)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; position: relative; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }

/* 상단 */
.top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; }
.top .wrap { max-width: 1040px; display: flex; justify-content: space-between; align-items: center; padding-top: 22px; padding-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.seal { width: 28px; height: 28px; background: var(--cinnabar); color: #F3E3D6; font-size: .95rem; display: grid; place-items: center; border-radius: 2px; font-family: var(--f-serif); font-weight: 700; opacity: .92; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .15); }
.bn { font-family: var(--f-serif); font-weight: 600; letter-spacing: .12em; font-size: .98rem; line-height: 1.2; }

.top .back:hover { color: var(--gold); }

/* 히어로 */
.hero { position: relative; min-height: 100svh; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(70% 52% at 50% 24%, rgba(92, 82, 156, .30), transparent 70%), linear-gradient(180deg, #07080F 0%, #0B0F1F 52%, #080A11 100%); }
#stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.moon { position: absolute; top: 12%; left: 50%; width: clamp(84px, 14vw, 124px); aspect-ratio: 1; margin-left: calc(clamp(84px, 14vw, 124px) / -2); border-radius: 50%;
  background: radial-gradient(circle at 38% 34%, #F6EBCB, #DCC796 58%, #B39B66); opacity: .92; animation: pulse 9s ease-in-out infinite;
  box-shadow: 0 0 46px 8px rgba(221, 200, 150, .16), 0 0 150px 50px rgba(146, 136, 214, .11); }
.moon::before, .moon::after { content: ''; position: absolute; border-radius: 50%; border: 1px solid rgba(205, 178, 122, .22); }
.moon::before { inset: -24%; }
.moon::after { inset: -52%; border-style: dashed; border-color: rgba(205, 178, 122, .13); animation: spin 140s linear infinite; }
.hanja-v { position: absolute; left: max(5vw, 18px); top: 34%; writing-mode: vertical-rl; font-family: var(--f-serif); font-weight: 300; font-size: clamp(1.1rem, 2.4vw, 1.5rem); letter-spacing: .6em; color: rgba(205, 178, 122, .42); }
.hanja-v::after { content: ''; display: block; width: 1px; height: 64px; margin: 18px auto 0; background: linear-gradient(var(--gold-d), transparent); }
.mtn { position: absolute; left: -2%; right: -2%; bottom: 0; width: 104%; will-change: transform; }

.hero-in { position: relative; z-index: 3; max-width: 820px; padding: 40vh 24px 18vh; text-align: center; }
.kicker { font-family: var(--f-serif); color: var(--gold); letter-spacing: .42em; font-size: .78rem; margin-bottom: 22px; display: flex; align-items: center; justify-content: center; gap: 16px; }
.kicker::before, .kicker::after { content: ''; width: 40px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-d)); }
.kicker::after { transform: scaleX(-1); }
.hero h1 { font-size: clamp(1.75rem, 6.4vw, 3.5rem); line-height: 1.4; font-weight: 600; text-shadow: 0 6px 50px rgba(0, 0, 0, .7); }
.hero .lead { margin: 24px auto 0; color: var(--ink-2); max-width: 31em; font-size: .98rem; text-shadow: 0 2px 24px rgba(0, 0, 0, .8); }
.scroll-hint { margin-top: 48px; font-size: .68rem; letter-spacing: .34em; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.scroll-hint i { display: block; width: 1px; height: 40px; background: linear-gradient(var(--gold-d), transparent); animation: drop 2.6s ease-in-out infinite; }

.btn { display: inline-block; border: 1px solid var(--gold); cursor: pointer; font: inherit; font-size: .9rem; font-weight: 500; padding: 14px 32px; background: linear-gradient(180deg, #D9C28E, #B39A63); color: #14100A; text-decoration: none; border-radius: 2px; letter-spacing: .14em; transition: filter .3s, background .3s, color .3s; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--gold); border-color: rgba(205, 178, 122, .5); }
.btn.ghost:hover { background: rgba(205, 178, 122, .08); filter: none; }

.cta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 36px; }

/* 섹션 공통 */
.sec { padding: 120px 0 0; }
.head { text-align: center; margin-bottom: 40px; }
.eyebrow { font-family: var(--f-serif); color: var(--gold); letter-spacing: .36em; font-size: .72rem; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 16px; }
.eyebrow::before, .eyebrow::after { content: ''; width: 30px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-d)); }
.eyebrow::after { transform: scaleX(-1); }
h2 { font-size: clamp(1.45rem, 4.4vw, 2.05rem); margin-bottom: 18px; }
.head .lead { color: var(--ink-2); font-size: .96rem; max-width: 34em; margin: 0 auto; }
.note { margin-top: 14px; font-size: .82rem; color: var(--ink-3); }
.note.ctr { text-align: center; margin-top: 26px; }
.badge { display: inline-block; font-size: .68rem; font-weight: 500; padding: 3px 14px; border: 1px solid rgba(205, 178, 122, .4); color: var(--gold); border-radius: 999px; letter-spacing: .12em; }

.rv { opacity: 0; transform: translateY(18px); transition: opacity 1.1s ease, transform 1.1s ease; }
.rv.in { opacity: 1; transform: none; }

/* 무빙툰 패널 */
.toon { display: grid; gap: 22px; }

.sfx { position: absolute; top: 22px; right: 22px; font-family: var(--f-serif); font-weight: 300; font-size: 1rem; color: var(--gold); writing-mode: vertical-rl; letter-spacing: .4em; opacity: .75; }
.glyphwrap { text-align: center; margin-bottom: auto; padding-top: 56px; }
.glyph { display: inline-block; font-family: var(--f-serif); font-weight: 300; font-size: clamp(4rem, 20vw, 6.5rem); line-height: 1; letter-spacing: .14em; background: linear-gradient(180deg, var(--gold-l), var(--gold-d)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 20px rgba(205, 178, 122, .3)); animation: pulse 6s ease-in-out infinite; }
.orbit { transform-origin: 200px 160px; animation: spin 50s linear infinite; }
.orbit.rev { animation-direction: reverse; animation-duration: 70s; }
.pathline { stroke-dasharray: 600; stroke-dashoffset: 600; transition: stroke-dashoffset 3s ease .2s; }
.in .pathline { stroke-dashoffset: 0; }
.float { animation: bob 6s ease-in-out infinite; }
.gate-open { transform-origin: 200px 230px; animation: pulse 5s ease-in-out infinite; }

/* 장 목록 */
.eps { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line-2); }
.eps li { display: grid; grid-template-columns: 52px 1fr; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line-2); }
.eps .no { width: 40px; height: 40px; border: 1px solid rgba(205, 178, 122, .35); border-radius: 50%; display: grid; place-items: center; font-family: var(--f-serif); font-size: 1rem; color: var(--gold); }
.eps li.hi .no { border-color: rgba(181, 67, 47, .7); color: #D9806D; }
.eps b { font-family: var(--f-serif); font-weight: 600; font-size: 1rem; display: block; }
.eps div > span { color: var(--ink-3); font-size: .88rem; }

/* 카드 */
.paths { display: grid; gap: 14px; }
.path { border: 1px solid var(--line-2); background: var(--bg-2); border-radius: 3px; padding: 22px 24px; position: relative; }
.path::before { content: ''; position: absolute; left: 24px; top: -1px; width: 28px; height: 1px; background: var(--gold-d); }
.path h3 { font-size: 1rem; color: var(--gold); margin-bottom: 6px; }
.path p { color: var(--ink-2); font-size: .92rem; }
.path.core { border-color: rgba(205, 178, 122, .4); background: linear-gradient(180deg, rgba(205, 178, 122, .07), var(--bg-2)); box-shadow: 0 0 50px -20px rgba(205, 178, 122, .35); }

.pillars { display: grid; gap: 26px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.pillars div { padding-top: 16px; border-top: 1px solid var(--gold-d); }
.pillars b { font-family: var(--f-serif); font-weight: 600; display: block; margin-bottom: 6px; }
.pillars p { color: var(--ink-2); font-size: .9rem; }

.prices { display: grid; gap: 16px; }
.price { border: 1px solid var(--line-2); background: var(--bg-2); border-radius: 3px; padding: 28px 26px; position: relative; }
.price.main { border-color: rgba(205, 178, 122, .45); background: linear-gradient(180deg, rgba(205, 178, 122, .07), var(--bg-2)); box-shadow: 0 0 60px -22px rgba(205, 178, 122, .4); }
.price h3 { font-size: 1.15rem; margin: 14px 0 8px; }
.price ul { margin: 10px 0 18px; padding-left: 1.1em; color: var(--ink-2); font-size: .92rem; }
.price li::marker { color: var(--gold-d); }
.amt { font-family: var(--f-serif); color: var(--ink-3); letter-spacing: .1em; font-size: .9rem; }

/* FAQ */
.faq { border-top: 1px solid var(--line-2); }
details { border-bottom: 1px solid var(--line-2); }
summary { cursor: pointer; font-family: var(--f-serif); font-weight: 400; padding: 20px 28px 20px 0; list-style: none; position: relative; }
summary::-webkit-details-marker { display: none; }
summary::after { content: '+'; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); color: var(--gold-d); font-size: 1.2rem; transition: transform .3s; }
details[open] summary::after { content: '−'; }
details p { color: var(--ink-2); font-size: .92rem; padding: 0 0 22px; }

/* 신청 */
.gate { border: 1px solid rgba(205, 178, 122, .3); background: linear-gradient(180deg, rgba(24, 24, 44, .8), var(--bg-2)); border-radius: 3px; padding: 34px 28px; position: relative; }
.gate::after { content: ''; position: absolute; inset: 7px; border: 1px solid rgba(205, 178, 122, .1); pointer-events: none; }
form.signup { display: grid; gap: 16px; position: relative; z-index: 1; }
.field { display: flex; flex-wrap: wrap; gap: 10px; }
.field input[type=email] { flex: 1 1 220px; min-width: 0; font: inherit; padding: 14px 16px; border-radius: 2px; border: 1px solid var(--line); background: rgba(8, 10, 17, .7); color: var(--ink); }
.field input[type=email]:focus { border-color: var(--gold); outline: none; }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: .8rem; color: var(--ink-3); }
.consent input { margin-top: 5px; width: 16px; height: 16px; accent-color: var(--gold); flex: none; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.msg { font-size: .9rem; min-height: 1.4em; text-align: center; }
.msg.ok { color: var(--jade); }
.msg.err { color: #E7907F; }

footer { padding: 90px 0 70px; color: var(--ink-3); font-size: .76rem; text-align: center; }
footer p + p { margin-top: 6px; }
footer .orn { display: block; width: 7px; height: 7px; margin: 0 auto 26px; border: 1px solid var(--gold-d); transform: rotate(45deg); }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .78; } }
@keyframes drift { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
@keyframes drop { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

@media (max-width: 640px) {
  .sec { padding-top: 90px; }
  .hanja-v { top: 30%; opacity: .7; }
  .hero-in { padding-top: 38vh; }
  .panel { min-height: 380px; }
  .cap { padding: 56px 20px 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  #app { opacity: 1; }
  .rv { opacity: 1; transform: none; }
  .pathline { stroke-dashoffset: 0; }
  html { scroll-behavior: auto; }
}

/* 배경 이미지 · 장식 이미지 · 이미지/구분 섹션 */

    var form = e.target; if (!form || form.id !== 'signup') return;
    e.preventDefault();
    var msg = document.getElementById('msg'), btn = document.getElementById('submitBtn');
    function say(t, c) { msg.textContent = t; msg.className = 'msg ' + (c || ''); }
    if (preview) { say('미리보기에서는 신청되지 않습니다'); return; }
    var email = document.getElementById('email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { say('이메일 형식을 확인해 주세요', 'err'); return; }
    if (!document.getElementById('consent').checked) { say('개인정보 수집·이용에 동의해 주세요', 'err'); return; }
    btn.disabled = true; say('신청 중입니다…');
    fetch('/api/waitlist', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: email, consent: true, website: document.getElementById('website').value })
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (res.ok) { say(form.dataset.done || '신청되었습니다.', 'ok'); form.reset(); }
        else say(res.d.error || '신청에 실패했습니다. 잠시 후 다시 시도해 주세요', 'err');
      })
      .catch(function () { say('네트워크 오류입니다. 잠시 후 다시 시도해 주세요', 'err'); })
      .then(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
