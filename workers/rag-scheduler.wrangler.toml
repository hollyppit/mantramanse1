name = "mantra-rag-scheduler"
main = "rag-scheduler.js"
compatibility_date = "2026-10-17"
workers_dev = false

# KST daily start is checked in durable state, not by this UTC heartbeat.
# One checkpoint/minute; at most one new scheduled run per KST day.
[triggers]
crons = ["0 * * * *"]

# Set RAG_API_ORIGIN and RAG_SCHEDULER_SECRET via deployment configuration/secrets.
# No production origin or credentials are embedded here.
# Hourly checkpoints: existing durable research gate starts only once daily at 03:00 KST.
# Reading blocks run only for changed/missing registered synthetic content within reserved budgets.
