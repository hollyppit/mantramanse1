      const m = bs.match(/^(rgba?\([^)]+\))\s+0px 0px 0px (\d+(?:\.\d+)?)px inset$/);
      el.style.boxShadow = 'none';
      if (m && m[1] !== 'rgba(0, 0, 0, 0)') { el.style.border = m[2] + 'px solid ' + m[1]; }
    });
    stage.querySelectorAll('.tip').forEach(e => e.remove());
    return stage;
  }
  async function xpRender(tabLabel) {
    const PW = 794, PH = 1123, MX = 40, MT = 36, MB = 44, GAP = 12, SC = 2, UH = PH - MT - MB;
    const stage = xpStage(tabLabel);
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const items = [];
      for (const el of [...stage.children]) {
        const c = await window.html2canvas(el, { scale: SC, backgroundColor: '#ffffff', useCORS: true, logging: false });
        items.push(c);
      }
      const pages = []; let cv = null, y = 0;
      const newPage = () => { cv = document.createElement('canvas'); cv.width = PW * SC; cv.height = PH * SC; const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); pages.push(cv); y = 0; };
      newPage();
      items.forEach((c, idx) => {
        const h = c.height / SC;
        if (y > 0 && y + h > UH) newPage();
        if (h <= UH) { cv.getContext('2d').drawImage(c, MX * SC, (MT + y) * SC); y += h + GAP; return; }
        let sy = 0; // 한 쪽보다 긴 카드는 여러 쪽으로 자른다
        while (sy < c.height) {
          const room = (UH - y) * SC, sh = Math.min(c.height - sy, room);
          cv.getContext('2d').drawImage(c, 0, sy, c.width, sh, MX * SC, (MT + y) * SC, c.width, sh);
          sy += sh; y += sh / SC + GAP;
          if (sy < c.height) newPage();
        }
      });
      pages.forEach((pc, i) => { const g = pc.getContext('2d'); g.fillStyle = '#8089A0'; g.font = `${11 * SC}px sans-serif`; g.textAlign = 'center'; g.fillText(`만트라 만세력 · ${tabLabel} · ${i + 1} / ${pages.length}`, PW * SC / 2, (PH - 20) * SC); });
      return pages;
    } finally { stage.remove(); }
  }
  async function xpExport(kind, btn) {
    if (XP.busy) return;
    XP.busy = true;
    const btns = document.querySelectorAll('[data-export]'), old = btn.textContent;
    btns.forEach(b => b.disabled = true); btn.textContent = '만드는 중…';
    try {
      const sel = document.querySelector('.tab[aria-selected="true"]');
      const label = sel ? sel.textContent.trim() : '만세력';
      await xpLibs(kind === 'pdf');
      const pages = await xpRender(label);
      const who = (S.inp && S.inp.name ? S.inp.name : '') || new Date().toISOString().slice(0, 10);
      const base = `만세력_${label}_${who}`.replace(/[\\/:*?"<>|\s]+/g, '_');
      if (kind === 'pdf') {
        const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
        pages.forEach((pc, i) => { if (i) pdf.addPage('a4', 'portrait'); pdf.addImage(pc.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297); });
        pdf.save(base + '.pdf');
      } else {
        for (let i = 0; i < pages.length; i++) {
          await new Promise(res => pages[i].toBlob(bl => {
            const a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = pages.length > 1 ? `${base}_${i + 1}.png` : base + '.png';
            document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); setTimeout(res, 350);
          }, 'image/png'));
        }
      }
    } catch (e) { alert('내보내기에 실패했습니다: ' + (e && e.message ? e.message : e)); }
    finally { XP.busy = false; btns.forEach(b => b.disabled = false); btn.textContent = old; }
  }
  document.addEventListener('click', ev => { const b = ev.target.closest && ev.target.closest('[data-export]'); if (b) xpExport(b.dataset.export, b); });

  // ───────────── 툴팁 ─────────────
  let tipEl = null;
  function showTip(ev, html) {
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); }
    tipEl.innerHTML = html; tipEl.hidden = false;
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let x = ev.clientX + 12, y = ev.clientY - h - 10;
    if (x + w > window.innerWidth - 8) x = ev.clientX - w - 12;
    if (y < 8) y = ev.clientY + 16;
    tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
  }
  function hideTip() { if (tipEl) tipEl.hidden = true; }
  document.addEventListener('mousemove', ev => {
    const t = ev.target.closest && ev.target.closest('[data-tip]');
    if (t) showTip(ev, esc(t.getAttribute('data-tip'))); else if (!ev.target.closest || !ev.target.closest('.ov')) hideTip();
  });

  // ───────────── 렌더 ─────────────
  const root = document.getElementById('app');
  function render() {
    let body = '';
    // 관상·풍수·타로는 사주 계산 없이도 볼 수 있다 (풍수의 용신 연결만 사주가 있을 때)
    if (S.tab === 'face') body = renderFace();
    else if (S.tab === 'fs') body = renderFs();
    else if (S.tab === 'tarot') body = renderTarot();
    else if (!S.ch) body = `<section class="card"><p class="err">${esc(S.err || '입력값을 확인하세요')}</p></section>`;
    else if (S.tab === 'wonguk') body = renderWonguk();
    else if (S.tab === 'rel') body = renderRel();
    else if (S.tab === 'ohaeng') body = renderOhaeng();
    else if (S.tab === 'yong') body = renderYong();
    else if (S.tab === 'luck') body = renderLuck();
    else if (S.tab === 'zw') body = S.ch.ziwei ? renderZiwei() : renderWonguk();
    else body = renderGl();
    root.innerHTML = renderTop() + `<main class="wrap" style="padding-top:16px">${renderAdminLogin()}${renderForm()}${body}${adminPw ? '' : '<div class="admin-link-row"><a class="admin-link" href="#admin" onclick="setTimeout(()=>scrollTo(0,0),0)">관리자</a></div>'}</main>`;
    drawCharts();
    renderSheet();
  }
  function renderSheet() {
    let sh = document.getElementById('sheet');
    if (!S.sheet) { if (sh) sh.remove(); return; }
    if (!sh) { sh = document.createElement('div'); sh.id = 'sheet'; document.body.appendChild(sh); }
    const key = S.sheet, [c, t] = GL[key];
    const edited = key in OVR;
    const body = adminPw
      ? `<textarea id="gl-edit" aria-label="설명 문구">${esc(t)}</textarea>
        <div class="acts"><button class="btn primary" data-act="gl-save">저장</button>${edited ? '<button class="btn" data-act="gl-reset">기본 문구로 되돌리기</button>' : ''}<span class="grow"></span><span id="gl-msg" class="admin-msg">${edited ? '수정된 문구입니다' : '기본 문구입니다'}</span></div>`
      : `<p>${esc(t)}</p>`;
    const title = c === '일간' ? `${key} 일간` : c === '육십갑자' ? `${key} (${gzHanja(key)})` : key;
    sh.innerHTML = `<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(key)}"><span class="cat">${esc(c)}${adminPw ? ' · 관리자 편집' : ''}</span><h3>${esc(title)}</h3>
      ${c === '육십갑자' ? `<div class="facts">${gzFacts(key)}</div>` : ''}
      ${body}
      ${c === '육십갑자' ? gzPosHTML(key, S.sheetPos) : ''}
      <button class="btn x" data-act="close">닫기</button></div></div>`;
    (sh.querySelector('#gl-edit') || sh.querySelector('.x')).focus();
  }
  const gzParse = key => { const s = M.STEM_K.indexOf(key[0]), b = M.BR_K.indexOf(key[1]); for (let i = 0; i < 60; i++) if (i % 10 === s && i % 12 === b) return { s, b, i }; return null; };
  const gzHanja = key => { const p = gzParse(key); return p ? M.gzName(p) : ''; };
  function gzFacts(key) {
    const p = gzParse(key); if (!p) return '';
    const se = M.stemEl(p.s), be = M.BR_EL[p.b], head = p.i - (p.i % 10), hb = head % 12;
    const gm = [(hb + 10) % 12, (hb + 11) % 12].map(b => M.BR[b]).join('');
    return `위 글자 <b class="eltxt ${ECLS[se]}">${M.STEM[p.s]} ${M.STEM_K[p.s]}${M.EL_K[se]}</b>(${yinyang(p.s)}) · 아래 글자 <b class="eltxt ${ECLS[be]}">${M.BR[p.b]} ${M.BR_K[p.b]}${M.EL_K[be]}</b> · 60갑자 중 ${p.i + 1}번째<br>
      납음 ${NAEUM[p.i >> 1]} · 위 글자가 아래에 앉은 힘(${term('좌법', '12운성')}) ${term(M.unseong(p.s, p.b))} · ${term('공망')} ${gm}`;
  }
  // 이 간지가 놓인 자리에서의 뜻. 사주가 있으면 내 일간 기준 십성으로 풀어 준다
  function gzPosHTML(key, pos) {
    const p = gzParse(key); if (!p) return '';
    const ch = S.ch, d = ch ? ch.pillars.day.s : null;
    const tgS = d != null ? M.tenGod(d, p.s) : null, tgB = d != null ? M.tenGod(d, M.HIDDEN[p.b][M.HIDDEN[p.b].length - 1][0]) : null;
    const me = d != null ? `나(${stemKey(d)})` : '';
    const stemLine = area => `위 글자 <b>${M.STEM[p.s]}</b>는 ${me} 기준 ${term(tgS)}입니다 — ${TG_KW[tgS]}. ${area}에서 겉으로 드러나는 모습입니다.`;
    const brLine = area => `아래 글자 <b>${M.BR[p.b]}</b>는 ${term(tgB)}입니다 — ${TG_KW[tgB]}. ${area}의 실제 생활과 속사정입니다.`;
    if (pos && POS_AREA[pos]) {
      const pk = M.POS_K[pos] + '주';
      const lines = pos === 'day'
        ? [`위 글자 <b>${M.STEM[p.s]}</b>는 일간, 곧 나 자신입니다. 위의 ${term(stemKey(p.s))} 설명이 나의 기본 성향입니다.`,
          `아래 글자(일지) <b>${M.BR[p.b]}</b>는 배우자 자리에 있는 ${term(tgB)}입니다 — ${TG_KW[tgB]}. 배우자와 가정, 나의 속마음이 이런 모습으로 나타난다고 봅니다.`]
        : [stemLine(POS_AREA[pos]), brLine(POS_AREA[pos])];
      return `<div class="facts"><b>${term(pk)}에 있을 때</b> — ${esc(GL[pk][1])}<ul class="pos-ul">${lines.map(l => `<li>${l}</li>`).join('')}</ul></div>`;
    }
    if (pos && LUCK_AREA[pos] && ch) {
      const [nm, when] = LUCK_AREA[pos];
      return `<div class="facts"><b>${term(nm)}으로 들어올 때</b> — ${when} 이 간지의 기운이 더해집니다.<ul class="pos-ul"><li>${stemLine(when)}</li><li>${brLine(when)}</li></ul></div>`;
    }
    return `<div class="facts"><b>자리마다 뜻이 달라집니다</b><ul class="pos-ul">${['year', 'month', 'day', 'hour'].map(k => `<li>${term(M.POS_K[k] + '주')}에 있으면: ${POS_AREA[k]}에 이 기운이 나타납니다.</li>`).join('')}</ul>
      <span class="muted">원국 표에서 기둥 이름(간지)을 누르면 내 일간 기준으로 자세히 풀어 줍니다.</span></div>`;
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(S.inp)); } catch (e) { } }
  function pick(p) {
    const [k, v] = p.split(':');
    if (k === 'now') S.sel = { kind: 'now', k: v };
    else if (k === 'daeun') S.sel = { kind: 'daeun', i: +v };
    else if (k === 'seun') { S.sel = { kind: 'seun', Y: +v }; S.selYear = +v; }
    else if (k === 'wolun') { const m = M.wolun(S.ch, S.selYear)[+v]; const d = kstYMD(m.startMs); S.selYM = [d[0], d[1]]; S.sel = { kind: 'wolun', i: +v }; }
    else if (k === 'ilun') S.sel = { kind: 'ilun', d: +v };
    render();
  }
  document.addEventListener('click', ev => {
    const t = ev.target;
    const tm = t.closest('.term');
    if (tm) { ev.preventDefault(); S.sheet = tm.dataset.term; S.sheetPos = tm.dataset.pos || null; renderSheet(); return; }
    const act = t.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'close') { if (t === act || t.classList.contains('x')) { S.sheet = null; renderSheet(); } return; }
      if (a === 'gl-save' || a === 'gl-reset') { saveTerm(a === 'gl-reset'); return; }
      if (a === 'admin-out') { adminLogout(''); return; }
      if (a.startsWith('pk-reset:')) { const k = a.slice(9); if (k === 'tr') PK.tr.cards = {}; else PK[k] = {}; pkSave(); render(); return; }
      if (a === 'tr-draw') { trDraw(); return; }
      if (a === 'edit') { if (S.editing) readForm(); S.editing = !S.editing; render(); return; }
      if (a.startsWith('year:')) { const d = +a.slice(5); S.selYear = d === 0 ? M.yearPillarAt(NOW).sajuYear : Math.max(M.MIN_Y, Math.min(M.MAX_Y - 2, S.selYear + d)); if (S.sel && S.sel.kind === 'wolun') S.sel = null; render(); return; }
      if (a.startsWith('zwy:')) { const d = +a.slice(4); S.zwY = d === 0 ? zwNowY() : Math.max(S.ch.ziwei.lunar.y, (S.zwY ?? zwNowY()) + d); render(); return; }
      if (a.startsWith('ym:')) { const d = +a.slice(3); if (d === 0) S.selYM = [TODAY[0], TODAY[1]]; else { let [y, m] = S.selYM; m += d; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.selYM = [y, m]; } if (S.sel && S.sel.kind === 'ilun') S.sel = null; render(); return; }
    }
    const tb = t.closest('[data-tab]');
    if (tb) { if (S.editing) readForm(); S.tab = tb.dataset.tab; try { localStorage.setItem(STORE + '-tab', S.tab); } catch (e) { } render(); return; }
    const op = t.closest('[data-opt]');
    if (op) {
      const [sys, k, v] = op.dataset.opt.split(':');
      if (sys === 'tr') {
        if (k === 'topic' || k === 'spread') PK.tr[k] = v;
        else if (k.startsWith('rev.') && PK.tr.cards[k.slice(4)]) PK.tr.cards[k.slice(4)][1] = v === '1';
      } else if (PK[sys][k] === v) delete PK[sys][k]; else PK[sys][k] = v;
      pkSave(); render(); return;
    }
    const st = t.closest('[data-set]');
    if (st) {
      const [k, v] = st.dataset.set.split(':');
      if (S.editing) readForm();
      if (k === 'model' || k === 'school') { S.inp[k] = v; run(); save(); render(); return; }
      S.inp[k] = v; if (k === 'calendar') S.inp.leap = false; render(); return;
    }
    const pk = t.closest('[data-pick]');
    if (pk) { pick(pk.dataset.pick); return; }
    const zy = t.closest('[data-zwy]');
    if (zy) { S.zwY = +zy.dataset.zwy; render(); return; }
    const zc = t.closest('[data-zw]');
    if (zc) { S.zwSel = +zc.dataset.zw; render(); }
  });
  document.addEventListener('change', ev => {
    const id = ev.target.id;
    if (id === 'f-hu' || id === 'f-city' || id === 'f-y') { readForm(); render(); }
    if (id.startsWith('tr-c-')) { const p = id.slice(5), v = ev.target.value; if (v) PK.tr.cards[p] = [v, PK.tr.cards[p] ? PK.tr.cards[p][1] : false]; else delete PK.tr.cards[p]; pkSave(); render(); }
    if (id === 'zw-adj') { S.zwAdj = ev.target.checked; render(); }
    if (id === 'zw-g12') { S.zwG12 = ev.target.checked; render(); }
  });
  document.addEventListener('submit', ev => {
    ev.preventDefault();
    if (ev.target.id === 'admin-form') { adminLogin(document.getElementById('admin-pw').value); return; }
    readForm();
    try { validate(); } catch (e) { S.err = e.message; render(); return; }
    run();
    if (!S.err) { S.isExample = false; S.editing = false; S.sel = null; S.zwSel = null; S.zwY = null; save(); }
    render();
  });
  document.addEventListener('input', ev => { if (ev.target.id === 'gl-q') { S.glq = ev.target.value; document.getElementById('gl-list').innerHTML = glList(); } });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.sheet) { const ta = document.getElementById('gl-edit'); if (!ta || ta.value === GL[S.sheet][1]) { S.sheet = null; renderSheet(); } } if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.nowc')) { ev.preventDefault(); pick(ev.target.dataset.pick); }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[data-zw]')) { ev.preventDefault(); S.zwSel = +ev.target.dataset.zw; render(); } });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });

  async function adminLogin(pw) {
    if (!pw) { S.adminMsg = '비밀번호를 입력하세요'; render(); return; }
    adminPw = pw;
    try { await api('/api/admin', { method: 'POST', body: '{}' }); try { sessionStorage.setItem(ADMIN_KEY, pw); } catch (e) { } S.adminMsg = null; S.tab = 'gl'; render(); }
    catch (e) { adminPw = null; S.adminMsg = e.message; render(); }
  }
  function adminLogout(msg) { adminPw = null; try { sessionStorage.removeItem(ADMIN_KEY); } catch (e) { } S.adminMsg = msg || null; render(); }
  async function saveTerm(reset) {
    const key = S.sheet, ta = document.getElementById('gl-edit');
    const setMsg = (t, c) => { const msg = document.getElementById('gl-msg'); if (msg) { msg.textContent = t; msg.className = 'admin-msg ' + (c || ''); } };
    const text = reset ? null : ta.value.trim();
    if (!reset && !text) { setMsg('설명을 입력하세요', 'err'); return; }
    if (reset && !confirm('기본 문구로 되돌릴까요?')) return;
    setMsg('저장 중…');
    try {
      const r = await api('/api/glossary', { method: 'PUT', body: JSON.stringify({ term: key, text }) });
      if (r.text == null) { delete OVR[key]; GL[key][1] = window.GLOSSARY_DEFAULT[key]; } else { OVR[key] = r.text; GL[key][1] = r.text; }
      render(); setMsg(reset ? '기본 문구로 되돌렸습니다' : '저장했습니다. 모든 방문자에게 반영됩니다(최대 1분).', 'ok');
    } catch (e) { if (e.status === 401) { adminLogout('로그인이 만료되었습니다. 다시 로그인하세요.'); return; } setMsg(e.message, 'err'); }
  }
  window.addEventListener('hashchange', () => render());

  run(); render();
  if (/^https?:$/.test(location.protocol)) api('/api/glossary').then(o => { applyOverrides(o); render(); }).catch(() => { });
})();

</script>
