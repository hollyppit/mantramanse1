<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>만트라 만세력</title>
<meta name="description" content="천문 계산 기반 만세력 · 원국, 합충, 신살, 오행, 용신, 대운·세운·월운·일진">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@700;800;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* 레이아웃: 밝은 단일 테마 앱 셸 — 반투명 상단바, 알약형 탭, 그림자 카드. 오방색은 파스텔 타일로 */
:root {
  --bg: #F5F6FA; --surface: #FFFFFF; --surface-2: #F0F2F7; --ink: #12151F; --ink-2: #474E5E; --ink-3: #8089A0;
  --line: #E7EAF1; --accent: #2F5BFF; --accent-2: #7B61FF; --accent-soft: #ECF0FF; --seal: #FF5B4A;
  --wood: #2FA866; --fire: #E8402F; --earth: #F5B921; --metal: #D9DDE5; --water: #2B303C;
  --wood-ink: #17744B; --fire-ink: #C9331F; --earth-ink: #946B00; --metal-ink: #5F4E9E; --water-ink: #2A48A0;
  --wood-on: #fff; --fire-on: #fff; --earth-on: #2A2100; --metal-on: #1D2230; --water-on: #fff;
  --d-atk: #1E9E57; --d-ext: #0E9AA7; --d-hrv: #8A5CF6; --d-acc: #2F6BFF; --d-chg: #E08A00; --d-def: #E5533D;
  --good: #1E9E57; --bad: #F0563F; --mid: #BAC1CE; --good-soft: #E3F5EA; --bad-soft: #FFEAE6;
  --shadow: 0 1px 2px rgba(18, 21, 31, .04), 0 10px 30px -12px rgba(30, 40, 90, .12);
  --f-display: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --f-head: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 18px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); background-image: radial-gradient(1200px 420px at 85% -120px, #E6ECFF 0%, transparent 70%), radial-gradient(900px 380px at -10% -80px, #FFF0EA 0%, transparent 65%); background-repeat: no-repeat; color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; padding: 0 16px 56px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h2 { font-size: 1.12rem; font-weight: 800; }
h3 { font-size: 0.98rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 0.82rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* 내보내기(PDF·이미지) */
.xp button { font-size: 0.8rem; }
.xp button[disabled] { opacity: .6; cursor: wait; }
.xs { position: absolute; left: -10000px; top: 0; width: 714px; background: #fff; color: var(--ink); padding: 0; display: grid; gap: 12px; font-size: 15px; }
.xs .card { box-shadow: none; }
.xs .du-strip { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); overflow: visible; }
.xs-head { display: grid; gap: 2px; padding: 4px 2px 8px; border-bottom: 2px solid var(--ink); }
.xs-head b { font-family: var(--f-head); font-size: 1.25rem; }
.xs-head span { font-size: 0.82rem; color: var(--ink-2); }

/* 공유용 사주 카드 */
.xc { width: 1080px; box-sizing: border-box; padding: 64px; background: linear-gradient(160deg, #fff 55%, #eef2ff); color: var(--ink); font-size: 28px; display: grid; gap: 28px; }
.xc-top { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; border-bottom: 3px solid var(--ink); padding-bottom: 14px; }
.xc-top b { font-family: var(--f-head); font-size: 34px; } .xc-top span { font-size: 20px; color: var(--ink-2); text-align: right; }
.xc-title { font-family: var(--f-head); font-size: 64px; font-weight: 800; line-height: 1.15; }
.xc-sub { font-size: 30px; color: var(--ink-2); margin-top: -14px; }
.xc-four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.xc-p { display: grid; gap: 8px; justify-items: center; text-align: center; padding: 14px 8px; border-radius: 20px; background: #fff; border: 2px solid var(--line); }
.xc-p.me { border-color: var(--ink); border-width: 4px; }
.xc-pl { font-size: 22px; font-weight: 700; color: var(--ink-2); } .xc-tg { font-size: 24px; font-weight: 700; } .xc-us { font-size: 20px; color: var(--ink-2); }
.xc-g { width: 100%; height: 168px; border-radius: 16px; background: var(--c); color: var(--on); display: grid; place-items: center; align-content: center; }
.xc-g b { font-size: 96px; line-height: 1; font-weight: 800; } .xc-g i { font-style: normal; font-size: 22px; opacity: .85; }
.xc-sec { font-size: 26px; font-weight: 800; margin-top: 4px; }
.xc-bars { display: grid; gap: 10px; }
.xc-bar { display: grid; grid-template-columns: 44px 1fr 64px; gap: 14px; align-items: center; font-size: 24px; font-weight: 700; }
.xc-bar div { height: 22px; background: #e8ebf3; border-radius: 99px; overflow: hidden; } .xc-bar i { display: block; height: 100%; background: var(--c); border-radius: 99px; } .xc-bar em { font-style: normal; text-align: right; color: var(--ink-2); }
.xc-chips { display: flex; flex-wrap: wrap; gap: 10px; } .xc-chips span { font-size: 24px; font-weight: 700; padding: 6px 16px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
.xc-chips span.g { background: var(--good-soft); color: var(--good); } .xc-chips span.b { background: var(--bad-soft); color: var(--bad); }
.xc-foot { font-size: 20px; color: var(--ink-2); text-align: center; margin-top: 6px; }
.chip.hl { outline: 1.5px solid var(--accent); }

/* 상단 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 78%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); padding-block: 12px 10px; margin: 0 -16px; padding-inline: 16px; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.top-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.seal { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, var(--seal), #FF8A4C); color: #fff; font-family: var(--f-display); font-weight: 900; font-size: 13px; line-height: 1.05; display: grid; place-items: center; text-align: center; box-shadow: 0 6px 14px -6px rgba(255, 91, 74, .6); }
.brand h1 { font-size: 1.12rem; font-weight: 900; letter-spacing: -0.03em; }
.who { flex: 1 1 240px; min-width: 0; font-size: 0.84rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-size: 0.86rem; font-weight: 700; box-shadow: 0 1px 2px rgba(18, 21, 31, .05); transition: transform .12s, box-shadow .12s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; box-shadow: 0 8px 18px -8px rgba(47, 91, 255, .7); }
.btn.primary:hover { color: #fff; transform: translateY(-1px); }
.tabs { max-width: 980px; margin: 10px auto 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; background: none; border: 0; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--ink-3); border-radius: 999px; transition: background .15s, color .15s; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: #fff; background: var(--ink); }

/* 카드 */
.card { background: var(--surface); border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); border-radius: var(--r); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.note { font-size: 0.82rem; color: var(--ink-3); line-height: 1.55; }
.warn { border: 0; background: linear-gradient(135deg, #FFF1EC, #FFF7F0); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; font-size: 0.88rem; box-shadow: inset 0 0 0 1px #FFD9CF; }
.warn b { color: var(--seal); }

/* 요약 히어로 */
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 22px; color: #fff; background: radial-gradient(420px 220px at 100% 0%, rgba(255, 138, 76, .55), transparent 70%), linear-gradient(135deg, #2F5BFF 0%, #5B4DFF 55%, #7B61FF 100%); box-shadow: 0 18px 40px -20px rgba(47, 91, 255, .8); display: grid; gap: 16px; }
.hero .eyebrow { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.08em; opacity: .8; }
.hero h2 { font-size: 1.5rem; font-weight: 900; color: #fff; }
.hero .pills { display: flex; gap: 6px; flex-wrap: wrap; }
.hero .hp { background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .28); border-radius: 999px; padding: 4px 11px; font-size: 0.8rem; font-weight: 600; color: #fff; }
.hero .hp .term { color: #fff; text-decoration-color: rgba(255, 255, 255, .6); }
.hero .four { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.hero .p4 { background: rgba(255, 255, 255, .96); color: var(--ink); border-radius: 14px; padding: 10px 4px 8px; text-align: center; display: grid; gap: 2px; }
.hero .p4 .pl { font-size: 0.7rem; color: var(--ink-3); font-weight: 700; }
.hero .p4 .pg { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.3rem, 5.4vw, 1.9rem); line-height: 1.1; letter-spacing: 0.02em; }
.hero .p4.me { box-shadow: 0 0 0 3px #FFD166; }
.hero .p4 .pk { font-size: 0.7rem; color: var(--ink-3); }

/* 입력 */
.form { display: grid; gap: 14px; }
.frow { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 0.78rem; color: var(--ink-3); font-weight: 600; letter-spacing: 0.02em; }
input, select { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 9px 12px; min-width: 0; transition: border-color .15s, background .15s; }
input:focus, select:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
input[type="number"] { width: 5.2em; }
input#f-y { width: 6.2em; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 0.86rem; font-weight: 600; color: var(--ink-2); border-radius: 9px; }

.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 800; box-shadow: 0 1px 3px rgba(18, 21, 31, .12); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 0.88rem; color: var(--ink-2); padding-bottom: 7px; }
details.adv { border-top: 1px dashed var(--line); padding-top: 10px; }
details.adv summary { cursor: pointer; font-size: 0.88rem; font-weight: 600; color: var(--ink-2); }
.adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 12px; }
.err { color: var(--seal); font-size: 0.88rem; font-weight: 600; }

/* 용어 버튼 */
.term { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; text-decoration: underline dotted color-mix(in srgb, var(--ink-3) 70%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.term:hover { color: var(--accent); text-decoration-color: var(--accent); }

/* 원국표 */
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.86rem; color: var(--ink-2); }
.meta b { color: var(--ink); font-weight: 600; }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.pil { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 340px; table-layout: fixed; }
table.pil th.rl { width: 58px; text-align: left; font-size: 0.74rem; font-weight: 600; color: var(--ink-3); vertical-align: middle; }
table.pil thead th { font-size: 0.8rem; color: var(--ink-3); font-weight: 600; padding-bottom: 2px; }
table.pil thead th .gzk { display: block; font-weight: 400; font-size: 0.72rem; }
table.pil td { text-align: center; font-size: 0.8rem; vertical-align: middle; padding: 3px 2px; line-height: 1.35; }
td.glyph { border-radius: 14px; padding: 8px 0 6px !important; background: var(--c); border: 0; }
td.glyph .g { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1; color: var(--on); display: block; }
td.glyph .gs { font-size: 0.72rem; color: var(--on); opacity: .85; display: block; margin-top: 4px; }
td.glyph.me { box-shadow: 0 0 0 2px var(--accent), 0 8px 18px -10px rgba(47, 91, 255, .7); }
td.tg { font-weight: 600; font-size: 0.84rem; }
td.hid { font-size: 0.76rem; color: var(--ink-2); }
td.hid div { white-space: nowrap; }
.e-wood { --c: var(--wood); --ci: var(--wood-ink); --on: var(--wood-on); } .e-fire { --c: var(--fire); --ci: var(--fire-ink); --on: var(--fire-on); }
.e-earth { --c: var(--earth); --ci: var(--earth-ink); --on: var(--earth-on); } .e-metal { --c: var(--metal); --ci: var(--metal-ink); --on: var(--metal-on); }
.e-water { --c: var(--water); --ci: var(--water-ink); --on: var(--water-on); }
/* 오행은 글자색이 아니라 배경 타일 색으로 구분한다 (글자는 타일 위 대비색) */
.eltxt { background: var(--c); color: var(--on); font-weight: 800; padding: 0 0.32em; border-radius: 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
td.empty { color: var(--ink-3); background: var(--surface-2); border-radius: 14px; }
.chip { display: inline-block; font-size: 0.72rem; line-height: 1.3; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); margin: 1px; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.gm { background: var(--ink); color: var(--surface); }
.pill { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
.pill.b-길 { background: var(--good); color: var(--surface); } .pill.b-소길 { background: var(--good-soft); color: var(--good); }
.pill.b-평 { background: var(--surface-2); color: var(--ink-2); }
.pill.b-소흉 { background: var(--bad-soft); color: var(--bad); } .pill.b-흉 { background: var(--bad); color: var(--surface); }
.pill.b-순풍 { background: var(--good-soft); color: var(--good); } .pill.b-보통 { background: var(--surface-2); color: var(--ink-2); }
.pill.b-주의 { background: color-mix(in srgb, var(--d-chg) 18%, var(--surface)); color: var(--d-chg); } .pill.b-부담 { background: var(--bad-soft); color: var(--bad); }
button.pill { border: 0; cursor: pointer; font-family: inherit; }
.pill.lv-강 { background: var(--bad); color: var(--surface); } .pill.lv-약 { background: var(--bad-soft); color: var(--bad); } .pill.lv-참고 { background: var(--surface-2); color: var(--ink-2); }

/* 목록·표 */
.list { display: grid; gap: 0; }
.li { display: grid; grid-template-columns: minmax(84px, auto) 1fr auto; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .k { font-size: 0.8rem; font-weight: 600; color: var(--ink-2); }
.li .v { min-width: 0; }
.li .v .small { display: block; }
table.dt { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
table.dt th, table.dt td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
table.dt th { font-size: 0.76rem; color: var(--ink-3); font-weight: 600; }
table.dt tr.cur td { background: var(--accent-soft); }
table.dt td.gz { font-family: var(--f-display); font-weight: 700; font-size: 1rem; }

/* 차트 */
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 64px 1fr 52px; gap: 10px; align-items: center; font-size: 0.86rem; }
.bar .track { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--c, var(--accent)); border-radius: 999px; }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.bar .lab { font-weight: 600; }
.subtg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.78rem; color: var(--ink-3); padding-left: 74px; margin-top: -4px; }
svg text { font-family: var(--f-body); }
.penta-wrap { display: grid; grid-template-columns: minmax(0, 420px) 1fr; gap: 18px; align-items: center; }
@media (max-width: 640px) { .penta-wrap { grid-template-columns: 1fr; } }
.penta { width: 100%; max-width: 420px; height: auto; display: block; }
.penta .saeng { stroke: var(--ink-3); stroke-width: 2; }
.penta .geuk { stroke: var(--bad); stroke-width: 1.6; stroke-dasharray: 5 4; opacity: .85; }
.penta .ah-saeng { fill: var(--ink-3); } .penta .ah-geuk { fill: var(--bad); }
.penta .node { fill: color-mix(in srgb, var(--c) 16%, var(--surface)); stroke: var(--c); stroke-width: 2; }
.penta .me-ring { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 3 3; }
.penta .nh { font-family: var(--f-display); font-weight: 900; font-size: 20px; fill: var(--ci); }
.penta .np { font-size: 11px; font-weight: 700; fill: var(--ink-2); }
.penta .nl { font-size: 12px; font-weight: 700; fill: var(--ci); }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; }
.hit { cursor: pointer; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: #fff; box-shadow: 0 10px 24px -10px rgba(18,21,31,.5); font-size: 0.8rem; padding: 6px 9px; border-radius: 6px; max-width: 240px; line-height: 1.45; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.78rem; color: var(--ink-2); align-items: center; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.gauge-l { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--ink-3); }
.lamps { display: flex; gap: 8px; flex-wrap: wrap; }
.lamp { border: 0; background: var(--surface-2); border-radius: 999px; padding: 6px 10px; font-size: 0.84rem; display: flex; gap: 6px; align-items: center; }
.lamp i { width: 8px; height: 8px; border-radius: 50%; background: var(--mid); display: inline-block; }
.lamp.on i { background: var(--accent); }

/* 용신 */
.roles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.role { border-radius: 16px; border: 0; background: var(--c); color: var(--on); padding: 10px 6px; text-align: center; display: grid; gap: 2px; }
.role .rn { font-size: 0.78rem; font-weight: 700; color: var(--on); }
.role .rg { font-family: var(--f-display); font-weight: 900; font-size: 1.8rem; color: var(--on); line-height: 1.1; }
.role .rp { font-size: 0.72rem; color: var(--on); opacity: .8; }
.role.main { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
ol.log { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: 0.9rem; color: var(--ink-2); }
@media (max-width: 520px) { .roles { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; } .role .rg { font-size: 1.4rem; } .role .rn { font-size: 0.7rem; } }

/* 운 */
.now { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 620px) { .now { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.nowc { border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 16px; padding: 10px 12px; display: grid; gap: 2px; cursor: pointer; text-align: left; background: var(--surface); }
.nowc:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.nowc .lbl { font-size: 0.74rem; color: var(--ink-3); font-weight: 600; }
.nowc .gzb { font-family: var(--f-display); font-weight: 900; font-size: 1.5rem; line-height: 1.15; }
.nowc .tgs { font-size: 0.76rem; color: var(--ink-2); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal .dow { font-size: 0.7rem; color: var(--ink-3); text-align: center; font-weight: 600; }
.cal button { border: 1px solid transparent; border-radius: 12px; padding: 5px 2px; min-height: 78px; cursor: pointer; display: grid; gap: 1px; justify-items: center; align-content: start; background: var(--surface-2); }
.cal button { position: relative; }
.cal .ctop { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 3px; }
.son { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: var(--seal); color: var(--surface); font-size: 9px; font-weight: 700; line-height: 1; }
.cal .sc { font-size: 0.74rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.cal .ld { font-size: 0.62rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cal .sc.strong { color: var(--ink); font-weight: 900; }
.acc { display: grid; gap: 0; }
.acc details { border-top: 1px solid var(--line); padding: 10px 0; }
.acc details:first-child { border-top: 0; }
.acc summary { cursor: pointer; list-style-position: outside; margin-left: 1em; }
.acc dl { display: grid; grid-template-columns: 96px 1fr; gap: 6px 14px; margin: 10px 0 0 1em; font-size: 0.88rem; }
.acc dt { font-weight: 700; color: var(--ink-2); font-size: 0.8rem; }
.acc dd { margin: 0; color: var(--ink-2); }
@media (max-width: 520px) { .acc dl { grid-template-columns: 1fr; gap: 2px; } .acc dd { margin-bottom: 6px; } }
.cal button .dn { font-size: 0.72rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal button .dg { font-family: var(--f-display); font-weight: 700; font-size: 0.9rem; line-height: 1.1; }
.cal button.today { border-color: var(--ink); }
.cal button.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.lts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(92px, 1fr); gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.lt { border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); border-radius: 16px; padding: 8px 6px; display: grid; gap: 3px; justify-items: center; align-content: start; cursor: pointer; text-align: center; }
.lt:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.lt.sel { box-shadow: inset 0 0 0 2px var(--ink); }
.lt.cur { background: var(--accent-soft); }
.lt-top { font-size: 0.7rem; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
.lt-tg { font-size: 0.74rem; font-weight: 700; color: var(--ink-2); }
.lt-g { display: grid; justify-items: center; width: 56px; padding: 4px 0 3px; border-radius: 12px; background: var(--c); }
.lt-g b { font-family: var(--f-display); font-weight: 900; font-size: 1.6rem; line-height: 1.05; color: var(--on); }
.lt-g i { font-style: normal; font-size: 0.66rem; color: var(--on); opacity: .85; }
.lt-us { font-size: 0.68rem; color: var(--ink-3); white-space: nowrap; }
.lt-ev { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 20px; }
.lt-ev .chip { font-size: 0.64rem; padding: 1px 5px; }
/* 운의 시기 */
.ph { display: inline-block; font-size: 0.72rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; color: #fff; text-decoration: none; border: 0; line-height: 1.4; }
button.ph { cursor: pointer; } button.ph:hover { color: #fff; filter: brightness(1.08); }
.phbox { border-radius: 14px; padding: 10px 12px; display: grid; gap: 4px; border-left: 4px solid; }
.phbox-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chart .ghost { fill: var(--ink-3); opacity: .16; }
.chart .ghost-line { fill: none; stroke: var(--ink-2); stroke-width: 1.4; opacity: .45; stroke-linejoin: round; }
.sw.ghost { background: color-mix(in srgb, var(--ink-3) 30%, var(--surface)); }
/* 일진 행동모드·시진 등급 */
.d-atk { background: var(--d-atk); } .d-ext { background: var(--d-ext); } .d-hrv { background: var(--d-hrv); } .d-acc { background: var(--d-acc); } .d-chg { background: var(--d-chg); } .d-def { background: var(--d-def); }
.lvl { display: inline-block; margin-left: 6px; font-size: 0.7rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; vertical-align: 2px; font-family: var(--f-body); }
.dm-bg { background: color-mix(in srgb, var(--dm) 9%, var(--surface)); border-color: var(--dm); }
.cal .dmn { font-size: 0.64rem; font-weight: 800; line-height: 1.1; }
.cal .dmn .ovm { display: block; font-style: normal; font-size: 0.56rem; font-weight: 800; }
.ov-volatility { color: var(--d-chg); } .ov-defense { color: var(--d-def); }
.ovb { display: inline-block; font-size: 0.68rem; font-weight: 800; padding: 1px 7px; border-radius: 999px; border: 1.5px solid currentColor; background: transparent; line-height: 1.4; margin-left: 3px; }
button.ovb { cursor: pointer; font-family: inherit; }
.flowbars { display: grid; gap: 4px; margin: 4px 0; }
.fb { display: grid; grid-template-columns: 112px 1fr 30px; gap: 8px; align-items: center; font-size: 0.78rem; }
.fb .fn { color: var(--ink-2); } .fb.main .fn { color: var(--ink); font-weight: 800; } .fb.sec .fn { font-weight: 700; color: var(--ink); }
.fb .num { text-align: right; }
.carc { display: block; }
.carc summary { cursor: pointer; font-weight: 800; }
.carstack { display: grid; margin: 8px 0; }
.cs-item { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 6px 0; align-items: start; }
.cs-ic svg { width: 22px; height: 22px; stroke: var(--ink-2); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cs-item b { font-size: 0.9rem; } .cs-item .small { display: block; }
.cs-arrow { margin-left: 8px; color: var(--ink-3); font-size: 0.8rem; line-height: 1; }
.cs-now { color: var(--ink); }
.gr { border: 0; cursor: pointer; font-size: 0.74rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; text-decoration: none; white-space: nowrap; }
.gr.g-go { background: var(--good); color: #fff; } .gr.g-use { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.gr.g-warn { background: #FFF1D6; color: #946B00; } .gr.g-avoid { background: var(--bad); color: #fff; }
.gr:hover { filter: brightness(1.05); }
tr.row-g-go td { background: color-mix(in srgb, var(--good) 8%, transparent); }
tr.row-g-avoid td { background: color-mix(in srgb, var(--bad) 7%, transparent); }
.judge { display: grid; gap: 4px; }
.jstep { display: grid; grid-template-columns: 22px 44px 1fr; gap: 6px; align-items: center; font-size: 0.84rem; padding: 6px 8px; border-radius: 10px; background: var(--surface-2); }
.jn { font-weight: 800; color: var(--ink-3); } .jl { font-weight: 800; }
/* 한난조습 지도 */
.cmap-wrap { display: grid; grid-template-columns: minmax(0, 300px) 1fr; gap: 18px; align-items: center; }
@media (max-width: 600px) { .cmap-wrap { grid-template-columns: 1fr; } }
.cmap { width: 100%; max-width: 300px; height: auto; display: block; }
.cq-hd { fill: #FFE6CC; } .cq-hw { fill: #FFDDE3; } .cq-cd { fill: #E9EDF3; } .cq-cw { fill: #DCE6FF; }
.cq-t { font-size: 11px; font-weight: 700; fill: var(--ink-3); }
.cq-bal { fill: color-mix(in srgb, var(--good) 12%, transparent); stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 4 3; }
.cq-bt { font-size: 10px; font-weight: 700; fill: var(--good); }
.cq-ax { stroke: var(--surface); stroke-width: 1.5; }
.cq-l { font-size: 11px; font-weight: 700; fill: var(--ink-2); }
.cq-me { fill: var(--ink); stroke: var(--surface); stroke-width: 3; }
.cq-mt { font-size: 11px; font-weight: 800; fill: var(--ink); }
.advice { display: grid; gap: 8px; }
.adv-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.adv-o { text-align: center; font-size: 0.84rem; font-weight: 700; color: var(--ink-3); padding: 8px 4px; border-radius: 10px; }
.adv-o.on { background: var(--ink); color: #fff; }
/* 자미두수 명반 */
.zw { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(132px, auto)); gap: 4px; }
.zc { position: relative; border-radius: 12px; background: var(--surface-2); padding: 6px 6px 18px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 3px; cursor: pointer; min-width: 0; box-shadow: inset 0 0 0 1px transparent; }
.zc:hover { box-shadow: inset 0 0 0 2px var(--line); }
.zc.ming { background: var(--accent-soft); }
.zc.curdh { box-shadow: inset 0 0 0 2px var(--good); }
.zc.sel { box-shadow: inset 0 0 0 2px var(--ink); }
.zc-main { display: flex; flex-wrap: wrap; gap: 2px 6px; }
.zc-main .zs .term { font-weight: 800; font-size: 0.92rem; color: var(--ink); text-decoration: none; }
.zc-sub { display: flex; flex-wrap: wrap; gap: 0 5px; align-content: start; }
.zs { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 1px; min-width: 0; max-width: 100%; }
.zs > .term:first-child { white-space: nowrap; }
.zs.good .term { font-size: 0.72rem; color: var(--good); text-decoration: none; }
.zs.bad .term { font-size: 0.72rem; color: var(--bad); text-decoration: none; }
.zs .hw, .zc-legend .hw { display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 1px; border-radius: 4px; font-size: 0.62rem; font-weight: 800; color: #fff; vertical-align: 2px; text-decoration: none; }
.hw.hl { background: var(--good); } .hw.hg { background: var(--accent-2); } .hw.hk { background: var(--accent); } .hw.hj { background: var(--bad); }
.zs .hw:hover { color: #fff; }
.hw.o-dh, .hw.o-yr { width: auto; padding: 0 3px; background: var(--surface); border: 1.5px solid currentColor; }
.hw.o-dh.hl, .hw.o-yr.hl { color: var(--good); } .hw.o-dh.hg, .hw.o-yr.hg { color: var(--accent-2); } .hw.o-dh.hk, .hw.o-yr.hk { color: var(--accent); } .hw.o-dh.hj, .hw.o-yr.hj { color: var(--bad); }
.hw.o-yr { border-style: dashed; }
.zs .hw.o-dh:hover, .zs .hw.o-yr:hover { color: var(--ink); }
.zb { font-size: 0.58rem; font-weight: 700; line-height: 1.3; padding: 0 3px; margin-left: 2px; border-radius: 4px; background: var(--surface); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); text-decoration: none; vertical-align: 2px; }
.zc-g12 { display: flex; flex-wrap: wrap; gap: 0 4px; }
.zc-g12 .term { font-size: 0.6rem; color: var(--accent-2); text-decoration: none; }
.zc-adj { display: flex; flex-wrap: wrap; gap: 0 4px; align-content: start; }
.zc-adj .term { font-size: 0.6rem; color: var(--ink-3); text-decoration: none; }
.chip .hw { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 4px; font-size: 0.6rem; font-weight: 800; color: #fff; }
.li .v .chip { margin: 2px 2px 0 0; }
.zc-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.zc-name { font-size: 0.74rem; font-weight: 800; color: var(--ink-2); white-space: nowrap; }
.zc.ming .zc-name .term { color: var(--accent); }
.zc-gz { font-family: var(--f-display); font-size: 0.72rem; color: var(--ink-3); }
.zc-dh { position: absolute; left: 6px; bottom: 3px; font-size: 0.64rem; color: var(--ink-3); }
.zc-tag { font-size: 0.62rem; font-weight: 800; padding: 0 4px; border-radius: 4px; background: var(--ink); color: #fff; }
.zc-tag .term { color: #fff; text-decoration: none; }
.zc-tag.zc-yr { background: var(--seal); }
.zc-center { grid-area: 2 / 2 / 4 / 4; display: grid; align-content: center; justify-items: center; gap: 4px; text-align: center; font-size: 0.8rem; color: var(--ink-2); padding: 8px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.zc-center .zt { font-size: 1rem; color: var(--ink); }
.zc-legend { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-items: center; margin-top: 4px; }
@media (max-width: 560px) {
  .zw { gap: 3px; grid-template-rows: repeat(4, minmax(108px, auto)); }
  .zc { padding: 4px 4px 16px; }
  .zc-main .zs .term { font-size: 0.8rem; }
  .zs.good .term, .zs.bad .term { font-size: 0.64rem; }
  .zc-gz { display: none; }
  .zc-center { font-size: 0.7rem; padding: 4px; }
}

/* 자미두수 요약·그래프 */
.zq { display: grid; gap: 10px; }
.zq-hero { display: grid; gap: 4px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); }
.zq-hero b { font-size: 1.02rem; }
.zq-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .zq-grid { grid-template-columns: 1fr; } }
.zq-box { border-radius: 12px; background: var(--surface-2); padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.zq-box h4 { margin: 0; font-size: 0.82rem; color: var(--ink-3); }
.zq-row { display: flex; gap: 8px; align-items: baseline; font-size: 0.86rem; color: var(--ink-2); flex-wrap: wrap; }
.zq-row .hw { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; font-size: 0.7rem; font-weight: 800; color: #fff; flex: none; }
.zq-row b { color: var(--ink); }
.zq-pill { display: inline-block; font-size: 0.7rem; font-weight: 800; padding: 1px 7px; border-radius: 99px; color: #fff; }
.zq-pill.s4 { background: var(--good); } .zq-pill.s3 { background: var(--accent-2); } .zq-pill.s2 { background: var(--ink-3); } .zq-pill.s1 { background: var(--seal); } .zq-pill.s0 { background: var(--bad); }
.zg-two { display: grid; grid-template-columns: minmax(0, 340px) 1fr; gap: 16px; align-items: center; }
@media (max-width: 640px) { .zg-two { grid-template-columns: 1fr; } }
.zg-radar { width: 100%; max-width: 340px; height: auto; display: block; margin: 0 auto; }
.zg-rg { stroke: var(--line); fill: none; }
.zg-ra { fill: color-mix(in srgb, var(--accent) 22%, transparent); stroke: var(--accent); stroke-width: 2; }
.zg-rl { font-size: 10.5px; font-weight: 700; fill: var(--ink-2); cursor: pointer; }
.zg-rl.sel { fill: var(--ink); font-weight: 900; }
.zg-bars { display: grid; gap: 4px; }
.zg-b { display: grid; grid-template-columns: 40px 1fr 30px; gap: 8px; align-items: center; font-size: 0.8rem; cursor: pointer; border-radius: 8px; padding: 2px 4px; }
.zg-b:hover, .zg-b.sel { background: var(--surface-2); }
.zg-b .n { font-weight: 700; color: var(--ink-2); }
.zg-b.sel .n { color: var(--ink); font-weight: 900; }
.zg-b .t { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.zg-b.sel .t { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.zg-b .t i { display: block; height: 100%; border-radius: 5px; }
.zg-b .v { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.zg-dh { display: block; }
.zg-dh g { cursor: pointer; }
.zm { display: grid; grid-template-columns: 74px repeat(4, minmax(0, 1fr)); gap: 4px; align-items: stretch; font-size: 0.78rem; }
.zm-h { text-align: center; font-weight: 700; color: var(--ink-3); font-size: 0.7rem; display: grid; gap: 2px; justify-items: center; align-content: end; }
.zm-h .hw { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; color: #fff; font-weight: 800; font-size: 0.75rem; }
.zm-r { align-self: center; font-size: 0.74rem; color: var(--ink-2); }
.zm-c { text-align: center; background: var(--surface-2); border-radius: 10px; padding: 6px 2px; cursor: pointer; display: grid; gap: 1px; line-height: 1.25; min-width: 0; }
.zm-c small { color: var(--ink-3); font-size: 0.64rem; }
.zm-c.muted { cursor: default; }
.zbd { display: flex; gap: 3px; height: 30px; border-radius: 10px; overflow: hidden; }
.zbd > span { display: grid; place-items: center; color: #fff; font-size: 0.72rem; font-weight: 800; min-width: 0; }
.zbd .term { color: #fff; text-decoration: none; }
.dom { display: grid; gap: 8px; }
.dom-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px; }
.dom-g { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 720px) { .dom-g { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.dcard { display: grid; gap: 2px; justify-items: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; cursor: pointer; min-width: 0; }
.dcard:hover { background: var(--surface-2); }
.dcard .dn { font-size: 0.78rem; color: var(--ink-3); font-weight: 700; }
.dcard .dv { font-size: 1.6rem; line-height: 1.1; }
.dcard .db { font-size: 0.8rem; font-weight: 800; color: var(--ink-2); }
.dcard .dt { font-size: 0.7rem; color: var(--ink-3); line-height: 1.3; }
.dbar { display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.dbar i { display: block; height: 100%; border-radius: 3px; }
.dom-n { margin: 0; }
.dparts { display: grid; gap: 6px; }
.dpart { display: grid; grid-template-columns: 9em 1fr 2.4em; gap: 8px; align-items: center; font-size: 0.86rem; }
.dpart .dbar { margin-top: 0; height: 8px; }
.dpart b { text-align: right; }
.volbox { display: grid; gap: 6px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--d-chg) 8%, var(--surface)); }
.volh { font-size: 0.86rem; }
.volbar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.volbar i { display: block; width: calc(var(--v) * 1%); height: 100%; border-radius: 5px; background: var(--d-chg); }
.cr-axes { display: grid; gap: 10px; }
.cr-ax { display: grid; grid-template-columns: 4.6em 1fr 4.6em auto; gap: 2px 8px; align-items: center; font-size: 0.86rem; }
.cr-ax .r { text-align: right; } .cr-ax .l, .cr-ax .r { color: var(--ink-3); } .cr-ax .on { color: var(--ink); font-weight: 800; }
.cr-bar2 { position: relative; display: flex; height: 12px; border-radius: 6px; overflow: hidden; }
.cr-bar2 i { display: block; height: 100%; }
.cr-bar2 .a { background: var(--accent); } .cr-bar2 .b { background: #F29A3C; }
.cr-bar2::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--surface); opacity: .9; }
.cr-ax .l.on { color: var(--accent); } .cr-ax .r.on { color: #C46A0A; }
.cr-bar, .cr-b { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.cr-bar i, .cr-b i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
.cr-v { font-size: 0.78rem; color: var(--ink-2); } .cr-w { grid-column: 2 / -1; font-size: 0.74rem; color: var(--ink-3); }
.cr-list { display: grid; gap: 8px; }
.cr-row { display: grid; grid-template-columns: 8.5em 1fr 2em auto; gap: 4px 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; cursor: pointer; }
.cr-row:hover { background: var(--surface-2); }
.cr-lab { font-size: 0.72rem; font-weight: 800; color: var(--ink-2); white-space: nowrap; } .cr-lab.good { color: var(--good); } .cr-lab.bad { color: var(--bad); }
.cr-why, .cr-more { grid-column: 1 / -1; font-size: 0.8rem; color: var(--ink-3); line-height: 1.4; } .cr-more { color: var(--accent); font-weight: 700; }
.cr-envtags { display: flex; flex-wrap: wrap; gap: 6px; }
.cr-env + .cr-env { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }

    if (has('상관') && has('정관')) {

      push('상관견관', both ? '강' : '약', `상관(${where('상관').join('·')})과 정관(${where('정관').join('·')})이 함께 있음${both ? ' — 둘 다 천간' : ''}`);
    }
    if (has('식신') && has('편관')) push('식신제살', '참고', `식신(${where('식신').join('·')})이 편관(${where('편관').join('·')})을 제어하는 구조`);
    if (has('편인') && has('식신') && inS('편인').length) push('효신탈식(도식)', '약', `천간의 편인(${inS('편인').join('·')})이 식신(${where('식신').join('·')})을 극함`);
    if (has('상관') && has('정인')) push('상관패인', '참고', `정인(${where('정인').join('·')})이 상관(${where('상관').join('·')})을 제어`);
    if (G[3] > 0 && G[4] > 0 && st.help < 50 && G[3] >= 20) push('살인상생', '참고', `관성 ${f1(G[3])}% · 인성 ${f1(G[4])}% — 관의 압박을 인성이 받아 나에게 전달`);
    if (G[2] >= 30 && st.help < 42) push('재다신약', '강', `재성 ${f1(G[2])}%, 나를 돕는 힘 ${f1(st.help)}%`);
    if (G[3] >= 30 && st.help < 42) push('관살과다', '강', `관성 ${f1(G[3])}%, 나를 돕는 힘 ${f1(st.help)}%`);
    if (G[1] >= 30 && st.help < 42) push('식상과다(설기)', '약', `식상 ${f1(G[1])}% — 기운이 과하게 빠져나감`);
    if (G[0] >= 35 && G[2] > 0) push('군겁쟁재', '약', `비겁 ${f1(G[0])}%가 재성 ${f1(G[2])}%를 나눠 가짐`);
    if (G[4] >= 35) push('인성과다', '약', `인성 ${f1(G[4])}%`);
    const NO = ['무비겁', '무식상', '무재', '무관', '무인성'];
    G.forEach((v, g) => { if (v < 0.01) push(NO[g], '참고', `${TG_GROUP[g]}이 원국에 전혀 없음 (지장간 포함)`); });
    w.pct.forEach((v, e) => { if (v < 0.01) push(`${EL_K[e]}(${EL[e]}) 결핍`, '참고', `${EL_K[e]} 오행이 원국에 전혀 없음 (지장간 포함)`); });
    // 투출
    const tuchul = [];
    POS.forEach(k => { const p = ch.pillars[k]; if (!p) return; HIDDEN[p.b].forEach(([hs]) => { ['year', 'month', 'day', 'hour'].forEach(k2 => { const q = ch.pillars[k2]; if (q && q.s === hs && k2 !== 'day') tuchul.push(`${POS_K[k]}지 ${STEM[hs]} → ${POS_K[k2]}간`); }); }); });
    return { list: out, tuchul };
  }

  // 월령 사령(司令): 절입 후 경과 일수로 월지 지장간 중 지금 주도권을 쥔 글자를 찾는다. 표시용 정보이며 강약·용신 점수에는 쓰지 않는다.
  function saryeong(ch) {
    const jie = ch.pillars.month.jie, b = ch.pillars.month.b;
    const day = Math.max(0, Math.floor((ch.utc - jie.t) / 86400000));   // 절입일 = 0일째
    let acc = 0, idx = HIDDEN[b].length - 1;
    for (let i = 0; i < HIDDEN[b].length; i++) { acc += HIDDEN[b][i][1]; if (day < acc) { idx = i; break; } }
    const s = HIDDEN[b][idx][0];
    return { day: day + 1, stem: s, label: hiddenLabels(b)[idx], tg: tenGod(ch.pillars.day.s, s), jie: jie.name };
  }

  // ───────────── 운 ─────────────
  function daeun(ch) {
    const fwd = (yang(ch.pillars.year.s) && ch.gender === 'M') || (!yang(ch.pillars.year.s) && ch.gender === 'F');
    const { prev, next } = surroundingJie(ch.utc);
    const target = fwd ? next : prev;
    const diffMs = Math.abs(target.t - ch.utc);
    const days = diffMs / 86400000;
    const exact = days / 3;
    let num = Math.round(exact); if (num < 1) num = 1;   // 대운수는 최소 1로 표기. 실제 시작은 startMs(출생 후 startMonths개월)
    const startMs = ch.utc + diffMs * 120;
    const list = [];
    for (let k = 1; k <= 10; k++) {
      const idx = mod(ch.pillars.month.i + (fwd ? k : -k), 60);
      const st = startMs + (k - 1) * 10 * 365.2422 * 86400000;
      list.push({ ...gz(idx), startMs: st, startAge: num + (k - 1) * 10, startYear: new Date(st).getUTCFullYear() });
    }
    return { forward: fwd, days, exact, num, startMs, startMonths: Math.round(diffMs * 4 / 86400000), jie: target, list };
  }
  function yearPillarOf(Y) { return { ...gz(mod(Y - 4, 60)), year: Y }; }
  function monthsOfYear(Y) { // 입춘 Y ~ 소한 Y+1
    const ys = gz(mod(Y - 4, 60)).s; const out = [];
    const rows = [termsOf(Y), termsOf(Y + 1)];
    for (let mIdx = 0; mIdx < 12; mIdx++) {
      const b = mod(mIdx + 2, 12);
      const s = mod((ys % 5) * 2 + 2 + mIdx, 10);
      const ti = 2 + mIdx * 2; // 입춘=2
      const t = ti < 24 ? rows[0][ti] : rows[1][ti - 24];
      out.push({ ...gz(gzIndex(s, b)), startMs: t, termName: TERM_NAMES[ti % 24] });
    }
    return out;
  }

  // ───────────── 운 평가 엔진 ─────────────
  // 운 한 기둥을 네 개의 독립 축으로 평가한다. 대운·세운·월운·일진·시진 모두 이 엔진 하나를 쓰고,

  //   volatilityScore 합·충·형·파·해가 원국 구조를 움직이는 변화 신호의 세기(0~100). 길흉이 아니라 변동성이다

      external: [0.3, 0.1, 0.6, 0.5, 0.2],                 // 외부 관계·제안이 들어오는 정도

  const VOLATILITY_CONFIG = {

  // ───────────── 운의 흐름 구조: 주 흐름 + 상태 overlay + 적합 상태 ─────────────

  // 시간 단위별 주 흐름 배율: 긴 단위일수록 기반·확대 흐름이, 짧은 단위일수록 활동·회수 흐름이 조금 더 잘 드러나게 한다(±10% 이내). 별도 알고리즘은 없다.

  const bandOf = conditionOf;

  // 오행 부합도: 용신 체계의 역할(용·희·한·구·기)로 운 천간·지지(지장간 가중)를 평가
  function elementFit(yong, p, stemW, tag) {

  // 조후: 운이 원국의 한난조습 치우침을 줄이는지(+) 키우는지(−). 용신 유무와 무관하게 연속값으로 계산

  // 60갑자 전체 평균을 빼서, 극단적인 기후의 사주가 평균적으로 한쪽으로 치우치지 않게 맞춘다

  // 운 글자가 원국과 만드는 합·충 등을 오행 역할에 따라 점수화(관계 성분)
  function relationParts(ch, p, rels, r, roleTxt) {

  // 변동성: 운 글자가 원국과 만드는 관계를 "변화 신호"로 모아 0~100으로 만든다. 길흉은 판단하지 않는다.
  function calculateVolatility(ch, rels) {

  // 변동성과 흐름 점수를 함께 읽은 한 줄 설명 (변동성은 길흉이 아니므로 어떤 조합도 가능하다)
  function volatilityNote(ev) {

  // 이 운 글자가 일간 기준 어느 십성 묶음(0 비겁 1 식상 2 재성 3 관성 4 인성)을 얼마나 끌어오는지

    const g = [0, 0, 0, 0, 0];

  // 기회 활성도와 확장·수확·축적 활성도 (모두 0~100). 길흉이 아니라 "무엇이 활성화되는가"이며 흐름 점수·변동성과 독립이다
  //   g 운이 끌어오는 십성 묶음 / G 원국 십성 묶음(%) / need 원국에서 모자란 정도 / rels 운과 원국의 관계
  function opportunityOf(g, G, need, rels) {

    add(W.tenGod * tenGod, `${gn(top(tScore))} 기운이 들어와 ${O.types.names[top(tScore)]} 쪽 새 활동이 활성화됨`);
    add(W.expression * expression, '식상 활성 증가 — 표현·생산·결과물 활동이 늘어남');
    add(W.lead * lead, '비겁 활성 증가 — 독립·주도·경쟁·새로운 관계 신호');
    add(W.external * external, '재성·관성 활동 증가 — 외부에서 오는 제안과 역할 신호');

  }
  // 기회 활성도와 흐름 점수를 함께 읽은 한 줄 설명 (기회가 많다는 것과 그 기회가 유리하다는 것은 다른 개념이다)

  // 점수 → 주 흐름·동반 흐름·overlay·적합 상태. 서로 경쟁하지 않는 세 층을 한 곳에서 조합한다(순수 함수라 점수만으로 검증할 수 있다).
  //   flows 네 활성도 / vol·def 변동성·부담도 점수(0~100) / fit 흐름 적합도(−100~+100)
  function composeFlowState(flows, vol, def, fit) {

  }
  function evaluateLuck(ch, p, level = 'ilun', opts = {}) {
    const C = LUCK_CFG, L = C.levels[level] || C.levels.ilun, stemW = opts.stemW ?? L.stemW;
    const W = luckWeights(ch, level), dEl = stemEl(ch.pillars.day.s), G = ch.weights.groups;
    const { rels } = luckRelations(ch, p);
    // 성분 점수(각각 −100~+100)

    const jo = johuFit(ch, p, stemW);

    // 관계 성분의 오행 역할은 억부·조후(·통관) 가중치대로 섞는다. 조후는 연속값이라 온도 기준 역할값으로 환산한다.

      return (W.eokbu * eokR + W.tonggwan * tonR + W.johu * joR) / yw;
    };
    const roleTxt = e => { const a = ch.yongAll.eokbu.roles[e], jy = ch.yongAll.johu; return jy.applicable && jy.roles[e] !== a ? `억부 ${a}·조후 ${jy.roles[e]}` : a; };
    const relP = relationParts(ch, p, rels, rBlend, roleTxt);
    const relRaw = relP.reduce((a, x) => a + x.v, 0);
    const relationScore = lclamp(relRaw * C.relationScale, -100, 100);
    // 구조 성분: 원국에서 모자란 십성 묶음을 채우면 +, 이미 넘치는 묶음을 더 키우면 −
    const g = groupPull(dEl, p), S = C.structure;
    // 활동 유형: 비겁+식상은 두 묶음의 합이므로 보정해 다른 묶음과 견준다. 주도 십성은 이긴 유형 안에서 가장 센 묶음
    // 주도 십성(top)은 표시용 보조값이다. 시기 유형은 아래 기회·확장·수확·축적 활성도로 따로 정한다
    const act = { '기회': (g[0] + g[1]) * C.attackNorm, '확장': g[3], '수확': g[2], '축적': g[4] };
    const pullType = Object.keys(act).reduce((a, k) => act[k] > act[a] ? k : a, '기회');
    const top = pullType === '기회' ? (g[0] >= g[1] ? 0 : 1) : { '확장': 3, '수확': 2, '축적': 4 }[pullType];
    const need = G.map(pc => (S.neutralPct - pc) / S.neutralPct);
    let structRaw = 0; g.forEach((v, i) => structRaw += v * need[i]);
    const structP = [];
    let patAdj = 0;
    for (const pt of ch.patterns.list) {
      const adj = S.pattern[pt.name]; if (adj == null || pt.level === '참고') continue;
      const hit = (pt.name === '관살혼잡' && g[3] >= 0.4) || (pt.name === '상관견관' && g[1] >= 0.4) || (pt.name === '군겁쟁재' && g[0] >= 0.4) || (pt.name === '효신탈식(도식)' && g[4] >= 0.4);

    }
    const structureScore = lclamp(structRaw * 100 * S.scale + patAdj, -100, 100);
    const structLabel = `십성 균형 — 원국 ${TG_GROUP[top]} ${G[top].toFixed(0)}%에 ${TG_GROUP[top]} 기운이 ${G[top] < S.neutralPct ? '채워짐' : '더해짐'}`;
    // 종합
    const ownFit = lclamp(W.eokbu * eok.v + W.johu * jo.v + W.relation * relationScore + W.structure * structureScore + (ton ? W.tonggwan * ton.v : 0), -100, 100);
    const parent = opts.parent && L.parent ? opts.parent : null;
    const fitScore = parent ? lclamp((1 - L.parent) * ownFit + L.parent * parent.fitScore, -100, 100) : ownFit;
    // 변화·강도
    const vol = calculateVolatility(ch, rels), volatilityScore = vol.score;
    const I = C.intensity, conc = lramp(Math.max(...g), I.conc[0], I.conc[1]);
    const relLoad = lclamp(relP.reduce((a, x) => a + Math.abs(x.v), 0) / I.relLoad, 0, 1) * 0.5 + lclamp(vol.signals.reduce((a, h) => a + h.pts, 0) / 60, 0, 1) * 0.5;

    const F = FLOW_CONFIG, LW = LEVEL_WEIGHTS[level] || LEVEL_WEIGHTS.ilun;

    const flows = {}; for (const k of F.keys) flows[k] = Math.round(lclamp(raw4[k] * (LW[k] ?? 1), 0, 100));
    // 방어 부담도: 사고수·분야 지수가 아니라 이 운의 성분 점수(fit·억부·구조·조후·관계)와 변동성·작용 강도만 읽는다(순환 방지)

    const defParts = { fit: neg(fitScore), eokbu: neg(eok.v), structure: neg(structureScore), johu: neg(jo.v), relation: neg(relationScore), volFit: (volatilityScore / 100) * lramp(-fitScore, 0, DF.volFitRamp) };
    let defRaw = 0, defW = 0; for (const k in DF.w) { defRaw += DF.w[k] * defParts[k]; defW += DF.w[k]; }

    const defenseBand = defenseLoad >= 60 ? '매우 높음' : defenseLoad >= F.overlay.defense ? '높음' : defenseLoad >= 15 ? '보통' : '낮음';
    const flowState = composeFlowState(flows, volatilityScore, defenseLoad, fitScore), { primaryFlow, secondaryFlow, topOverlay } = flowState;
    const overlays = {
      volatility: { active: flowState.on.volatility, score: Math.round(volatilityScore), band: vol.band },
      defense: { active: flowState.on.defense, score: Math.round(defenseLoad), band: defenseBand },
    };
    const activityType = F.names[primaryFlow], phase = F.legacy[primaryFlow];   // 옛 UI 호환 키(기회기·확장기·수확기·축적기). 변동기·방어기는 더 이상 나오지 않는다
    const oname = opp.types.map(t => t.name).join(' · ');
    const why = primaryFlow === 'opportunity' ? `새로운 활동 신호(기회 활성도 ${flows.opportunity}) — 주요 기회: ${oname || '뚜렷한 종류 없음'}`
      : primaryFlow === 'expansion' ? `이미 있는 활동·역할을 키우는 신호(확장 ${flows.expansion})가 가장 강하고, 기회 활성도는 ${flows.opportunity}`
        : primaryFlow === 'harvest' ? `이미 만든 결과를 거두는 신호(수확 ${flows.harvest})가 가장 강하고, 기회 활성도는 ${flows.opportunity}`
          : `기반·역량을 쌓는 신호(축적 ${flows.accumulation})가 가장 강하고, 기회 활성도는 ${flows.opportunity}`;

    if (overlays.defense.active) ovWhy.push(`방어 — 부담도 ${overlays.defense.score}: 흐름 점수 ${Math.round(fitScore)}, 작용 강도 ${Math.round(intensityScore)}${volatilityScore >= 50 && fitScore < 0 ? ', 변화 신호와 부적합이 겹침' : ''}`);
    const tendency = activityType + ' 성향' + (overlays.volatility.active ? ' + 변동' : '') + (overlays.defense.active ? ' + 방어' : '') + (condition === '주의' || condition === '부담' ? ` · ${condition}` : '');
    // 근거 문장: 흐름 판정 이유 + overlay 이유 + 기여가 큰 성분 2~3개
    const parts = [{ label: eok.label, v: W.eokbu * eok.v, comp: 'eokbu' }, { label: jo.label, v: W.johu * jo.v, comp: 'johu' }];
    if (ton) parts.push({ label: ton.label, v: W.tonggwan * ton.v, comp: 'tonggwan' });
    relP.forEach(x => parts.push({ label: x.label, v: W.relation * C.relationScale * x.v, comp: 'relation' }));
    parts.push({ label: structLabel, v: W.structure * structureScore - structP.reduce((a, x) => a + x.v, 0) * W.structure, comp: 'structure' });
    structP.forEach(x => parts.push({ label: x.label, v: W.structure * x.v, comp: 'structure' }));
    const phrase = v => v >= 6 ? '보완' : v <= -6 ? '부담을 높임' : '영향 작음';
    const reasons = [why, ...ovWhy, ...[...parts].sort((a, b) => Math.abs(b.v) - Math.abs(a.v)).slice(0, 3).filter(x => Math.abs(x.v) >= 1).map(x => `${x.label} → ${phrase(x.v)}`)].slice(0, 6);
    // 동반 신호: 주 흐름이 아닌 다른 흐름 중 기준 이상인 것(변동·방어는 overlay로 따로 표시)
    const OP = C.opportunity, companions = [];
    const compText = { opportunity: v => `기회 활성도 높음(${v})`, expansion: v => `기존 활동·역할 확대 신호 높음(${v})`, harvest: v => `재물·결과 회수 활동 높음(${v})`, accumulation: v => `기반·역량 축적 신호 높음(${v})` };
    for (const k of F.keys) if (k !== primaryFlow && flows[k] >= OP.companionMin) companions.push({ key: k, text: compText[k](flows[k]), value: flows[k] });
    const relations = rels.map(r => `${relWhere(r)} ${r.name}`);
    // 흐린 비교 막대: 덜 앞세운 기준 하나만 단독으로 본 점수
    let alt = null;
    if (W.ghost) { const own = W.ghost === 'johu' ? jo.v : eok.v; alt = { school: W.ghost, value: parent && parent.alt ? (1 - L.parent) * own + L.parent * parent.alt.value : own }; }
    const flow = { flows, primaryFlow, secondaryFlow, overlays, topOverlay, condition: { name: condition, fitScore }, reasons, defenseParts: defParts };
    return {
      level, fitScore, ownFit, eokbuScore: eok.v, johuScore: jo.v, relationScore, structureScore, tonggwanScore: ton ? ton.v : null,
      weights: { eokbu: W.eokbu, johu: W.johu, relation: W.relation, structure: W.structure, tonggwan: W.tonggwan },
      volatilityScore, volatilityBand: vol.band, volatilitySignals: vol.signals.map(g => ({ text: g.text, means: g.means, pts: g.pts, type: g.type, core: g.core })), volatilityOverlap: vol.nCore, intensityScore, defenseLoad, activityType, primaryFlow, secondaryFlow, overlays, topOverlay, flow, tendency, dominantTenGodGroup: TG_GROUP[top], grp: top,
      opportunityActivation: flows.opportunity, opportunityType: opp.types.map(t => t.name), opportunityReasons: opp.reasons, opportunityComponents: opp.comps,

  }

  // ───────────── 운의 흐름 공개 API ─────────────
  // evaluateLuckFlow: 운 한 기둥 → { flows, primaryFlow, secondaryFlow, overlays, condition, reasons }. 대운·세운·월운·일진·시진이 같은 엔진(evaluateLuck)을 쓴다.
  function evaluateLuckFlow(ch, p, level = 'ilun', context = {}) {
    const ev = evaluateLuck(ch, p, level, { parent: context.parent ?? context.parentEv, stemW: context.stemW });
    return ev.flow;
  }
  const flowName = k => FLOW_CONFIG.names[k] || '';
  // "기회 + 변동 · 순풍" 형태의 짧은 표기. opts.overlay: 'all'(기본) | 'top'(가장 중요한 overlay 하나) | 'none'
  function flowLabel(ev, opts = {}) {
    const f = ev.flow || ev, ov = opts.overlay || 'all';

  }
  // 실제 계산값만 문장 틀에 넣는다(새로운 명리 판단을 만들지 않는다)
  const FLOW_DESC = { opportunity: '새로운 활동과 선택지의 활성', expansion: '이미 있는 활동·역할의 확대', harvest: '만들어 둔 결과의 회수', accumulation: '기반·역량의 축적' };
  const FIT_DESC = { '순풍': '현재 원국과의 적합도는 양호합니다.', '보통': '현재 원국과의 적합도는 보완과 부담이 섞여 중립적입니다.', '주의': '현재 원국의 기존 불균형을 조금 키울 수 있어 점검이 필요합니다.', '부담': '현재 원국의 불균형을 크게 키울 수 있어 부담이 큽니다.' };
  function flowSummary(ev) {
    const f = ev.flow || ev, F = FLOW_CONFIG, o = f.overlays;
    const s = [`${FLOW_DESC[f.primaryFlow]} 신호가 가장 강합니다(${f.flows[f.primaryFlow]}).` + (f.secondaryFlow ? ` ${FLOW_DESC[f.secondaryFlow]} 신호도 비슷한 세기(${f.flows[f.secondaryFlow]})로 함께 나타납니다.` : '')];
    s.push(o.volatility.active ? `변화량은 ${o.volatility.band}(${o.volatility.score})으로 기존 구조가 움직이기 쉽습니다.` : `변화량은 ${o.volatility.band}(${o.volatility.score}) 수준입니다.`);

  // 옛 6분류 문자열 하나를 새 구조로 읽는다: 주 흐름 키 또는 overlay 키
  const migrateLegacyPhase = str => LEGACY_PHASE_MAP[str] || null;

  // ───────────── 메인 ─────────────
  function compute(inp) {
    let { year, month, day } = inp;

  // ───────────── 자미두수 명반 (삼합파 기준) ─────────────
  // 음력 년·월·일과 시진으로 세운다. 날짜와 시진은 사주와 같은 보정(경도·자시 처리)을 따른다.
  const ZW_PALACE = ['명궁', '형제궁', '부처궁', '자녀궁', '재백궁', '질액궁', '천이궁', '노복궁', '관록궁', '전택궁', '복덕궁', '부모궁'];

    else if (skew < 8) { verdict = '조후'; why = '강약은 중화에 가깝고 기후만 치우쳐 있어 조후가 우선입니다.'; }

  const hourPillarsOfDay = ds => Array.from({ length: 12 }, (_, hb) => gz(gzIndex(hourStem(ds, hb), hb)));

  // ───────────── 궁합 기운: 나와 조화로운 오행·일주 후보 ─────────────
  // 운세 흐름(evaluateLuck·LUCK_CFG)과는 완전히 별개의 계산이다. 점수·가중치도 이 config 한 곳에서만 조절한다.
  // 모든 성분은 −1~+1(과잉 위험만 0~1)로 만들고, 성분별 가중치를 곱해 50점 기준에서 더하고 뺀다.
  const COMPAT_CONFIG = {
    // ── 궁합 오행: 이 오행을 가진 사람이 내 원국을 얼마나 보완하나
    element: { eokbu: 34, johu: 26, balance: 22, tenGod: 8, excessPenalty: 10, scale: 0.55 },
    eokbuMix: { struct: 0.7, role: 0.3, weakCenter: 30 },          // 강약 구조 70% + 억부 용신 역할 30%, 돕는 힘 20%·80%에서 ±1
    climateModel: { share: 0.3, comfort: 0.3, tempK: 0.6, humK: 0.8, full: 1.2 },
    balance: { ideal: 20, lackBelow: 15, over: 30, support: 0.3, own: 0.8 },
    pattern: { '관살혼잡': [3, -0.6], '상관견관': [1, -0.5], '식상과다(설기)': [1, -0.6], '재다신약': [2, -0.7], '관살과다': [3, -0.7], '군겁쟁재': [0, -0.6], '효신탈식(도식)': [4, -0.5], '살인상생': [4, 0.4], '식신제살': [1, 0.3], '상관패인': [4, 0.4] },
    patternLevel: { '강': 1, '약': 0.6, '참고': 0.5 },

    excess: { elFrom: 24, elTo: 42, groupFrom: 32, groupTo: 50, groupW: 0.8 },
    // ── 궁합 일주: 상대 일간·일지를 가정한 간이 분석
    dayStem: 0.55, dayBranch: 0.45,                                 // 오행 성분에서 일간과 일지(지장간 가중)가 차지하는 몫
    elementBalance: 28, climate: 18, tenGod: 8, stemRelation: 10, branchRelation: 14, natalRelations: 10, excessPenalty: 10,
    scale: 0.8, natalGain: 1.6,

    type: { frictionStim: 0.4, frictionStimAll: 0.85, bondStable: 0.35, frictionStable: 0.15, compFit: 0.2, compFitStrong: 0.45, active: 0.6 },
    condition: { high: 66, ok: 55, low: 30, risk: 0.55, highRisk: 0.35 },

  const CP_EL_TEMP = [0.4, 2, 0.2, -0.6, -2], CP_EL_HUM = [0.3, -2, -0.4, 0.3, 2]; // 목화토금수의 온도·습도 성향
  const _cpEl = new WeakMap(), _cpDay = new WeakMap();

  // 오행 e를 상대가 가져올 때의 성분 (−1~+1, excess는 0~1)
  function cpElParts(ch, e) {
    let m = _cpEl.get(ch); if (!m) _cpEl.set(ch, m = {});
    if (m[e]) return m[e];
    const C = COMPAT_CONFIG, w = ch.weights, st = ch.strength, dEl = stemEl(ch.pillars.day.s), g = groupOfEl(dEl, e);
    // 억부: 신약이면 비겁·인성이, 신강이면 식상·재성·관성이 보완. 용신 역할은 30%만 섞는다
    const s = lclamp((50 - st.help) / C.eokbuMix.weakCenter, -1, 1);
    const weak = [1, -0.5, -0.7, -0.8, 1], strong = [-1, 0.8, 0.8, 1, -0.8];
    const struct = s >= 0 ? weak[g] * s : strong[g] * -s;

    // 조후: 원국의 한난조습 치우침을 줄이는지 (다섯 오행 평균을 빼서 상대 비교)
    const K = C.climateModel, c = ch.climate, dev = (x, k) => Math.max(0, Math.abs(x) / k - K.comfort);
    const gain = el => { const nt = (1 - K.share) * c.temp + K.share * CP_EL_TEMP[el], nh = (1 - K.share) * c.hum + K.share * CP_EL_HUM[el]; return dev(c.temp, K.tempK) - dev(nt, K.tempK) + dev(c.hum, K.humK) - dev(nh, K.humK); };
    const gs = [0, 1, 2, 3, 4].map(gain), mean = gs.reduce((a, b) => a + b, 0) / 5;

      if (controls(e) === x) sup += B.support * exc;

    const balance = lclamp(B.own * lclamp((B.ideal - pct[e]) / B.ideal, -1, 1) + sup, -1, 1);
    // 십성 작용: 원국 구조의 약점을 더 키우면 −, 풀어 주면 +. 배우자성이 모자라면 채우는 쪽 +

    const tenGod = lclamp(tg, -1, 1);
    const X = C.excess;
    const excess = Math.max(lramp(pct[e], X.elFrom, X.elTo), X.groupW * lramp(w.groups[g], X.groupFrom, X.groupTo));

  }
  const cpElFit = q => { const W = COMPAT_CONFIG.element; return lclamp((q.eokbu * W.eokbu + q.johu * W.johu + q.balance * W.balance + q.tenGod * W.tenGod - q.excess * W.excessPenalty) / (W.eokbu + W.johu + W.balance + W.tenGod), -1, 1); };
  const cpNatalWord = c => c.temp >= 0.6 ? '더운' : c.temp <= -0.6 ? '추운' : c.hum >= 0.8 ? '습한' : c.hum <= -0.8 ? '건조한' : '';

  function evaluateCompatibleElement(ch, e) {

    const score = Math.round(lclamp(50 + pts.eokbu + pts.johu + pts.balance + pts.tenGod + pts.excess, 0, 100));

    const rs = [], add = (mag, t) => rs.push([mag, t]);

  // 일주 후보 한 개(천간 s, 지지 b)를 사용자 원국과 비교
  function evaluateDayPillarCompatibility(ch, s, b) {
    const C = COMPAT_CONFIG, T = C.type, d = ch.pillars.day, dEl = stemEl(d.s), myB = d.b;
    const stemQ = cpElParts(ch, stemEl(s)), hid = HIDDEN[b].map(([hs, dd]) => ({ hs, w: dd / 30, q: cpElParts(ch, stemEl(hs)) }));
    const mixv = k => (C.dayStem * stemQ[k] + C.dayBranch * hid.reduce((a, h) => a + h.q[k] * h.w, 0)) / (C.dayStem + C.dayBranch);
    const eokbu = mixv('eokbu'), johu = mixv('johu'), balance = mixv('balance'), tenGodC = mixv('tenGod'), excess = mixv('excess');
    const EW = C.element;
    const elementBalance = (EW.eokbu * eokbu + EW.balance * balance) / (EW.eokbu + EW.balance);
    // 일간 ↔ 일간: 생극·음양·천간합·천간충 (합이 있어도 자동 최고점 아님)
    let sv = C.stemGroup[groupOfEl(dEl, stemEl(s))] + (yang(s) !== yang(d.s) ? C.yinyang : 0);
    const tags = [];
    for (const r of relationsAmong([{ id: 'me', s: d.s }, { id: 'you', s }])) {
      if (r.type === '천간합') { sv += C.bond['천간합']; tags.push({ kind: 'bond', where: '일간', name: r.name, v: C.bond['천간합'] }); }
      else if (r.type === '천간충') { sv -= C.friction['천간충']; tags.push({ kind: 'friction', where: '일간', name: r.name, v: C.friction['천간충'] }); }

    let bond = 0, fr = 0;
    for (const r of relationsAmong([{ id: 'me', b: myB }, { id: 'you', b }])) {
      if (C.bond[r.type] != null) { bond += C.bond[r.type]; tags.push({ kind: 'bond', where: '일지', name: r.name, v: C.bond[r.type] }); }
      else if (C.friction[r.type] != null) {
        let f = C.friction[r.type];
        if (r.type === '충') { const fit = cpElFit(cpElParts(ch, stemEl(mainHidden(myB)))); if (fit < 0) f *= 1 - C.relieve * Math.min(1, -fit * 2); }
        fr += f; tags.push({ kind: 'friction', where: '일지', name: r.name, v: f });
      }
    }
    if (myB === b) { bond += C.sameBranch; tags.push({ kind: 'bond', where: '일지', name: `${BR[b]}${BR[b]} 같은 지지`, v: C.sameBranch }); }
    const branchRelation = lclamp(bond - fr, -1, 1);
    // 원국 전체(년·월·시 위주, 일과의 단독 쌍은 위에서 이미 계산)
    const natal = POS.filter(k => ch.pillars[k]).map(k => ({ id: k, s: ch.pillars[k].s, b: ch.pillars[k].b }));
    let nB = 0, nF = 0;
    for (const r of relationsAmong([...natal, { id: 'you', s, b }])) {
      if (!r.members.includes('you') || (r.members.length === 2 && r.members.includes('day'))) continue;
      const others = r.members.filter(m => m !== 'you'), w = Math.max(...others.map(o => C.posW[o] ?? 0.3));
      const where = others.map(o => POS_K[o] + (r.kind === 'stem' ? '간' : '지')).join('·');
      if (C.bond[r.type] != null) {
        const fit = r.el != null ? cpElFit(cpElParts(ch, r.el)) : 0, v = C.bond[r.type] * w * (1 + 0.5 * fit);
        nB += v; tags.push({ kind: 'bond', where, name: r.name, v });
      } else if (C.friction[r.type] != null) {

        if (r.type === '충') { const ob = others.map(o => ch.pillars[o] && ch.pillars[o].b).find(x => x != null); if (ob != null) { const fit = cpElFit(cpElParts(ch, stemEl(mainHidden(ob)))); if (fit < 0) f *= 1 - C.relieve * Math.min(1, -fit * 2); } }
        nF += f; tags.push({ kind: 'friction', where, name: r.name, v: f });

    const risk = lclamp(1.1 * fr + 0.6 * nF + 0.5 * excess + 0.15 * Math.max(0, -elementBalance) + 0.1 * Math.max(0, -johu), 0, 1);
    const parts = [
      { key: 'elementBalance', label: '오행 보완', v: elementBalance, w: C.elementBalance },
      { key: 'climate', label: '조후 보완', v: johu, w: C.climate },
      { key: 'stemRelation', label: '일간 관계', v: stemRelation, w: C.stemRelation },
      { key: 'branchRelation', label: '일지 관계', v: branchRelation, w: C.branchRelation },
      { key: 'natalRelations', label: '원국 합충', v: natalRelations, w: C.natalRelations },
      { key: 'tenGod', label: '십성 작용', v: tenGodC, w: C.tenGod },

    const supply = [0, 0, 0, 0, 0];

    const dName = STEM[d.s] + BR[d.b], gName = STEM[s] + BR[b], sTG = tenGod(d.s, s), bTG = tenGod(d.s, mainHidden(b));
    const reasons = [];
    reasons.push(`${STEM[s]}${EL[stemEl(s)]}은 나(${STEM[d.s]}) 기준 ${sTG}(${TG_GROUP[groupOfEl(dEl, stemEl(s))]}) 기운입니다`);
    reasons.push(`${BR[b]}의 지장간(${hid.map(h => STEM[h.hs]).join('·')})이 ${hid.slice().sort((a, x) => x.w - a.w).map(h => EL_K[stemEl(h.hs)]).filter((v, i, a) => a.indexOf(v) === i).join('·')} 기운을 공급합니다`);
    if (elementBalance >= 0.2) reasons.push('억부·오행 균형 면에서 원국의 부족한 곳을 채워 줍니다');
    else if (elementBalance <= -0.2) reasons.push('억부·오행 균형 면에서 원국의 쏠림을 키우는 편입니다');

    if (m[ck]) return m[ck];
