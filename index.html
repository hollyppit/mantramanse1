  function wcLoad() {

  function wcWhyBox(r) {

    return `<details class="wc-why"><summary>왜 이런 결과가 나왔나요?</summary>

      <h4>십성별 쓸 만한 힘 <span class="muted">투출=천간에 드러남 · 통근=지지 지장간에 뿌리</span></h4><div>${r.power.map(p => `<span class="chip">${p.tg} ${p.label}${p.touched ? ' · 투출' : ''}${p.rooted ? ' · 통근' : ''}</span>`).join('')}</div>
      <p class="muted">십성 묶음 비율: ${r.pct.map(g => `${g.group} ${g.pct}%`).join(' · ')}</p>
      <h4>구조 판정 11가지 <span class="muted">있다는 사실과 구조가 성립한다는 사실은 다릅니다</span></h4>${r.structures.map(stRow).join('')}

  }
  function wcS1(r) {
    const s = r.s1, p = s.primary;

      body = `<div class="wc-hero"><span class="wc-no">대표 수익 유형</span><h3>${esc(p.name)}</h3><p class="small muted" style="margin:0">${esc(p.plain)} · ${WC_CONF[s.conf]}${s.tie ? ' · 보조 유형과 점수가 근접해 함께 읽는 편이 좋습니다' : ''}</p>${wcP(p.head)}
        <div class="wc-grid2"><div class="wc-kv"><b>핵심 역량</b>${wcP(p.skill)}</div><div class="wc-kv"><b>적합한 수익 창출 방식</b>${wcP(p.method)}</div></div></div>

    const job = j => `<details class="wc-job"><summary><span class="wc-rk">${j.rank}</span><span class="wc-jn"><b>${esc(j.name)}</b><span class="small muted">${esc(j.typeRole)} 유형 · ${esc(j.typeName)}</span></span><span class="chip">${esc(j.barrierLabel)}</span></summary><div class="wc-jb">

      <div class="wc-kv"><b>주의할 점</b><p>${esc(j.caution)}</p>${j.exposes.length ? `<p class="small muted">원국상 부담이 커질 수 있는 환경이 포함될 수 있습니다: ${esc(j.exposes.map(envNm).join(' · '))}</p>` : ''}</div>

      ${k === 'wealth' && res.windfall ? (() => { const w = res.windfall, g = sigMetric('windfall', w.score); return `<div class="wf-line"><div><b>횡재운</b> <span class="num">${w.score}</span> · ${g.n}${w.tags.length ? ` <span class="muted small">${w.tags.join(' · ')}</span>` : ''}</div><p class="small">${w.summary}</p>${w.loss ? `<p class="small"><b>뜻밖의 재물손실 위험 ${w.loss.score} · ${sigMetric('windfallLoss', w.loss.score).n}</b> — ${w.loss.summary}</p>` : ''}<button type="button" class="btn" data-dom="${sel.id}:windfall">횡재운·손실 위험 자세히 ›</button></div>`; })() : ''}
      ${res.chainNote ? `<p class="small muted">${esc(res.chainNote)}</p>` : ''}
      <p class="small muted"><b>${DOM_LEVEL_NAME[kind]}에서의 의미</b> — ${DOM_SCOPE[kind][k]}</p>
      <p class="cp-disc">${I.note}</p>
      <button class="btn x" data-act="close">닫기</button>`;
  }

  // ── 지표 선택과 그래프
  const METRICS = [['flow', '전체 흐름'], ['love', '연애'], ['wealth', '재물'], ['health', '건강'], ['accident', '사고수']];
  const METRICS_SUB = DOM_SUB.map(k => [k, DOM_INFO[k].name]);   // 취업·이직·직업·사업·자식
  const isDomain = () => DOM_ORDER.includes(S.metric) || DOM_SUB.includes(S.metric);
  // 재물 그래프 아래 한 줄 요약: 지금 대운·올해의 뜻밖의 재물손실 위험(횡재운 계산의 손실 쪽)
  function wealthLossLine() {
    try {
      const ch = S.ch, du = M.daeunAt(ch, NOW), curY = M.yearPillarAt(NOW).sajuYear, se = M.seunRange(ch, curY, curY)[0];
      const part = (label, x, kind) => { if (!x) return ''; const w = domOf(x, kind).windfall; if (!w || !w.loss) return ''; const g = sigMetric('windfallLoss', w.loss.score); return `<span><b>${label}</b> ${w.loss.score} · <b style="color:${g.c}">${g.n}</b></span>`; };
      const yr = se ? domOf(se, 'seun').windfall : null;
      return `<div class="wf-line"><div><b>뜻밖의 재물손실 위험</b> <span class="muted small">(낮을수록 좋음)</span></div><div class="wf-row">${[part('지금 대운', du, 'daeun'), part('올해', se, 'seun')].filter(Boolean).join('')}</div>${yr && yr.loss ? `<p class="small"><b>올해</b> — ${yr.loss.summary}</p>` : ''}<button type="button" class="btn" data-act="metric:windfall">횡재운·손실 위험 그래프 보기 ›</button></div>`;
    } catch (e) { return ''; }
  }
  function metricBar() {
    const m = S.metric || 'flow', info = DOM_INFO[m];
    return `<section class="card"><div class="card-h"><h2>그래프 지표</h2><span class="note">아래 대운·연도·월운 그래프와 일진 달력에 적용됩니다</span></div>
      <div class="cp-filters" role="group" aria-label="그래프 지표">${METRICS.map(([k, l]) => `<button type="button" class="opt" data-act="metric:${k}" aria-pressed="${m === k}">${l}</button>`).join('')}</div>
      <div class="cp-filters" role="group" aria-label="직업·가족 세부 지표" style="margin-top:6px">${METRICS_SUB.map(([k, l]) => `<button type="button" class="opt" data-act="metric:${k}" aria-pressed="${m === k}">${l}운</button>`).join('')}</div>
      <p class="small" style="color:var(--ink-2)">${m === 'flow' ? '전체 흐름: 원국의 불균형을 들어오는 운이 보완하는지 심화하는지를 나타내는 −100~+100의 상대 지표입니다. 막대 색은 좋고 나쁨(최고·좋음·무난·주의·부담)이고, 막대 아래 글자는 활성화되는 일입니다.' : `<b>${info.full}</b> — ${info.sub}. 0~100 눈금이며 ${m === 'accident' ? '높을수록 주의 신호가 많이 겹쳤다는 뜻입니다.' : '높을수록 그 지표의 값이 큽니다.'}`}</p>
      ${m === 'health' || m === 'accident' ? `<p class="cp-disc">${info.note}</p>` : m !== 'flow' ? `<p class="small muted">${info.note}</p>` : ''}
      ${m === 'wealth' ? wealthLossLine() : ''}
    </section>`;
  }
  const chartLegendInner = () => !isDomain() ? modeLegend() : `${sigLegend(metricRule(S.metric))}<div class="legend"><span>막대 높이 = ${DOM_INFO[S.metric].full} 점수(0~100) · 막대 위 글자 = 신호등 단계</span></div>${S.metric === 'wealth' ? '<div class="legend"><span>아래 "횡재"(초록 계열) = 뜻밖의 수입 신호가 좋음 이상, "손재"(주황·빨강) = 뜻밖의 재물손실 위험이 주의 이상인 시기에만 표시됩니다</span></div>' : ''}${S.metric === 'windfall' ? '<div class="legend"><span><i class="sw" style="background:var(--sg-bad)"></i>아래 막대 = 뜻밖의 재물손실 위험(길수록·빨강일수록 조심, 횡재 점수와 따로 봅니다)</span></div>' : ''}`;
  const chartLegend = () => `<details class="lg-fold"${(S.lgOpen === undefined ? window.innerWidth > 640 : S.lgOpen) ? ' open' : ''}><summary>그래프 보는 법 <span class="muted small">색·막대·글자 뜻</span></summary>${chartLegendInner()}</details>`;
  document.addEventListener('toggle', ev => { if (ev.target && ev.target.classList && ev.target.classList.contains('lg-fold')) S.lgOpen = ev.target.open; }, true);
  function domTip(title, res) { const k = S.metric, r = res[k]; return `<b>${esc(title)}</b><br>${DOM_INFO[k].full} <b>${r.score}</b> · ${sigMetric(k, r.score).n}${r.tags.length ? `<br>${r.tags.join(' · ')}` : ''}${k === 'wealth' && res.windfall && res.windfall.score >= WF_ON() ? `<br>뜻밖의 횡재 신호 <b>${res.windfall.score}</b> · ${sigMetric('windfall', res.windfall.score).n}` : ''}${k === 'wealth' && res.windfall && res.windfall.loss && res.windfall.loss.score >= LOSS_ON() ? `<br>뜻밖의 손재 주의 <b>${res.windfall.loss.score}</b> · ${sigMetric('windfallLoss', res.windfall.loss.score).n}` : ''}${k === 'windfall' && r.loss ? `<br>뜻밖의 재물손실 위험 <b>${r.loss.score}</b> · ${sigMetric('windfallLoss', r.loss.score).n}${r.loss.tags.length ? ' · ' + r.loss.tags.join(' · ') : ''}` : ''}<br>${r.summary}${r.reasons.slice(0, 2).map(t => `<br>· ${esc(t)}`).join('')}`; }
  // 0~100 눈금 막대(대운·월운)
  function drawDomainDiv(el, items) {
    const k = S.metric, n = items.length, cw = el.clientWidth || 320, W = Math.max(cw, n * chartStep(cw)), H = 246, L = 34, R = 6, T = 30, B = 54, ST = k === 'windfall' ? 60 : k === 'wealth' ? 30 : 0;   // ST: 횡재운 그래프 아래의 손실 위험 띠 높이
    const step = (W - L - R) / n, bw = Math.min(30, step * 0.58), y = v => T + (100 - v) / 100 * (H - T - B);
    let s = svgEl(W, H + ST);
    s += metricZones(k, y, L, W - R);
    for (const g of [0, 25, 50, 75, 100]) s += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" style="stroke:${g === 0 ? 'var(--ink-3)' : 'var(--line)'};stroke-width:1" ${g && g !== 100 ? 'stroke-dasharray="3 3"' : ''}/><text x="${L - 6}" y="${y(g) + 3.5}" text-anchor="end" style="fill:var(--ink-3);font-size:10px">${g}</text>`;
    if (k === 'wealth') s += `<text x="${L - 6}" y="${y(0) + 24}" text-anchor="end" style="fill:var(--ink-3);font-size:9px;font-weight:800">뜻밖</text>`;
    if (k === 'windfall') s += `<text x="${L - 6}" y="${y(0) + 20}" text-anchor="end" style="fill:var(--bad);font-size:9px;font-weight:800">손실</text><text x="${L - 6}" y="${y(0) + 30}" text-anchor="end" style="fill:var(--bad);font-size:9px;font-weight:800">위험</text>`;
    items.forEach((it, i) => {
      const cx = L + step * (i + 0.5), h = Math.max(2, y(0) - y(it.v)), top = y(it.v), x0 = cx - bw / 2, r = Math.min(4, h / 2);
      s += `<path d="M${x0},${y(0)} V${top + r} Q${x0},${top} ${x0 + r},${top} H${x0 + bw - r} Q${x0 + bw},${top} ${x0 + bw},${top + r} V${y(0)} Z" style="fill:${domCol(k, it.v)};${it.sel ? 'stroke:var(--ink);stroke-width:2' : ''}"/>`;
      s += `<text x="${cx}" y="${top - 5}" text-anchor="middle" style="fill:var(--ink-2);font-size:10px;font-weight:700">${it.v}</text>`;
      { const g = sigMetric(k, it.v), by = top - 22; s += `<rect x="${cx - 14}" y="${by}" width="28" height="12" rx="6" style="fill:${g.c}"/><text x="${cx}" y="${by + 9}" text-anchor="middle" style="fill:${g.t};font-size:9px;font-weight:800">${g.n}</text>`; }
      if (it.cur) s += `<circle cx="${cx}" cy="${T - 12}" r="3" style="fill:var(--seal)"/>`;
      if (k === 'windfall' && it.loss != null) { const sy = y(0) + 8, lh = Math.max(2, it.loss / 100 * (ST - 28)), lc = sigMetric('windfallLoss', it.loss).c; s += `<rect x="${cx - bw / 2}" y="${sy}" width="${bw}" height="${lh}" rx="3" style="fill:${lc}"/><text x="${cx}" y="${sy + lh + 11}" text-anchor="middle" style="fill:var(--ink-2);font-size:9px;font-weight:700">${it.loss}</text>`; }
      if (k === 'wealth') { const sy = y(0) + 8; let oy = sy; if (it.wf != null && it.wf >= WF_ON()) { s += `<rect x="${cx - 15}" y="${oy}" width="30" height="12" rx="6" style="fill:${sigMetric('windfall', it.wf).c}"/><text x="${cx}" y="${oy + 9}" text-anchor="middle" style="fill:#fff;font-size:9px;font-weight:800">횡재</text>`; oy += 15; } if (it.loss != null && it.loss >= LOSS_ON()) s += `<rect x="${cx - 15}" y="${oy}" width="30" height="12" rx="6" style="fill:${sigMetric('windfallLoss', it.loss).c}"/><text x="${cx}" y="${oy + 9}" text-anchor="middle" style="fill:#fff;font-size:9px;font-weight:800">손재</text>`; }
      s += `<text x="${cx}" y="${H - B + ST + 18}" text-anchor="middle" style="fill:var(--ink);font-size:14px;font-weight:${it.sel ? 900 : 700};font-family:var(--f-display)">${it.label}</text>`;
      s += `<text x="${cx}" y="${H - B + ST + 33}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${it.sub}</text>`;
      if (it.sub2) s += `<text x="${cx}" y="${H - B + ST + 45}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${it.sub2}</text>`;
      s += `<rect class="hit" x="${cx - step / 2}" y="0" width="${step}" height="${H + ST}" style="fill:transparent" data-pick="${it.pick}" data-tip="${esc(it.tip)}"/>`;
    });
    el.innerHTML = s + '</svg>';
    { const q = items.findIndex(t => t.sel); chartFit(el, W, q >= 0 ? L + step * (q + 0.5) : null); }
  }
  // 0~100 눈금 막대(연도별 90년)
  function drawDomainLife(el) {
    const ch = S.ch, k = S.metric, y0 = ch.solar.y, y1 = Math.min(y0 + 90, M.MAX_Y - 1), data = M.seunRange(ch, y0, y1).map(x => ({ year: x.year, age: x.age, x, res: domOf(x, 'seun') }));
    const cw = el.clientWidth || 320, W = cw < 520 ? Math.max(cw, (y1 - y0 + 1) * 7 + 52) : Math.max(cw, 320), H = 270, L = 34, R = 18, T = 26, B = 46;
    const x = Y => L + (Y - y0) / (y1 - y0) * (W - L - R), y = v => T + (100 - v) / 100 * (H - T - B);
    let s = svgEl(W, H);
    s += metricZones(k, y, L, W - R);
    ch.daeun.list.forEach((d, i) => { const a = Math.max(y0, d.startYear), b = Math.min(y1, d.startYear + 10); if (b <= a) return; if (i % 2 === 0) s += `<rect x="${x(a)}" y="${T}" width="${x(b) - x(a)}" height="${H - T - B}" style="fill:var(--surface-2)"/>`; if (x(b) - x(a) > 28) s += `<text x="${(x(a) + x(b)) / 2}" y="${T - 9}" text-anchor="middle" style="fill:var(--ink-2);font-size:12px;font-weight:700;font-family:var(--f-display)">${M.gzName(d)}</text>`; });
    for (const g of [0, 25, 50, 75, 100]) s += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" style="stroke:${g === 0 ? 'var(--ink-3)' : 'var(--line)'}" ${g && g !== 100 ? 'stroke-dasharray="3 3"' : ''}/><text x="${L - 6}" y="${y(g) + 3.5}" text-anchor="end" style="fill:var(--ink-3);font-size:10px">${g}</text>`;
    for (let Y = Math.ceil(y0 / 10) * 10; Y <= y1; Y += 10) s += `<text x="${x(Y)}" y="${H - 8}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${Y}</text>`;
    const bw = Math.max(1.5, (W - L - R) / (y1 - y0 + 1) - 1.2);
    data.forEach(d => { const v = d.res[k].score, top = y(v), h = Math.max(1.5, y(0) - top); s += `<rect x="${(x(d.year) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(2, bw / 2)}" style="fill:${domCol(k, v)}"/>`;
      if (k === 'windfall' && d.res.windfall.loss) { const lv = d.res.windfall.loss.score, lh = Math.max(1.5, lv / 100 * 24); s += `<rect x="${(x(d.year) - bw / 2).toFixed(1)}" y="${(y(0) + 4).toFixed(1)}" width="${bw.toFixed(1)}" height="${lh.toFixed(1)}" rx="${Math.min(2, bw / 2)}" style="fill:${sigMetric('windfallLoss', lv).c}"/>`; } });
    if (k === 'windfall') s += `<text x="${L - 6}" y="${y(0) + 14}" text-anchor="end" style="fill:var(--bad);font-size:9px;font-weight:800">손실</text>`;
    if (k === 'wealth') { s += `<text x="${L - 6}" y="${y(0) + 17}" text-anchor="end" style="fill:var(--ink-3);font-size:9px;font-weight:800">뜻밖</text>`; data.forEach(d => { const w = d.res.windfall, cx = x(d.year); if (w.score >= WF_ON()) s += `<circle cx="${cx.toFixed(1)}" cy="${(y(0) + 9).toFixed(1)}" r="${Math.max(2, Math.min(3.2, bw))}" style="fill:${sigMetric('windfall', w.score).c}"/>`; if (w.loss && w.loss.score >= LOSS_ON()) s += `<circle cx="${cx.toFixed(1)}" cy="${(y(0) + 20).toFixed(1)}" r="${Math.max(2, Math.min(3.2, bw))}" style="fill:${sigMetric('windfallLoss', w.loss.score).c}"/>`; }); }
    const curY = M.yearPillarAt(NOW).sajuYear;
    if (curY >= y0 && curY <= y1) s += `<line x1="${x(curY)}" x2="${x(curY)}" y1="${T}" y2="${H - B}" style="stroke:var(--seal);stroke-width:1.5" stroke-dasharray="4 3"/><text x="${x(curY) + 4}" y="${T + 11}" style="fill:var(--seal);font-size:10px;font-weight:700">올해</text>`;
    const sel = S.sel && S.sel.kind === 'seun' ? S.sel.Y : null;
    if (sel && sel >= y0 && sel <= y1) { const d = data.find(q => q.year === sel); if (d) s += `<circle cx="${x(sel)}" cy="${y(d.res[k].score)}" r="4.5" style="fill:var(--ink);stroke:var(--surface);stroke-width:2"/>`; }
    s += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" style="stroke:var(--ink);stroke-width:1;opacity:0"/><circle class="xd" r="4" style="fill:var(--ink);opacity:0"/><rect class="hit ov" x="${L}" y="0" width="${W - L - R}" height="${H}" style="fill:transparent"/>`;
    el.innerHTML = s + '</svg>';
    { const sy = S.sel && S.sel.kind === 'seun' ? S.sel.Y : null; chartFit(el, W, x(sy && sy >= y0 && sy <= y1 ? sy : curY)); }
    const svg = el.querySelector('svg'), ov = el.querySelector('.ov'), xh = el.querySelector('.xh'), xd = el.querySelector('.xd');

    ov.addEventListener('mousemove', ev => { const d = nearest(ev); if (!d) return; xh.setAttribute('x1', x(d.year)); xh.setAttribute('x2', x(d.year)); xh.style.opacity = .35; xd.setAttribute('cx', x(d.year)); xd.setAttribute('cy', y(d.res[k].score)); xd.style.opacity = 1; showTip(ev, domTip(`${d.year}년 (만 ${d.age}세) ${M.gzName(d.x)}`, d.res)); });
    ov.addEventListener('mouseleave', () => { xh.style.opacity = 0; xd.style.opacity = 0; hideTip(); });

  // 지표 선택 시 대운·연도·월운 그래프
  function drawDomainChart(el, k) {
    const ch = S.ch, m = S.metric;
    if (k === 'daeun') {
      const cur = M.daeunAt(ch, NOW);
      drawDomainDiv(el, ch.daeun.list.map((d, i) => { const r = domOf(d, 'daeun'); return { v: r[m].score, wf: m === 'wealth' ? r.windfall.score : null, loss: m === 'windfall' || m === 'wealth' ? r.windfall.loss.score : null, label: M.gzName(d), sub: `${d.startAge}세`, sub2: d.startYear, pick: 'daeun:' + i, sel: S.sel && S.sel.kind === 'daeun' && S.sel.i === i, cur: cur === d, tip: domTip(`${d.startAge}세 대운 ${M.gzName(d)}`, r) }; }));
    } else if (k === 'wolun') {
      const ms = M.wolun(ch, S.selYear);
      drawDomainDiv(el, ms.map((x, i) => { const nx = ms[i + 1] ? ms[i + 1].startMs : Infinity, r = domOf(x, 'wolun'); return { v: r[m].score, wf: m === 'wealth' ? r.windfall.score : null, loss: m === 'windfall' || m === 'wealth' ? r.windfall.loss.score : null, label: M.gzName(x), sub: x.termName, pick: 'wolun:' + i, sel: S.sel && S.sel.kind === 'wolun' && S.sel.i === i, cur: NOW >= x.startMs && NOW < nx, tip: domTip(`${x.termName}~ ${M.gzName(x)}`, r) }; }));
    } else if (k === 'life') drawDomainLife(el);
  }

  // 운의 흐름 상세: 주 흐름 4개를 모두 보여 주고(최고점이 주 흐름), 변동·방어 overlay와 흐름 적합도는 따로 보여 준다
  const FLOW_ROWS = [['opportunity', '기회', 'd-atk'], ['expansion', '확장', 'd-ext'], ['harvest', '수확', 'd-hrv'], ['accumulation', '축적', 'd-acc']];
  function flowBars(e) {
    const f = e.flow;
    return `<div class="flowbars">${FLOW_ROWS.map(([k, n, c]) => `<div class="fb${k === f.primaryFlow ? ' main' : k === f.secondaryFlow ? ' sec' : ''}"><span class="fn">${n} 활성도${k === f.primaryFlow ? ' · 주' : k === f.secondaryFlow ? ' · 동반' : ''}</span><span class="volbar" style="--v:${f.flows[k]}"><i style="background:var(--${c})"></i></span><b class="num">${f.flows[k]}</b></div>`).join('')}</div>`;
  }
  function metricsBox(e) {
    const o = e.overlays;
    return `<div class="flowbars">
      <div class="fb${o.volatility.active ? ' main' : ''}"><span class="fn">${term('변동성')}</span><span class="volbar" style="--v:${o.volatility.score}"><i style="background:var(--d-chg)"></i></span><b class="num">${o.volatility.score}</b></div>

      `<h3>07 현실적인 행동 처방</h3><h4>지금 해야 할 행동</h4>${icList(a['do'])}<h4>피해야 할 행동</h4>${icList(a.avoid)}<h4>결정 전에 확인할 것</h4>${icList(a.check_before)}<h4>판단을 다시 점검할 기준</h4>${icList(a.review_criteria)}`,
      `<h3>08 최종 한마디</h3><div class="sumbox ic-final">${esc(r.final_message.text)}</div><p class="note">점괘는 미래를 확정하는 도구가 아니라, 지금의 선택을 돌아보게 하는 참고 자료입니다.</p>`

    return `<p class="muted small">${esc(IC_CAT[r.question_category])} · ${esc(hx.ko)}${tr ? ' → ' + esc(tr.ko) : ''} · ${n}/8 단계</p>` + cards.slice(0, n).map((h, i) => `<article class="ic-card" aria-label="${IC_SECTIONS[i]}">${h}</article>`).join('')
      + (n >= 8 ? icAiCard() : '') + `<div class="frow" style="margin-top:10px">${n < 8 ? `<button class="btn primary" data-act="ic-next">다음 · ${IC_SECTIONS[n]} ›</button><button class="btn" data-act="ic-all">전체 펼치기</button>` : ''}<button class="btn" data-act="ic-new">새 점괘 보기</button></div>`;
  }
  // ───────────── 용어 ─────────────
  function glList() {
    const q = S.glq.trim();
    const cats = {};
    for (const [k, [c, t]] of Object.entries(GL)) { if (q && !k.includes(q) && !(t + glSectionsText(k, t) + glOverlapText(k, t) + glCasesText(k, t)).includes(q)) continue; (cats[c] ||= []).push([k, t]); }

    return keys.map(c => `<div class="gl-cat"><h3>${c}</h3>${cats[c].map(([k, t]) => `<div class="gl-item"><span>${term(k)}${adminPw && k in OVR ? ' <span class="chip edited">수정됨</span>' : ''}</span><p>${glFull(k, t)}</p></div>`).join('')}</div>`).join('');
  }
  function renderGl() {
    return `<section class="card"><div class="card-h"><h2>용어 사전</h2><span class="note num">${Object.keys(GL).length}개 항목${adminPw ? ` · 수정됨 ${Object.keys(OVR).length}개 · 용어를 눌러 편집` : ''}</span></div>
      <input class="gl-search" id="gl-q" type="search" placeholder="용어나 설명으로 찾기 (예: 공망, 합)" value="${esc(S.glq)}">
      <div id="gl-list">${glList()}</div></section>`;
  }

  // ───────────── 12운성 에너지 곡선 ─────────────
  // 12운성은 일간이 지지에서 얻는 힘을 사람의 일생에 빗댄 12단계다. 단계 순서가 곧 생애 주기(올라감 → 정점 → 내려감 → 갈무리 → 새 출발)라서
  // 곡선으로 그리면 한눈에 읽힌다. 세기 눈금(0~100)은 단계끼리 견주려고 붙인 상징값이며, 점수·판정에는 쓰이지 않고 좋고 나쁨도 뜻하지 않는다.
  // 강(70 이상): 장생·관대·건록·제왕 / 중: 목욕·쇠·양 / 약(40 미만): 병·사·묘·절·태. 이 앱은 양간은 순서대로, 음간은 거꾸로 센다.
  const UN_ORDER = ['장생', '목욕', '관대', '건록', '제왕', '쇠', '병', '사', '묘', '절', '태', '양'];
  const UN_POW = { 장생: 72, 목욕: 42, 관대: 82, 건록: 92, 제왕: 100, 쇠: 58, 병: 26, 사: 12, 묘: 20, 절: 5, 태: 30, 양: 45 };
  const UN_MEAN = { 장생: '태어나 도움을 받으며 자라기 시작', 목욕: '불안정하지만 매력과 호기심이 큼', 관대: '자신감과 패기가 커지는 청년기', 건록: '스스로 서서 일하는 힘이 단단함', 제왕: '힘이 가장 센 전성기', 쇠: '힘은 줄고 노련함이 쌓임', 병: '추진력은 약하고 섬세함이 큼', 사: '움직임이 멈추고 깊이 몰입함', 묘: '거두어 저장하는 갈무리', 절: '기운이 끊겨 새 출발을 준비함', 태: '아직 드러나지 않은 가능성', 양: '보호받으며 준비하고 자람' };
  const UN_PHASE = [['올라가는 때', 0, 4], ['내려가는 때', 5, 7], ['갈무리', 8, 9], ['새 출발 준비', 10, 11]];
  const unTier = p => p >= 70 ? '강' : p >= 40 ? '중' : '약';
  const UN_WHO = { year: ['년지', 'var(--d-hrv)'], month: ['월지', 'var(--d-ext)'], day: ['일지', 'var(--ink)'], hour: ['시지', 'var(--earth-ink)'] };
  function unSmooth(pts) {
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }
  // marks: [{ stage, lab, color, ring }] — 곡선 위에 찍을 점(원국의 네 지지, 대운 등). hi: 강조할 단계
  function unCurve({ marks = [], hi = null } = {}) {
    const W = 680, H = 272, L = 40, R = 26, T = 52, B = 78, step = (W - L - R) / 11;
    const xs = i => L + i * step, y = v => T + (100 - v) / 100 * (H - T - B);
    const bandTxt = { 강: 85, 중: 55, 약: 20 };
    let s = `<svg class="unc" xmlns="${NS}" viewBox="0 0 ${W} ${H}" role="img" aria-label="12운성 에너지 곡선: 장생에서 시작해 제왕에서 가장 높고 절에서 가장 낮은 뒤 다시 이어집니다">`;
    [['강', 70, 100, .12], ['중', 40, 70, .06], ['약', 0, 40, .02]].forEach(([n, lo, hi2, op]) => { s += `<rect x="${L - 8}" y="${y(hi2)}" width="${W - L - R + 16}" height="${y(lo) - y(hi2)}" style="fill:var(--accent);opacity:${op}"/><text x="${L - 14}" y="${y(bandTxt[n]) + 4}" text-anchor="end" style="fill:var(--ink-3);font-size:11px;font-weight:700">${n}</text>`; });
    // 올라가는 때 · 내려가는 때 · 갈무리 · 새 출발 준비
    UN_PHASE.forEach(([n, a, b], k) => { const x0 = xs(a) - step * 0.42, x1 = xs(b) + step * 0.42, c = ['var(--d-atk)', 'var(--d-chg)', 'var(--ink-3)', 'var(--d-ext)'][k]; s += `<line x1="${x0}" x2="${x1}" y1="${T - 24}" y2="${T - 24}" style="stroke:${c};stroke-width:3;stroke-linecap:round;opacity:.7"/><text x="${(x0 + x1) / 2}" y="${T - 30}" text-anchor="middle" style="fill:var(--ink-2);font-size:11px;font-weight:700">${n}</text>`; });
    const pts = UN_ORDER.map((n, i) => [xs(i), y(UN_POW[n])]);
    s += `<path d="${unSmooth(pts)} L${xs(11).toFixed(1)},${y(0)} L${xs(0).toFixed(1)},${y(0)} Z" style="fill:var(--accent);opacity:.1"/>`;
    s += `<path d="${unSmooth(pts)}" style="fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round"/>`;
    s += `<text x="${W - 6}" y="${y(UN_POW['양']) - 8}" text-anchor="end" style="fill:var(--ink-3);font-size:10px">양 → 다시 장생 ↻</text>`;
    const by = {}; marks.forEach(m => { const i = UN_ORDER.indexOf(m.stage); if (i >= 0) (by[i] = by[i] || []).push(m); });
    UN_ORDER.forEach((n, i) => {
      const x = xs(i), on = hi === n, has = !!by[i], tip = `${n} · 세기 ${UN_POW[n]}(${unTier(UN_POW[n])}) — ${UN_MEAN[n]}`;
      s += `<g class="term unst" data-term="${n}" data-tip="${esc(tip)}"><rect class="unbg" x="${x - step / 2}" y="${T - 20}" width="${step}" height="${H - T - 4}" style="fill:${on ? 'var(--accent)' : 'transparent'};opacity:${on ? .14 : 0}"/>`;
      s += `<circle cx="${x}" cy="${y(UN_POW[n])}" r="${on ? 6.5 : 4}" style="fill:${on ? 'var(--accent)' : 'var(--surface)'};stroke:var(--accent);stroke-width:2"/>`;
      s += `<text x="${x}" y="${H - B + 20}" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:${on || has ? 900 : 600};font-family:var(--f-display)">${n}</text>`;
      s += `<text x="${x}" y="${H - B + 35}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${UN_POW[n]}</text>`;
      s += `</g>`;
    });
    // 점 찍기: 같은 단계에 여러 개면 위로 쌓는다
    Object.keys(by).forEach(i => by[i].forEach((m, k) => {
      const x = xs(+i), cy = y(UN_POW[UN_ORDER[+i]]), col = m.color || 'var(--accent-2)', w = Math.max(30, m.lab.length * 10 + 14), by0 = cy - 22 - k * 20;
      s += `<circle cx="${x}" cy="${cy}" r="${m.ring ? 8 : 6.5}" style="fill:${col};stroke:var(--surface);stroke-width:2"/>`;
      s += `<rect x="${x - w / 2}" y="${by0 - 7}" width="${w}" height="17" rx="8.5" style="fill:${col}"/><text x="${x}" y="${by0 + 5.5}" text-anchor="middle" style="fill:#fff;font-size:10.5px;font-weight:800">${m.lab}</text>`;
    }));
    return s + '</svg>';
  }
  const unNote = '세기 눈금(0~100)은 12단계를 서로 견주려고 붙인 상징값입니다. 12운성은 좋고 나쁨이 아니라 힘의 상태이며(제왕은 가장 세지만 독선이 될 수도, 약한 단계는 섬세함·몰입으로 쓰일 수 있음), 점수·판정에는 쓰이지 않습니다. 음간(을·정·기·신·계)은 거꾸로 세는 이 앱의 표 기준입니다.';
  function unChips(marks) { return `<div class="unchips">${marks.map(m => `<span class="unchip" style="--c:${m.color}"><i></i>${m.lab}${m.sub ? ' ' + m.sub : ''} <b>${m.stage}</b> · 세기 ${UN_POW[m.stage]} · ${unTier(UN_POW[m.stage])}</span>`).join('')}</div>`; }
  // 원국의 네 기둥을 곡선에 찍을 점으로 만든다. 봉법 = 일간이 각 지지에서 받는 힘(표에 크게 적힌 값), 좌법 = 각 기둥의 천간이 바로 아래 자기 지지에서 받는 힘(표에 작게 적힌 값)
  function unMarks(ch, mode) {
    return ['year', 'month', 'day', 'hour'].filter(k => ch.cells[k]).map(k => {
      const c = ch.cells[k], jwa = mode === 'jwa';
      return { stage: jwa ? c.unseongJwa : c.unseong, lab: jwa ? UN_WHO[k][0].replace('지', '주') : UN_WHO[k][0], sub: jwa ? M.gzName(ch.pillars[k]) : '', color: UN_WHO[k][1], ring: k === 'day' };
    });
  }
  // 봉법과 좌법의 차이를 작게 접어 둔 설명. 예시는 내 사주에서 두 값이 다른 기둥(월주 → 년주 → 시주 순)으로 든다
  function unDiffHTML(ch) {
    let ex = '';
    if (ch) {
      const d = ch.pillars.day.s;
      const k = ['month', 'year', 'hour'].find(q => ch.cells[q] && ch.cells[q].unseong !== ch.cells[q].unseongJwa);
      if (k) { const p = ch.pillars[k], c = ch.cells[k], nm = UN_WHO[k][0].replace('지', '주'); ex = `<li>내 사주의 예: ${nm} ${M.gzName(p)} — 봉법은 일간 ${M.STEM[d]}이 ${M.BR[p.b]}에서 <b>${c.unseong}</b>, 좌법은 ${nm}의 천간 ${M.STEM[p.s]}이 ${M.BR[p.b]}에서 <b>${c.unseongJwa}</b>입니다.</li>`; }
    }
    return `<details class="undiff"><summary>봉법과 좌법의 차이</summary><ul>
      <li><b>봉법</b> — 일간(나) 하나를 기준으로 네 지지에서 받는 힘. "나의 에너지가 그 자리에서 얼마나 센가". 원국 표에 크게 적힌 값입니다.</li>
      <li><b>좌법</b> — 각 기둥의 천간이 바로 아래 자기 지지에서 받는 힘. "그 글자(십성)가 뿌리를 내려 단단한가". 표에 작게 적힌 값입니다.</li>
      ${ex}<li>일주는 일간이 곧 그 기둥의 천간이라 두 값이 항상 같습니다. 봉법은 나의 상태를, 좌법은 각 십성의 뿌리(통근)를 볼 때 주로 씁니다.</li></ul></details>`;
  }
  // 원국 탭: 봉법(일간 기준)과 좌법(각 기둥 천간 기준)을 바꿔 가며 네 지지가 곡선의 어디에 있는지 본다
  function unNatalHTML(ch, mode = S.unMode || 'bong') {
    const d = ch.pillars.day.s, jwa = mode === 'jwa', marks = unMarks(ch, mode);
    const strong = marks.filter(m => UN_POW[m.stage] >= 70).length, weak = marks.filter(m => UN_POW[m.stage] < 40).length;
    const sum = strong >= 3 ? '힘이 센 단계에 놓인 곳이 많습니다.' : weak >= 3 ? '힘이 약한 단계에 놓인 곳이 많습니다. 약하다는 것은 섬세함·몰입·정리에 쓰이는 기운이라는 뜻이기도 합니다.' : '힘이 센 단계와 약한 단계가 섞여 있습니다.';
    const toggle = `<div class="seg" role="group" aria-label="12운성 보는 기준" style="margin:2px 0 8px"><button type="button" data-act="un:bong" aria-pressed="${!jwa}">봉법 · 일간 기준</button><button type="button" data-act="un:jwa" aria-pressed="${jwa}">좌법 · 각 기둥 천간 기준</button></div>`;
    const intro = jwa ? `각 기둥의 천간이 바로 아래 자기 지지에서 받는 힘(${term('좌법')})입니다. 그 기둥 천간의 뿌리가 튼튼한지 보는 값이고, 원국 표에 작게 적힌 값입니다.` : `${M.STEM[d]}${M.EL_K[M.stemEl(d)]} 일간(나)이 네 지지에서 받는 힘(${term('봉법')})입니다. 원국 표에 크게 적힌 값입니다.`;
    return `${toggle}<p class="small" style="color:var(--ink-2)">${intro} ${sum} 단계 이름을 누르면 설명이 열립니다.</p>${unCurve({ marks })}${unChips(marks)}${unDiffHTML(ch)}<p class="note">${unNote}</p>`;
  }
  // 대운 카드: 10개의 대운이 곡선의 어디를 지나는지
  function unDaeunHTML(ch, du) {
    const marks = ch.daeun.list.map(x => ({ stage: x.unseong, lab: `${x.startAge}세`, color: x === du ? 'var(--seal)' : 'var(--accent-2)', ring: x === du }));
    const now = du ? `지금 대운 ${M.gzName(du)}은 ${du.unseong}(세기 ${UN_POW[du.unseong]} · ${unTier(UN_POW[du.unseong])}) 단계입니다. ${UN_MEAN[du.unseong]}.` : '아직 대운이 시작되기 전입니다.';
    return `<div class="card-h" style="margin:14px 0 4px"><h3>대운으로 보는 에너지 곡선 <span class="lvl">12운성</span></h3></div><p class="small" style="color:var(--ink-2)">10개의 대운이 12운성 곡선의 어디를 지나는지 보여 줍니다(붉은 점이 지금 대운). ${now}</p>${unCurve({ marks, hi: du ? du.unseong : null })}<p class="note">${unNote}</p>`;
  }
  // 용어 팝업: 그 단계를 곡선에서 밝히고, 내 사주에서 어느 기둥에 있는지 같이 보여 준다. '좌법' 용어는 좌법 값으로, 나머지는 봉법 값으로 찍는다
  function unSheetHTML(key) {
    const ch = S.ch, hi = UN_POW[key] != null ? key : null, mode = key === '좌법' ? 'jwa' : 'bong';
    const marks = ch ? unMarks(ch, mode) : [];

  const FOLD = new Set(), FOLD_SEEN = new Set();

  function enhanceFold() {
    const main = root.querySelector('main.wrap'); if (!main) return;
    const seen = {}, mobile = isMobile();
    const keyOf = (h, lv) => { const t = (h.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 28), k = `${S.tab}|${lv}|${t}`; seen[k] = (seen[k] || 0) + 1; return `${k}|${seen[k]}`; };
    const hasInline = els => els.some(e => e.nodeType === 3 ? e.textContent.trim() : /^inline/.test(getComputedStyle(e).display));
    const fold = (h, lv, cls) => {

      h.classList.add('fold-h'); h.dataset.fold = key; h.setAttribute('role', 'button'); h.setAttribute('tabindex', '0');
      if (!FOLD_SEEN.has(key)) { FOLD_SEEN.add(key); if (FOLD_EXPERT.test(h.textContent || '') || (lv === 1 && FOLD_DEFAULT.test(h.textContent || '')) || (mobile && FOLD_MOBILE.test((h.textContent || '').trim()))) FOLD.add(key); }

  function jumpBar(main) {

    if (!pw) { S.adminMsg = '비밀번호를 입력하세요'; render(); return; }
    adminPw = pw;
    try { await api('/api/admin', { method: 'POST', body: '{}' }); try { sessionStorage.setItem(ADMIN_KEY, pw); } catch (e) { } S.adminMsg = null; S.tab = 'gl'; render(); }
    catch (e) { adminPw = null; S.adminMsg = e.message; render(); }
  }
  function adminLogout(msg) { adminPw = null; try { sessionStorage.removeItem(ADMIN_KEY); } catch (e) { } S.adminMsg = msg || null; render(); }
  async function saveTerm(reset) {
    const key = S.sheet, ta = document.getElementById('gl-edit');
    const setMsg = (t, c) => { const msg = document.getElementById('gl-msg'); if (msg) { msg.textContent = t; msg.className = 'admin-msg ' + (c || ''); } };
    const text = reset ? null : ta.value.trim();
    if (!reset && !text) { setMsg('설명을 입력하세요', 'err'); return; }
    if (reset && !confirm('기본 문구로 되돌릴까요?')) return;
    setMsg('저장 중…');
    try {
      const r = await api('/api/glossary', { method: 'PUT', body: JSON.stringify({ term: key, text }) });
      if (r.text == null) { delete OVR[key]; GL[key][1] = window.GLOSSARY_DEFAULT[key]; } else { OVR[key] = r.text; GL[key][1] = r.text; }
      render(); setMsg(reset ? '기본 문구로 되돌렸습니다' : '저장했습니다. 모든 방문자에게 반영됩니다(최대 1분).', 'ok');
    } catch (e) { if (e.status === 401) { adminLogout('로그인이 만료되었습니다. 다시 로그인하세요.'); return; } setMsg(e.message, 'err'); }
  }
  window.addEventListener('hashchange', () => render());

  run(); render();
  if (/^https?:$/.test(location.protocol)) api('/api/glossary').then(o => { applyOverrides(o); render(); }).catch(() => { });
})();

</script>
</body>
</html>
