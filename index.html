<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>만트라 만세력</title>
<meta name="description" content="천문 계산 기반 만세력 · 원국, 합충, 신살, 오행, 용신, 대운·세운·월운·일진">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@700;800;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* 레이아웃: 밝은 단일 테마 앱 셸 — 반투명 상단바, 알약형 탭, 그림자 카드. 오방색은 파스텔 타일로 */
:root {
  --bg: #F5F6FA; --surface: #FFFFFF; --surface-2: #F0F2F7; --ink: #12151F; --ink-2: #474E5E; --ink-3: #8089A0;
  --line: #E7EAF1; --accent: #2F5BFF; --accent-2: #7B61FF; --accent-soft: #ECF0FF; --seal: #FF5B4A;
  --wood: #2FA866; --fire: #E8402F; --earth: #F5B921; --metal: #D9DDE5; --water: #2B303C;
  --wood-ink: #17744B; --fire-ink: #C9331F; --earth-ink: #946B00; --metal-ink: #5F4E9E; --water-ink: #2A48A0;
  --wood-on: #fff; --fire-on: #fff; --earth-on: #2A2100; --metal-on: #1D2230; --water-on: #fff;
  --d-atk: #1E9E57; --d-ext: #0E9AA7; --d-hrv: #8A5CF6; --d-acc: #2F6BFF; --d-chg: #E08A00; --d-def: #E5533D;
  --good: #1E9E57; --bad: #F0563F; --mid: #BAC1CE; --good-soft: #E3F5EA; --bad-soft: #FFEAE6;
  --sg-best: #0B7A3A; --sg-good: #2DB36B; --sg-ok: #B5BDCB; --sg-warn: #F2A516; --sg-bad: #E5483A;   /* 운 신호등: 최고·좋음·무난·주의·부담 */
  --shadow: 0 1px 2px rgba(18, 21, 31, .04), 0 10px 30px -12px rgba(30, 40, 90, .12);
  --f-display: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --f-head: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 18px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); background-image: radial-gradient(1200px 420px at 85% -120px, #E6ECFF 0%, transparent 70%), radial-gradient(900px 380px at -10% -80px, #FFF0EA 0%, transparent 65%); background-repeat: no-repeat; color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; padding: 0 16px 56px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h2 { font-size: 1.12rem; font-weight: 800; }
h3 { font-size: 0.98rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 0.82rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* 내보내기(PDF·이미지) */
.xp button { font-size: 0.8rem; }
.xp button[disabled] { opacity: .6; cursor: wait; }
.xs { position: absolute; left: -10000px; top: 0; width: 714px; background: #fff; color: var(--ink); padding: 0; display: grid; gap: 12px; font-size: 15px; }
.xs .card { box-shadow: none; }
.xs .du-strip { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); overflow: visible; }
.xs-head { display: grid; gap: 2px; padding: 4px 2px 8px; border-bottom: 2px solid var(--ink); }
.xs-head b { font-family: var(--f-head); font-size: 1.25rem; }
.xs-head span { font-size: 0.82rem; color: var(--ink-2); }

/* 공유용 사주 카드 */
.xc { width: 1080px; box-sizing: border-box; padding: 64px; background: linear-gradient(160deg, #fff 55%, #eef2ff); color: var(--ink); font-size: 28px; display: grid; gap: 28px; }
.xc-top { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; border-bottom: 3px solid var(--ink); padding-bottom: 14px; }
.xc-top b { font-family: var(--f-head); font-size: 34px; } .xc-top span { font-size: 20px; color: var(--ink-2); text-align: right; }
.xc-title { font-family: var(--f-head); font-size: 64px; font-weight: 800; line-height: 1.15; }
.xc-sub { font-size: 30px; color: var(--ink-2); margin-top: -14px; }
.xc-four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.xc-p { display: grid; gap: 8px; justify-items: center; text-align: center; padding: 14px 8px; border-radius: 20px; background: #fff; border: 2px solid var(--line); }
.xc-p.me { border-color: var(--ink); border-width: 4px; }
.xc-pl { font-size: 22px; font-weight: 700; color: var(--ink-2); } .xc-tg { font-size: 24px; font-weight: 700; } .xc-us { font-size: 20px; color: var(--ink-2); }
.xc-g { width: 100%; height: 168px; border-radius: 16px; background: var(--c); color: var(--on); display: grid; place-items: center; align-content: center; }
.xc-g b { font-size: 96px; line-height: 1; font-weight: 800; } .xc-g i { font-style: normal; font-size: 22px; opacity: .85; }
.xc-sec { font-size: 26px; font-weight: 800; margin-top: 4px; }
.xc-bars { display: grid; gap: 10px; }
.xc-bar { display: grid; grid-template-columns: 44px 1fr 64px; gap: 14px; align-items: center; font-size: 24px; font-weight: 700; }
.xc-bar div { height: 22px; background: #e8ebf3; border-radius: 99px; overflow: hidden; } .xc-bar i { display: block; height: 100%; background: var(--c); border-radius: 99px; } .xc-bar em { font-style: normal; text-align: right; color: var(--ink-2); }
.xc-chips { display: flex; flex-wrap: wrap; gap: 10px; } .xc-chips span { font-size: 24px; font-weight: 700; padding: 6px 16px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
.xc-chips span.g { background: var(--good-soft); color: var(--good); } .xc-chips span.b { background: var(--bad-soft); color: var(--bad); }
.xc-foot { font-size: 20px; color: var(--ink-2); text-align: center; margin-top: 6px; }
.chip.hl { outline: 1.5px solid var(--accent); }

.rt-adv { display: grid; gap: 10px; margin: 6px 0; }
.rt-ab { border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; background: var(--surface-2); }
.rt-ab.on { border-color: var(--accent); background: var(--surface); }
.rt-ab h4 { margin: 0 0 4px; font-size: 0.92rem; }
.rt-ab ul { margin: 2px 0 6px; padding-left: 1.15em; }
.rt-ab li { font-size: 0.82rem; line-height: 1.65; color: var(--ink-2); }
@media (min-width: 720px) { .rt-adv { grid-template-columns: 1fr 1fr; } }

/* 상단 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 78%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); padding-block: 12px 10px; margin: 0 -16px; padding-inline: 16px; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.top-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.seal { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, var(--seal), #FF8A4C); color: #fff; font-family: var(--f-display); font-weight: 900; font-size: 13px; line-height: 1.05; display: grid; place-items: center; text-align: center; box-shadow: 0 6px 14px -6px rgba(255, 91, 74, .6); }
.brand h1 { font-size: 1.12rem; font-weight: 900; letter-spacing: -0.03em; }
.who { flex: 1 1 240px; min-width: 0; font-size: 0.84rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-size: 0.86rem; font-weight: 700; box-shadow: 0 1px 2px rgba(18, 21, 31, .05); transition: transform .12s, box-shadow .12s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; box-shadow: 0 8px 18px -8px rgba(47, 91, 255, .7); }
.btn.primary:hover { color: #fff; transform: translateY(-1px); }
.tabs { max-width: 980px; margin: 10px auto 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; background: none; border: 0; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--ink-3); border-radius: 999px; transition: background .15s, color .15s; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: #fff; background: var(--ink); }
.tab-link { text-decoration: none; color: var(--seal); display: inline-flex; align-items: center; white-space: nowrap; }
.tab-link:hover { color: var(--seal); background: rgba(0, 0, 0, .05); }
.mt-cta { text-decoration: none; background: var(--seal); border-color: var(--seal); color: #fff; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap; }
.mt-cta:hover { filter: brightness(1.06); }

/* 카드 */
.card { background: var(--surface); border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); border-radius: var(--r); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.note { font-size: 0.82rem; color: var(--ink-3); line-height: 1.55; }
.warn { border: 0; background: linear-gradient(135deg, #FFF1EC, #FFF7F0); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; font-size: 0.88rem; box-shadow: inset 0 0 0 1px #FFD9CF; }
.warn b { color: var(--seal); }

/* 요약 히어로 */
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 22px; color: #fff; background: radial-gradient(420px 220px at 100% 0%, rgba(255, 138, 76, .55), transparent 70%), linear-gradient(135deg, #2F5BFF 0%, #5B4DFF 55%, #7B61FF 100%); box-shadow: 0 18px 40px -20px rgba(47, 91, 255, .8); display: grid; gap: 16px; }
.hero .eyebrow { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.08em; opacity: .8; }
.hero h2 { font-size: 1.5rem; font-weight: 900; color: #fff; }
.hero .pills { display: flex; gap: 6px; flex-wrap: wrap; }
.hero .hp { background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .28); border-radius: 999px; padding: 4px 11px; font-size: 0.8rem; font-weight: 600; color: #fff; }
.hero .hp .term { color: #fff; text-decoration-color: rgba(255, 255, 255, .6); }
.hero .four { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.hero .p4 { background: rgba(255, 255, 255, .96); color: var(--ink); border-radius: 14px; padding: 10px 4px 8px; text-align: center; display: grid; gap: 2px; }
.hero .p4 .pl { font-size: 0.7rem; color: var(--ink-3); font-weight: 700; }
.hero .p4 .pg { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.3rem, 5.4vw, 1.9rem); line-height: 1.1; letter-spacing: 0.02em; }
.hero .p4.me { box-shadow: 0 0 0 3px #FFD166; }
.hero .p4 .pk { font-size: 0.7rem; color: var(--ink-3); }

/* 입력 */
.form { display: grid; gap: 14px; }
.frow { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 0.78rem; color: var(--ink-3); font-weight: 600; letter-spacing: 0.02em; }
input, select { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 9px 12px; min-width: 0; transition: border-color .15s, background .15s; }
input:focus, select:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
input[type="number"] { width: 5.2em; }
input#f-y { width: 6.2em; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 0.86rem; font-weight: 600; color: var(--ink-2); border-radius: 9px; }

.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 800; box-shadow: 0 1px 3px rgba(18, 21, 31, .12); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 0.88rem; color: var(--ink-2); padding-bottom: 7px; }
details.adv { border-top: 1px dashed var(--line); padding-top: 10px; }
details.adv summary { cursor: pointer; font-size: 0.88rem; font-weight: 600; color: var(--ink-2); }
.adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 12px; }
.err { color: var(--seal); font-size: 0.88rem; font-weight: 600; }

/* 용어 버튼 */
.term { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; text-decoration: underline dotted color-mix(in srgb, var(--ink-3) 70%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.term:hover { color: var(--accent); text-decoration-color: var(--accent); }

/* 원국표 */
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.86rem; color: var(--ink-2); }
.meta b { color: var(--ink); font-weight: 600; }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.pil { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 340px; table-layout: fixed; }
table.pil th.rl { width: 58px; text-align: left; font-size: 0.74rem; font-weight: 600; color: var(--ink-3); vertical-align: middle; }
table.pil thead th { font-size: 0.8rem; color: var(--ink-3); font-weight: 600; padding-bottom: 2px; }
table.pil thead th .gzk { display: block; font-weight: 400; font-size: 0.72rem; }
table.pil td { text-align: center; font-size: 0.8rem; vertical-align: middle; padding: 3px 2px; line-height: 1.35; }
td.glyph { border-radius: 14px; padding: 8px 0 6px !important; background: var(--c); border: 0; }
td.glyph .g { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1; color: var(--on); display: block; }
td.glyph .gs { font-size: 0.72rem; color: var(--on); opacity: .85; display: block; margin-top: 4px; }
td.glyph.me { box-shadow: 0 0 0 2px var(--accent), 0 8px 18px -10px rgba(47, 91, 255, .7); }
td.tg { font-weight: 600; font-size: 0.84rem; }
td.hid { font-size: 0.76rem; color: var(--ink-2); }
td.hid div { white-space: nowrap; }
.e-wood { --c: var(--wood); --ci: var(--wood-ink); --on: var(--wood-on); } .e-fire { --c: var(--fire); --ci: var(--fire-ink); --on: var(--fire-on); }
.e-earth { --c: var(--earth); --ci: var(--earth-ink); --on: var(--earth-on); } .e-metal { --c: var(--metal); --ci: var(--metal-ink); --on: var(--metal-on); }
.e-water { --c: var(--water); --ci: var(--water-ink); --on: var(--water-on); }
/* 오행은 글자색이 아니라 배경 타일 색으로 구분한다 (글자는 타일 위 대비색) */
.eltxt { background: var(--c); color: var(--on); font-weight: 800; padding: 0 0.32em; border-radius: 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
td.empty { color: var(--ink-3); background: var(--surface-2); border-radius: 14px; }
.chip { display: inline-block; font-size: 0.72rem; line-height: 1.3; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); margin: 1px; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.gm { background: var(--ink); color: var(--surface); }
.pill { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
.pill.b-길 { background: var(--good); color: var(--surface); } .pill.b-소길 { background: var(--good-soft); color: var(--good); }
.pill.b-평 { background: var(--surface-2); color: var(--ink-2); }
.pill.b-소흉 { background: var(--bad-soft); color: var(--bad); } .pill.b-흉 { background: var(--bad); color: var(--surface); }
.pill.b-순풍 { background: var(--good-soft); color: var(--good); } .pill.b-보통 { background: var(--surface-2); color: var(--ink-2); }
.pill.b-주의 { background: color-mix(in srgb, var(--d-chg) 18%, var(--surface)); color: var(--d-chg); } .pill.b-부담 { background: var(--bad-soft); color: var(--bad); }
button.pill { border: 0; cursor: pointer; font-family: inherit; }
.pill.lv-강 { background: var(--bad); color: var(--surface); } .pill.lv-약 { background: var(--bad-soft); color: var(--bad); } .pill.lv-참고 { background: var(--surface-2); color: var(--ink-2); }

/* 목록·표 */
.list { display: grid; gap: 0; }
.li { display: grid; grid-template-columns: minmax(84px, auto) 1fr auto; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .k { font-size: 0.8rem; font-weight: 600; color: var(--ink-2); }
.li .v { min-width: 0; }
.li .v .small { display: block; }
.rel-body .card { align-content: start; }
.rel-sum { display: grid; gap: 6px; }
.rel-sum-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.rel-sum-chips .chip { font-size: 0.78rem; padding: 3px 10px; font-weight: 600; }
.rel-sum-chips .chip.good { background: var(--good-soft); color: var(--good); }
.rel-sum-line { margin: 0; font-size: 0.92rem; line-height: 1.6; }
.rel-list { display: grid; gap: 12px; }
.rel-card { border: 1px solid var(--line); border-left: 4px solid var(--mid); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; background: var(--surface); }
.rel-card.tone-bad { border-left-color: var(--bad); } .rel-card.tone-good { border-left-color: var(--good); }
.rel-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rel-badge { display: inline-flex; align-items: baseline; gap: 5px; font-weight: 700; font-size: 0.8rem; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.rel-badge small { font-size: 0.7rem; font-weight: 500; }
.tone-bad .rel-badge { background: var(--bad-soft); color: var(--bad); } .tone-good .rel-badge { background: var(--good-soft); color: var(--good); }
.rel-name { font-size: 0.9rem; font-weight: 600; }
@media (max-width: 520px) { .rel-card { padding: 11px 11px; } .rel-str { margin-left: 0; } .rel-head { font-size: 0.94rem; } .rel-tip { padding: 6px 8px; } }
.rel-str { margin-left: auto; font-size: 0.62rem; letter-spacing: 1px; color: var(--ink-3); }
.rel-where { font-size: 0.8rem; color: var(--ink-2); }
.rel-head { margin: 2px 0 0; font-size: 0.98rem; font-weight: 700; line-height: 1.5; }
.rel-place, .rel-tip { margin: 0; font-size: 0.88rem; line-height: 1.65; color: var(--ink-2); }
.rel-place b, .rel-tip b { display: inline-block; margin-right: 6px; font-size: 0.74rem; padding: 0 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink); }
.rel-tip { background: var(--accent-soft); border-radius: 8px; padding: 7px 10px; }
.rel-tip b { background: var(--surface); color: var(--accent); }
.rel-more { font-size: 0.84rem; color: var(--ink-2); }
.rel-more summary { cursor: pointer; color: var(--ink-3); font-size: 0.8rem; }
.rel-more p { margin: 6px 0 0; line-height: 1.65; }
.rel-more summary { padding: 6px 0; }
.easy-list { display: grid; gap: 12px; }
.easy-row { display: grid; gap: 3px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); }
.easy-row > b { font-size: 0.82rem; color: var(--ink-3); }
.prof { display: grid; gap: 6px; }
.prof-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.prof-chip { display: inline-flex; align-items: stretch; background: var(--surface-2); border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 1px transparent; }

/* 용어 사전: [분류, 설명] — 관리자 모드에서 설명을 고칠 수 있다 */
var GLOSSARY = {
  // ── 기초
  '사주': ['기초', '태어난 해·달·날·시각을 각각 글자 두 개로 적은 네 개의 기둥입니다. 기둥 하나는 위 글자(천간)와 아래 글자(지지)로 이뤄져 모두 여덟 글자가 되므로 "팔자"라고도 합니다. 예를 들어 "壬申년 丙午월 庚午일 丙子시"처럼 적습니다.'],
  '원국': ['기초', '태어날 때 정해진 사주 여덟 글자 그 자체입니다. 평생 바뀌지 않는 "타고난 설계도"라고 생각하면 됩니다. 시간이 흐르며 바뀌는 대운·세운(운의 흐름)과 구분할 때 이 말을 씁니다.'],
  '일간': ['기초', '태어난 날 기둥(일주)의 위 글자로, 사주에서 "나 자신"을 뜻합니다. 사주의 다른 글자들이 나에게 어떤 존재인지(십성), 내가 힘이 센지 약한지(신강신약)는 모두 이 글자를 기준으로 따집니다. 천간 글자를 누르면 일간별 성향을 볼 수 있습니다.'],
  '천간': ['기초', '갑·을·병·정·무·기·경·신·임·계, 열 개의 글자입니다. 각 기둥의 위쪽 글자로, 겉으로 드러나는 모습이나 생각·의지를 나타낸다고 봅니다. 두 글자씩 같은 오행입니다(갑을=나무, 병정=불, 무기=흙, 경신=쇠, 임계=물).'],
  '지지': ['기초', '자·축·인·묘·진·사·오·미·신·유·술·해, 열두 글자로 우리가 아는 12띠와 같습니다. 각 기둥의 아래쪽 글자로, 실제 생활 환경과 속마음, 계절과 시간을 나타낸다고 봅니다. 안에 여러 기운을 품고 있어서(지장간) 천간보다 복잡합니다.'],
  '간지': ['기초', '천간 하나와 지지 하나를 짝지은 두 글자입니다. 갑자, 을축, 병인…처럼 순서대로 짝을 지으면 60개가 나오고 다시 처음으로 돌아가서 "60갑자"라고 부릅니다. 환갑(60세)도 여기서 나온 말입니다.'],
  '오행': ['기초', '세상의 기운을 나무(목)·불(화)·흙(토)·쇠(금)·물(수) 다섯 가지로 나눈 것입니다. 서로 돕는 순서(생): 나무→불→흙→쇠→물→나무. 예를 들어 나무는 불을 피우고, 물은 나무를 키웁니다. 서로 누르는 순서(극): 나무→흙→물→불→쇠→나무. 예를 들어 물은 불을 끄고, 쇠(도끼)는 나무를 벱니다.'],
  '음양': ['기초', '모든 글자는 양(적극적·밖으로 뻗는 기운) 또는 음(차분함·안으로 모으는 기운)으로 나뉩니다. 같은 오행이라도 음양이 같은지 다른지에 따라 십성 이름이 달라집니다. 예: 나와 같은 오행이면서 음양도 같으면 비견, 음양이 다르면 겁재입니다.'],
  '절기': ['기초', '1년 동안 태양이 지나는 길을 24등분한 날짜입니다(입춘, 경칩, 청명…). 사주에서는 음력 1일이 아니라 이 중 12개 절기(입춘·경칩·청명 등)가 올 때 달이 바뀝니다. 그래서 같은 음력 달에 태어나도 월주가 다를 수 있습니다.'],
  '사령': ['기초', '월지 속 지장간 가운데 태어난 날 지금 주도권을 쥔 글자입니다. 절입 후 며칠째인지로 여기·중기·정기를 나눕니다. 이 앱에서는 참고용으로만 보여 주며 강약·용신 점수에는 반영하지 않습니다.'],
  '절입': ['기초', '절기가 시작되는 정확한 시각입니다. 이 시각 전에 태어났는지 후에 태어났는지에 따라 월주가 달라지고, 입춘 시각 전후로는 년주(띠)까지 달라집니다. 이 앱은 천문 계산으로 분 단위까지 구합니다.'],
  '입춘': ['기초', '사주에서 새해가 시작되는 날로, 보통 양력 2월 4일 무렵입니다. 1월 1일이나 음력 설날이 아니라 입춘 시각에 띠(년주)가 바뀝니다. 예: 2월 3일생은 아직 전년도 띠일 수 있습니다.'],
  '만세력': ['기초', '날짜마다 그날의 년·월·일 간지와 절기를 적어 둔 달력입니다. 사주를 세우려면 반드시 필요합니다. 이 앱은 표를 옮겨 적지 않고 천문 계산으로 직접 만듭니다.'],
  '진태양시': ['기초', '실제 해의 위치로 정한 시각입니다. 한국 시계는 일본 쪽(동경 135도)에 맞춰져 있어서, 서울에서는 해가 시계보다 약 32분 늦게 뜨고 집니다. 여기에 계절마다 생기는 차이(균시차, 최대 약 16분)까지 반영한 것이 진태양시입니다.'],
  '평균태양시': ['기초', '태어난 곳의 경도(동서 위치)만 반영해 시계를 보정한 시각입니다. 동쪽으로 1도 갈 때마다 4분씩 차이가 납니다. 예: 서울은 시계보다 약 32분, 부산은 약 24분 늦게 봅니다. 계절별 차이(균시차)는 넣지 않습니다.'],
  '균시차': ['기초', '지구 공전 궤도가 완전한 원이 아니어서 생기는, 실제 해의 시각과 평균 시각의 차이입니다. 2월 초에는 해가 약 14분 늦고, 11월 초에는 약 16분 빠릅니다.'],
  '서머타임': ['기초', '여름에 시계를 1시간 앞당기던 제도입니다. 한국은 1948~1951년, 1955~1960년, 1987~1988년에 실시했습니다. 이 기간에 태어났다면 출생 시각에서 1시간을 빼야 실제 시각이 되며, 이 앱은 자동으로 반영합니다.'],
  '자시': ['기초', '밤 11시부터 새벽 1시까지의 시간대입니다. 하루의 첫 시간대라서, 밤 11시에 날짜를 바꿀지(정자시) 자정에 바꿀지(야자시) 두 가지 방식이 있습니다. 이 시간에 태어났다면 두 결과를 함께 보는 것이 좋습니다.'],
  '정자시': ['기초', '밤 11시가 되면 다음 날로 보는 방식입니다. 예: 밤 11시 30분에 태어났다면 일주도 다음 날 것을 씁니다. 전통 명리학에서 가장 많이 쓰는 방식입니다.'],
  '야자시': ['기초', '밤 11시~자정을 "그날의 늦은 밤"으로 보는 방식입니다. 일주는 그날 것을 그대로 쓰고, 시주만 다음 날 기준으로 정합니다. 학파마다 쓰는지 여부가 다릅니다.'],

  // ── 자리(궁): 네 기둥이 각각 무엇을 보는지
  '년주': ['자리', '태어난 해의 기둥입니다. 조상과 집안 배경, 어린 시절(대략 0~15세), 그리고 바깥 사회에 비치는 나를 봅니다. 예: 년주에 좋은 기운이 있으면 좋은 집안 환경이나 어릴 때의 도움으로 풉니다.'],
  '월주': ['자리', '태어난 달의 기둥입니다. 부모·형제, 청년기(대략 15~30세), 사회생활과 직장 환경을 봅니다. 태어난 계절을 알려주기 때문에 사주 전체에서 영향력이 가장 큰 자리입니다.'],
  '일주': ['자리', '태어난 날의 기둥으로 "나"와 "배우자"의 자리입니다. 위 글자(일간)는 나 자신, 아래 글자(일지)는 배우자와 가정, 나의 속마음을 봅니다. 중년기(대략 30~45세)의 모습으로도 봅니다.'],
  '시주': ['자리', '태어난 시각의 기둥입니다. 자녀, 아랫사람, 노년기(대략 45세 이후), 그리고 일의 결과와 마무리를 봅니다. 태어난 시각을 모르면 이 자리는 비워 두고 해석합니다.'],

  // ── 십성
  '십성': ['십성', '나(일간)를 기준으로 다른 글자가 나에게 어떤 존재인지 열 가지로 나눈 것입니다. 나와 같은 편(비견·겁재), 내가 만들어 내는 것(식신·상관), 내가 다루는 것(편재·정재), 나를 다스리는 것(편관·정관), 나를 돕는 것(편인·정인)으로 나뉩니다. 사람·돈·일·명예 같은 삶의 영역을 해석하는 핵심 도구입니다.'],
  '비견': ['십성', '나와 오행도 같고 음양도 같은 글자로, "나와 똑같은 사람"입니다. 형제, 친구, 동료, 경쟁자를 뜻합니다. 자립심과 주관이 강해지지만, 많으면 고집이 세고 재물을 나눠야 하는 일이 생긴다고 봅니다.'],
  '겁재': ['십성', '나와 오행은 같지만 음양이 다른 글자로, "나와 닮은 경쟁자"입니다. 승부욕과 추진력이 강해지는 반면, 재물을 빼앗기거나 무리한 투자·보증으로 손해 볼 수 있다고 봅니다.'],
  '식신': ['십성', '내가 만들어 내는 오행 중 음양이 같은 글자입니다. 내 재능과 솜씨, 먹고사는 능력, 여유와 즐거움을 뜻합니다. 꾸준히 무언가를 만들어 내는 힘으로, 여성에게는 자녀를 뜻하기도 합니다.'],
  '상관': ['십성', '내가 만들어 내는 오행 중 음양이 다른 글자입니다. 날카로운 말솜씨, 창의력, 기술과 예술 감각을 뜻합니다. 기존 규칙이나 윗사람에게 반발하는 기질도 있어서 잘 쓰면 혁신, 못 쓰면 구설수로 봅니다.'],
  '편재': ['십성', '내가 다스리는(극하는) 오행 중 음양이 같은 글자입니다. 사업, 투자, 큰돈처럼 크게 벌고 크게 쓰는 재물을 뜻합니다. 활동 반경이 넓고 사교적이며, 남성에게는 아버지나 이성을 뜻하기도 합니다.'],
  '정재': ['십성', '내가 다스리는(극하는) 오행 중 음양이 다른 글자입니다. 월급, 저축처럼 꾸준하고 안정된 재물을 뜻합니다. 성실하고 알뜰한 성향을 주며, 남성에게는 아내를 뜻하기도 합니다.'],
  '편관': ['십성', '나를 누르는(극하는) 오행 중 음양이 같은 글자로, "칠살"이라고도 합니다. 강한 압박, 위기, 권력, 무거운 책임을 뜻합니다. 잘 다스리면 군인·경찰·관리자 같은 카리스마와 추진력이 되고, 못 다스리면 스트레스와 사고로 봅니다.'],
  '정관': ['십성', '나를 누르는(극하는) 오행 중 음양이 다른 글자입니다. 규칙, 직장, 명예, 바른 생활을 뜻합니다. 조직 안에서 인정받고 안정된 자리를 얻는 기운이며, 여성에게는 남편을 뜻하기도 합니다.'],
  '편인': ['십성', '나를 도와주는(생하는) 오행 중 음양이 같은 글자입니다. 남다른 직관, 영감, 특수 분야의 공부(예술·종교·철학·기술)를 뜻합니다. 생각이 깊지만, 많으면 변덕스럽거나 식신(먹고사는 힘)을 방해한다고 봅니다.'],
  '정인': ['십성', '나를 도와주는(생하는) 오행 중 음양이 다른 글자입니다. 학문, 자격증, 어머니, 나를 보살펴 주는 사람과 도움을 뜻합니다. 배우는 것을 좋아하고 인정이 많으며, 윗사람의 후원을 받기 쉽다고 봅니다.'],
  '비겁': ['십성', '비견과 겁재를 합쳐 부르는 말입니다. 나와 같은 오행으로, 내 편이 되어 나를 직접 도와주는 힘입니다.'],
  '식상': ['십성', '식신과 상관을 합쳐 부르는 말입니다. 내가 만들어 내는 오행으로, 말·재능·표현처럼 내 기운이 밖으로 나가는 통로입니다.'],
  '재성': ['십성', '편재와 정재를 합쳐 부르는 말입니다. 내가 다스리는 오행으로 재물과 결과물을 뜻합니다.'],
  '관성': ['십성', '편관과 정관을 합쳐 부르는 말입니다. 나를 다스리는 오행으로 직장·규칙·명예를 뜻합니다.'],
  '인성': ['십성', '편인과 정인을 합쳐 부르는 말입니다. 나를 도와주는 오행으로 공부·보살핌·후원을 뜻합니다.'],

  // ── 지장간
  '지장간': ['지장간', '지지(아래 글자) 속에 숨어 있는 천간입니다. 지지는 한 달 동안의 기운이라, 그 안에서 기운이 바뀌는 순서대로 여기(앞 달의 남은 기운)·중기·정기(본래 기운)로 나뉩니다. 겉으로 보이지 않는 속마음이나 잠재력으로 해석합니다.'],
  '여기': ['지장간', '지지 속에 남아 있는 앞 달의 기운입니다. 절기가 바뀐 직후 며칠 동안만 작용한다고 봅니다. 예: 인월(寅) 초반에는 앞 달인 축월의 기운이 조금 남아 있습니다.'],
  '중기': ['지장간', '지지 속에 들어 있는 중간 기운으로, 삼합 관계에서 들어온 기운입니다. 자·묘·유(子卯酉)에는 없습니다.'],
  '정기': ['지장간', '그 지지의 본래 기운으로 가장 오래, 가장 강하게 작용합니다. 지지의 십성은 보통 이 정기로 정합니다.'],
  '투출': ['지장간', '지지 속에 숨어 있던 글자가 천간에도 드러나 있는 것입니다. 속에 있던 기운이 겉으로 드러났으니 힘이 뚜렷해진다고 봅니다. 예: 월지 속의 정관이 천간에도 있으면 정관이 사주의 중심 역할을 합니다.'],

  // ── 12운성
  '12운성': ['12운성', '천간이 각 지지에서 얼마나 힘을 받는지를 사람의 일생(태어남→자람→전성기→늙음→죽음→다시 잉태)에 빗댄 12단계입니다. 장생·관대·건록·제왕은 힘이 좋은 단계, 쇠·병·사·묘·절은 힘이 약해지는 단계로 봅니다.'],
  '봉법': ['12운성', '나(일간)를 기준으로 네 지지 각각에서 내가 얼마나 힘을 받는지 매기는 방법입니다. 표에 크게 적힌 값입니다.'],
  '좌법': ['12운성', '각 기둥의 천간이 바로 아래 자기 지지에서 얼마나 힘을 받는지 매기는 방법입니다. 그 기둥 천간의 뿌리가 튼튼한지 봅니다. 표에 작게 적힌 값입니다.'],
  '장생': ['12운성', '막 태어난 아기의 단계입니다. 새로운 시작, 성장 가능성, 주변의 도움을 받는 기운으로 봅니다.'],
  '목욕': ['12운성', '태어난 아기를 처음 씻기는 단계입니다. 아직 불안정해서 호기심·변덕·유행에 민감함, 이성에 대한 관심으로 해석합니다.'],
  '관대': ['12운성', '어른이 되어 옷과 관을 갖춰 입는 단계입니다. 자신감과 도전 정신이 커지고, 지나치면 과시하거나 무리한다고 봅니다.'],
  '건록': ['12운성', '사회에 나가 월급을 받는 단계입니다. 스스로 설 수 있는 힘, 안정된 실력과 일하는 능력으로 봅니다.'],
  '제왕': ['12운성', '힘이 가장 센 전성기 단계입니다. 주도권과 강한 자아로 보며, 지나치면 독선과 고집이 된다고 봅니다.'],
  '쇠': ['12운성', '전성기를 지나 힘이 조금씩 줄어드는 단계입니다. 대신 경험이 쌓인 노련함과 신중함으로 봅니다.'],
  '병': ['12운성', '몸이 약해진 단계입니다. 추진력은 떨어지지만 섬세함과 감수성, 남을 이해하는 마음이 커진다고 봅니다.'],
  '사': ['12운성', '움직임이 멈춘 단계입니다. 활동보다 한 가지에 깊이 몰입하는 힘, 연구·정신적 활동으로 봅니다.'],
  '묘': ['12운성', '무덤(창고)에 들어간 단계입니다. 모으고 저장하고 아끼는 힘, 드러나지 않는 재산으로 봅니다.'],
  '절': ['12운성', '기운이 완전히 끊긴 단계입니다. 단절과 전환, 그래서 오히려 새 출발의 계기로 봅니다.'],
  '태': ['12운성', '엄마 뱃속에 막 생긴 단계입니다. 아직 드러나지 않은 가능성, 계획과 구상의 단계로 봅니다.'],
  '양': ['12운성', '뱃속에서 자라는 단계입니다. 보호받으며 준비하는 기운, 길러 주고 길러지는 관계로 봅니다.'],

  // ── 12신살
  '12신살': ['12신살', '태어난 해(또는 날)의 지지를 기준으로 다른 지지에 붙이는 12가지 별명입니다. "살"이라는 이름이 붙어도 모두 나쁜 것은 아니며, 대부분 좋은 면과 조심할 면을 함께 가집니다. 기준을 년지로 할지 일지로 할지는 학파마다 달라서 설정에서 바꿀 수 있습니다.'],
  '겁살': ['12신살', '무언가를 빼앗기거나 갑자기 잃는 기운입니다. 도난·손재수를 조심하라는 뜻이지만, 반대로 과감하게 결단하는 힘으로도 봅니다.'],
  '재살': ['12신살', '"수옥살"이라고도 하며 갇히거나 묶이는 기운입니다. 법적 문제나 구속을 조심하라는 뜻이고, 좋게 쓰면 남을 통제하고 관리하는 능력으로 봅니다.'],
  '천살': ['12신살', '하늘에서 오는 일, 즉 사람 힘으로 어쩔 수 없는 일을 뜻합니다. 자연재해나 뜻밖의 일을 조심하고, 좋게는 종교심·인내심으로 봅니다.'],
  '지살': ['12신살', '땅을 딛고 떠나는 기운입니다. 이사, 이직, 새로운 출발, 환경 변화를 뜻합니다.'],
  '연살': ['12신살', '흔히 말하는 "도화살"입니다. 사람을 끄는 매력, 인기, 이성 관계, 예술적 끼를 뜻합니다. 연예·서비스업에서는 장점이 됩니다.'],
  '월살': ['12신살', '"고초살"이라고도 하며 일이 막히고 메마르는 기운입니다. 일이 더디게 풀리니 서두르지 말라는 뜻으로 봅니다.'],
  '망신살': ['12신살', '체면을 잃거나 숨기고 싶은 것이 드러나는 기운입니다. 구설수를 조심하라는 뜻이고, 좋게는 자신을 과감히 드러내는 표현력으로 봅니다.'],
  '장성살': ['12신살', '장군의 별입니다. 리더십, 권위, 강한 주관을 뜻하며 조직을 이끄는 자리에 어울린다고 봅니다.'],
  '반안살': ['12신살', '말 위에 안장을 얹고 오르는 기운입니다. 승진, 출세, 안정된 지위를 뜻하는 좋은 살입니다.'],
  '역마살': ['12신살', '말을 타고 멀리 떠나는 기운입니다. 이동이 잦음, 해외, 출장, 여행, 무역·운송 관련 일을 뜻합니다.'],
  '육해살': ['12신살', '여섯 가지 해로움이라는 뜻입니다. 잔병치레나 일이 지연되는 것을 조심하라는 뜻이고, 좋게는 남을 돌보는 헌신과 봉사로 봅니다.'],
  '화개살': ['12신살', '꽃을 덮는 기운입니다. 화려함보다 내면을 향해서 학문·종교·예술에 깊이 빠지고, 혼자 있는 시간을 즐기는 성향으로 봅니다.'],

  // ── 공망
  '공망': ['공망', '"비어 있다"는 뜻입니다. 60갑자를 10개씩 묶으면 천간은 10개인데 지지는 12개라 지지 두 개가 짝 없이 남는데, 그 두 지지가 공망입니다. 공망에 걸린 자리는 기운이 비어서 작용이 약하거나 늦게 나타난다고 봅니다. 예: 배우자 자리가 공망이면 인연이 늦게 온다고 풉니다.'],

  // ── 관계
  '천간합': ['관계', '짝이 맞는 두 천간이 만나 서로 끌어당기는 관계입니다(갑기·을경·병신·정임·무계). 협력, 화합, 또는 서로에게 묶여 제 역할을 못 하는 것으로 봅니다. 조건이 맞으면 다른 오행으로 바뀐다고도 보지만, 이 앱은 오행 비율에 반영하지 않습니다.'],
  '천간충': ['관계', '서로 정면으로 부딪치는 두 천간입니다(갑경·을신·병임·정계). 생각이나 목표의 충돌, 갑작스러운 변화를 뜻합니다.'],
  '육합': ['관계', '두 지지가 짝을 이뤄 하나로 묶이는 관계입니다(자축·인해·묘술·진유·사신·오미). 결합, 화합, 인연을 뜻합니다.'],
  '삼합': ['관계', '세 지지가 모여 하나의 강한 오행 세력을 만드는 관계입니다. 신자진은 물, 해묘미는 나무, 인오술은 불, 사유축은 쇠가 됩니다. 합 중에 가장 강해서 사주의 흐름을 크게 바꾼다고 봅니다.'],
  '반합': ['관계', '삼합의 세 글자 중 가운데 글자(자·오·묘·유)를 포함한 두 글자만 모인 경우입니다. 삼합보다 약하지만 같은 방향으로 기운을 모읍니다.'],
  '방합': ['관계', '같은 계절의 세 지지가 모인 관계입니다(인묘진=봄·나무, 사오미=여름·불, 신유술=가을·쇠, 해자축=겨울·물). 같은 계절 기운이 뭉쳐 그 오행이 아주 강해집니다.'],
  '충': ['관계', '정반대 방향의 두 지지가 정면으로 부딪치는 관계입니다(예: 자↔오, 인↔신). 이사·이직 같은 변화, 갈등, 깨짐을 뜻합니다. 어느 자리에서 부딪치는지가 중요합니다. 예: 일지 충은 배우자·집 문제, 월지 충은 직장·부모 문제로 봅니다.'],
  '형': ['관계', '서로 벌을 주고 다듬는 관계입니다(인사신, 축술미, 자묘, 진진·오오·유유·해해). 갈등, 법적 문제, 수술처럼 "고치고 다듬는" 일로 나타난다고 봅니다. 의사·법조인처럼 형을 직업으로 쓰기도 합니다.'],
  '파': ['관계', '서로 깨뜨리는 관계입니다(자유·오묘·신사·인해·진축·술미). 충보다 약한 금 가는 정도의 균열로 봅니다.'],
  '해': ['관계', '서로 해치는 관계입니다(자미·축오·인사·묘진·신해·유술). 좋은 인연(합)을 방해하거나 믿던 사람과 틀어지는 작용으로 봅니다.'],
  '원진': ['관계', '서로 괜히 미워하고 원망하는 관계입니다(자미·축오·인유·묘신·진해·사술). 가까운 사람과의 이유 없는 불화로 해석합니다.'],
  '귀문관': ['관계', '"귀신이 드나드는 문"이라는 뜻입니다(자·유, 축·오, 인·미, 묘·신, 진·해, 사·술). 예민함, 뛰어난 직관과 영감으로 해석하며, 지나치면 신경이 날카로워진다고 봅니다. 조합은 학파마다 조금 다릅니다.'],

  // ── 신살·길성
  '신살': ['신살', '특정 글자 조합에 붙이는 상징적인 별명입니다. 좋은 것은 "귀인·길성", 조심할 것은 "살"이라 부릅니다. 사주 해석에서는 오행 균형보다 비중이 낮은 참고 지표입니다.'],
  '천을귀인': ['신살', '가장 좋은 길성으로 꼽힙니다. 어려울 때 도와주는 사람이 나타나고, 위기를 넘기는 복이 있다고 봅니다. 일간 기준으로 찾습니다(갑무경→축미, 을기→자신, 병정→해유, 신→인오, 임계→사묘).'],
  '문창귀인': ['신살', '글과 공부의 별입니다. 머리가 좋고 글재주가 있으며 시험운이 좋다고 봅니다.'],
  '금여록': ['신살', '"금으로 만든 수레"라는 뜻입니다. 좋은 배우자, 품위 있는 생활, 넉넉한 재물을 뜻하는 길성입니다.'],
  '암록': ['신살', '"숨은 월급"이라는 뜻입니다. 뜻밖의 도움이나 드러나지 않는 재물이 생긴다고 봅니다.'],
  '건록': ['신살', '나(일간)가 지지에서 안정된 월급을 받는 자리입니다. 스스로 설 수 있는 힘과 직업적 안정으로 봅니다. 12운성의 건록과 같은 자리입니다.'],
  '양인살': ['신살', '"양날의 칼"이라는 뜻입니다. 양 일간이 가장 힘센 자리(제왕)를 만날 때 붙습니다. 강한 추진력과 결단력이 있지만 과격해지거나 다칠 수 있다고 봅니다.'],
  '홍염살': ['신살', '"붉은 불꽃"이라는 뜻입니다. 이성을 끄는 매력과 끼, 멋을 내는 감각을 뜻합니다.'],
  '천덕귀인': ['신살', '하늘의 덕이 돕는 길성입니다. 나쁜 일이 생겨도 크게 번지지 않게 막아 준다고 봅니다. 태어난 달(월지) 기준으로 찾습니다.'],
  '월덕귀인': ['신살', '달의 덕이 돕는 길성입니다. 천덕귀인처럼 나쁜 일을 줄여 주고, 성품이 너그럽다고 봅니다. 태어난 달(월지) 기준으로 찾습니다.'],
  '백호대살': ['신살', '"호랑이에게 물린다"는 뜻의 강한 살입니다. 갑진·을미·병술·정축·무진·임술·계축 일곱 간지가 해당합니다. 사고·수술·다침을 조심하라는 뜻이고, 강한 기질과 추진력으로도 봅니다.'],
  '괴강살': ['신살', '북두칠성의 우두머리 별에서 온 이름입니다. 경진·경술·임진·임술·무술 간지가 해당합니다. 강한 리더십과 결단력이 있지만 극단적으로 흐르기 쉽다고 봅니다.'],
  '고신살': ['신살', '"외로운 신하"라는 뜻입니다. 혼자 지내는 시간이 많거나 가족과 떨어져 지내는 경향으로 봅니다.'],
  '과숙살': ['신살', '"홀로 지내는 집"이라는 뜻으로 고신살과 짝을 이룹니다. 배우자와 떨어져 지내는 시간이 생기기 쉽다고 봅니다.'],
  '천의성': ['신살', '"하늘의 의사"라는 뜻입니다. 의료, 약, 치유, 상담처럼 사람을 돌보는 일과 인연이 있다고 봅니다.'],
  '현침살': ['신살', '"바늘을 매단다"는 뜻입니다. 갑·신(辛) 천간과 묘·오·미·신(申) 지지처럼 글자 모양이 바늘이나 침처럼 뾰족한 것에 붙습니다. 말과 시선이 날카롭고 예민하며 비판력이 좋다고 봅니다. 날카로운 것을 다루는 의료·침술·재봉·미용·정밀 기술 분야에서는 오히려 장점이 됩니다. 다만 말로 상처를 주거나 신경이 곤두서는 면은 조심하라고 풉니다.'],
  '도화살': ['신살', '"복숭아꽃"이라는 뜻으로, 사람을 끄는 매력과 인기를 말합니다. 이 앱에서는 12신살의 "연살"이 도화살에 해당하며(자·오·묘·유 글자), 같은 의미의 홍염살과 함께 매력 신호로 참고합니다.'],
  '학당귀인': ['신살', '"배우는 집"이라는 뜻의 길성입니다. 일간이 생(장생)을 얻는 자리(갑→해, 을→오, 병·무→인, 정·기→유, 경→사, 신→자, 임→신, 계→묘)에 있을 때 붙습니다. 배움을 즐기고 학문·연구·자격 공부에 인연이 있다고 봅니다.'],
  '태극귀인': ['신살', '"모든 것의 시작"인 태극에서 온 길성입니다. 갑·을→자·오, 병·정→묘·유, 무·기→진·술·축·미, 경·신→인·해, 임·계→사·신이 해당합니다. 위기에서 도움을 받고, 정신세계·종교·철학·학문에 깊은 관심을 갖는다고 봅니다.'],
  '낙정관살': ['신살', '"우물에 빠진다"는 뜻입니다. 일간 기준으로 갑·기→사, 을·경→자, 병·신→신, 정·임→술, 무·계→묘에 해당합니다. 물가나 높은 곳에서의 사고, 갑작스러운 함정 같은 일을 조심하라는 신호로 봅니다. 참고용의 약한 살입니다.'],
  '천라지망': ['신살', '"하늘의 그물과 땅의 그물"이라는 뜻입니다. 원국에 술·해가 함께 있으면 천라, 진·사가 함께 있으면 지망이라 합니다. 일이 묶이고 답답하게 막히는 느낌, 법적인 일이나 구속을 조심하라는 뜻으로 봅니다. 집중력과 끈기로 쓰이기도 합니다.'],
  '음양차착살': ['신살', '"음양이 어긋난다"는 뜻입니다. 일주가 병자·정축·무인·신묘·임진·계사·병오·정미·무신·신유·임술·계해일 때 붙습니다. 연애·결혼에서 상대나 처가·시가와의 엇갈림, 인연이 어긋나는 일을 조심하라는 뜻으로 봅니다. 해석이 크게 갈리는 살이라 참고만 합니다.'],
  '고란살': ['신살', '"외로운 난초"라는 뜻입니다. 일주가 갑인·을사·정사·무신·신해일 때 붙습니다. 배우자 인연이 순탄치 않거나 혼자 있는 시간이 길어질 수 있다고 보지만, 독립심과 자기 세계가 강하다는 뜻으로도 풉니다.'],
  '복성귀인': ['신살', '"복을 부르는 별"이라는 뜻의 길성입니다. 일간 기준으로 갑·병→인·자, 을·계→묘·축, 무→신, 기→미, 정→해, 경→오, 신→사·유, 임→진·술에 해당합니다. 먹고사는 걱정이 덜하고 평탄하게 복을 누린다고 봅니다.'],
  '상문살': ['신살', '"초상집 문"이라는 뜻입니다. 태어난 해 지지에서 두 칸 앞의 지지가 해당합니다. 슬픈 소식이나 상실, 우울한 기분을 조심하라는 신호이며, 반대로 남의 아픔을 잘 헤아리는 마음으로도 봅니다.'],
  '조객살': ['신살', '"문상객"이라는 뜻으로 상문살과 짝을 이룹니다. 태어난 해 지지에서 두 칸 뒤의 지지가 해당합니다. 경조사와 이별, 구설을 조심하라는 신호로 봅니다.'],
  '효신살': ['신살', '"올빼미 같은 별"이라는 뜻입니다. 일지의 속 기운이 편인일 때 붙는 것으로 봅니다(학파마다 해당 간지가 달라 이 앱은 이 기준을 씁니다). 어머니나 윗사람과의 인연이 엇갈리거나 생각이 많고 한쪽으로 치우치기 쉽다고 보며, 한 분야를 깊이 파는 집중력으로도 풉니다.'],
  '삼기귀인': ['신살', '천간 세 글자가 순서대로 이어질 때 붙는 귀한 길성입니다. 갑·무·경(천상삼기), 을·병·정(지하삼기), 임·계·신(인중삼기)이 년·월·일 또는 월·일·시 순서로 나란히 놓여야 합니다. 남다른 재능과 독특한 운, 큰 뜻을 품는 기질로 봅니다. 드물게 나타납니다.'],
  '금신살': ['신살', '"쇠로 만든 신"이라는 뜻입니다. 일주 또는 시주가 을축·기사·계유일 때 붙습니다. 칼날처럼 날카롭고 결단력과 추진력이 강하다고 봅니다. 기운이 세서 다툼이나 급한 성격을 조심하라는 뜻도 함께 있습니다.'],
  '천관귀인': ['신살', '"하늘의 벼슬"이라는 뜻의 길성입니다. 일간 기준으로 갑→미, 을→진, 병→사, 정→인, 무→묘, 기→유, 경→해, 신→신, 임→유, 계→오에 해당합니다. 승진, 직위, 공적인 명예와 인연이 있다고 봅니다. 학파마다 일부 글자가 다릅니다.'],
  '천복귀인': ['신살', '"하늘이 내린 복"이라는 뜻의 길성입니다. 일간 기준으로 갑→유, 을→신, 병→자, 정→해, 무→묘, 기→인, 경→오, 신→사, 임→오, 계→사에 해당합니다. 먹고사는 복과 편안하게 누리는 복이 있다고 봅니다. 학파마다 일부 글자가 다릅니다.'],
  '천주귀인': ['신살', '"하늘의 주방"이라는 뜻의 길성입니다. 일간이 낳는 식신(먹을 복의 별)이 지지에서 안정적으로 자리 잡은 곳으로, 갑→사, 을→오, 병→사, 정→오, 무→신, 기→유, 경→해, 신→자, 임→인, 계→묘에 해당합니다. 의식주가 넉넉하고 음식·요리와 인연이 있다고 봅니다.'],
  '복음': ['운', '들어오는 운의 간지가 원국의 같은 간지와 똑같이 겹치는 것입니다. 같은 기운이 두 배로 쌓여 그 자리의 일이 반복되거나 정체되고, 기쁜 일은 더 커지고 힘든 일은 길어진다고 봅니다. 해당 기둥이 말하는 영역(년=조상·사회, 월=직장, 일=나·배우자, 시=자녀·말년)을 살펴보세요. 참고 신호이며 점수에는 반영하지 않습니다.'],
  '반음': ['운', '들어오는 운의 간지가 원국 기둥과 천간·지지 모두 정반대로 부딪치는 것입니다(천극지충). 그 기둥이 말하는 영역에서 급격한 변화, 이동, 뒤바뀜이 일어나기 쉽다고 봅니다. 나쁜 일만이 아니라 낡은 것을 정리하는 계기로도 풉니다. 참고 신호이며 점수에는 반영하지 않습니다.'],
  '급각살': ['신살', '"다리를 급하게 다친다"는 뜻입니다. 태어난 달의 계절에 따라 봄(인묘진월)은 해·자, 여름(사오미월)은 묘·미, 가을(신유술월)은 인·술, 겨울(해자축월)은 축·진이 일지나 시지에 있을 때 붙습니다. 다리·관절을 다치거나 급한 사고를 조심하라는 신호로 봅니다. 학파마다 다른 참고용의 약한 살입니다.'],
  '탕화살': ['신살', '"끓는 물과 불"이라는 뜻입니다. 인(寅)이 사·신과, 오(午)가 또 다른 오와, 축(丑)이 술·미와 함께 있어 형을 이룰 때 붙는 것으로 봅니다. 화상·약물·급체처럼 뜨겁거나 급한 일을 조심하라는 신호이며, 감정이 급하게 끓어오르는 성향으로도 풉니다. 학파마다 다른 참고용 살입니다.'],
  '천문성': ['신살', '"하늘의 문"이라는 뜻입니다. 묘·미·술·해가 일지나 시지에 있을 때 붙는 것으로 봅니다. 직관력과 영감이 좋고 철학·종교·의학·역학처럼 눈에 보이지 않는 것을 다루는 일에 소질이 있다고 봅니다. 다만 몸이 약하거나 예민해지기 쉽다는 해석도 있습니다. 학파마다 해당 글자가 다릅니다.'],
  '해공': ['공망', '공망(비어 있는 자리)이 충이나 합을 만나 어느 정도 풀리는 것을 말합니다. 공망 글자가 충을 맞으면 비어 있던 자리가 깨어나고, 합을 만나면 채워진다고 봅니다. 풀렸다고 해서 공망이 완전히 사라지는 것은 아니고 "작용이 약하거나 늦다"는 해석이 덜해진다는 정도로 읽습니다. 이 앱은 원국 안의 충·육합·삼합·반합만 따집니다.'],
  '12건제': ['택일', '날짜마다 붙는 12가지 성격(건·제·만·평·정·집·파·위·성·수·개·폐)입니다. 그달의 월지에서 시작해 날의 지지가 몇 칸째인지로 정합니다. 만·평·정·성·개일은 대체로 좋고, 파·위·폐일은 대체로 꺼린다고 봅니다. 목적에 따라 좋은 날이 달라서(예: 개업은 건·개일, 이사는 만·성·개일) 이 앱은 목적별 가중치를 따로 둡니다.'],
  '손 없는 날': ['택일', '음력 날짜가 9·10·19·20·29·30일인 날입니다. 악귀(손)가 없다고 보는 날이라 이사·결혼처럼 사람이 움직이는 일에 좋다고 봅니다. 민간에서 널리 쓰는 기준이라 이 앱도 이사·결혼 목적일 때 점수에 조금 더합니다.'],
  '택일': ['택일', '일을 시작할 좋은 날을 고르는 것입니다. 이 앱은 날의 간지와 내 사주의 충·형·합, 귀인일, 12건제, 내 용신 오행을 함께 보며 점수로 보여 줍니다. 전통 기법을 조합한 참고 정보라서 흐름 점수와는 별개입니다.'],
  '십악대패일': ['신살', '"열 가지 큰 실패의 날"이라는 뜻입니다. 일주가 갑진·을사·병신·정해·무술·기축·경진·신사·임신·계해일 때 붙습니다. 타고난 재물이 새기 쉽다고 보는 옛 해석이며, 지금은 돈 관리를 꼼꼼히 하라는 정도의 참고로만 봅니다.'],

  // ── 강약
  '신강신약': ['강약', '나(일간)가 사주 안에서 얼마나 힘을 받는지 판단한 것입니다. 나를 돕는 글자(비겁·인성)가 많으면 신강(힘이 셈), 적으면 신약(힘이 약함)입니다. 좋고 나쁨이 아니라 "무엇이 필요한가"를 정하는 기준이 됩니다. 신강하면 힘을 빼 주는 기운이, 신약하면 도와주는 기운이 필요합니다.'],
  '득령': ['강약', '태어난 계절이 나를 돕는지를 봅니다. 예: 나무(갑·을) 일간이 봄에 태어나면 득령입니다. 힘의 세기를 판단할 때 가장 중요한 기준입니다.'],
  '득지': ['강약', '내가 앉은 자리(일지)가 나를 돕는지를 봅니다. 발 딛고 선 땅이 튼튼한지와 같습니다.'],
  '득세': ['강약', '월지·일지를 뺀 나머지 글자 중 내 편이 절반을 넘는지를 봅니다. 주변에 나를 돕는 사람이 많은지와 같습니다.'],
  '월령': ['강약', '태어난 달(월지)이 가진 계절의 힘입니다. 사주 전체의 분위기를 정하기 때문에 다른 자리보다 무겁게 계산합니다.'],
  '중화': ['강약', '나를 돕는 힘과 빼는 힘이 비슷하게 균형 잡힌 상태입니다(돕는 힘 42~58%). 한쪽으로 치우치지 않아 무난하다고 봅니다.'],
  '극약': ['강약', '나를 돕는 힘이 20% 미만으로 아주 약한 상태입니다. 이 정도면 억지로 돕기보다 강한 쪽을 따라가는 것(종격)이 낫다고 보는 학파도 있습니다.'],
  '태약': ['강약', '나를 돕는 힘이 20~30%로 많이 약한 상태입니다. 나를 도와주는 운이 올 때 크게 힘을 얻습니다.'],
  '신약': ['강약', '나를 돕는 힘이 30~42%로 약간 약한 상태입니다. 혼자보다는 도움을 받으며 일할 때 좋다고 봅니다.'],
  '신강': ['강약', '나를 돕는 힘이 58~70%로 약간 센 상태입니다. 주관이 뚜렷하고 스스로 밀고 나가는 힘이 있습니다.'],
  '태강': ['강약', '나를 돕는 힘이 70~80%로 많이 센 상태입니다. 힘을 밖으로 쓰거나 덜어 주는 운이 좋다고 봅니다.'],
  '극왕': ['강약', '나를 돕는 힘이 80% 이상으로 아주 센 상태입니다. 이 정도면 누르기보다 그 강한 기운을 따르는 것(전왕격)이 낫다고 보는 학파도 있습니다.'],
  '오행 비율': ['강약', '사주 글자들의 오행을 점수로 더해 비율로 나타낸 것입니다. 숨은 글자(지장간)를 어떻게 셀지, 태어난 달에 가중치를 얼마나 줄지에 따라 숫자가 크게 달라집니다. 사주 앱마다 비율이 다른 이유가 이것입니다.'],

  // ── 용신
  '용신': ['용신', '내 사주의 균형을 맞추는 데 가장 필요한 오행입니다. 부족한 것을 채워 주는 "약" 같은 기운이라, 용신 운이 오면 일이 잘 풀린다고 봅니다. 기준(억부·조후·통관 등)에 따라 답이 달라지므로 이 앱은 학파를 고르고 근거를 함께 보여줍니다.'],
  '희신': ['용신', '용신을 도와주는 오행입니다. 용신 다음으로 반가운 기운입니다.'],
  '기신': ['용신', '용신을 방해하는(극하는) 오행입니다. 가장 꺼리는 기운으로, 기신 운에는 조심하라고 봅니다.'],
  '구신': ['용신', '기신을 도와주는 오행입니다. 기신 다음으로 꺼리는 기운입니다.'],
  '한신': ['용신', '용신·희신·기신·구신 어디에도 속하지 않는 오행입니다. 크게 좋지도 나쁘지도 않은 중립적인 기운입니다.'],
  '억부': ['용신', '"강하면 누르고 약하면 돕는다"는 방식입니다. 내가 약하면 나를 돕는 오행을, 강하면 힘을 빼 주는 오행을 용신으로 정합니다. 가장 널리 쓰이는 기준입니다.'],
  '조후': ['용신', '사주의 온도와 습도를 맞추는 방식입니다. 한여름에 태어나 뜨거운 사주는 물로 식히고, 한겨울에 태어나 차가운 사주는 불로 데웁니다. 이 앱의 조후는 글자별 온도·습도를 더한 단순화 모델입니다.'],
  '통관': ['용신', '서로 싸우는 두 오행 사이를 이어 주는 오행을 쓰는 방식입니다. 예: 쇠와 나무가 부딪치면 쇠→물→나무로 흐르게 해 주는 물이 통관 용신입니다.'],
  '한난조습': ['용신', '사주가 차가운지(한), 따뜻한지(난), 습한지(습), 건조한지(조)를 보는 것입니다. 조후 용신을 정하는 근거가 됩니다.'],

  // ── 운
  '대운': ['운', '10년마다 바뀌는 인생의 큰 흐름입니다. 계절이 바뀌듯 10년 단위로 주어지는 환경이라고 생각하면 됩니다. 태어난 달 기둥(월주)에서 출발해 한 칸씩 앞으로(순행) 또는 뒤로(역행) 이동합니다.'],
  '대운수': ['운', '첫 대운이 시작되는 나이입니다. 예: 대운수가 5면 5세, 15세, 25세…에 대운이 바뀝니다. 태어난 때부터 가까운 절기까지의 날짜를 3으로 나눠 구합니다(3일=1년).'],
  '순행': ['운', '대운이 60갑자 순서대로 앞으로 나아가는 것입니다. 양의 해에 태어난 남자, 음의 해에 태어난 여자가 해당합니다.'],
  '역행': ['운', '대운이 60갑자 순서를 거꾸로 거슬러 가는 것입니다. 음의 해에 태어난 남자, 양의 해에 태어난 여자가 해당합니다.'],
  '세운': ['운', '해마다 바뀌는 그해의 기운입니다. 예: 2026년은 병오년입니다. 입춘을 기준으로 바뀝니다. 대운이 10년의 계절이라면 세운은 그해의 날씨와 같습니다.'],
  '월운': ['운', '달마다 바뀌는 기운입니다. 매달 절기(입춘·경칩 등)를 기준으로 바뀝니다.'],
  '일운': ['운', '날마다 바뀌는 그날의 기운으로 "일진"이라고도 합니다. 달력의 점수는 그날의 간지가 이 사주에 필요한 기운(용신)인지를 따져 매긴 값입니다.'],
  '삼재': ['운', '삼재는 전통 민속에서 사람의 띠를 기준으로 일정한 주기에 걸쳐 주의가 필요하다고 보는 3년의 시기를 말합니다.\n보통 첫해를 들삼재, 두 번째 해를 눌삼재, 세 번째 해를 날삼재라고 부릅니다.\n이 앱에서는 삼재를 전통적인 참고 정보로 표시하며, 삼재라는 이유만으로 해당 연도의 흐름 점수를 낮추지는 않습니다.\n실제 운세 흐름은 원국과 대운·세운의 오행, 십신, 합충형파해, 억부·조후 등의 관계를 별도로 계산합니다.'],
  '들삼재': ['운', '삼재가 시작되는 첫 번째 해를 뜻합니다. 전통적으로 새로운 변화나 외부 환경의 변동에 주의를 기울이는 시기로 해석합니다.'],
  '눌삼재': ['운', '삼재의 두 번째 해를 뜻합니다. 전통적으로 삼재의 영향이 이어지는 시기로 해석합니다.'],
  '날삼재': ['운', '삼재의 마지막 해를 뜻합니다. 전통적으로 삼재의 흐름에서 벗어나는 과정으로 해석합니다.'],
  '손 없는 날': ['운', '민간 풍습에서 "손"은 날짜마다 방향을 옮겨 다니며 사람의 일을 방해한다는 귀신입니다. 음력 날짜 끝자리가 9·0인 날(9·10·19·20·29·30일)에는 손이 하늘로 올라가 없다고 봐서 이사·결혼 날로 선호합니다. 사주 해석과는 별개인 풍습이라 이 앱의 흐름 점수에는 반영하지 않습니다.'],
  '시진': ['운', '하루 24시간을 12지지로 나눈 2시간 단위입니다. 자시(밤 11시~새벽 1시)부터 해시(밤 9~11시)까지입니다.'],
  '통근': ['구조', '통근은 일간이 지지와 지장간에서 자신의 뿌리를 얻고 있는지를 살펴보는 개념입니다. 일간이 원국 안에서 어느 정도 기반을 확보하고 있는지를 해석하는 요소 중 하나입니다.'],
  '무근': ['구조', '무근은 원국의 지지에서 일간이 직접적으로 의지할 근이 확인되지 않는 상태입니다. 무근 자체를 좋거나 나쁘다고 판단하지 않으며 신강·신약 역시 통근 하나만으로 결정하지 않습니다.'],
  '운의 근 보강': ['구조', '원국의 통근 여부와 별개로 대운·세운·월운·일진의 지지에서 일간을 지지하는 근이 들어오는 현상을 말합니다. 원국 자체가 바뀌는 것은 아닙니다.'],
  '근 안정성': ['구조', '원국의 뿌리가 현재 운과 맺는 관계를 바탕으로 변화·교란 신호가 얼마나 나타나는지를 보여주는 참고 지표입니다.'],
  '흐름 점수': ['운', '들어오는 운이 현재 원국의 불균형을 얼마나 보완하거나 심화시키는지를 나타내는 상대 지표입니다(−100~+100). 미래의 행운·불운 확률이 아닙니다.\n+ 값은 원국에 필요한 방향과 잘 맞는다는 뜻, 0 부근은 영향이 섞이거나 중립, − 값은 기존 불균형이나 부담을 강화한다는 뜻입니다.\n네 성분을 사주에 맞춰 섞습니다. 억부(신강·신약을 맞추는 오행), 조후(한난조습 치우침을 줄이는지), 관계(원국과의 합·충·귀인), 구조(원국에서 모자란 십성 묶음을 채우는지). 강약 치우침이 크면 억부, 기후 치우침이 크면 조후 비중이 커지고, 둘 다 크지 않은 중화 사주는 특정 용신 하나의 영향력이 줄어듭니다.\n세운·월운은 대운과 40%:60%로 섞습니다. 해석을 돕는 참고용 모델이며 통계적으로 검증된 예측이 아닙니다.'],
  '상태 순풍': ['운의 흐름', "상태 순풍: 흐름 적합도가 높아, 활성화되는 일이 원국에 필요한 방향을 보완하는 상태입니다. 어떤 일이 활성화되는지는 주 흐름(기회·확장·수확·축적)이 따로 알려 줍니다."],
  '상태 보통': ['운의 시기', '상태 보통: 보완과 부담이 섞이거나 영향이 중립적인 상태입니다.'],
  '상태 주의': ['운의 흐름', "상태 주의: 활성화되는 일이 원국의 기존 불균형을 조금 키우는 상태입니다. 주 흐름은 그대로 두고, 그 일을 할 때 리스크 관리가 필요하다는 뜻입니다. 예: 수확 · 주의 = 결과 회수 신호는 강하지만 무리한 확장·지출은 점검."],
  '상태 부담': ['운의 흐름', "상태 부담: 활성화되는 일이 원국의 불균형을 크게 키워 부담이 큰 상태입니다. 주 흐름은 사라지지 않고 그대로 표시되며, 부담도가 기준을 넘으면 방어 신호가 함께 붙습니다."],

  // ── 운의 시기
  '운의 시기': ['운의 흐름', "운의 흐름은 세 가지 정보를 함께 보여줍니다.\n① 무엇이 활성화되는가? 기회 · 확장 · 수확 · 축적 — 네 가지 활성도(0~100)를 모두 계산하고 가장 높은 것이 주 흐름입니다. 1·2위가 비슷하면 동반 흐름도 함께 표시합니다.\n② 변화와 부담은 어느 정도인가? 변동 · 방어 — 주 흐름을 바꾸지 않고 덧붙는 상태 신호입니다. 변동은 기존 구조가 얼마나 움직이는가(변동성), 방어는 부담·리스크 관리가 얼마나 필요한가(부담도)입니다. 둘은 서로 독립이라 함께 붙을 수도 있습니다.\n③ 나에게 얼마나 잘 맞는가? 순풍 · 보통 · 주의 · 부담 — 흐름 적합도(−100~+100)로만 정합니다.\n예: \"기회 + 변동 · 순풍\" = 새로운 가능성이 활성화되고 변화도 많은 편이지만 현재 원국과의 적합도는 비교적 좋은 흐름. \"수확 + 방어 · 주의\" = 결과 회수 신호는 강하지만 부담 관리가 필요한 흐름.\n세 가지는 서로 다른 질문에 답하므로 하나로 합쳐 고르지 않습니다. 변동성이 높다고 주 흐름이 바뀌지 않고, 흐름 적합도가 낮아도 기회 활성도는 높을 수 있습니다.\n같은 이름이라도 운의 단위마다 풀이가 다릅니다. 대운은 10년짜리 장기 환경, 세운은 1년의 실행 환경, 월운은 1개월의 전술, 일진은 하루의 행동, 시진은 실행 타이밍입니다. 길흉 예언이 아니라 해석을 돕는 참고용 모델입니다."],
  '운의 작동 방식': ['운의 흐름', "운은 한 요소만으로 결정되지 않습니다. 같은 자동차라도 어떤 도로를 달리는지, 날씨가 어떤지, 현재 노면 상태가 어떤지에 따라 주행 경험이 달라집니다. 사주도 마찬가지로 원국을 기준으로 대운·세운·월운·일진이 겹쳐 현재의 흐름을 만듭니다.\n원국 = 자동차(타고난 구조와 특성) · 대운 = 오래 달리는 도로(약 10년) · 세운 = 그해의 날씨 · 월운 = 현재 구간의 교통·노면 · 일진 = 오늘의 실제 주행 조건 · 시진 = 순간적인 신호·교통 변화.\n비가 온다고 반드시 사고가 나는 것이 아니듯, 특정 운이 들어왔다고 특정 사건이 반드시 발생하는 것은 아닙니다. 이 비유는 이해를 돕기 위한 설명이며 실제 사고 확률 같은 예측이 아닙니다."],
  '기회기': ['운의 흐름', "기회 흐름: 새로운 가능성·시작·제안·진입 같은 새로운 활동이 활성화되는 흐름입니다. 새로운 일, 프로젝트, 제안, 만남, 도전 등 기존에 없던 가능성을 탐색하기 좋은 흐름입니다.\n기회가 많다는 것이 반드시 좋은 결과나 성공을 의미하지는 않습니다. 실제 유불리는 흐름 적합도, 변동성, 재물·애정·건강 등의 분야별 지표와 함께 확인합니다.\n판정: 기회·확장·수확·축적 활성도를 모두 계산해 가장 높은 것을 주 흐름으로 삼습니다. 기회 활성도는 새 활동을 만드는 십성의 활성, 표현·생산, 독립·주도, 외부 제안, 원국에서 모자랐던 기능의 보완, 새로운 합 관계, 원국에 없던 새 작용을 함께 봅니다. 십성 하나로 정하지 않으며, 비겁이 많아도 원국에 이미 익숙한 작용이면 기회보다 확장으로 읽힙니다.\n종류: 비겁은 독립·협업·경쟁·인맥, 식상은 창작·표현·생산·출시, 재성은 사업·거래·재정 활동, 관성은 직책·조직·사회적 역할, 인성은 학습·자격·연구·지원 기회를 만듭니다.\n구분: 기회는 새로 시작하거나 발견하는 흐름, 확장은 이미 있는 것을 키우는 흐름, 수확은 이미 만든 결과를 거두는 흐름, 축적은 내부 기반을 쌓는 흐름입니다. 변동·방어는 주 흐름이 아니라 따로 붙는 상태 신호입니다."],
  '확장기': ['운의 흐름', "확장 흐름: 이미 존재하는 활동·역할·관계·영향력이 커지는 흐름입니다. 관성이 주도하며, 원국에 그 기운이 이미 있을 때 뚜렷해집니다.\n기회가 새로운 것을 시작하거나 발견하는 때라면, 확장은 이미 있는 사업·프로젝트·관계·직책을 넓히는 때입니다. 예: 기존 사업 규모 확대, 프로젝트 확장, 승진, 조직 확대, 기존 관계 강화.\n행동: 대운은 규모 확대·승진·조직 키우기, 세운은 증액·재계약·파트너십, 월운은 광고 증액·협업 확대. 흐름 적합도가 주의·부담이면 과부하를 관리합니다."],
  '수확기': ['운의 흐름', "수확 흐름: 이미 만들어 놓은 활동에서 결과·성과·재정적 결과를 회수하는 흐름입니다. 재성이 주도하며, 원국에 결과물(식상 등)이 이미 있을 때 뚜렷해집니다. 재성이 들어온다고 무조건 수확이 되지는 않고, 식상→재성처럼 결과물이 현실 성과로 이어지는 구조도 함께 봅니다.\n기회가 새로운 가능성의 등장이라면, 수확은 기존 활동의 결과 회수입니다. 예: 신규 계약 제안은 기회, 계약 확정·대금 회수는 수확. 신제품 기획·출시는 기회, 판매 성과·정산은 수확.\n행동: 대운은 자산화·지분 정리·정산, 세운은 계약 확정·수금·판매·성과 회수, 월운은 청구·수금·마감. 흐름 적합도가 주의·부담이면 \"수확 · 주의\"로 읽고 지출·확장을 점검합니다."],
  '변동기': ['운의 흐름', "변동 신호: 기존 구조가 얼마나 움직이고 재편되는가를 나타내는 상태 신호입니다. 변동성이 기준(55) 이상이면 주 흐름 옆에 \"변동\" 표시가 붙습니다. 주 흐름(기회·확장·수확·축적)은 그대로 유지됩니다.\n변동성이 높다는 것은 좋은 일이나 나쁜 일이 반드시 발생한다는 뜻이 아닙니다. 변동 자체는 길흉을 의미하지 않으며, 변화가 현재 사주에 유리한 방향인지 부담이 되는 방향인지는 흐름 적합도와 상태(순풍·보통·주의·부담)를 함께 확인합니다. 기회 + 변동 · 순풍, 수확 + 변동 · 주의처럼 어떤 흐름·상태와도 짝지어질 수 있습니다.\n핵심 키워드: 변화 · 이동 · 재편 · 방향 변경 · 변동성\n판정: 합·충·형·파·해가 원국의 핵심 자리를 움직이는 정도를 0~100의 변동성으로 계산합니다. 일주·월주에 닿으면 무겁게, 시주는 중간, 년주는 가볍게 보며, 여러 신호가 겹치면 누적됩니다.\n방어 신호와의 차이: 변동은 변화량(변동성)이고, 방어는 부담과 리스크 관리(부담도)입니다. 둘은 독립이라 함께 붙을 수 있습니다."],
  '기회 활성도': ['운의 시기', '새로운 활동이나 선택지를 만들어 낼 기운이 얼마나 활성화되는지를 0~100으로 나타낸 값입니다. 좋고 나쁨이 아니라 "새로운 가능성이 얼마나 열리는가"입니다.\n새 활동을 만드는 십성의 활성(28%), 표현·생산(12%), 독립·주도(12%), 외부 관계·제안(10%), 원국에서 부족했던 기능의 보완(14%), 새로운 합 관계(10%), 원국에 많지 않던 새 작용의 등장(14%)을 합칩니다. 비겁·식상만이 아니라 재성(새 거래), 관성(새 역할), 인성(새 학습·지원)도 각자 다른 종류의 기회를 만듭니다.\n흐름 점수·변동성과는 독립입니다. 기회가 많아도 흐름 점수가 낮으면 선별과 리스크 관리가 중요하고, 변동성이 낮으면 기존 구조는 안정적인 채로 새 선택지만 늘어날 수 있습니다.'],
  '변동성': ['운의 시기', '운의 글자가 원국의 핵심 자리를 얼마나 움직이는지, 곧 변화 신호의 세기를 0~100으로 나타낸 값입니다. 좋고 나쁨이 아니라 "얼마나 움직이는가"입니다.\n0~24 안정적 · 25~49 움직임 있음 · 50~69 변동성 높음 · 70~100 변동성 매우 높음.\n충·형·파·해·합은 각각 세기가 다르고(충이 가장 큼), 일지·월지에 닿을수록 크며, 삼합·방합 완성처럼 구조가 바뀔 수 있는 조합이나 여러 신호의 중첩이 점수를 더합니다. 변동성이 높아도 흐름 점수는 깎이지 않으며, 변화의 유불리는 흐름 점수와 상태로 따로 봅니다.'],
  '축적기': ['운의 흐름', "축적 흐름: 미래 활동을 위한 역량·지식·자원·기반을 쌓는 흐름입니다. 인성이 주도하지만 인성이 있다고 무조건 축적이 되지는 않고, 전체 구조와 활동 성격을 함께 봅니다.\n기회가 외부 활동과 새 선택지의 활성이라면, 축적은 내부 기반의 축적입니다. 예: 새 프로젝트 진입은 기회, 기술 습득·연구·준비는 축적. 인성이 새로운 교육·자격·지원의 선택지를 만드는 경우에는 기회 활성도에도 일부 반영됩니다.\n행동: 대운은 학위·자격·전문성 쌓기, 세운은 제품 개발·교육·시스템 정비, 월운은 제작·기획·문서·재무 점검. 당장의 성과보다 다음 흐름을 위한 기반에 집중합니다."],
  '방어기': ['운의 흐름', "방어 신호(부담도): 이 운에서 부담·과부하·리스크 관리가 얼마나 필요한가를 0~100으로 나타낸 상태 신호입니다. 부담도가 기준(40) 이상이면 주 흐름 옆에 \"방어\" 표시가 붙으며, 주 흐름은 그대로 유지됩니다. 나쁜 때라는 뜻이 아니라 보수적으로 운영할 필요가 있다는 뜻입니다.\n계산: 흐름 적합도 저하, 억부(강약) 불균형 심화, 십성 균형 악화, 조후 부담, 합·충 관계 부담, 변화 신호와 부적합의 결합을 가중합하고 작용 강도로 조금 증폭합니다. 사고수(충돌·과부하 등 별도 주의 신호)나 분야별 지수를 가져와 쓰지 않아서, 사고수와 같은 점수가 아닙니다.\n변동 신호와의 차이: 방어는 부담 관리, 변동은 변화량입니다. 기회 + 변동 + 방어처럼 함께 나타날 수 있고, 이때는 \"새로운 선택지는 활성화되지만 변화량과 부담도 함께 큰 흐름\"으로 읽습니다.\n행동: 대운은 부채·건강 관리와 위험 분산, 세운은 현금 보존·비용 절감·하던 일 완주, 월운은 지출 줄이기·일정 여유 두기·휴식."],

  // ── 일진 행동모드·시진 실행 등급
  '일진 행동모드': ['운의 흐름', "하루를 \"오늘 어떤 일이 활성화되는가\"로 읽습니다. 주 흐름(기회·확장·수확·축적) 하나가 칸의 색과 글자로 표시되고, 변동·방어 상태가 있으면 가장 중요한 하나가 \"+변동\" \"+방어\"로 붙습니다(날짜를 누르면 모두 보입니다). 순풍·보통·주의·부담은 흐름 적합도로 따로 표시됩니다."],
  '실행 등급': ['운의 시기', '시진(2시간 단위)마다 "오늘의 목적"과 얼마나 잘 맞는지를 네 단계로 매긴 것입니다. ◎ 실행, ○ 활용, △ 주의, × 회피가 있습니다. 목적(일반·계약·돈·창작)을 고르면 그 목적에 맞는 기운이 들어오는 시간에 ◎가 붙습니다. 계약은 관성·인성, 돈은 재성·식상, 창작은 식상·인성 기운을 봅니다.'],
  '실행': ['운의 시기', '◎ 실행: 그날의 목적과 시진이 잘 맞는 시간입니다. 중요한 전화, 제출, 계약 서명, 공개 버튼 누르기처럼 결과가 생기는 행동을 이 시간에 둡니다.'],
  '활용': ['운의 시기', '○ 활용: 특별히 강하지는 않지만 안정적인 시간입니다. 회의·업무·제작 같은 일반적인 일에 무난합니다.'],
  '주의': ['운의 시기', '△ 주의: 원국의 일지·월지나 그날 일진과 충·형·파·해 같은 불안 요소가 있는 시간입니다. 중요한 결정은 가능하면 다른 시간대로 옮깁니다.'],
  '회피': ['운의 시기', '× 회피: 그날의 목적과 충돌이 상당히 강한 시간입니다(그날 일진과 정면 충돌하거나 점수가 크게 낮음). 굳이 이 시간에 중요한 일을 둘 이유가 없다면 피합니다.'],
  '판정 순서': ['운의 시기', '하루를 판단할 때 큰 흐름에서 작은 흐름 순서로 봅니다. ① 세운(올해 기본 환경) → ② 월운(이번 달 행동 방향) → ③ 일진(오늘의 흐름) → ④ 목적(계약인지, 돈인지, 창작인지) → ⑤ 시진(실제 실행 시간).'],

  // ── 구조

  // ── 기초
  '자미두수': ['자미두수', '태어난 음력 날짜와 시각으로 하늘의 별 100여 개를 12칸(12궁)에 배치해 인생을 읽는 동양 점성술입니다. 사주가 "여덟 글자의 오행 균형"을 본다면, 자미두수는 "돈·배우자·직업처럼 삶의 영역마다 어떤 별이 들어 있는지"를 봅니다. 그래서 영역별 질문에 답하기가 쉽습니다. 태어난 시각을 모르면 명반을 세울 수 없습니다.'],
  '명반': ['자미두수', '자미두수의 별 배치도입니다. 가운데를 비운 4×4 칸에 12궁이 둘러서 있고, 각 칸에 별이 들어갑니다. 칸의 위치는 12지지(자·축·인…)로 고정되어 있고, 어느 칸이 명궁이 되는지는 태어난 달과 시각으로 정해집니다.'],
  '오행국': ['자미두수', '명궁 간지의 오행으로 정하는 "그릇의 종류"입니다. 수2국·목3국·금4국·토5국·화6국 다섯 가지가 있습니다. 숫자는 첫 대한이 시작되는 나이이고, 자미성의 위치를 정하는 데도 쓰입니다. 예: 화6국이면 6세부터 첫 대한이 시작됩니다.'],

  // ── 12궁
  '명궁': ['자미 12궁', '나 자신의 궁입니다. 타고난 성격, 재능, 외모, 인생 전체의 방향을 봅니다. 명반에서 가장 먼저, 가장 중요하게 보는 칸입니다.'],
  '형제궁': ['자미 12궁', '형제자매와 가까운 친구, 동료와의 관계를 봅니다. 어머니와의 관계를 함께 보기도 합니다.'],
  '부처궁': ['자미 12궁', '배우자와 연애, 결혼 생활을 봅니다. 어떤 사람과 인연이 닿는지, 부부 관계가 어떤지를 읽습니다.'],
  '자녀궁': ['자미 12궁', '자녀와의 관계, 아랫사람, 제자를 봅니다. 성생활이나 창작물을 함께 보기도 합니다.'],
  '재백궁': ['자미 12궁', '돈을 버는 방식과 쓰는 방식, 재물운을 봅니다. 월급형인지 사업형인지, 돈이 모이는지 새는지를 읽습니다.'],
  '질액궁': ['자미 12궁', '건강과 체질, 조심해야 할 질병과 사고를 봅니다.'],
  '천이궁': ['자미 12궁', '밖에 나갔을 때의 나, 이동과 여행, 해외, 사회에서 만나는 기회를 봅니다. 명궁과 마주 보고 있어 명궁 다음으로 중요하게 봅니다.'],
  '노복궁': ['자미 12궁', '친구, 동료, 부하 직원, 사회에서 만나는 사람들과의 관계를 봅니다. "교우궁"이라고도 합니다.'],
  '관록궁': ['자미 12궁', '직업과 일, 사회적 성취, 학업을 봅니다. 어떤 일이 잘 맞는지, 직장에서 어떻게 인정받는지를 읽습니다.'],
  '전택궁': ['자미 12궁', '집과 부동산, 사는 환경, 가정의 분위기를 봅니다.'],
  '복덕궁': ['자미 12궁', '마음의 여유와 행복감, 취미, 정신세계를 봅니다. 겉으로 성공해도 속으로 행복한지를 이 궁으로 읽습니다.'],
  '부모궁': ['자미 12궁', '부모와의 관계, 윗사람·상사와의 관계, 문서와 계약 운을 봅니다.'],

  // ── 14주성
  '자미': ['자미 주성', '별들의 황제입니다. 품위와 자존심, 리더십, 사람들을 이끄는 힘을 뜻합니다. 주변에 좋은 별(좌보·우필 등)이 모이면 크게 성공하고, 혼자면 외롭고 고집스러울 수 있다고 봅니다.'],
  '천기': ['자미 주성', '지혜와 계획의 별입니다. 머리 회전이 빠르고 분석·기획에 강하며 변화를 좋아합니다. 생각이 많아 걱정이 많거나 자주 바꾸는 면도 있습니다.'],
  '태양': ['자미 주성', '해처럼 밝고 베푸는 별입니다. 열정, 명예, 남을 돕는 마음을 뜻합니다. 낮에 태어나거나 밝은 자리에 있으면 힘이 강하다고 봅니다. 남성·아버지를 뜻하기도 합니다.'],
  '무곡': ['자미 주성', '재물과 결단의 별입니다. 돈을 다루는 능력, 실행력, 강한 의지를 뜻합니다. 금융·재무에 강하지만 성격이 딱딱하고 외로울 수 있다고 봅니다.'],
  '천동': ['자미 주성', '복과 여유의 별입니다. 온화하고 낙천적이며 편안함을 좋아합니다. 어릴 때 고생해도 나중에 복을 누린다고 보며, 게으름을 조심하라고 합니다.'],
  '염정': ['자미 주성', '감정과 규율이 함께 있는 별입니다. 열정적이고 매력이 있으며 원칙을 중시합니다. 좋게 쓰면 공직·관리에 강하고, 나쁘게 흐르면 감정 기복과 구설이 따른다고 봅니다.'],
  '천부': ['자미 주성', '곳간(창고)의 별입니다. 안정, 저축, 관리 능력, 너그러움을 뜻합니다. 자미 다음가는 복된 별로, 재물을 지키고 모으는 힘이 있습니다.'],
  '태음': ['자미 주성', '달처럼 부드럽고 섬세한 별입니다. 감성, 저축, 부동산, 가정을 뜻합니다. 밤에 태어나거나 어두운 자리에 있으면 힘이 강하다고 봅니다. 여성·어머니를 뜻하기도 합니다.'],
  '탐랑': ['자미 주성', '욕망과 재주의 별입니다. 사교성, 매력, 다재다능함, 즐거움을 추구하는 마음을 뜻합니다. 예술·영업·사교에 강하지만 욕심과 유혹을 조심하라고 봅니다.'],
  '거문': ['자미 주성', '말(입)의 별입니다. 말솜씨, 분석력, 의심과 비판을 뜻합니다. 교사·변호사·방송처럼 말로 하는 일에 강하지만 구설수와 오해를 조심하라고 봅니다.'],
  '천상': ['자미 주성', '재상(보좌관)의 별입니다. 공정하고 성실하며 남을 돕고 조율하는 능력이 있습니다. 좋은 파트너, 믿음직한 2인자의 기운입니다.'],
  '천량': ['자미 주성', '보호와 어른의 별입니다. 남을 돌보고 지켜 주는 마음, 원칙, 장수를 뜻합니다. 위기를 넘기게 해 주는 별로, 의료·상담·교육과 인연이 있다고 봅니다.'],
  '칠살': ['자미 주성', '장군의 별입니다. 용맹함, 결단력, 개척 정신을 뜻합니다. 변화와 도전이 많은 삶이지만 크게 이루는 힘이 있다고 봅니다.'],
  '파군': ['자미 주성', '선봉대장의 별입니다. 기존 것을 부수고 새로 시작하는 힘, 변화와 혁신을 뜻합니다. 파란만장하지만 새 길을 여는 개척자형입니다.'],

  // ── 보좌성
  '좌보': ['자미 보좌성', '왼쪽에서 돕는 별로 우필과 짝을 이룹니다. 주변의 도움, 협력자, 인복을 뜻하는 좋은 별입니다.'],
  '우필': ['자미 보좌성', '오른쪽에서 돕는 별로 좌보와 짝을 이룹니다. 좌보처럼 도움과 인복을 뜻하며, 특히 뒤에서 조용히 돕는 사람을 뜻합니다.'],
  '문창': ['자미 보좌성', '글과 학문의 별로 문곡과 짝을 이룹니다. 공부, 시험, 문서, 글재주를 뜻하는 좋은 별입니다.'],
  '문곡': ['자미 보좌성', '재주와 말솜씨의 별로 문창과 짝을 이룹니다. 예술적 감각, 말재주, 손재주를 뜻하는 좋은 별입니다.'],
  '천괴': ['자미 보좌성', '낮의 귀인 별로 천월과 짝을 이룹니다. 윗사람이나 드러난 곳에서 도와주는 사람, 좋은 기회를 뜻합니다.'],
  '천월': ['자미 보좌성', '밤의 귀인 별로 천괴와 짝을 이룹니다. 보이지 않는 곳에서 도와주는 사람, 뜻밖의 도움을 뜻합니다.'],
  '녹존': ['자미 보좌성', '재물과 녹봉의 별입니다. 안정된 수입과 재물을 지키는 힘을 뜻합니다. 양옆에 경양과 타라가 늘 붙어 다녀서, 지키려는 만큼 경쟁도 따른다고 봅니다.'],
  '천마': ['자미 보좌성', '말을 타고 달리는 별입니다. 이동, 출장, 해외, 바쁘게 움직이며 기회를 잡는 것을 뜻합니다. 녹존이나 화록과 만나면 "움직여서 돈을 번다"고 봅니다.'],
  '홍란': ['자미 보좌성', '연애와 결혼의 기쁜 별로 천희와 짝을 이룹니다. 인연, 매력, 경사스러운 일을 뜻합니다.'],
  '천희': ['자미 보좌성', '기쁜 일의 별로 홍란과 짝을 이룹니다. 결혼·출산 같은 경사, 즐거운 소식을 뜻합니다.'],
  '경양': ['자미 보좌성', '날카로운 칼의 별로, 조심해야 할 여섯 살성 중 하나입니다. 경쟁, 다툼, 다침을 뜻하지만 강한 추진력이 되기도 합니다.'],
  '타라': ['자미 보좌성', '끌고 늦추는 별로, 조심해야 할 여섯 살성 중 하나입니다. 일이 지연되고 질질 끄는 것, 속으로 삭이는 고민을 뜻합니다. 대신 끈기와 인내가 됩니다.'],
  '화성': ['자미 보좌성', '불같이 급한 별로, 조심해야 할 여섯 살성 중 하나입니다. 갑작스러운 변화, 급한 성격, 충동을 뜻합니다. 탐랑과 만나면 뜻밖의 큰 행운이 되기도 합니다.'],
  '영성': ['자미 보좌성', '속에서 타는 불의 별로, 조심해야 할 여섯 살성 중 하나입니다. 속으로 끓는 불만, 은근한 스트레스를 뜻합니다.'],
  '지공': ['자미 보좌성', '"텅 빈" 별로, 조심해야 할 여섯 살성 중 하나입니다. 계획이 허공에 뜨거나 손재가 생기는 것을 뜻하지만, 기발한 발상과 정신적 깊이가 되기도 합니다.'],
  '지겁': ['자미 보좌성', '"빼앗기는" 별로, 조심해야 할 여섯 살성 중 하나입니다. 갑작스러운 손실과 좌절을 뜻하지만, 틀을 깨는 대담함이 되기도 합니다.'],

  // ── 밝기·운의 사화
  '별의 밝기': ['자미두수', '같은 별이라도 어느 칸(지지)에 있느냐에 따라 힘이 다릅니다. 가장 밝은 것부터 묘(廟, 아주 강함)·왕(旺, 강함)·득(得, 제자리를 얻음)·리(利, 조금 유리)·평(平, 보통)·불(不, 조금 약함)·함(陷, 약함, 빛이 가려짐) 순입니다. 밝은 별은 좋은 성질이 잘 드러나고, 어두운 별은 약점이 드러나기 쉽다고 봅니다. 밝기 표는 유파마다 몇 칸씩 다를 수 있습니다.'],
  '대한 사화': ['자미두수', '10년 대한 칸의 천간으로 새로 정해지는 사화입니다. 태어난 해의 사화(생년 사화)가 평생의 바탕이라면, 대한 사화는 그 10년 동안 어떤 영역에 기회(록)·힘(권)·인정(과)·막힘(기)이 생기는지를 보여줍니다. 명반에서는 "대"가 붙은 테두리 배지로 표시합니다.'],
  '유년 사화': ['자미두수', '그해 천간으로 정해지는 사화입니다. 예: 병(丙)년에는 천동 화록, 천기 화권, 문창 화과, 염정 화기가 됩니다. 그해에 어느 영역이 잘 풀리고 어디서 막히는지를 봅니다. 명반에서는 "년"이 붙은 점선 테두리 배지로 표시합니다.'],
  '잡성': ['자미두수', '14주성과 주요 보좌성 외에 명반에 들어가는 작은 별들입니다. 힘은 약하지만 연애·학업·질병·고독 같은 구체적인 분위기를 더해 줍니다. 해석할 때는 주성을 먼저 보고, 잡성은 양념처럼 참고합니다.'],

  // ── 잡성
  '천관': ['자미 잡성', '벼슬의 별입니다. 승진, 직위, 공적인 명예와 인연이 있다고 봅니다.'],
  '천복': ['자미 잡성', '복을 받는 별입니다. 먹고사는 복, 편안하게 누리는 복이 있다고 봅니다.'],
  '천주': ['자미 잡성', '부엌의 별입니다. 먹을 복, 요리 솜씨, 음식과 관련된 인연을 뜻합니다.'],
  '천재': ['자미 잡성', '재능의 별입니다. 타고난 재주와 총명함을 뜻합니다.'],
  '천수': ['자미 잡성', '장수의 별입니다. 건강하게 오래 사는 기운, 어른스러움을 뜻합니다.'],
  '용지': ['자미 잡성', '용이 사는 연못이라는 뜻으로 봉각과 짝을 이룹니다. 품위, 예술적 재능, 시험운을 뜻합니다.'],
  '봉각': ['자미 잡성', '봉황의 누각이라는 뜻으로 용지와 짝을 이룹니다. 멋과 명예, 좋은 평판을 뜻합니다.'],
  '천곡': ['자미 잡성', '우는 별로 천허와 짝을 이룹니다. 슬픔, 걱정, 눈물 흘릴 일을 뜻합니다.'],
  '천허': ['자미 잡성', '텅 빈 별로 천곡과 짝을 이룹니다. 허전함, 공허함, 실속 없음을 뜻합니다.'],
  '천덕': ['자미 잡성', '하늘의 덕이라는 뜻입니다. 나쁜 일을 누그러뜨리고 어려울 때 도움을 받게 해 준다고 봅니다.'],
  '월덕': ['자미 잡성', '달의 덕이라는 뜻입니다. 천덕처럼 흉함을 줄여 주고 성품을 온화하게 한다고 봅니다.'],
  '천공': ['자미 잡성', '하늘이 빈 별입니다. 계획이 뜻대로 안 되고 헛수고하기 쉽다고 보지만, 정신적인 깊이와 발상이 되기도 합니다.'],
  '고진': ['자미 잡성', '외로운 별로 과숙과 짝을 이룹니다. 혼자 있는 시간이 많고 독립적인 성향을 뜻합니다. 남성에게 더 강하게 작용한다고 봅니다.'],
  '과숙': ['자미 잡성', '홀로 지내는 별로 고진과 짝을 이룹니다. 외로움과 독립심을 뜻하며, 여성에게 더 강하게 작용한다고 봅니다.'],
  '비렴': ['자미 잡성', '날아다니는 벌레라는 뜻입니다. 구설수, 뒷말, 사소한 방해를 조심하라는 별입니다.'],
  '파쇄': ['자미 잡성', '깨지고 부서지는 별입니다. 일이 자잘하게 어그러지거나 물건이 망가지는 것을 뜻합니다.'],
  '화개': ['자미 잡성', '꽃을 덮는 덮개라는 뜻입니다. 학문·종교·예술에 대한 관심, 혼자 깊이 파고드는 성향을 뜻합니다.'],
  '함지': ['자미 잡성', '도화(桃花)의 별입니다. 매력, 이성 관계, 유흥을 뜻합니다. 지나치면 이성 문제를 조심하라고 봅니다.'],
  '연해': ['자미 잡성', '태어난 해 기준으로 어려움을 풀어 주는 별입니다. 막힌 일이 풀리고 걱정이 해소된다고 봅니다.'],
  '해신': ['자미 잡성', '태어난 달 기준으로 어려움을 풀어 주는 별입니다. 다툼이나 문제가 원만히 해결된다고 봅니다.'],
  '천형': ['자미 잡성', '형벌의 별입니다. 규율, 법, 수술, 엄격함을 뜻합니다. 법조·의료·군경 쪽에서는 오히려 힘이 됩니다.'],

    '임수': [

      '(함께 보면) 무토(둑)가 있으면 물이 모여 힘이 모이고, 갑목(식상)이 있으면 큰 강이 나무를 키워 재능이 열림. 토가 없으면 범람하기 쉬움.',
      '(성향) 스케일이 크고 자유로우며 지혜와 적응력이 뛰어남. 한곳에 정착하기 어렵고 생각이 많음.',
      '(건강) 신장·방광·귀·생식기·냉증에 주의.'
    ],
    '계수': [
      '(계절에 따라) 이슬·비·샘물이라 여름에 특히 귀하고, 겨울에는 병화(햇빛)로 얼지 않게 해야 함.',
      '(함께 보면) 신금이 있으면 샘이 마르지 않고, 을목을 키워 재능과 연결됨. 토가 강하면 물이 흡수돼 힘이 약해짐.',
      '(성향) 섬세하고 영리하며 직관이 뛰어남. 감정의 기복이 있고 속마음을 잘 안 보여 줌.',
      '(건강) 신장·방광·귀·호르몬·냉증에 주의.'
    ],
    // ── 강약
    '신강신약': [
      '(운에서 들어올 때) 신강은 식상·재성·관성 운에서 힘을 쓰기 좋고, 신약은 인성·비겁 운에서 힘을 얻음. 같은 해라도 강약에 따라 좋고 나쁨이 바뀜.',
      '(함께 보면) 개수만이 아니라 월령(월지)과 뿌리(지지의 힘)를 같이 봐야 정확함. 이 앱은 득령·득지·득세를 종합해 판정함.'
    ],
    '득령': [
      '(쉽게 읽기) 태어난 달(월지)에서 일간이 힘을 받는다는 뜻. 월지는 사주에서 가장 큰 영향력이라 강약 판단의 첫째 기준.',
      '(득령하면) 비겁·인성이 월지에 있어 기본 힘이 좋음. (실령하면) 월지가 식상·재성·관성이라 힘이 빠져 신약으로 기울기 쉬움.'
    ],
    '득지': [
      '(쉽게 읽기) 일지(배우자 자리)와 지지에서 일간이 뿌리를 얻는다는 뜻. 뿌리가 있으면 흔들려도 다시 일어서는 힘.',
      '(득지하면) 일지나 다른 지지에 같은 오행 또는 인성이 있음. 득령은 못 해도 득지로 버티는 사주도 있음.'
    ],
    '득세': [
      '(쉽게 읽기) 주변 글자들(천간·지지)에 같은 편이 많아 세력으로 힘을 얻는다는 뜻. 비겁·인성이 많으면 득세.',
      '(득세하면) 협력자가 많아 힘이 붙지만 고집이 세질 수 있음. (실세하면) 주변이 식상·재성·관성이라 힘이 분산됨.'
    ],
    '월령': [
      '(쉽게 읽기) 태어난 달의 기운. 계절의 힘이 일간을 돕는지 누르는지 가르는 열쇠.',
      '(운에서) 월령을 얻은 오행이 대운·세운에서 오면 그 힘이 크게 작동함. 월지가 겨울이면 따뜻함(화)이, 여름이면 시원함(수)이 필요한 이유.'
    ],
    '중화': [
      '(쉽게 읽기) 너무 강하지도 약하지도 않아 균형이 좋은 상태. 상황에 따라 유연하게 움직임.',
      '(운에서) 어느 운이 와도 비교적 큰 손상이 없고, 다만 균형이 한쪽으로 쏠릴 때(합·충 등) 변화가 도드라짐.'
    ],
    '극약': [
      '(쉽게 읽기) 일간의 힘이 아주 약해 도움(인성·비겁)이 절실한 상태. 혼자보다 사람·환경의 힘을 빌리는 편이 안전.',
      '(운에서) 인성·비겁 운이 오면 숨통이 트이고, 식상·재성·관성 운은 부담이 커지니 무리한 확장·보증을 피하기.'
    ],
    '태약': [
      '(쉽게 읽기) 신약보다 더 약해 한쪽 도움이 절실한 상태. 좋은 운을 기다리며 기초를 다지는 것이 우선.',
      '(운에서) 도움 되는 오행이 올 때 크게 호전. 건강·수면·인간관계 관리를 먼저.'
    ],
    '신약': [
      '(쉽게 읽기) 일간의 힘이 약해 도움(인성·비겁)이 필요한 상태. 혼자 밀어붙이기보다 협력하고 배우며 크는 형.',
      '(운에서) 인성·비겁 운에서 힘을 얻고, 재성·관성 운에서는 기회가 와도 감당이 어려울 수 있음. 체력과 자원을 먼저 확보.'
    ],
    '신강': [
      '(쉽게 읽기) 일간의 힘이 강해 스스로 일어서고 밀고 나가는 형. 자기 주관이 뚜렷함.',
      '(운에서) 식상·재성·관성 운에서 힘을 쓰기 좋고, 인성·비겁 운은 고집과 과욕이 커질 수 있음. 베풀고 표현하는 활동이 균형.'
    ],
    '태강': [
      '(쉽게 읽기) 신강보다 더 강해 힘이 넘치는 상태. 에너지를 밖으로 쓰는 통로(식상·재성)가 있어야 안정됨.',
      '(운에서) 설기(식상)·재성·관성 운에서 좋고, 인성·비겁 운에서 고집과 충돌이 커짐.'
    ],
    '극왕': [
      '(쉽게 읽기) 한 오행이 사주를 압도하는 상태. 흐름을 따라가는 전략(종격)으로 보기도 함.',
      '(운에서) 그 오행을 더 키우는 운이 오면 성공이 크지만, 거스르는 운은 위험이 큼. 극단적인 구조라 전문가 해석이 필요한 경우가 많음.'
    ],
    '오행 비율': [
      '(쉽게 읽기) 사주 여덟 글자 속 목·화·토·금·수의 비중. 많은 오행은 성향이 강하게, 적은 오행은 보완이 필요한 영역으로 나타남.',
      '(운에서) 부족한 오행이 운에서 오면 균형이 맞춰져 좋아지고, 이미 많은 오행이 더 오면 쏠림이 커짐. 용신과 함께 봐야 정확함.'
    ],
    // ── 구조
    '통근': [
      '(쉽게 읽기) 천간의 글자가 지지에 같은 오행의 뿌리를 두고 있다는 뜻. 뿌리가 있으면 힘이 실림.',
      '(좋은 점) 뿌리가 깊은 십성은 그 성향이 오래 안정적으로 발휘됨. (뿌리가 약하면) 말뿐이거나 겉만 화려할 수 있음.'
    ],
    '무근': [
      '(쉽게 읽기) 천간의 글자가 지지에 뿌리가 없는 상태. 겉으로는 보이지만 힘이 약함.',
      '(운에서) 운에서 뿌리가 생기면 갑자기 힘이 붙음. 뿌리가 약한 십성은 기대치를 낮추고 꾸준히 쌓는 게 안전.'
    ],
    '운의 근 보강': [
      '(쉽게 읽기) 원국에서 뿌리가 약한 글자가 대운·세운으로 뿌리를 얻는 일. 그 시기에 해당 십성의 기운이 눈에 띄게 살아남.',
      '(활용) 보강되는 시기에 맞춰 공부·사업·관계 계획을 세우면 성과가 좋다고 봄.'
    ],
    '근 안정성': [
      '(쉽게 읽기) 뿌리가 몇 개이고 얼마나 깊은지 본 안정도. 뿌리가 여러 곳이면 흔들려도 쉽게 무너지지 않음.',
      '(주의) 뿌리가 합·충으로 흔들리면 안정성이 떨어지므로 운에서 충이 오는 해에는 큰 결정을 신중히.'
    ],
    '관살혼잡': [
      '(함께 보면) 식신이 편관을 제어하거나, 합으로 한쪽을 묶거나, 인성이 중재하면 완화됨. 정관·편관이 모두 강하면 직장·이성 관계에서 방향이 갈림.',
      '(운에서) 관살이 한 번 더 오는 해에는 직장 변동·이성 문제·평판 이슈가 겹치기 쉬움. 하나로 정리하는 결정이 필요.',
      '(여성 사주) 배우자(관성)가 둘로 갈리는 느낌이 있어 인연 정리가 숙제가 되기도 하나, 요즘은 직장·역할이 많다는 뜻으로 읽는 경우가 많음.'
    ],
    '상관견관': [
      '(함께 보면) 인성이 중재하면(상관패인) 말솜씨가 지혜로 바뀌고, 재성이 사이에 들어오면 표현이 성과가 되어 완화됨.',
      '(운에서) 상관 운이나 정관 운이 한 번 더 오면 말실수·윗사람과의 마찰·평판 이슈가 커지기 쉬움. 중요한 자리일수록 말을 아끼기.'
    ],
    '식신제살': [
      '(함께 보면) 식신이 힘 있고 편관이 너무 세지 않아야 균형. 편인이 식신을 막으면 효과가 줄어듦.',
      '(운에서) 식신 운이 오면 위기를 재능으로 풀어낼 기회, 편인 운이 오면 효과가 막히니 준비와 기술을 먼저 갖추기.',
      '(직업) 군경·의료·법률·스포츠·현장 관리처럼 압박을 기술로 다스리는 일에서 크게 쓰임.'
    ],
    '효신탈식(도식)': [
      '(함께 보면) 재성이 편인을 눌러 주면 해소됨. 식신이 약한데 편인이 강하면 더 심하게 나타남.',
      '(운에서) 편인 운이 오면 불안·소화·수면 문제와 수입 지연이 도드라지기 쉬움. 규칙적인 생활과 건강 관리가 방어.',
      '(좋게 쓰면) 막힘이 깊이 있는 연구·특수 기술·창작으로 승화되기도 함.'
    ],
    '상관패인': [
      '(함께 보면) 상관이 강하고 인성이 받쳐 줄 때 성립. 재성이 인성을 깨뜨리면 효과가 약해짐.',
      '(운에서) 인성 운이 오면 학문·자격·연구가 열리고, 재성 운이 강하면 중도에 흔들릴 수 있음.',
      '(직업) 교수·연구원·작가·변호사·전문 강사처럼 날카로운 표현을 학문으로 다듬는 일.'
    ],
    '살인상생': [
      '(함께 보면) 편관과 인성이 함께 있고 인성이 편관의 기운을 일간에게 흘려보내는 구조. 재성이 인성을 깨뜨리면 효과가 약해짐.',
      '(운에서) 인성 운에서 압박이 후원으로 바뀌어 성장하는 시기. 재성 운에서는 인성이 손상될 수 있어 무리한 투자를 피하기.',
      '(직업) 군경·공직·대기업 관리직·전문직에서 위기를 기회로 바꾸는 사람.'
    ],
    '재다신약': [
      '(함께 보면) 비겁·인성이 힘을 보태면 해소됨. 식상이 재성을 키우기만 하면 더 부담이 커짐.',
      '(운에서) 비겁·인성 운에서 힘을 얻어 재물을 감당할 수 있게 되고, 재성 운이 더 오면 부담이 커져 건강·관계가 흔들리기 쉬움.'
    ],
    '관살과다': [
      '(함께 보면) 인성이 있으면 압박을 후원으로 풀고, 식신이 있으면 편관을 제어함. 비겁이 있으면 맞서는 힘이 생김.',
      '(운에서) 관성 운이 더 오면 직장·책임·건강에 부담이 커지니 일정과 체력을 여유 있게 운용.'
    ],
    '식상과다(설기)': [
      '(함께 보면) 인성이 있으면 식상을 눌러 안정시키고, 재성이 있으면 식상이 재물로 이어짐. 둘 다 없으면 에너지가 새기 쉬움.',
      '(운에서) 식상 운이 더 오면 말·활동·소비가 늘어 지치기 쉬우니 쉬는 시간을 일정에 넣기.'
    ],
    '군겁쟁재': [
      '(함께 보면) 식상이 있으면 재능으로 재물을 만들어 나눠도 남음. 관성이 비겁을 눌러 주면 완화됨.',
      '(운에서) 비겁 운이나 겁재 운이 오는 해에는 지인과의 돈 거래·보증·동업에서 손재가 커질 수 있음. 정산·약속을 글로 남기기.'
    ],
    '인성과다': [
      '(함께 보면) 재성이 인성을 적당히 눌러 주면 균형이 잡힘. 식상이 있으면 쌓은 지식을 밖으로 꺼내 쓸 수 있음.',
      '(운에서) 인성 운이 더 오면 생각만 많고 실행이 늦어지기 쉬움. 마감과 작은 행동 계획을 정하기.'
    ],
    '무비겁': [
      '(함께 보면) 인성이 있으면 힘이 보충되고, 비겁 운이 오면 도움이 되는 사람·동료가 나타남.',
      '(운에서) 비겁 운에서 협력자·형제·동료의 도움을 받고 자존감이 회복됨.'
    ],
    '무식상': [
      '(함께 보면) 인성이 강하면 생각이 깊고 말수가 적음. 재성·관성이 있으면 표현보다 현실과 책임이 앞섬.',
      '(운에서) 식상 운이 오면 표현·창작·도전이 열려 억눌렸던 재능이 드러나기 쉬움.'
    ],
    '무재': [
      '(함께 보면) 식상이 있으면 재능으로 돈이 따라올 길이 있고, 관성이 있으면 직장 안에서 안정을 얻음.',
      '(운에서) 재성 운이 오면 돈과 현실 감각이 갑자기 눈에 띄는 시기. 기회가 왔을 때 구조를 정해 두고 쓰기.'
    ],
    '무관': [
      '(함께 보면) 식상이 강하면 자유로운 직업, 비겁이 강하면 독립형. 인성이 있으면 학문·연구 쪽으로 풀림.',
      '(운에서) 관성 운이 오면 취업·승진·책임이 늘고 규칙 속에서 단련되는 시기.'
    ],
    '무인성': [
      '(함께 보면) 비겁이 있으면 독립적으로 버티고, 관성이 있으면 규율 속에서 배우며 큼.',
      '(운에서) 인성 운이 오면 공부·자격·후원자가 나타나 마음이 안정됨. 배울 기회를 놓치지 않기.'
    ],
    '오행 결핍': [
      '(운에서) 부족한 오행이 대운·세운으로 오면 균형이 맞춰져 해당 영역이 살아남. 예: 수 결핍인 사람이 수 운에서 감정·휴식·유연성이 회복됨.',
      '(함께 보면) 결핍 오행이 용신이면 가장 중요한 보완 과제, 기신이면 오히려 없어도 부담이 줄어듦. 결핍 = 무조건 나쁨이 아니라 "쏠림"으로 읽기.'
    ],
    // ── 용신
    '희신': [

    '과숙': [

    '천곡': [

    '천허': [

    '천공': [

    '비렴': [

    '파쇄': [

    '음살': [

    '박사': [

    '비렴(박사)': [

    '병부': [

    '대모': [

    '세건': [

    '공망': [

    '삼재': [

  function readForm() {

    i.combinationMode=g('f-combination').value; i.climatePalaceMode=g('f-climate-palace').value;
    i.timeMode = g('f-tm').value; i.jasi = g('f-js').value; i.sinsalBase = g('f-sb').value;

  function validate() {
    const i = S.inp;
    const n = (v, a, b, name) => { const x = String(v).trim() === '' ? NaN : Number(v); if (!Number.isInteger(x) || x < a || x > b) throw new Error(`${name}을(를) ${a}~${b} 사이로 입력하세요`); };
    n(i.year, M.MIN_Y, M.MAX_Y - 1, '년'); n(i.month, 1, 12, '월'); n(i.day, 1, 31, '일');
    if (!i.hourUnknown) { n(i.hour, 0, 23, '시'); n(i.minute, 0, 59, '분'); }
    const lon = Number(i.lon); if (!(lon >= 120 && lon <= 135)) throw new Error('경도는 120~135° 범위로 입력하세요 (한국 표준시 지역)');
  }

    return `<td class="glyph ${ECLS[e]}${me ? ' me' : ''}">${isStem ? `<button type="button" class="term gterm" data-term="${stemKey(v)}" aria-label="${stemKey(v)} 특징">${inner}</button>` : inner}</td>`;
  }

      <div class="four">${cols.map(k => { const p = ch.pillars[k]; return `<div class="p4${k === 'day' ? ' me' : ''}"><span class="pl">${M.POS_K[k]}주</span><span class="pg">${p ? `<span class="eltxt ${ECLS[M.stemEl(p.s)]}">${M.STEM[p.s]}</span><span class="eltxt ${ECLS[M.BR_EL[p.b]]}">${M.BR[p.b]}</span>` : '<span class="muted">—</span>'}</span><span class="pk">${p ? gzBtn(p, k, M.gzNameK(p)) : '시간 미상'}</span></div>`; }).join('')}</div>
      <div class="pills"><span class="hp">${term('일간')} ${term(stemKey(d), M.STEM_K[d] + M.EL_K[e])}</span><span class="hp">${term('신강신약', '강약')} ${ch.strength.zone} ${ch.strength.help.toFixed(0)}%</span><span class="hp">${term('용신')} ${elLabel(yongEl)} · ${M.SCHOOLS[y.school].split(' ')[0]}</span><span class="hp">${term('대운수')} ${ch.daeun.num} · ${ch.daeun.forward ? '순행' : '역행'}</span></div>
    </section>`;
  }
  function adjustmentNotice(ch) { const a=ch.weights.adjustments,n=a.combinations.filter(r=>r.applied).length;return (a.options.combinationMode==='off'?'합에 따른 오행 변화는 끄고, ':n?'조건을 충족한 합 '+n+'건을 오행 비중에 일부 반영하고, ':'합은 확인했지만 반영 조건을 충족하지 않아 원래 오행을 유지하고, ')+(a.options.climatePalaceMode==='auto'?'태어난 계절과 글자의 자리에 따른 보정을 적용했어요.':'조후·궁성 보정은 껐어요.'); }
  // 어려운 용어 없이 먼저 보여 주는 요약: 일간(나) · 힘의 세기 · 나에게 필요한 기운
  const STEM_SIMPLE = [

  function renderEasy() {
    const ch = S.ch, d = ch.pillars.day.s, e = M.stemEl(d), y = ch.yong, st = ch.strength;

      ${pat.list.length ? `<div class="list">${pat.list.map(p => `<div class="li"><span class="k">${term(patTerm(p.name), p.name)}</span><span class="v small">${esc(p.basis)}</span><span class="pill lv-${p.level}">${p.level}</span></div>`).join('')}</div>` : '<p class="muted small">특기할 구조가 없습니다.</p>'}
      <p class="note">강: 천간에 드러나거나 비율이 뚜렷함 · 약: 지지 정기까지 포함해야 성립 · 참고: 판단 보조. 구조가 성립해도 합·제어 관계에 따라 작용이 줄어들 수 있으며, 이 앱은 그 해소 여부를 판정하지 않습니다.</p>
      ${pat.tuchul.length ? `<div><h3 style="margin-bottom:6px">${term('투출')}</h3><div>${pat.tuchul.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>` : ''}

      <div class="list">
        <div class="li"><span class="k">${term('공망')} · 일주</span><span class="v"><b>${gmD.map(b => M.BR[b] + M.BR_K[b]).join(' ')}</b> <span class="small muted">${hitD.length ? hitD.join('·') + '가 공망' : '원국 지지 중 해당 없음'}</span></span><span></span></div>
        <div class="li"><span class="k">${term('공망')} · 년주</span><span class="v"><b>${gmY.map(b => M.BR[b] + M.BR_K[b]).join(' ')}</b> <span class="small muted">${hitY.length ? hitY.join('·') + '가 공망' : '원국 지지 중 해당 없음'}</span></span><span></span></div>
      </div>
      <p class="note">${term('12신살')}은 ${ch.sinsalBase === 'day' ? '일지' : '년지'} 기준입니다. 기준은 입력의 계산 기준 설정에서 바꿀 수 있습니다.</p>

    ${upcomingSinsal(ch)}`;
  }

  // ───────────── 신살 한눈에 보기 · 다가오는 신살 ─────────────
  // [핵심어, 한 줄 설명] — 요약 카드와 타임라인 힌트에 쓴다. 자세한 설명은 용어 사전(term)에 있다.
  const SINSAL_BRIEF = {

    '금여록': ['배우자·품위', '좋은 배우자와 품위 있는 생활을 뜻하는 길성'],
    '암록': ['숨은 도움', '뜻밖의 도움과 드러나지 않는 재물'],

    '백호대살': ['사고 주의·강단', '다침·사고는 조심하되 강한 기질과 추진력으로 쓰는 살'],
    '괴강살': ['강한 리더십', '리더십과 결단력이 강하나 극단으로 흐르기 쉬움'],
    '고신살': ['혼자 있는 시간', '가족과 떨어지거나 혼자 지내는 경향'],
    '과숙살': ['배우자와 거리', '배우자와 떨어져 지내기 쉬운 경향'],

    '현침살': ['날카로움', '말과 시선이 날카롭고 예민, 정밀한 일에는 장점'],
    '학당귀인': ['학문', '배움을 즐기고 공부·연구에 인연'],
    '태극귀인': ['위기 극복·정신세계', '위기에서 도움을 받고 철학·종교에 관심'],
    '낙정관살': ['함정·사고', '물가·높은 곳 사고나 갑작스러운 함정 주의'],
    '천라지망': ['답답함·묶임', '일이 막히고 묶이는 느낌, 법적 문제 주의'],
    '음양차착살': ['인연의 엇갈림', '연애·결혼에서 엇갈림 주의(참고용)'],
    '고란살': ['독립심·혼자', '배우자 인연이 늦거나 혼자 있는 시간(참고용)'],
    '십악대패일': ['재물 관리', '돈이 새기 쉬우니 꼼꼼한 관리(참고용)'],
    '복성귀인': ['평탄한 복', '먹고사는 걱정이 덜한 복'],
    '상문살': ['슬픈 소식', '상실·우울 주의, 남의 아픔을 헤아리는 마음'],
    '조객살': ['경조사·이별', '경조사·이별·구설 주의'],

    '금신살': ['날카로운 추진력', '칼날 같은 결단력과 추진력, 다툼은 주의'],
    '천관귀인': ['직위·명예', '승진·직위와 공적 명예에 인연'],
    '천복귀인': ['복록', '먹고사는 복과 편안히 누리는 복'],
    '천주귀인': ['의식주 넉넉함', '의식주가 넉넉하고 음식과 인연'],
    '급각살': ['급한 사고', '다리·급한 사고 주의(참고용)'],
    '탕화살': ['화상·급변', '불·뜨거운 것·급한 일 주의(참고용)'],
    '천문성': ['직관·영성', '직관력과 영적·학문적 감각'],
    '복음': ['반복·정체', '같은 기운이 겹쳐 일이 반복되거나 정체'],
    '반음': ['급변', '정반대로 부딪쳐 일어나는 급격한 변화'],
    '겁살': ['손재 주의', '갑자기 잃는 일은 조심, 과감한 결단력'],
    '재살': ['구속 주의', '갇히거나 묶이는 일은 조심'],
    '천살': ['뜻밖의 일', '사람 힘으로 어쩔 수 없는 일 조심'],
    '지살': ['새 출발', '이사·이직·새로운 시작'],
    '연살': ['인기·이성(도화)', '사람을 끄는 매력과 이성 관계'],
    '월살': ['더딤', '일이 막히고 더디게 풀림'],
    '망신살': ['구설·표현', '체면·구설은 조심, 자신을 드러내는 힘'],
    '장성살': ['리더십', '조직을 이끄는 리더십과 권위'],
    '반안살': ['승진·안정', '승진·출세와 안정된 지위'],
    '역마살': ['이동·변화', '이동·해외·출장·여행'],
    '육해살': ['잔병·지연', '잔병치레와 지연은 주의, 돌봄과 헌신'],
    '화개살': ['학문·예술·고독', '학문·종교·예술에 깊이 빠지는 기운'],
  };
  const SS_AREA = { year: '조상·어린 시절', month: '부모·직장', day: '배우자·나', hour: '자녀·말년' };
  const SS_NOTABLE12 = ['연살', '역마살', '화개살', '장성살', '반안살', '망신살', '겁살', '재살', '지살'];
  function gongmangFxHTML(ch) {
    const fx = ch.gongmangFx || [];
    if (!fx.length) return '<div class="li"><span class="k">' + term('해공') + '</span><span class="v small muted">원국 지지 중 공망에 든 글자가 없습니다.</span><span></span></div>';
    return fx.map(f => `<div class="li"><span class="k">${term('해공')} · ${f.label}</span><span class="v"><b>${M.POS_K[f.pos]}지 ${M.BR[f.b]}${M.BR_K[f.b]}</b><span class="small muted">${f.released.length ? `${f.released.map(r => esc(r.name)).join(', ')}로 풀립니다 — 비어 있던 자리가 일부 채워진다고 봅니다` : '충·합이 없어 공망이 그대로 작용합니다 — 그 자리의 일이 약하거나 늦게 나타난다고 봅니다'}</span></span><span></span></div>`).join('');
  }
  function sinsalSummary(ch) {
    const cols = ['year', 'month', 'day', 'hour'].filter(k => ch.pillars[k]);
    const map = new Map();
    for (const k of cols) for (const x of ch.sinsal[k]) { if (!map.has(x.name)) map.set(x.name, { good: x.good, pos: [] }); map.get(x.name).pos.push(k); }
    const rows = [...map].map(([name, v]) => ({ name, good: v.good, pos: v.pos }));
    const good = rows.filter(r => r.good), bad = rows.filter(r => !r.good);
    const li = r => { const b = SINSAL_BRIEF[r.name] || ['', '']; return `<div class="li"><span class="k">${term(r.name)}</span><span class="v"><b>${esc(b[0])}</b><span class="small muted">${r.pos.map(k => `${M.POS_K[k]}주(${SS_AREA[k]})`).join(' · ')} — ${esc(b[1])}</span></span><span></span></div>`; };
    const s12 = cols.map(k => { const n = ch.cells[k].sinsal12, b = SINSAL_BRIEF[n]; return `<span class="chip${SS_NOTABLE12.includes(n) ? ' hl' : ''}">${M.POS_K[k]} ${term(n)}${b ? ` <span style="opacity:.7">${esc(b[0])}</span>` : ''}</span>`; }).join('');
    const lead = good.length >= bad.length ? '길성이 주의 신호보다 같거나 많이 잡힙니다.' : '주의 신호가 더 많이 잡히지만, 대부분의 살은 좋은 면과 조심할 면을 함께 가집니다.';
    return `<section class="card">
      <div class="card-h"><h2>내 사주 신살 한눈에 보기</h2><span class="note">길성 ${good.length}개 · 주의 ${bad.length}개 · ${lead}</span></div>
      ${good.length ? `<h3 style="margin:4px 0">길성</h3><div class="list">${good.map(li).join('')}</div>` : ''}
      ${bad.length ? `<h3 style="margin:10px 0 4px">주의 신호</h3><div class="list">${bad.map(li).join('')}</div>` : ''}
      <h3 style="margin:10px 0 4px">${term('12신살')} (${ch.sinsalBase === 'day' ? '일지' : '년지'} 기준)</h3>
      <div>${s12}</div>
      <h3 style="margin:10px 0 4px">${term('공망')}과 ${term('해공')}</h3>
      <div class="list">${gongmangFxHTML(ch)}</div>
      <p class="note">신살은 오행 균형보다 비중이 낮은 보조 지표이며 점수 계산에는 아주 제한적으로만 쓰입니다. 같은 살도 어느 기둥에 있는지에 따라 의미가 달라서, 기둥 이름 옆 괄호가 그 영역을 뜻합니다.</p>
    </section>`;
  }
  // 올해 월별·앞으로 5년 동안 들어오는 신살
  function upcomingSinsal(ch) {
    const nowY = M.yearPillarAt(NOW).sajuYear;
    const hint = names => { const k = names.map(n => SINSAL_BRIEF[n] && SINSAL_BRIEF[n][0]).filter(Boolean); return k.slice(0, 3).join(' · '); };
    const chipsOf = x => {
      const sin = M.luckRelations(ch, x).sinsal;
      const names = [x.sinsal12, ...sin.map(q => q.name)];
      const chips = [`<span class="chip${SS_NOTABLE12.includes(x.sinsal12) ? ' hl' : ''}">${term(x.sinsal12)}</span>`, ...sin.map(q => `<span class="chip ${q.good ? 'good' : 'bad'}">${term(q.name)}</span>`)];
      return { chips: chips.join(''), hint: hint(names) };
    };
    let yrs = '', mos = '', head = '';
    try {
      const ys = M.seunRange(ch, nowY, nowY + 5);
      yrs = ys.map(x => { const c = chipsOf(x), sj = samjaeTag(samjaeOf(x.year)); return `<tr class="${x.year === nowY ? 'cur' : ''}"><td class="num">${x.year}년<div class="small muted">${x.age}세</div></td><td class="gz">${M.gzName(x)}</td><td>${c.chips}${sj}</td><td class="small">${esc(c.hint)}</td></tr>`; }).join('');
      const ms = M.wolun(ch, nowY);
      mos = ms.map((x, i) => { const c = chipsOf(x), end = i < 11 ? ms[i + 1].startMs : x.startMs + 30 * 86400000, on = NOW >= x.startMs && NOW < end; return `<tr class="${on ? 'cur' : ''}"><td class="num">${kstYMD(x.startMs)[1]}월${on ? ' <span class="muted small">· 지금</span>' : ''}</td><td class="gz">${M.gzName(x)}</td><td>${c.chips}</td><td class="small">${esc(c.hint)}</td></tr>`; }).join('');
      const cur = ys.find(x => x.year === nowY);
      if (cur) { const c = chipsOf(cur); head = `<p class="small">올해(${nowY}년 ${M.gzName(cur)})에 들어오는 신살: ${c.chips}${c.hint ? ` — <b>${esc(c.hint)}</b>의 기운이 두드러지는 해입니다.` : ''}</p>`; }
    } catch (e) { return ''; }
    return `<section class="card">
      <div class="card-h"><h2>다가오는 신살</h2><span class="note">운으로 들어오는 글자가 내 사주와 만나 붙는 신살 · 점수에는 반영하지 않는 참고 정보</span></div>
      ${head}
      <h3 style="margin:8px 0 4px">앞으로 5년 (세운)</h3>
      <div class="tbl-wrap"><table class="dt"><thead><tr><th>해</th><th>간지</th><th>신살</th><th>핵심</th></tr></thead><tbody>${yrs}</tbody></table></div>
      <h3 style="margin:12px 0 4px">${nowY}년 월별 (월운)</h3>
      <div class="tbl-wrap"><table class="dt"><thead><tr><th>달</th><th>간지</th><th>신살</th><th>핵심</th></tr></thead><tbody>${mos}</tbody></table></div>
      <p class="note">월은 절기 기준이라 양력 달과 며칠 어긋납니다. 12신살은 ${ch.sinsalBase === 'day' ? '일지' : '년지'} 기준, 복음·반음은 운의 간지가 원국 기둥과 같거나 정반대일 때 붙습니다.</p>
    </section>`;
  }

  // ───────────── 택일 ─────────────
  const tkState = () => (S.tk = S.tk || { purpose: 'move', days: 60, start: null });
  const TK_WD = ['일', '월', '화', '수', '목', '금', '토'];
  function renderTk() {
    const ch = S.ch, T = tkState(), PU = M.TAEK_PURPOSE;
    const sd = T.start ? T.start.split('-').map(Number) : TODAY;
    let list;
    try { list = M.pickDays(ch, T.purpose, sd[0], sd[1], sd[2], T.days); } catch (e) { return `<section class="card"><p class="err">날짜 범위를 계산할 수 없습니다: ${esc(e.message)}</p></section>`; }
    const fmt = r => `${r.m}.${r.d}(${TK_WD[r.dow]})`;
    const TK_POS = { '년지': '집안 자리(년지)', '월지': '직장·부모 자리(월지)', '일지': '배우자 자리(일지)', '시지': '자녀·말년 자리(시지)' };
    const TK_JIAN = { '건': '새 출발에 무난한 날', '제': '털어내고 정리하기 좋은 날', '만': '가득 차서 넘치기 쉬운 날', '평': '무난하고 평탄한 날', '정': '일을 확정 짓기 좋은 날', '집': '붙잡고 지키기 좋은 날', '파': '깨지기 쉬운 날', '위': '위태로워 조심할 날', '성': '일을 이루기 좋은 날', '수': '거두고 마무리하기 좋은 날', '개': '새로 열기 좋은 날', '폐': '닫히고 막히기 쉬운 날' };
    const tkPlain = t => {
      let m;
      if ((m = t.match(/^내 (년|월|일|시)지와 (.+)$/))) {
        const nm = m[2], kind = nm.includes('충') ? '충 — 정면으로 부딪쳐요' : nm.endsWith('형') ? '형 — 서로 눌러 불편해요' : nm.includes('원진') ? '원진 — 이유 없이 거슬려요' : nm.endsWith('해') ? '해 — 서운함이 쌓여요' : nm.endsWith('파') ? '파 — 계획이 어긋나요' : '합 — 서로 잘 맞아요';
        return `${TK_POS[m[1] + '지']}: ${kind}`;
      }
      if ((m = t.match(/^(.)일\(12건제\)$/))) return `${m[1]}일(12건제) — ${TK_JIAN[m[1]] || ''}`;

    const rs = (r, n) => r.reasons.slice(0, n).map(q => `${q.pts > 0 ? '+' : '−'}${Math.abs(q.pts)} ${esc(tkPlain(q.text))}`).join(' · ') || '특별한 요인 없음';

  function xpCardStage() {

    const bars = ch.weights.pct.map((v, i) => `<div class="xc-bar ${ECLS[i]}"><span>${M.EL_K[i]}</span><div><i style="width:${Math.max(3, Math.round(v))}%"></i></div><em>${Math.round(v)}%</em></div>`).join('');

  // ───────────── 오행·강약 ─────────────

  function natalFlowBox(ch) {

    // 쉬운 말이 먼저(해요체·생활 장면), 명리 용어 문장은 '명리 용어로 보기'에 접어 둔다
    const pats = f.chips.filter(c => c.plain);

    let now = '';

    const terms = `<details class="lg-fold" style="margin-top:10px"><summary>명리 용어로 보기</summary><p class="small" style="margin:4px 0"><b>${esc(f.verdict)}</b></p><ul class="ib-ul small">${f.items.map(i => `<li>${esc(i.text)}</li>`).join('')}</ul>${f.chips.length ? `<p class="small muted" style="margin:6px 0 0">원국 구조: ${f.chips.map(c => esc(c.name) + (c.basis ? ` (${esc(c.basis)})` : '')).join(' · ')}</p>` : ''}</details>`;
    return `<div class="ib" style="margin:0 0 10px"><div class="ib-k">내 사주의 기운 흐름</div><p style="margin:2px 0 6px;font-size:1.05rem"><b class="${tc(f.tone)}">${esc(f.headline || f.verdict)}</b></p>
      <ul class="ib-ul" style="line-height:1.65">${f.items.map(i => `<li>${esc(i.plain || i.text)}</li>`).join('')}</ul>${patList}${now}${terms}</div>`;

  // 오행 오각형: 바깥 실선 = 생(도와줌), 안쪽 점선 별 = 극(누름). 원 크기 = 비율
  function ohaengPentagon(ch) {
    const pct = ch.weights.pct, dEl = M.stemEl(ch.pillars.day.s);
    const W = 440, H = 356, cx = 220, cy = 180, R = 112;
    const pt = i => { const a = (-90 + i * 72) * Math.PI / 180; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; };
    const rad = i => 22 + Math.min(20, pct[i] * 0.4);
    const line = (i, j, cls) => {
      const [x1, y1] = pt(i), [x2, y2] = pt(j), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
      const a = rad(i) + 4, b = rad(j) + 9;
      return `<line class="${cls}" x1="${(x1 + ux * a).toFixed(1)}" y1="${(y1 + uy * a).toFixed(1)}" x2="${(x2 - ux * b).toFixed(1)}" y2="${(y2 - uy * b).toFixed(1)}" marker-end="url(#ah-${cls})"/>`;
    };
    let s = `<svg class="penta" viewBox="0 0 ${W} ${H}" role="img" aria-label="오행 생극 관계도">
      <defs>${['saeng', 'geuk'].map(c => `<marker id="ah-${c}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-${c}"/></marker>`).join('')}</defs>`;
    for (let i = 0; i < 5; i++) s += line(i, (i + 1) % 5, 'saeng');
    for (let i = 0; i < 5; i++) s += line(i, (i + 2) % 5, 'geuk');
    for (let i = 0; i < 5; i++) {
      const [x, y] = pt(i), r = rad(i), g = (i - dEl + 5) % 5;
      const [lx, ly] = [x, y + r + (i === dEl ? 20 : 15)];
      s += `<g class="${ECLS[i]}">
        ${i === dEl ? `<circle cx="${x}" cy="${y}" r="${r + 5}" class="me-ring"/>` : ''}
        <circle cx="${x}" cy="${y}" r="${r}" class="node"/>
        <text x="${x}" y="${y + 1}" text-anchor="middle" class="nh">${M.EL[i]}</text>
        <text x="${x}" y="${y + 17}" text-anchor="middle" class="np">${pct[i].toFixed(0)}%</text>
        <text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" class="nl">${i === dEl ? '나 · ' : ''}${M.EL_K[i]} · ${M.TG_GROUP[g]}</text>

      ${natalFlowBox(ch)}<div class="list">${rel(0, '나와 같은 편')}${rel(4, '나를 돕는 것')}${rel(1, '내가 돕는 것')}${rel(2, '내가 누르는 것')}${rel(3, '나를 누르는 것')}
      <p class="note" style="padding-top:8px">생: 목→화→토→금→수→목 (나무는 불을 피우고, 불은 재를 남겨 흙이 되고, 흙 속에서 쇠가 나고, 쇠에 물이 맺히고, 물은 나무를 키웁니다). 극: 목→토→수→화→금→목 (나무는 흙을 뚫고, 흙은 물을 막고, 물은 불을 끄고, 불은 쇠를 녹이고, 쇠는 나무를 벱니다).</p></div></div>`;

  // 한난조습 지도: 가로 = 건조↔습함, 세로 = 차가움↔더움. 가운데 점선 상자가 균형 구역
  function climateMap(c) {
    const S0 = 20, W = 260, px = h => S0 + (h + 2) / 4 * W, py = t => S0 + (2 - t) / 4 * W, cl = v => Math.max(-2, Math.min(2, v));

      <circle cx="${px(cl(c.hum))}" cy="${py(cl(c.temp))}" r="9" class="cq-me"/><text x="${px(cl(c.hum))}" y="${py(cl(c.temp)) - 14}" class="cq-mt" text-anchor="middle">내 사주</text>

  function climateWords(c) {

          <dt>일간 관계 (±${cfg.stemRelation})</dt><dd>생극·음양·천간합·천간충. 천간합이 있어도 자동으로 최고점이 되지 않습니다.</dd>
          <dt>일지 관계 (±${cfg.branchRelation})</dt><dd>육합·삼합(반합)은 결속, 충·형·원진·해·파는 변화·마찰 신호로 따로 셉니다. 충이 이미 과한 기운을 깨는 경우에는 마찰을 덜어 줍니다.</dd>
          <dt>원국 합충 (±${cfg.natalRelations})</dt><dd>내 년·월·시와 만드는 관계입니다. 일간·일지 관계보다 가볍게(월 ${cfg.posW.month}·시 ${cfg.posW.hour}·년 ${cfg.posW.year}배) 반영합니다.</dd>
          <dt>과잉 위험 (−${cfg.excessPenalty})</dt><dd>이미 많은 오행을 더 키우는 위험입니다.</dd></dl></details>
        <details><summary><b>끌림은 어떻게 계산하나</b><span class="small muted" style="display:block">배우자성·합·매력 신호를 두 방향으로 계산합니다</span></summary>
          <dl><dt>내가 끌리는 일주 (나 → 상대)</dt><dd>배우자성 십성(${cfg.attract.toThem.spouse}), 일간 천간합(${cfg.attract.toThem.stemHap}), 지지 합(${cfg.attract.toThem.branchBond}), 홍염·도화·천을귀인(${cfg.attract.toThem.charm}), 내게 필요한 기운(${cfg.attract.toThem.need}), 원진·충 같은 강한 자극(${cfg.attract.toThem.charge}), 음양 조화(${cfg.attract.toThem.yinyang}) 순으로 반영합니다.</dd>
          <dt>나를 좋아하는 일주 (상대 → 나)</dt><dd>상대 일간을 기준으로 내 일간·일지가 상대의 배우자성인지, 내 일지가 상대의 매력 신살 자리인지를 봅니다. 상대의 전체 사주를 모르므로 "상대 일간이 나를 어떻게 보는가"로 단순화한 것입니다.</dd>
          <dt>서로 끌리는 일주</dt><dd>두 방향 점수의 기하평균입니다. 한쪽만 높으면 낮게 나옵니다.</dd>

        <details><summary><b>유형과 조건</b><span class="small muted" style="display:block">점수와 관계의 성격을 따로 판정합니다</span></summary>
          <dl>${CP_TYPES.map(t => `<dt>${t}</dt><dd>${CP_TYPE_INFO[t]}</dd>`).join('')}
          <dt>조화 높음 · 조화 · 혼합 · 주의 요소 있음</dt><dd>점수와 위험도로 정하는 종합 조건입니다. 마찰이 큰 조합은 점수가 높아도 "주의 요소 있음"으로 표시합니다.</dd></dl></details>
        <details><summary><b>한계</b></summary><dl><dd>${cpDisclaimer} 점수는 좋고 나쁨의 판정이 아니라 내 원국을 기준으로 한 상대 지표이며, 억부·조후의 단순화 모델에 기대고 있습니다.</dd></dl></details>
      </div>
    </section>`;
  }

  // 누르면 열리는 상세 시트
  function cpSheetHTML(ch, sel) {
    const bar = (label, v, w) => `<div class="cp-part"><span>${label}</span><span class="cp-mk ${v > 0.05 ? 'good' : v < -0.05 ? 'bad' : ''}">${cpMark(v)}</span></div>`;
    if (sel.k === 'el') {
      const r = M.evaluateCompatibleElement(ch, sel.i), st = ch.strength;
      const rows = [['억부 보완', r.pts.eokbu], ['조후 보완', r.pts.johu], ['오행 균형', r.pts.balance], ['십성 관계', r.pts.tenGod], ['과잉 위험', r.pts.excess]];
      return `<span class="cat">궁합 오행</span><h3>${M.EL[sel.i]} ${M.EL_K[sel.i]} · 보완도 ${r.score}</h3>
        <div class="cp-pills"><span class="pill ${r.score >= 62 ? 'good' : r.score < 38 ? 'bad' : ''}">${r.label}</span><span class="pill">${r.tenGodGroup} 기운</span></div>
        <div class="list">${rows.map(([l, v]) => `<div class="cp-line"><span>${l}</span><b class="${v > 0.4 ? 'pos' : v < -0.4 ? 'neg' : ''}">${cpPts(v)}</b></div>`).join('')}</div>
        <p class="cp-sum">${esc(r.reasons.join('. ') + '.')}</p>
        <p class="small muted">${st.zone} 사주(돕는 힘 ${st.help.toFixed(0)}%)를 기준으로 계산했습니다. 절대적으로 "${M.EL_K[sel.i]} 기운의 사람이 최고의 배우자"라는 뜻이 아니라, 지금 원국에서 ${M.EL_K[sel.i]} 기운이 들어올 때 나타나는 상대적 효과입니다.</p>
        <button class="btn x" data-act="close">닫기</button>`;
    }
    const x = M.compatAttraction(ch, S.cpPartner || 'opposite').find(q => q.i === sel.i), at = x.attract;
    return `<span class="cat">궁합 일주 · 내 일주 ${x.myDay}</span><h3>${x.ganzhi} (${x.ganzhiK}) · 궁합 분석</h3>
      <div class="cp-pills"><span class="pill">종합 보완도 <b>${x.score}</b></span><span class="pill">${x.type}</span><span class="pill ${cpTone(x.condition)}">${x.condition}</span></div>
      <p class="small muted">${CP_TYPE_INFO[x.type]}</p>
      <h4>${x.ganzhi} 일주의 특징</h4>
      <div class="facts">${gzFacts(x.ganzhiK)}</div>
      <p class="small" style="color:var(--ink-2)">${esc(glInline(x.ganzhiK))}</p>
      <h4>끌림 <span class="muted small">${(S.cpPartner || 'opposite') === 'any' ? '성별 무관 기준' : '이성 기준'}</span></h4>
      <div class="cp-att-box">${[['내가 끌림', at.toThem], ['나를 좋아함', at.toMe]].map(([l, r]) => `<div><div class="cp-att-r"><b>${l}</b><span class="pill ${r.score >= 60 ? 'good' : ''}">${r.score}</span></div><ul class="pos-ul small">${r.reasons.slice(0, 3).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}
        <div class="cp-att-r"><b>서로 끌림</b><span class="pill ${at.mutual >= 60 ? 'good' : ''}">${at.mutual}</span></div></div>
      <h4>내 원국과의 궁합</h4>
      <div class="cp-parts">${x.parts.map(p => `<div class="cp-part"><span>${p.label}</span><span class="cp-mk ${p.v > 0.05 ? 'good' : p.v < -0.05 ? 'bad' : ''}">${p.key === 'excess' ? (x.excessRisk >= 0.5 ? '높음' : x.excessRisk >= 0.25 ? '보통' : '낮음') : cpMark(p.v)}</span><em class="num">${cpPts(p.pts)}</em></div>`).join('')}</div>
      <h4>핵심 이유</h4><ul class="pos-ul small">${x.reasons.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <p class="small">상대 일간은 나에게 <b>${x.stemTG}</b>, 일지 정기는 <b>${x.branchTG}</b> 십성으로 작용합니다.</p>
      ${x.cautions.length ? `<h4>주의</h4><ul class="pos-ul small">${x.cautions.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      <p class="cp-disc">${cpDisclaimer}</p>
      <button class="btn x" data-act="close">닫기</button>`;
  }

  // ───────────── 직업 · 활동 적성 고도화: 나의 돈 버는 방식 · 업무 환경 · 직업 · 약점 (wealth-career.js) ─────────────
  // 계산·문구 조합은 MantraWealthCareer(원국만 읽음, AI 호출 없음). 이 절은 표시만 맡는다. 기능 스위치 MANTRA_FLAGS.wealth (기본 꺼짐).
