<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>만트라 만세력</title>
<meta name="description" content="천문 계산 기반 만세력 · 원국, 합충, 신살, 오행, 용신, 대운·세운·월운·일진">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@700;800;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* 레이아웃: 밝은 단일 테마 앱 셸 — 반투명 상단바, 알약형 탭, 그림자 카드. 오방색은 파스텔 타일로 */
:root {
  --bg: #F5F6FA; --surface: #FFFFFF; --surface-2: #F0F2F7; --ink: #12151F; --ink-2: #474E5E; --ink-3: #8089A0;
  --line: #E7EAF1; --accent: #2F5BFF; --accent-2: #7B61FF; --accent-soft: #ECF0FF; --seal: #FF5B4A;
  --wood: #1F8A5B; --fire: #D8412F; --earth: #D9A520; --metal: #7A68B8; --water: #2A48A0;
  --wood-ink: #17744B; --fire-ink: #C9331F; --earth-ink: #946B00; --metal-ink: #5F4E9E; --water-ink: #2A48A0;
  --d-atk: #1E9E57; --d-ext: #0E9AA7; --d-hrv: #8A5CF6; --d-acc: #2F6BFF; --d-chg: #E08A00; --d-def: #E5533D;
  --good: #1E9E57; --bad: #F0563F; --mid: #BAC1CE; --good-soft: #E3F5EA; --bad-soft: #FFEAE6;
  --shadow: 0 1px 2px rgba(18, 21, 31, .04), 0 10px 30px -12px rgba(30, 40, 90, .12);
  --f-display: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --f-head: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 18px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); background-image: radial-gradient(1200px 420px at 85% -120px, #E6ECFF 0%, transparent 70%), radial-gradient(900px 380px at -10% -80px, #FFF0EA 0%, transparent 65%); background-repeat: no-repeat; color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; padding: 0 16px 56px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h2 { font-size: 1.12rem; font-weight: 800; }
h3 { font-size: 0.98rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 0.82rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* 내보내기(PDF·이미지) */
.xp button { font-size: 0.8rem; }
.xp button[disabled] { opacity: .6; cursor: wait; }
.xs { position: absolute; left: -10000px; top: 0; width: 714px; background: #fff; color: var(--ink); padding: 0; display: grid; gap: 12px; font-size: 15px; }
.xs .card { box-shadow: none; }
.xs .du-strip { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); overflow: visible; }
.xs-head { display: grid; gap: 2px; padding: 4px 2px 8px; border-bottom: 2px solid var(--ink); }
.xs-head b { font-family: var(--f-head); font-size: 1.25rem; }
.xs-head span { font-size: 0.82rem; color: var(--ink-2); }

/* 상단 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 78%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); padding-block: 12px 10px; margin: 0 -16px; padding-inline: 16px; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.top-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.seal { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, var(--seal), #FF8A4C); color: #fff; font-family: var(--f-display); font-weight: 900; font-size: 13px; line-height: 1.05; display: grid; place-items: center; text-align: center; box-shadow: 0 6px 14px -6px rgba(255, 91, 74, .6); }
.brand h1 { font-size: 1.12rem; font-weight: 900; letter-spacing: -0.03em; }
.who { flex: 1 1 240px; min-width: 0; font-size: 0.84rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-size: 0.86rem; font-weight: 700; box-shadow: 0 1px 2px rgba(18, 21, 31, .05); transition: transform .12s, box-shadow .12s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; box-shadow: 0 8px 18px -8px rgba(47, 91, 255, .7); }
.btn.primary:hover { color: #fff; transform: translateY(-1px); }
.tabs { max-width: 980px; margin: 10px auto 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; background: none; border: 0; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--ink-3); border-radius: 999px; transition: background .15s, color .15s; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: #fff; background: var(--ink); }

/* 카드 */
.card { background: var(--surface); border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); border-radius: var(--r); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.note { font-size: 0.82rem; color: var(--ink-3); line-height: 1.55; }
.warn { border: 0; background: linear-gradient(135deg, #FFF1EC, #FFF7F0); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; font-size: 0.88rem; box-shadow: inset 0 0 0 1px #FFD9CF; }
.warn b { color: var(--seal); }

/* 요약 히어로 */
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 22px; color: #fff; background: radial-gradient(420px 220px at 100% 0%, rgba(255, 138, 76, .55), transparent 70%), linear-gradient(135deg, #2F5BFF 0%, #5B4DFF 55%, #7B61FF 100%); box-shadow: 0 18px 40px -20px rgba(47, 91, 255, .8); display: grid; gap: 16px; }
.hero .eyebrow { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.08em; opacity: .8; }
.hero h2 { font-size: 1.5rem; font-weight: 900; color: #fff; }
.hero .pills { display: flex; gap: 6px; flex-wrap: wrap; }
.hero .hp { background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .28); border-radius: 999px; padding: 4px 11px; font-size: 0.8rem; font-weight: 600; color: #fff; }
.hero .hp .term { color: #fff; text-decoration-color: rgba(255, 255, 255, .6); }
.hero .four { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.hero .p4 { background: rgba(255, 255, 255, .96); color: var(--ink); border-radius: 14px; padding: 10px 4px 8px; text-align: center; display: grid; gap: 2px; }
.hero .p4 .pl { font-size: 0.7rem; color: var(--ink-3); font-weight: 700; }
.hero .p4 .pg { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.3rem, 5.4vw, 1.9rem); line-height: 1.1; letter-spacing: 0.02em; }
.hero .p4.me { box-shadow: 0 0 0 3px #FFD166; }
.hero .p4 .pk { font-size: 0.7rem; color: var(--ink-3); }

/* 입력 */
.form { display: grid; gap: 14px; }
.frow { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 0.78rem; color: var(--ink-3); font-weight: 600; letter-spacing: 0.02em; }
input, select { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 9px 12px; min-width: 0; transition: border-color .15s, background .15s; }
input:focus, select:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
input[type="number"] { width: 5.2em; }
input#f-y { width: 6.2em; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 0.86rem; font-weight: 600; color: var(--ink-2); border-radius: 9px; }

.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 800; box-shadow: 0 1px 3px rgba(18, 21, 31, .12); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 0.88rem; color: var(--ink-2); padding-bottom: 7px; }
details.adv { border-top: 1px dashed var(--line); padding-top: 10px; }
details.adv summary { cursor: pointer; font-size: 0.88rem; font-weight: 600; color: var(--ink-2); }
.adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 12px; }
.err { color: var(--seal); font-size: 0.88rem; font-weight: 600; }

/* 용어 버튼 */
.term { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; text-decoration: underline dotted color-mix(in srgb, var(--ink-3) 70%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.term:hover { color: var(--accent); text-decoration-color: var(--accent); }

/* 원국표 */
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.86rem; color: var(--ink-2); }
.meta b { color: var(--ink); font-weight: 600; }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.pil { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 340px; table-layout: fixed; }
table.pil th.rl { width: 58px; text-align: left; font-size: 0.74rem; font-weight: 600; color: var(--ink-3); vertical-align: middle; }
table.pil thead th { font-size: 0.8rem; color: var(--ink-3); font-weight: 600; padding-bottom: 2px; }
table.pil thead th .gzk { display: block; font-weight: 400; font-size: 0.72rem; }
table.pil td { text-align: center; font-size: 0.8rem; vertical-align: middle; padding: 3px 2px; line-height: 1.35; }
td.glyph { border-radius: 14px; padding: 8px 0 6px !important; background: color-mix(in srgb, var(--c) 11%, var(--surface)); border: 0; }
td.glyph .g { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1; color: var(--ci); display: block; }
td.glyph .gs { font-size: 0.72rem; color: var(--ink-2); display: block; margin-top: 4px; }
td.glyph.me { box-shadow: 0 0 0 2px var(--accent), 0 8px 18px -10px rgba(47, 91, 255, .7); }
td.tg { font-weight: 600; font-size: 0.84rem; }
td.hid { font-size: 0.76rem; color: var(--ink-2); }
td.hid div { white-space: nowrap; }
.e-wood { --c: var(--wood); --ci: var(--wood-ink); } .e-fire { --c: var(--fire); --ci: var(--fire-ink); }
.e-earth { --c: var(--earth); --ci: var(--earth-ink); } .e-metal { --c: var(--metal); --ci: var(--metal-ink); }
.e-water { --c: var(--water); --ci: var(--water-ink); }
.eltxt { color: var(--ci); font-weight: 700; }
td.empty { color: var(--ink-3); background: var(--surface-2); border-radius: 14px; }
.chip { display: inline-block; font-size: 0.72rem; line-height: 1.3; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); margin: 1px; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.gm { background: var(--ink); color: var(--surface); }
.pill { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
.pill.b-길 { background: var(--good); color: var(--surface); } .pill.b-소길 { background: var(--good-soft); color: var(--good); }
.pill.b-평 { background: var(--surface-2); color: var(--ink-2); }
.pill.b-소흉 { background: var(--bad-soft); color: var(--bad); } .pill.b-흉 { background: var(--bad); color: var(--surface); }
.pill.b-순풍 { background: var(--good-soft); color: var(--good); } .pill.b-보통 { background: var(--surface-2); color: var(--ink-2); }
.pill.b-주의 { background: color-mix(in srgb, var(--d-chg) 18%, var(--surface)); color: var(--d-chg); } .pill.b-부담 { background: var(--bad-soft); color: var(--bad); }
button.pill { border: 0; cursor: pointer; font-family: inherit; }
.pill.lv-강 { background: var(--bad); color: var(--surface); } .pill.lv-약 { background: var(--bad-soft); color: var(--bad); } .pill.lv-참고 { background: var(--surface-2); color: var(--ink-2); }

/* 목록·표 */
.list { display: grid; gap: 0; }
.li { display: grid; grid-template-columns: minmax(84px, auto) 1fr auto; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .k { font-size: 0.8rem; font-weight: 600; color: var(--ink-2); }
.li .v { min-width: 0; }
.li .v .small { display: block; }
table.dt { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
table.dt th, table.dt td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
table.dt th { font-size: 0.76rem; color: var(--ink-3); font-weight: 600; }
table.dt tr.cur td { background: var(--accent-soft); }
table.dt td.gz { font-family: var(--f-display); font-weight: 700; font-size: 1rem; }

/* 차트 */
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 64px 1fr 52px; gap: 10px; align-items: center; font-size: 0.86rem; }
.bar .track { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--c, var(--accent)); border-radius: 999px; }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.bar .lab { font-weight: 600; }
.subtg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.78rem; color: var(--ink-3); padding-left: 74px; margin-top: -4px; }
svg text { font-family: var(--f-body); }
.penta-wrap { display: grid; grid-template-columns: minmax(0, 420px) 1fr; gap: 18px; align-items: center; }
@media (max-width: 640px) { .penta-wrap { grid-template-columns: 1fr; } }
.penta { width: 100%; max-width: 420px; height: auto; display: block; }
.penta .saeng { stroke: var(--ink-3); stroke-width: 2; }
.penta .geuk { stroke: var(--bad); stroke-width: 1.6; stroke-dasharray: 5 4; opacity: .85; }
.penta .ah-saeng { fill: var(--ink-3); } .penta .ah-geuk { fill: var(--bad); }
.penta .node { fill: color-mix(in srgb, var(--c) 16%, var(--surface)); stroke: var(--c); stroke-width: 2; }
.penta .me-ring { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 3 3; }
.penta .nh { font-family: var(--f-display); font-weight: 900; font-size: 20px; fill: var(--ci); }
.penta .np { font-size: 11px; font-weight: 700; fill: var(--ink-2); }
.penta .nl { font-size: 12px; font-weight: 700; fill: var(--ci); }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; }
.hit { cursor: pointer; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: #fff; box-shadow: 0 10px 24px -10px rgba(18,21,31,.5); font-size: 0.8rem; padding: 6px 9px; border-radius: 6px; max-width: 240px; line-height: 1.45; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.78rem; color: var(--ink-2); align-items: center; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.gauge-l { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--ink-3); }
.lamps { display: flex; gap: 8px; flex-wrap: wrap; }
.lamp { border: 0; background: var(--surface-2); border-radius: 999px; padding: 6px 10px; font-size: 0.84rem; display: flex; gap: 6px; align-items: center; }
.lamp i { width: 8px; height: 8px; border-radius: 50%; background: var(--mid); display: inline-block; }
.lamp.on i { background: var(--accent); }

/* 용신 */
.roles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.role { border-radius: 16px; border: 0; background: color-mix(in srgb, var(--c) 10%, var(--surface)); padding: 10px 6px; text-align: center; display: grid; gap: 2px; }
.role .rn { font-size: 0.78rem; font-weight: 700; color: var(--ink-2); }
.role .rg { font-family: var(--f-display); font-weight: 900; font-size: 1.8rem; color: var(--ci); line-height: 1.1; }
.role .rp { font-size: 0.72rem; color: var(--ink-3); }
.role.main { box-shadow: inset 0 0 0 2px var(--c); }
ol.log { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: 0.9rem; color: var(--ink-2); }
@media (max-width: 520px) { .roles { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; } .role .rg { font-size: 1.4rem; } .role .rn { font-size: 0.7rem; } }

/* 운 */
.now { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 620px) { .now { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.nowc { border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 16px; padding: 10px 12px; display: grid; gap: 2px; cursor: pointer; text-align: left; background: var(--surface); }
.nowc:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.nowc .lbl { font-size: 0.74rem; color: var(--ink-3); font-weight: 600; }
.nowc .gzb { font-family: var(--f-display); font-weight: 900; font-size: 1.5rem; line-height: 1.15; }
.nowc .tgs { font-size: 0.76rem; color: var(--ink-2); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal .dow { font-size: 0.7rem; color: var(--ink-3); text-align: center; font-weight: 600; }
.cal button { border: 1px solid transparent; border-radius: 12px; padding: 5px 2px; min-height: 68px; cursor: pointer; display: grid; gap: 1px; justify-items: center; align-content: start; background: var(--surface-2); }
.cal button { position: relative; }
.cal .ctop { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 3px; }
.son { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: var(--seal); color: var(--surface); font-size: 9px; font-weight: 700; line-height: 1; }
.cal .sc { font-size: 0.74rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.cal .ld { font-size: 0.62rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cal .sc.strong { color: var(--ink); font-weight: 900; }
.acc { display: grid; gap: 0; }
.acc details { border-top: 1px solid var(--line); padding: 10px 0; }
.acc details:first-child { border-top: 0; }
.acc summary { cursor: pointer; list-style-position: outside; margin-left: 1em; }
.acc dl { display: grid; grid-template-columns: 96px 1fr; gap: 6px 14px; margin: 10px 0 0 1em; font-size: 0.88rem; }
.acc dt { font-weight: 700; color: var(--ink-2); font-size: 0.8rem; }
.acc dd { margin: 0; color: var(--ink-2); }
@media (max-width: 520px) { .acc dl { grid-template-columns: 1fr; gap: 2px; } .acc dd { margin-bottom: 6px; } }
.cal button .dn { font-size: 0.72rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal button .dg { font-family: var(--f-display); font-weight: 700; font-size: 0.9rem; line-height: 1.1; }
.cal button.today { border-color: var(--ink); }
.cal button.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.lts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(92px, 1fr); gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.lt { border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); border-radius: 16px; padding: 8px 6px; display: grid; gap: 3px; justify-items: center; align-content: start; cursor: pointer; text-align: center; }

    weights: {
      eokbuBase: 0.2, eokbuGain: 1.0, skewOn: 3, skewFull: 25,   // skew = |돕는 힘 − 50|(%p)
      johuBase: 0.1, johuGain: 1.0, climOn: 0.4, climFull: 1.6,  // clim = 기후 치우침 / 조후 기준(1 이상이면 조후 필요)
      relation: 0.5, structure: 0.35, tonggwan: 0.6,
      selectedBoost: 1.25,   // 사용자가 고른 학파의 가중치 배율
      ghostMin: 0.12,        // 조후 가중치가 이보다 작으면 흐린 비교 막대를 그리지 않는다
    },
    climate: { share: 0.25, comfort: 0.5, full: 1.2 },  // 운이 원국 기후를 움직이는 비율 / 무시할 편차 / 만점 개선폭
    relationScale: 4,      // 관계 합산(대략 ±15)을 ±100 축으로
    structure: { neutralPct: 20, scale: 0.8, pattern: { '관살혼잡': -12, '상관견관': -10, '군겁쟁재': -12, '효신탈식(도식)': -8 } },
    condition: { tailwind: 18, caution: -12, burden: -35 },   // 흐름 점수 → 순풍 / 보통 / 주의 / 부담
    change: {
      threshold: 55, sat: 50, stack: 0.75,   // changeScore = 100 × (1 − e^(−점수합/sat)), 큰 신호부터 stack^순번을 곱해 누적; threshold 이상이면 전환기 우선
      complete: 25, completeCore: 10, half: 8,   // 삼합·방합 완성(+일지·월지가 낀 경우) / 반합
      // 자리별 점수: [일, 월, 시, 년]
      pos: { '충': [40, 36, 22, 15], '형': [24, 22, 12, 8], '파': [8, 7, 4, 3], '해': [5, 5, 3, 2], '천간충': [32, 14, 7, 7], '천간합': [12, 6, 3, 3], '육합': [10, 9, 5, 4] },
    },
    intensity: { conc: [0.3, 0.6], gap: 25, relLoad: 20, w: [0.4, 0.3, 0.3] },
    defense: { fit: -20, intensity: 50, hardFit: -45, hardIntensity: 30 },
    attackNorm: 0.65,        // 비겁+식상 두 묶음을 다른 묶음과 공정하게 비교하기 위한 보정
    hourExecFit: 12,         // 시진 '실행' 등급의 최소 흐름 점수
  };
  const ACT_PHASE = { '공격': '공격기', '확장': '확장기', '수확': '수확기', '축적': '축적기' };
  const ROLE_V = { '용신': 2, '희신': 1, '한신': 0, '구신': -1, '기신': -2 };
  const lclamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lramp = (v, a, b) => lclamp((v - a) / (b - a), 0, 1);
  const conditionOf = v => { const c = LUCK_CFG.condition; return v >= c.tailwind ? '순풍' : v > c.caution ? '보통' : v > c.burden ? '주의' : '부담'; };
  const bandOf = conditionOf;

  // 성분 가중치(사주·시간 단위별로 한 번만 계산)
  const _lw = new WeakMap();
  function luckWeights(ch, level) {
    let byLevel = _lw.get(ch); if (!byLevel) _lw.set(ch, byLevel = {});
    if (byLevel[level]) return byLevel[level];
    const C = LUCK_CFG.weights, L = LUCK_CFG.levels[level] || LUCK_CFG.levels.ilun, a = methodAdvice(ch);
    const sE = lramp(a.skew, C.skewOn, C.skewFull), sJ = lramp(a.clim, C.climOn, C.climFull);
    const ton = ch.yongAll.tonggwan;
    const raw = {
      eokbu: (C.eokbuBase + C.eokbuGain * sE) * (ch.school === 'eokbu' ? C.selectedBoost : 1),
      johu: (C.johuBase + C.johuGain * sJ) * (ch.school === 'johu' ? C.selectedBoost : 1),
      relation: C.relation, structure: C.structure,
      tonggwan: ch.school === 'tonggwan' && ton && ton.applicable ? C.tonggwan : 0,
    };
    let sum = 0; for (const k in raw) { raw[k] *= L.mul[k] ?? 1; sum += raw[k]; }
    const w = {}; for (const k in raw) w[k] = raw[k] / sum;
    // 흐린 비교 막대: 두 기준 중 덜 앞세운 쪽
    const ghost = w.johu >= C.ghostMin ? (w.eokbu >= w.johu ? 'johu' : 'eokbu') : null;
    return byLevel[level] = { ...w, sE, sJ, clim: a.clim, skew: a.skew, ghost };
  }

  // 오행 부합도: 용신 체계의 역할(용·희·한·구·기)로 운 천간·지지(지장간 가중)를 평가
  function elementFit(yong, p, stemW, tag) {
    const r = e => ROLE_V[yong.roles[e]];
    let bp = 0; for (const [hs, dd] of HIDDEN[p.b]) bp += r(stemEl(hs)) * dd / 30;
    const v = (stemW * r(stemEl(p.s)) + (1 - stemW) * bp) / 2 * 100;
    return { v, label: `${tag} 오행 부합 (천간 ${STEM[p.s]}:${yong.roles[stemEl(p.s)]}, 지지 ${BR[p.b]}:지장간 가중)` };
  }
  // 조후: 운이 원국의 한난조습 치우침을 줄이는지(+) 키우는지(−). 용신 유무와 무관하게 연속값으로 계산
  function climateGain(ch, p, stemW) {
    const c = ch.climate, K = LUCK_CFG.climate;
    const lt = stemW * STEM_TEMP[p.s] + (1 - stemW) * BR_TEMP[p.b], lh = stemW * STEM_HUM[p.s] + (1 - stemW) * BR_HUM[p.b];
    const dev = (x, k) => Math.max(0, Math.abs(x) / k - K.comfort);
    const nt = (1 - K.share) * c.temp + K.share * lt, nh = (1 - K.share) * c.hum + K.share * lh;
    return { gain: dev(c.temp, 0.6) - dev(nt, 0.6) + dev(c.hum, 0.8) - dev(nh, 0.8), lt, lh };
  }
  // 60갑자 전체 평균을 빼서, 극단적인 기후의 사주가 평균적으로 한쪽으로 치우치지 않게 맞춘다
  const _jb = new WeakMap();
  function climateBase(ch, stemW) {
    let m = _jb.get(ch); if (!m) _jb.set(ch, m = {});
    if (m[stemW] == null) { let s = 0; for (let i = 0; i < 60; i++) s += climateGain(ch, gz(i), stemW).gain; m[stemW] = s / 60; }
    return m[stemW];
  }
  const johuFit = (ch, p, stemW) => {
    const { gain, lt, lh } = climateGain(ch, p, stemW), c = ch.climate;
    const v = lclamp((gain - climateBase(ch, stemW)) / LUCK_CFG.climate.full * 100, -100, 100);
    const wordT = lt > 0.3 ? '더운' : lt < -0.3 ? '찬' : '', wordH = lh > 0.3 ? '습한' : lh < -0.3 ? '마른' : '';
    const luckWord = [wordT, wordH].filter(Boolean).join('·') || '고른';
    const natal = c.temp >= 0.6 ? '더운' : c.temp <= -0.6 ? '추운' : c.hum >= 0.8 ? '습한' : c.hum <= -0.8 ? '건조한' : '기후가 고른';
    return { v, label: `조후 (${natal} 원국에 ${luckWord} 기운이 들어옴)` };
  };

  // 운 글자가 원국과 만드는 합·충 등을 오행 역할에 따라 점수화(관계 성분)
  function relationParts(ch, p, rels, r, roleTxt) {
    const parts = [], posW = { day: 1, month: 0.8, year: 0.5, hour: 0.5 };
    for (const x of rels) {
      const other = x.members.find(m => m !== 'luck'), w = posW[other] || 0.6;
      if (x.type === '충') {
        const tb = ch.pillars[other].b;
        parts.push({ label: `${x.name} — ${POS_K[other]}지(${roleTxt(BR_EL[tb])}) 충돌·변동`, v: (-r(BR_EL[tb]) * 5 - 5) * w });
      } else if (['육합', '삼합', '반합', '방합'].includes(x.type) && x.el != null) {
        parts.push({ label: `${x.name} — ${EL_K[x.el]}(${roleTxt(x.el)}) 기운 형성`, v: r(x.el) * 5 * w });
      } else if (x.type === '천간합' && x.el != null && other === 'day') {
        parts.push({ label: `${x.name} — 일간이 묶임(합화 ${roleTxt(x.el)})`, v: r(x.el) * 3 });
      } else if (x.type === '천간충' && other === 'day') {
        parts.push({ label: `${x.name} — 일간 충돌`, v: -5 });
      }
    }
    if (CHEONEUL[ch.pillars.day.s].includes(p.b)) parts.push({ label: '천을귀인 운', v: 5 });
    return parts;
  }
  // 변화 점수: 자리별 점수를 누적하되 100에 가까워질수록 완만하게 쌓는다
  function changeOf(rels) {
    const C = LUCK_CFG.change, posIdx = { day: 0, month: 1, hour: 2, year: 3 }, hits = [];
    for (const x of rels) {
      const others = x.members.filter(m => m !== 'luck'); let pts = 0;
      if (x.type === '삼합' || x.type === '방합') pts = C.complete + (others.some(o => o === 'day' || o === 'month') ? C.completeCore : 0);
      else if (x.type === '반합') pts = C.half;
      else if (C.pos[x.type]) pts = Math.max(...others.map(o => C.pos[x.type][posIdx[o]] ?? 0));
      if (pts > 0) hits.push({ r: x, pts });
    }
    hits.sort((a, b) => b.pts - a.pts);
    const sum = hits.reduce((a, h, i) => a + h.pts * C.stack ** i, 0);
    return { score: 100 * (1 - Math.exp(-sum / C.sat)), hits };
  }
  // 이 운 글자가 일간 기준 어느 십성 묶음(0 비겁 1 식상 2 재성 3 관성 4 인성)을 얼마나 끌어오는지
  function groupPull(dEl, p) {
    const g = [0, 0, 0, 0, 0];
    g[groupOfEl(dEl, stemEl(p.s))] += 0.4;
    for (const [hs, dd] of HIDDEN[p.b]) g[groupOfEl(dEl, stemEl(hs))] += 0.6 * dd / 30;
    return g;
  }
  const relWhere = r => r.members.filter(m => m !== 'luck').map(m => POS_K[m] + (r.kind === 'stem' ? '간' : '지')).join('·');

  function evaluateLuck(ch, p, level = 'ilun', opts = {}) {
    const C = LUCK_CFG, L = C.levels[level] || C.levels.ilun, stemW = opts.stemW ?? L.stemW;
    const W = luckWeights(ch, level), dEl = stemEl(ch.pillars.day.s), G = ch.weights.groups;
    const { rels } = luckRelations(ch, p);
    // 성분 점수(각각 −100~+100)
    const eok = elementFit(ch.yongAll.eokbu, p, stemW, '억부');
    const jo = johuFit(ch, p, stemW);
    const ton = W.tonggwan > 0 ? elementFit(ch.yongAll.tonggwan, p, stemW, '통관') : null;
    // 관계 성분의 오행 역할은 억부·조후(·통관) 가중치대로 섞는다. 조후는 연속값이라 온도 기준 역할값으로 환산한다.
    const yw = W.eokbu + W.tonggwan + W.johu;
    const rBlend = e => {
      const eokR = ROLE_V[ch.yongAll.eokbu.roles[e]], tonR = ton ? ROLE_V[ch.yongAll.tonggwan.roles[e]] : 0;
      const jy = ch.yongAll.johu, joR = jy.applicable ? ROLE_V[jy.roles[e]] : 0;
      return (W.eokbu * eokR + W.tonggwan * tonR + W.johu * joR) / yw;
    };
    const roleTxt = e => { const a = ch.yongAll.eokbu.roles[e], jy = ch.yongAll.johu; return jy.applicable && jy.roles[e] !== a ? `억부 ${a}·조후 ${jy.roles[e]}` : a; };
    const relP = relationParts(ch, p, rels, rBlend, roleTxt);
    const relRaw = relP.reduce((a, x) => a + x.v, 0);
    const relationScore = lclamp(relRaw * C.relationScale, -100, 100);
    // 구조 성분: 원국에서 모자란 십성 묶음을 채우면 +, 이미 넘치는 묶음을 더 키우면 −
    const g = groupPull(dEl, p), S = C.structure;
    // 활동 유형: 비겁+식상은 두 묶음의 합이므로 보정해 다른 묶음과 견준다. 주도 십성은 이긴 유형 안에서 가장 센 묶음
    const act = { '공격': (g[0] + g[1]) * C.attackNorm, '확장': g[3], '수확': g[2], '축적': g[4] };
    const activityType = Object.keys(act).reduce((a, k) => act[k] > act[a] ? k : a, '공격');
    const top = activityType === '공격' ? (g[0] >= g[1] ? 0 : 1) : { '확장': 3, '수확': 2, '축적': 4 }[activityType];
    const need = G.map(pc => (S.neutralPct - pc) / S.neutralPct);
    let structRaw = 0; g.forEach((v, i) => structRaw += v * need[i]);
    const structP = [];
    let patAdj = 0;
    for (const pt of ch.patterns.list) {
      const adj = S.pattern[pt.name]; if (adj == null || pt.level === '참고') continue;
      const hit = (pt.name === '관살혼잡' && g[3] >= 0.4) || (pt.name === '상관견관' && g[1] >= 0.4) || (pt.name === '군겁쟁재' && g[0] >= 0.4) || (pt.name === '효신탈식(도식)' && g[4] >= 0.4);
      if (hit) { patAdj += adj; structP.push({ label: `${pt.name} 구조에 ${TG_GROUP[top]} 기운이 겹침`, v: adj }); }
    }
    const structureScore = lclamp(structRaw * 100 * S.scale + patAdj, -100, 100);
    const structLabel = `십성 균형 — 원국 ${TG_GROUP[top]} ${G[top].toFixed(0)}%에 ${TG_GROUP[top]} 기운이 ${G[top] < S.neutralPct ? '채워짐' : '더해짐'}`;
    // 종합
    const ownFit = lclamp(W.eokbu * eok.v + W.johu * jo.v + W.relation * relationScore + W.structure * structureScore + (ton ? W.tonggwan * ton.v : 0), -100, 100);
    const parent = opts.parent && L.parent ? opts.parent : null;
    const fitScore = parent ? lclamp((1 - L.parent) * ownFit + L.parent * parent.fitScore, -100, 100) : ownFit;
    // 변화·강도
    const ch2 = changeOf(rels), changeScore = ch2.score;
    const I = C.intensity, conc = lramp(Math.max(...g), I.conc[0], I.conc[1]);
    const relLoad = lclamp(relP.reduce((a, x) => a + Math.abs(x.v), 0) / I.relLoad, 0, 1) * 0.5 + lclamp(ch2.hits.reduce((a, h) => a + h.pts, 0) / 60, 0, 1) * 0.5;
    const gap = lclamp(Math.abs(G[top] - S.neutralPct) / I.gap, 0, 1);
    const intensityScore = 100 * (I.w[0] * conc + I.w[1] * relLoad + I.w[2] * gap);
    // 시기 유형
    const D = C.defense, condition = conditionOf(fitScore);
    let phase, why;
    if (fitScore <= D.hardFit && intensityScore >= D.hardIntensity) { phase = '방어기'; why = `흐름 점수 ${Math.round(fitScore)}로 부담이 크고 작용 강도(${Math.round(intensityScore)})도 있어 감당 범위를 넘을 수 있음`; }
    else if (changeScore >= C.change.threshold) { phase = '전환기'; why = `변화 점수 ${Math.round(changeScore)} — 구조 재편 신호: ${ch2.hits.slice(0, 2).map(h => `${relWhere(h.r)} ${h.r.name}`).join(', ')}`; }
    else if (fitScore <= D.fit && intensityScore >= D.intensity) { phase = '방어기'; why = `흐름 점수 ${Math.round(fitScore)}와 작용 강도 ${Math.round(intensityScore)}가 함께 높아 리스크 관리가 필요`; }
    else { phase = ACT_PHASE[activityType]; why = `${TG_GROUP[top]} 기운이 주도해 ${activityType} 성향`; }
    const tendency = ACT_PHASE[activityType].replace('기', '') + ' 성향' + (phase === ACT_PHASE[activityType] && (condition === '주의' || condition === '부담') ? ` + ${condition}` : '');
    // 근거 문장: 시기 판정 이유 + 기여가 큰 성분 2~3개
    const parts = [{ label: eok.label, v: W.eokbu * eok.v, comp: 'eokbu' }, { label: jo.label, v: W.johu * jo.v, comp: 'johu' }];
    if (ton) parts.push({ label: ton.label, v: W.tonggwan * ton.v, comp: 'tonggwan' });
    relP.forEach(x => parts.push({ label: x.label, v: W.relation * C.relationScale * x.v, comp: 'relation' }));
    parts.push({ label: structLabel, v: W.structure * structureScore - structP.reduce((a, x) => a + x.v, 0) * W.structure, comp: 'structure' });
    structP.forEach(x => parts.push({ label: x.label, v: W.structure * x.v, comp: 'structure' }));
    const phrase = v => v >= 6 ? '보완' : v <= -6 ? '부담을 높임' : '영향 작음';
    const reasons = [why, ...[...parts].sort((a, b) => Math.abs(b.v) - Math.abs(a.v)).slice(0, 3).filter(x => Math.abs(x.v) >= 1).map(x => `${x.label} → ${phrase(x.v)}`)].slice(0, 4);
    const relations = rels.map(r => `${relWhere(r)} ${r.name}`);
    // 흐린 비교 막대: 덜 앞세운 기준 하나만 단독으로 본 점수
    let alt = null;
    if (W.ghost) { const own = W.ghost === 'johu' ? jo.v : eok.v; alt = { school: W.ghost, value: parent && parent.alt ? (1 - L.parent) * own + L.parent * parent.alt.value : own }; }
    return {
      level, fitScore, ownFit, eokbuScore: eok.v, johuScore: jo.v, relationScore, structureScore, tonggwanScore: ton ? ton.v : null,
      weights: { eokbu: W.eokbu, johu: W.johu, relation: W.relation, structure: W.structure, tonggwan: W.tonggwan },
      changeScore, intensityScore, activityType, tendency, dominantTenGodGroup: TG_GROUP[top], grp: top,
      phase, condition, reasons, parts, relations, triggers: ch2.hits.filter(h => h.pts >= 10).sort((a, b) => b.pts - a.pts).map(h => `${relWhere(h.r)} ${h.r.name}`), alt,
    };
  }

  // ───────────── 메인 ─────────────
  function compute(inp) {
    let { year, month, day } = inp;
    if (year < MIN_Y || year > MAX_Y) throw new Error(`${MIN_Y}~${MAX_Y}년만 지원합니다`);
    let lunar = null;
    if (inp.calendar === 'lunar') {
      lunar = { y: year, m: month, d: day, leap: !!inp.leap };
      [year, month, day] = lunarToSolar(year, month, day, inp.leap);
    } else {
      const dt = new Date(Date.UTC(year, month - 1, day));
      if (dt.getUTCMonth() !== month - 1) throw new Error('존재하지 않는 날짜입니다');
      lunar = solarToLunar(year, month, day);
    }
    const hourKnown = inp.hour != null && inp.hour !== '';
    const h = hourKnown ? +inp.hour : 12, mi = hourKnown ? +(inp.minute || 0) : 0;
    const utc = wallToUtc(year, month, day, h, mi);
    const lon = inp.lon ?? 126.98;
    const timeMode = inp.timeMode || 'lmt';
    const jasi = inp.jasi || 'jeong';
    const P = pillarsFor(utc, lon, timeMode, jasi, hourKnown);
    const ch = { input: inp, gender: inp.gender || 'M', utc, lon, timeMode, jasi, hourKnown, solar: { y: year, m: month, d: day, h, mi }, lunar };
    ch.pillars = { year: P.year, month: P.month, day: P.day, hour: P.hour };
    ch.localSolarMs = P.localSolarMs;
    ch.tzOffset = tzOffset(utc);
    ch.dst = tzOffset(utc) !== standardOffset(utc);
    // 시간 기준별 비교(불확실성)
    ch.alternatives = Object.keys(TIME_MODES).map(m => {
      const q = pillarsFor(utc, lon, m, jasi, hourKnown);
      return { mode: m, label: TIME_MODES[m], local: q.localSolarMs, day: gzName(q.day), hour: q.hour ? gzName(q.hour) : null };
    });
    ch.alternativesJasi = hourKnown && P.lateJasi ? ['jeong', 'ya'].map(j => { const q = pillarsFor(utc, lon, timeMode, j, true); return { jasi: j, day: gzName(q.day), hour: gzName(q.hour) }; }) : null;
    // 경계 근접 경고
    ch.warnings = [];
    const { prev, next } = surroundingJie(utc);

  // 세운·월운·일운 (차트 기준)

  // 조후론과 억부론 중 무엇을 앞세울지

  '편재': ['십성', '내가 다스리는(극하는) 오행 중 음양이 같은 글자입니다. 사업, 투자, 큰돈처럼 크게 벌고 크게 쓰는 재물을 뜻합니다. 활동 반경이 넓고 사교적이며, 남성에게는 아버지나 이성을 뜻하기도 합니다.'],
  '정재': ['십성', '내가 다스리는(극하는) 오행 중 음양이 다른 글자입니다. 월급, 저축처럼 꾸준하고 안정된 재물을 뜻합니다. 성실하고 알뜰한 성향을 주며, 남성에게는 아내를 뜻하기도 합니다.'],
  '편관': ['십성', '나를 누르는(극하는) 오행 중 음양이 같은 글자로, "칠살"이라고도 합니다. 강한 압박, 위기, 권력, 무거운 책임을 뜻합니다. 잘 다스리면 군인·경찰·관리자 같은 카리스마와 추진력이 되고, 못 다스리면 스트레스와 사고로 봅니다.'],
  '정관': ['십성', '나를 누르는(극하는) 오행 중 음양이 다른 글자입니다. 규칙, 직장, 명예, 바른 생활을 뜻합니다. 조직 안에서 인정받고 안정된 자리를 얻는 기운이며, 여성에게는 남편을 뜻하기도 합니다.'],
  '편인': ['십성', '나를 도와주는(생하는) 오행 중 음양이 같은 글자입니다. 남다른 직관, 영감, 특수 분야의 공부(예술·종교·철학·기술)를 뜻합니다. 생각이 깊지만, 많으면 변덕스럽거나 식신(먹고사는 힘)을 방해한다고 봅니다.'],
  '정인': ['십성', '나를 도와주는(생하는) 오행 중 음양이 다른 글자입니다. 학문, 자격증, 어머니, 나를 보살펴 주는 사람과 도움을 뜻합니다. 배우는 것을 좋아하고 인정이 많으며, 윗사람의 후원을 받기 쉽다고 봅니다.'],
  '비겁': ['십성', '비견과 겁재를 합쳐 부르는 말입니다. 나와 같은 오행으로, 내 편이 되어 나를 직접 도와주는 힘입니다.'],
  '식상': ['십성', '식신과 상관을 합쳐 부르는 말입니다. 내가 만들어 내는 오행으로, 말·재능·표현처럼 내 기운이 밖으로 나가는 통로입니다.'],
  '재성': ['십성', '편재와 정재를 합쳐 부르는 말입니다. 내가 다스리는 오행으로 재물과 결과물을 뜻합니다.'],
  '관성': ['십성', '편관과 정관을 합쳐 부르는 말입니다. 나를 다스리는 오행으로 직장·규칙·명예를 뜻합니다.'],
  '인성': ['십성', '편인과 정인을 합쳐 부르는 말입니다. 나를 도와주는 오행으로 공부·보살핌·후원을 뜻합니다.'],

  // ── 지장간
  '지장간': ['지장간', '지지(아래 글자) 속에 숨어 있는 천간입니다. 지지는 한 달 동안의 기운이라, 그 안에서 기운이 바뀌는 순서대로 여기(앞 달의 남은 기운)·중기·정기(본래 기운)로 나뉩니다. 겉으로 보이지 않는 속마음이나 잠재력으로 해석합니다.'],
  '여기': ['지장간', '지지 속에 남아 있는 앞 달의 기운입니다. 절기가 바뀐 직후 며칠 동안만 작용한다고 봅니다. 예: 인월(寅) 초반에는 앞 달인 축월의 기운이 조금 남아 있습니다.'],
  '중기': ['지장간', '지지 속에 들어 있는 중간 기운으로, 삼합 관계에서 들어온 기운입니다. 자·묘·유(子卯酉)에는 없습니다.'],
  '정기': ['지장간', '그 지지의 본래 기운으로 가장 오래, 가장 강하게 작용합니다. 지지의 십성은 보통 이 정기로 정합니다.'],
  '투출': ['지장간', '지지 속에 숨어 있던 글자가 천간에도 드러나 있는 것입니다. 속에 있던 기운이 겉으로 드러났으니 힘이 뚜렷해진다고 봅니다. 예: 월지 속의 정관이 천간에도 있으면 정관이 사주의 중심 역할을 합니다.'],

  // ── 12운성
  '12운성': ['12운성', '천간이 각 지지에서 얼마나 힘을 받는지를 사람의 일생(태어남→자람→전성기→늙음→죽음→다시 잉태)에 빗댄 12단계입니다. 장생·관대·건록·제왕은 힘이 좋은 단계, 쇠·병·사·묘·절은 힘이 약해지는 단계로 봅니다.'],
  '봉법': ['12운성', '나(일간)를 기준으로 네 지지 각각에서 내가 얼마나 힘을 받는지 매기는 방법입니다. 표에 크게 적힌 값입니다.'],
  '좌법': ['12운성', '각 기둥의 천간이 바로 아래 자기 지지에서 얼마나 힘을 받는지 매기는 방법입니다. 그 기둥 천간의 뿌리가 튼튼한지 봅니다. 표에 작게 적힌 값입니다.'],
  '장생': ['12운성', '막 태어난 아기의 단계입니다. 새로운 시작, 성장 가능성, 주변의 도움을 받는 기운으로 봅니다.'],
  '목욕': ['12운성', '태어난 아기를 처음 씻기는 단계입니다. 아직 불안정해서 호기심·변덕·유행에 민감함, 이성에 대한 관심으로 해석합니다.'],
  '관대': ['12운성', '어른이 되어 옷과 관을 갖춰 입는 단계입니다. 자신감과 도전 정신이 커지고, 지나치면 과시하거나 무리한다고 봅니다.'],
  '건록': ['12운성', '사회에 나가 월급을 받는 단계입니다. 스스로 설 수 있는 힘, 안정된 실력과 일하는 능력으로 봅니다.'],
  '제왕': ['12운성', '힘이 가장 센 전성기 단계입니다. 주도권과 강한 자아로 보며, 지나치면 독선과 고집이 된다고 봅니다.'],
  '쇠': ['12운성', '전성기를 지나 힘이 조금씩 줄어드는 단계입니다. 대신 경험이 쌓인 노련함과 신중함으로 봅니다.'],
  '병': ['12운성', '몸이 약해진 단계입니다. 추진력은 떨어지지만 섬세함과 감수성, 남을 이해하는 마음이 커진다고 봅니다.'],
  '사': ['12운성', '움직임이 멈춘 단계입니다. 활동보다 한 가지에 깊이 몰입하는 힘, 연구·정신적 활동으로 봅니다.'],
  '묘': ['12운성', '무덤(창고)에 들어간 단계입니다. 모으고 저장하고 아끼는 힘, 드러나지 않는 재산으로 봅니다.'],
  '절': ['12운성', '기운이 완전히 끊긴 단계입니다. 단절과 전환, 그래서 오히려 새 출발의 계기로 봅니다.'],
  '태': ['12운성', '엄마 뱃속에 막 생긴 단계입니다. 아직 드러나지 않은 가능성, 계획과 구상의 단계로 봅니다.'],
  '양': ['12운성', '뱃속에서 자라는 단계입니다. 보호받으며 준비하는 기운, 길러 주고 길러지는 관계로 봅니다.'],

  // ── 12신살
  '12신살': ['12신살', '태어난 해(또는 날)의 지지를 기준으로 다른 지지에 붙이는 12가지 별명입니다. "살"이라는 이름이 붙어도 모두 나쁜 것은 아니며, 대부분 좋은 면과 조심할 면을 함께 가집니다. 기준을 년지로 할지 일지로 할지는 학파마다 달라서 설정에서 바꿀 수 있습니다.'],
  '겁살': ['12신살', '무언가를 빼앗기거나 갑자기 잃는 기운입니다. 도난·손재수를 조심하라는 뜻이지만, 반대로 과감하게 결단하는 힘으로도 봅니다.'],
  '재살': ['12신살', '"수옥살"이라고도 하며 갇히거나 묶이는 기운입니다. 법적 문제나 구속을 조심하라는 뜻이고, 좋게 쓰면 남을 통제하고 관리하는 능력으로 봅니다.'],
  '천살': ['12신살', '하늘에서 오는 일, 즉 사람 힘으로 어쩔 수 없는 일을 뜻합니다. 자연재해나 뜻밖의 일을 조심하고, 좋게는 종교심·인내심으로 봅니다.'],
  '지살': ['12신살', '땅을 딛고 떠나는 기운입니다. 이사, 이직, 새로운 출발, 환경 변화를 뜻합니다.'],
  '연살': ['12신살', '흔히 말하는 "도화살"입니다. 사람을 끄는 매력, 인기, 이성 관계, 예술적 끼를 뜻합니다. 연예·서비스업에서는 장점이 됩니다.'],
  '월살': ['12신살', '"고초살"이라고도 하며 일이 막히고 메마르는 기운입니다. 일이 더디게 풀리니 서두르지 말라는 뜻으로 봅니다.'],
  '망신살': ['12신살', '체면을 잃거나 숨기고 싶은 것이 드러나는 기운입니다. 구설수를 조심하라는 뜻이고, 좋게는 자신을 과감히 드러내는 표현력으로 봅니다.'],
  '장성살': ['12신살', '장군의 별입니다. 리더십, 권위, 강한 주관을 뜻하며 조직을 이끄는 자리에 어울린다고 봅니다.'],
  '반안살': ['12신살', '말 위에 안장을 얹고 오르는 기운입니다. 승진, 출세, 안정된 지위를 뜻하는 좋은 살입니다.'],
  '역마살': ['12신살', '말을 타고 멀리 떠나는 기운입니다. 이동이 잦음, 해외, 출장, 여행, 무역·운송 관련 일을 뜻합니다.'],
  '육해살': ['12신살', '여섯 가지 해로움이라는 뜻입니다. 잔병치레나 일이 지연되는 것을 조심하라는 뜻이고, 좋게는 남을 돌보는 헌신과 봉사로 봅니다.'],
  '화개살': ['12신살', '꽃을 덮는 기운입니다. 화려함보다 내면을 향해서 학문·종교·예술에 깊이 빠지고, 혼자 있는 시간을 즐기는 성향으로 봅니다.'],

  // ── 공망
  '공망': ['공망', '"비어 있다"는 뜻입니다. 60갑자를 10개씩 묶으면 천간은 10개인데 지지는 12개라 지지 두 개가 짝 없이 남는데, 그 두 지지가 공망입니다. 공망에 걸린 자리는 기운이 비어서 작용이 약하거나 늦게 나타난다고 봅니다. 예: 배우자 자리가 공망이면 인연이 늦게 온다고 풉니다.'],

  // ── 관계
  '천간합': ['관계', '짝이 맞는 두 천간이 만나 서로 끌어당기는 관계입니다(갑기·을경·병신·정임·무계). 협력, 화합, 또는 서로에게 묶여 제 역할을 못 하는 것으로 봅니다. 조건이 맞으면 다른 오행으로 바뀐다고도 보지만, 이 앱은 오행 비율에 반영하지 않습니다.'],
  '천간충': ['관계', '서로 정면으로 부딪치는 두 천간입니다(갑경·을신·병임·정계). 생각이나 목표의 충돌, 갑작스러운 변화를 뜻합니다.'],
  '육합': ['관계', '두 지지가 짝을 이뤄 하나로 묶이는 관계입니다(자축·인해·묘술·진유·사신·오미). 결합, 화합, 인연을 뜻합니다.'],
  '삼합': ['관계', '세 지지가 모여 하나의 강한 오행 세력을 만드는 관계입니다. 신자진은 물, 해묘미는 나무, 인오술은 불, 사유축은 쇠가 됩니다. 합 중에 가장 강해서 사주의 흐름을 크게 바꾼다고 봅니다.'],
  '반합': ['관계', '삼합의 세 글자 중 가운데 글자(자·오·묘·유)를 포함한 두 글자만 모인 경우입니다. 삼합보다 약하지만 같은 방향으로 기운을 모읍니다.'],
  '방합': ['관계', '같은 계절의 세 지지가 모인 관계입니다(인묘진=봄·나무, 사오미=여름·불, 신유술=가을·쇠, 해자축=겨울·물). 같은 계절 기운이 뭉쳐 그 오행이 아주 강해집니다.'],
  '충': ['관계', '정반대 방향의 두 지지가 정면으로 부딪치는 관계입니다(예: 자↔오, 인↔신). 이사·이직 같은 변화, 갈등, 깨짐을 뜻합니다. 어느 자리에서 부딪치는지가 중요합니다. 예: 일지 충은 배우자·집 문제, 월지 충은 직장·부모 문제로 봅니다.'],
  '형': ['관계', '서로 벌을 주고 다듬는 관계입니다(인사신, 축술미, 자묘, 진진·오오·유유·해해). 갈등, 법적 문제, 수술처럼 "고치고 다듬는" 일로 나타난다고 봅니다. 의사·법조인처럼 형을 직업으로 쓰기도 합니다.'],
  '파': ['관계', '서로 깨뜨리는 관계입니다(자유·오묘·신사·인해·진축·술미). 충보다 약한 금 가는 정도의 균열로 봅니다.'],
  '해': ['관계', '서로 해치는 관계입니다(자미·축오·인사·묘진·신해·유술). 좋은 인연(합)을 방해하거나 믿던 사람과 틀어지는 작용으로 봅니다.'],
  '원진': ['관계', '서로 괜히 미워하고 원망하는 관계입니다(자미·축오·인유·묘신·진해·사술). 가까운 사람과의 이유 없는 불화로 해석합니다.'],
  '귀문관': ['관계', '"귀신이 드나드는 문"이라는 뜻입니다(자유·축오·인미·묘신·진해·사술). 예민함, 뛰어난 직관과 영감으로 해석하며, 지나치면 신경이 날카로워진다고 봅니다. 조합은 학파마다 조금 다릅니다.'],

  // ── 신살·길성
  '신살': ['신살', '특정 글자 조합에 붙이는 상징적인 별명입니다. 좋은 것은 "귀인·길성", 조심할 것은 "살"이라 부릅니다. 사주 해석에서는 오행 균형보다 비중이 낮은 참고 지표입니다.'],
  '천을귀인': ['신살', '가장 좋은 길성으로 꼽힙니다. 어려울 때 도와주는 사람이 나타나고, 위기를 넘기는 복이 있다고 봅니다. 일간 기준으로 찾습니다(갑무경→축미, 을기→자신, 병정→해유, 신→인오, 임계→사묘).'],
  '문창귀인': ['신살', '글과 공부의 별입니다. 머리가 좋고 글재주가 있으며 시험운이 좋다고 봅니다.'],
  '금여록': ['신살', '"금으로 만든 수레"라는 뜻입니다. 좋은 배우자, 품위 있는 생활, 넉넉한 재물을 뜻하는 길성입니다.'],
  '암록': ['신살', '"숨은 월급"이라는 뜻입니다. 뜻밖의 도움이나 드러나지 않는 재물이 생긴다고 봅니다.'],
  '건록': ['신살', '나(일간)가 지지에서 안정된 월급을 받는 자리입니다. 스스로 설 수 있는 힘과 직업적 안정으로 봅니다. 12운성의 건록과 같은 자리입니다.'],
  '양인살': ['신살', '"양날의 칼"이라는 뜻입니다. 양 일간이 가장 힘센 자리(제왕)를 만날 때 붙습니다. 강한 추진력과 결단력이 있지만 과격해지거나 다칠 수 있다고 봅니다.'],
  '홍염살': ['신살', '"붉은 불꽃"이라는 뜻입니다. 이성을 끄는 매력과 끼, 멋을 내는 감각을 뜻합니다.'],
  '천덕귀인': ['신살', '하늘의 덕이 돕는 길성입니다. 나쁜 일이 생겨도 크게 번지지 않게 막아 준다고 봅니다. 태어난 달(월지) 기준으로 찾습니다.'],
  '월덕귀인': ['신살', '달의 덕이 돕는 길성입니다. 천덕귀인처럼 나쁜 일을 줄여 주고, 성품이 너그럽다고 봅니다. 태어난 달(월지) 기준으로 찾습니다.'],
  '백호대살': ['신살', '"호랑이에게 물린다"는 뜻의 강한 살입니다. 갑진·을미·병술·정축·무진·임술·계축 일곱 간지가 해당합니다. 사고·수술·다침을 조심하라는 뜻이고, 강한 기질과 추진력으로도 봅니다.'],
  '괴강살': ['신살', '북두칠성의 우두머리 별에서 온 이름입니다. 경진·경술·임진·임술·무술 간지가 해당합니다. 강한 리더십과 결단력이 있지만 극단적으로 흐르기 쉽다고 봅니다.'],
  '고신살': ['신살', '"외로운 신하"라는 뜻입니다. 혼자 지내는 시간이 많거나 가족과 떨어져 지내는 경향으로 봅니다.'],
  '과숙살': ['신살', '"홀로 지내는 집"이라는 뜻으로 고신살과 짝을 이룹니다. 배우자와 떨어져 지내는 시간이 생기기 쉽다고 봅니다.'],
  '천의성': ['신살', '"하늘의 의사"라는 뜻입니다. 의료, 약, 치유, 상담처럼 사람을 돌보는 일과 인연이 있다고 봅니다.'],

  // ── 강약
  '신강신약': ['강약', '나(일간)가 사주 안에서 얼마나 힘을 받는지 판단한 것입니다. 나를 돕는 글자(비겁·인성)가 많으면 신강(힘이 셈), 적으면 신약(힘이 약함)입니다. 좋고 나쁨이 아니라 "무엇이 필요한가"를 정하는 기준이 됩니다. 신강하면 힘을 빼 주는 기운이, 신약하면 도와주는 기운이 필요합니다.'],
  '득령': ['강약', '태어난 계절이 나를 돕는지를 봅니다. 예: 나무(갑·을) 일간이 봄에 태어나면 득령입니다. 힘의 세기를 판단할 때 가장 중요한 기준입니다.'],
  '득지': ['강약', '내가 앉은 자리(일지)가 나를 돕는지를 봅니다. 발 딛고 선 땅이 튼튼한지와 같습니다.'],
  '득세': ['강약', '월지·일지를 뺀 나머지 글자 중 내 편이 절반을 넘는지를 봅니다. 주변에 나를 돕는 사람이 많은지와 같습니다.'],
  '월령': ['강약', '태어난 달(월지)이 가진 계절의 힘입니다. 사주 전체의 분위기를 정하기 때문에 다른 자리보다 무겁게 계산합니다.'],
  '중화': ['강약', '나를 돕는 힘과 빼는 힘이 비슷하게 균형 잡힌 상태입니다(돕는 힘 42~58%). 한쪽으로 치우치지 않아 무난하다고 봅니다.'],
  '극약': ['강약', '나를 돕는 힘이 20% 미만으로 아주 약한 상태입니다. 이 정도면 억지로 돕기보다 강한 쪽을 따라가는 것(종격)이 낫다고 보는 학파도 있습니다.'],
  '태약': ['강약', '나를 돕는 힘이 20~30%로 많이 약한 상태입니다. 나를 도와주는 운이 올 때 크게 힘을 얻습니다.'],
  '신약': ['강약', '나를 돕는 힘이 30~42%로 약간 약한 상태입니다. 혼자보다는 도움을 받으며 일할 때 좋다고 봅니다.'],
  '신강': ['강약', '나를 돕는 힘이 58~70%로 약간 센 상태입니다. 주관이 뚜렷하고 스스로 밀고 나가는 힘이 있습니다.'],
  '태강': ['강약', '나를 돕는 힘이 70~80%로 많이 센 상태입니다. 힘을 밖으로 쓰거나 덜어 주는 운이 좋다고 봅니다.'],
  '극왕': ['강약', '나를 돕는 힘이 80% 이상으로 아주 센 상태입니다. 이 정도면 누르기보다 그 강한 기운을 따르는 것(전왕격)이 낫다고 보는 학파도 있습니다.'],
  '오행 비율': ['강약', '사주 글자들의 오행을 점수로 더해 비율로 나타낸 것입니다. 숨은 글자(지장간)를 어떻게 셀지, 태어난 달에 가중치를 얼마나 줄지에 따라 숫자가 크게 달라집니다. 사주 앱마다 비율이 다른 이유가 이것입니다.'],

  // ── 용신
  '용신': ['용신', '내 사주의 균형을 맞추는 데 가장 필요한 오행입니다. 부족한 것을 채워 주는 "약" 같은 기운이라, 용신 운이 오면 일이 잘 풀린다고 봅니다. 기준(억부·조후·통관 등)에 따라 답이 달라지므로 이 앱은 학파를 고르고 근거를 함께 보여줍니다.'],
  '희신': ['용신', '용신을 도와주는 오행입니다. 용신 다음으로 반가운 기운입니다.'],
  '기신': ['용신', '용신을 방해하는(극하는) 오행입니다. 가장 꺼리는 기운으로, 기신 운에는 조심하라고 봅니다.'],
  '구신': ['용신', '기신을 도와주는 오행입니다. 기신 다음으로 꺼리는 기운입니다.'],
  '한신': ['용신', '용신·희신·기신·구신 어디에도 속하지 않는 오행입니다. 크게 좋지도 나쁘지도 않은 중립적인 기운입니다.'],
  '억부': ['용신', '"강하면 누르고 약하면 돕는다"는 방식입니다. 내가 약하면 나를 돕는 오행을, 강하면 힘을 빼 주는 오행을 용신으로 정합니다. 가장 널리 쓰이는 기준입니다.'],
  '조후': ['용신', '사주의 온도와 습도를 맞추는 방식입니다. 한여름에 태어나 뜨거운 사주는 물로 식히고, 한겨울에 태어나 차가운 사주는 불로 데웁니다. 이 앱의 조후는 글자별 온도·습도를 더한 단순화 모델입니다.'],
  '통관': ['용신', '서로 싸우는 두 오행 사이를 이어 주는 오행을 쓰는 방식입니다. 예: 쇠와 나무가 부딪치면 쇠→물→나무로 흐르게 해 주는 물이 통관 용신입니다.'],
  '한난조습': ['용신', '사주가 차가운지(한), 따뜻한지(난), 습한지(습), 건조한지(조)를 보는 것입니다. 조후 용신을 정하는 근거가 됩니다.'],

  // ── 운
  '대운': ['운', '10년마다 바뀌는 인생의 큰 흐름입니다. 계절이 바뀌듯 10년 단위로 주어지는 환경이라고 생각하면 됩니다. 태어난 달 기둥(월주)에서 출발해 한 칸씩 앞으로(순행) 또는 뒤로(역행) 이동합니다.'],
  '대운수': ['운', '첫 대운이 시작되는 나이입니다. 예: 대운수가 5면 5세, 15세, 25세…에 대운이 바뀝니다. 태어난 때부터 가까운 절기까지의 날짜를 3으로 나눠 구합니다(3일=1년).'],
  '순행': ['운', '대운이 60갑자 순서대로 앞으로 나아가는 것입니다. 양의 해에 태어난 남자, 음의 해에 태어난 여자가 해당합니다.'],
  '역행': ['운', '대운이 60갑자 순서를 거꾸로 거슬러 가는 것입니다. 음의 해에 태어난 남자, 양의 해에 태어난 여자가 해당합니다.'],
  '세운': ['운', '해마다 바뀌는 그해의 기운입니다. 예: 2026년은 병오년입니다. 입춘을 기준으로 바뀝니다. 대운이 10년의 계절이라면 세운은 그해의 날씨와 같습니다.'],
  '월운': ['운', '달마다 바뀌는 기운입니다. 매달 절기(입춘·경칩 등)를 기준으로 바뀝니다.'],
  '일운': ['운', '날마다 바뀌는 그날의 기운으로 "일진"이라고도 합니다. 달력의 점수는 그날의 간지가 이 사주에 필요한 기운(용신)인지를 따져 매긴 값입니다.'],
  '삼재': ['운', '삼재는 전통 민속에서 사람의 띠를 기준으로 일정한 주기에 걸쳐 주의가 필요하다고 보는 3년의 시기를 말합니다.\n보통 첫해를 들삼재, 두 번째 해를 눌삼재, 세 번째 해를 날삼재라고 부릅니다.\n이 앱에서는 삼재를 전통적인 참고 정보로 표시하며, 삼재라는 이유만으로 해당 연도의 흐름 점수를 낮추지는 않습니다.\n실제 운세 흐름은 원국과 대운·세운의 오행, 십신, 합충형파해, 억부·조후 등의 관계를 별도로 계산합니다.'],
  '들삼재': ['운', '삼재가 시작되는 첫 번째 해를 뜻합니다. 전통적으로 새로운 변화나 외부 환경의 변동에 주의를 기울이는 시기로 해석합니다.'],
  '눌삼재': ['운', '삼재의 두 번째 해를 뜻합니다. 전통적으로 삼재의 영향이 이어지는 시기로 해석합니다.'],
  '날삼재': ['운', '삼재의 마지막 해를 뜻합니다. 전통적으로 삼재의 흐름에서 벗어나는 과정으로 해석합니다.'],
  '손 없는 날': ['운', '민간 풍습에서 "손"은 날짜마다 방향을 옮겨 다니며 사람의 일을 방해한다는 귀신입니다. 음력 날짜 끝자리가 9·0인 날(9·10·19·20·29·30일)에는 손이 하늘로 올라가 없다고 봐서 이사·결혼 날로 선호합니다. 사주 해석과는 별개인 풍습이라 이 앱의 흐름 점수에는 반영하지 않습니다.'],
  '시진': ['운', '하루 24시간을 12지지로 나눈 2시간 단위입니다. 자시(밤 11시~새벽 1시)부터 해시(밤 9~11시)까지입니다.'],
  '흐름 점수': ['운', '들어오는 운이 현재 원국의 불균형을 얼마나 보완하거나 심화시키는지를 나타내는 상대 지표입니다(−100~+100). 미래의 행운·불운 확률이 아닙니다.\n+ 값은 원국에 필요한 방향과 잘 맞는다는 뜻, 0 부근은 영향이 섞이거나 중립, − 값은 기존 불균형이나 부담을 강화한다는 뜻입니다.\n네 성분을 사주에 맞춰 섞습니다. 억부(신강·신약을 맞추는 오행), 조후(한난조습 치우침을 줄이는지), 관계(원국과의 합·충·귀인), 구조(원국에서 모자란 십성 묶음을 채우는지). 강약 치우침이 크면 억부, 기후 치우침이 크면 조후 비중이 커지고, 둘 다 크지 않은 중화 사주는 특정 용신 하나의 영향력이 줄어듭니다.\n세운·월운은 대운과 40%:60%로 섞습니다. 해석을 돕는 참고용 모델이며 통계적으로 검증된 예측이 아닙니다.'],
  '상태 순풍': ['운의 시기', '상태 순풍: 흐름 점수가 높아, 이 시기에 활성화되는 일이 원국에 필요한 방향을 보완하는 상태입니다. 어떤 일이 활성화되는지는 시기 유형(공격기·수확기 등)이 따로 알려 줍니다.'],
  '상태 보통': ['운의 시기', '상태 보통: 보완과 부담이 섞이거나 영향이 중립적인 상태입니다.'],
  '상태 주의': ['운의 시기', '상태 주의: 활성화되는 일이 원국의 기존 불균형을 조금 키우는 상태입니다. 시기 유형은 그대로 두고, 그 일을 할 때 리스크 관리가 필요하다는 뜻입니다. 예: 수확기 + 주의 = 결과 회수 성향은 강하지만 무리한 확장·지출은 점검.'],
  '상태 부담': ['운의 시기', '상태 부담: 활성화되는 일이 원국의 불균형을 크게 키워 부담이 큰 상태입니다. 작용 강도까지 높으면 시기 유형이 방어기가 됩니다.'],

  // ── 운의 시기
  '운의 시기': ['운의 시기', '운을 좋다·나쁘다로 가르지 않고, 그 시기에 어떤 활동·환경이 가장 강하게 나타나는지로 나눈 것입니다. 공격기·확장기·수확기·축적기·전환기·방어기 여섯 가지가 있습니다.\n시기 유형(무엇이 활성화되는가)과 상태(순풍·보통·주의·부담: 그 활성화가 원국에 얼마나 맞는가)는 따로 봅니다. 예: 수확기 + 순풍, 공격기 + 주의.\n같은 이름이라도 운의 단위마다 풀이가 다릅니다. 대운은 10년짜리 장기 환경, 세운은 1년의 실행 환경, 월운은 1개월의 전술, 일진은 하루의 행동(공격일·확장일 등), 시진은 실행 타이밍(◎ 실행·○ 활용·△ 주의·× 회피)입니다.\n들어오는 기운에 따라 성향이 다릅니다. 비겁·식상이면 공격, 관성이면 확장, 재성이면 수확, 인성이면 축적 성향입니다. 다만 이것만으로 정하지 않고 변화 점수·흐름 점수·작용 강도를 함께 봅니다.'],
  '공격기': ['운의 시기', '의미: 새로운 활동·표현·생산·경쟁·독립·개척 작용이 강한 때입니다. 나와 같은 기운(비겁)이나 내가 만드는 기운(식상)이 주도합니다.\n행동: 대운(10년)은 창업·이직·새 분야 진출, 세운(1년)은 신규 계약·론칭·영업, 월운(1개월)은 제안서 발송·미팅·출시. 상태가 주의·부담이면 속도를 조절합니다.'],
  '확장기': ['운의 시기', '의미: 사회적 역할·책임·조직·지위·외부 영향력이 커지는 작용이 강한 때입니다. 관성이 주도합니다. 공격기가 새 길을 뚫는 때라면, 확장기는 역할과 영향력을 넓히는 때입니다.\n행동: 대운은 규모 확대·승진·조직 키우기, 세운은 증액·재계약·파트너십, 월운은 광고 증액·협업 확대. 상태가 주의·부담이면 과부하를 관리합니다.'],
  '수확기': ['운의 시기', '의미: 재물·거래·결과물·현금화·성과 회수 작용이 강한 때입니다. 재성이 주도합니다.\n행동: 대운은 자산화·지분 정리·정산, 세운은 계약 확정·수금·판매·성과 회수, 월운은 청구·수금·마감. 상태가 주의·부담이면 "수확 성향 + 주의"로 읽고 지출·확장을 점검합니다.'],
  '전환기': ['운의 시기', '의미: 합·충·형·파·해로 구조가 재편되는 신호(변화 점수)가 기준을 넘은 때입니다. 일지·월지 충, 일간 천간충처럼 핵심 자리의 변화는 점수가 크고, 년주 변화는 작으며, 삼합·방합 완성이나 여러 신호의 겹침은 점수를 더합니다.\n행동: 대운은 업종 전환·이주·인생 재설계, 세운은 조직 개편·이사·이직·사업 모델 변경, 월운은 계약 해지·거래처 교체·리뉴얼. 변화가 원국에 맞는지는 상태(순풍·주의 등)가 따로 알려 줍니다.'],
  '축적기': ['운의 시기', '의미: 학습·회복·준비·보호·시스템·내부 기반을 쌓는 작용이 강한 때입니다. 인성이 주도합니다.\n행동: 대운은 학위·자격·전문성 쌓기, 세운은 제품 개발·교육·시스템 정비, 월운은 제작·기획·문서·재무 점검. 당장의 성과보다 다음 시기를 위한 기반에 집중합니다.'],
  '방어기': ['운의 시기', '의미: 흐름 점수가 크게 낮으면서 작용 강도도 높아, 현재 원국이 감당할 범위를 넘을 가능성이 있는 때입니다. 나쁜 때라는 뜻이 아니라 리스크 관리가 필요하다는 뜻입니다.\n행동: 대운은 부채·건강 관리와 위험 분산, 세운은 현금 보존·비용 절감·하던 일 완주, 월운은 지출 줄이기·일정 여유 두기·휴식.'],

  // ── 일진 행동모드·시진 실행 등급
  '일진 행동모드': ['운의 시기', '하루를 "오늘 어떤 성격의 일이 활성화되는가"로 나눈 여섯 가지입니다. 공격일(새 판을 뚫음), 확장일(역할·영향력을 키움), 수확일(결과를 회수), 축적일(내부 역량 강화), 전환일(구조를 바꿈), 방어일(리스크 관리)이 있습니다. 순풍·보통·주의·부담 상태는 따로 표시됩니다.'],
  '공격일': ['운의 시기', '핵심 의미: 새로운 판을 뚫는 날입니다. 필요한 기운이 들어오면서 나와 같은 기운(비겁)이나 내가 만드는 기운(식상)이 강해질 때입니다.\n그날 할 일: 제안·투고·영업·협상·고백·발표.'],
  '확장일': ['운의 시기', '핵심 의미: 검증된 것을 키우는 날입니다. 필요한 기운이 들어오면서 규칙·조직·지위의 기운(관성)이 강해질 때입니다.\n그날 할 일: 증액·재계약·파트너십·홍보 확대.'],
  '수확일': ['운의 시기', '핵심 의미: 결과를 회수하는 날입니다. 필요한 기운이 들어오면서 재물·결과의 기운(재성)이 강해질 때입니다.\n그날 할 일: 계약 확정·수금·판매·성과 회수.'],
  '축적일': ['운의 시기', '핵심 의미: 내부 역량을 강화하는 날입니다. 나를 채워 주는 기운(인성)이 들어오거나, 크게 좋지도 나쁘지도 않은 날입니다.\n그날 할 일: 제작·기획·공부·문서·재무·저축.'],
  '전환일': ['운의 시기', '핵심 의미: 기존 구조를 바꾸는 날입니다. 그날의 글자가 나의 핵심 자리(일지·월지·일간)와 충·형을 만들거나 크게 합을 이룰 때입니다.\n그날 할 일: 해지·이직·이사·정리·리뉴얼.'],
  '방어일': ['운의 시기', '핵심 의미: 부담이 감당 범위를 넘을 수 있어 리스크를 관리하는 날입니다. 새로 벌이기보다 지키는 편이 맞는 날입니다.\n그날 할 일: 검토·유지·완료·휴식·현금 보존.'],
  '실행 등급': ['운의 시기', '시진(2시간 단위)마다 "오늘의 목적"과 얼마나 잘 맞는지를 네 단계로 매긴 것입니다. ◎ 실행, ○ 활용, △ 주의, × 회피가 있습니다. 목적(일반·계약·돈·창작)을 고르면 그 목적에 맞는 기운이 들어오는 시간에 ◎가 붙습니다. 계약은 관성·인성, 돈은 재성·식상, 창작은 식상·인성 기운을 봅니다.'],
  '실행': ['운의 시기', '◎ 실행: 그날의 목적과 시진이 잘 맞는 시간입니다. 중요한 전화, 제출, 계약 서명, 공개 버튼 누르기처럼 결과가 생기는 행동을 이 시간에 둡니다.'],
  '활용': ['운의 시기', '○ 활용: 특별히 강하지는 않지만 안정적인 시간입니다. 회의·업무·제작 같은 일반적인 일에 무난합니다.'],
  '주의': ['운의 시기', '△ 주의: 원국의 일지·월지나 그날 일진과 충·형·파·해 같은 불안 요소가 있는 시간입니다. 중요한 결정은 가능하면 다른 시간대로 옮깁니다.'],
  '회피': ['운의 시기', '× 회피: 그날의 목적과 충돌이 상당히 강한 시간입니다(그날 일진과 정면 충돌하거나 점수가 크게 낮음). 굳이 이 시간에 중요한 일을 둘 이유가 없다면 피합니다.'],
  '판정 순서': ['운의 시기', '하루를 판단할 때 큰 흐름에서 작은 흐름 순서로 봅니다. ① 세운(올해 기본 환경) → ② 월운(이번 달 행동 방향) → ③ 일진(오늘의 행동모드) → ④ 목적(계약인지, 돈인지, 창작인지) → ⑤ 시진(실제 실행 시간).'],

  // ── 구조
  '관살혼잡': ['구조', '정관(규칙)과 편관(압박)이 함께 있는 구조입니다. 나를 누르는 기준이 여러 방향에서 들어와 진로·직장·이성 관계에서 선택이 복잡해진다고 봅니다. 식신이 편관을 다스리거나 한쪽이 합으로 묶이면 문제가 줄어듭니다. 천간에 둘 다 있으면 "강", 지지까지 포함해야 성립하면 "약"으로 표시합니다.'],
  '상관견관': ['구조', '상관(반항·자유로운 표현)이 정관(규칙·윗사람)을 공격하는 구조입니다. 조직이나 윗사람과 부딪치기 쉽고 말실수로 구설에 오르기 쉽다고 봅니다. 인성(공부·절제)이나 재성이 사이에 있으면 완화됩니다.'],
  '식신제살': ['구조', '식신(실력)이 편관(압박·위기)을 다스리는 구조입니다. 위기가 와도 실력으로 이겨낸다고 보아 좋은 구조로 칩니다. 전문가·군인·경찰 등에서 두각을 나타낸다고 봅니다.'],
  '효신탈식(도식)': ['구조', '편인이 식신을 공격하는 구조로, "밥그릇을 엎는다"고 해서 도식이라 부릅니다. 하고 싶은 일이 막히거나, 생각만 많고 실행이 안 되는 것으로 봅니다. 재성이 편인을 눌러 주면 풀립니다.'],
  '상관패인': ['구조', '정인(공부·절제)이 상관(날카로운 재능)을 다스리는 구조입니다. 거친 재능을 공부와 규범으로 다듬는다고 보아 좋은 구조로 칩니다.'],
  '살인상생': ['구조', '편관(압박)의 힘을 인성(공부·도움)이 받아서 나에게 넘겨주는 구조입니다. 압박과 시련이 오히려 성장의 원동력이 된다고 봅니다.'],
  '재다신약': ['구조', '재물(재성)은 많은데 나는 약한 구조입니다. 돈 벌 기회는 많지만 감당할 힘이 부족해 오히려 돈에 치인다고 봅니다. 나를 도와주는 비겁 운이 오면 좋아집니다.'],
  '관살과다': ['구조', '나를 누르는 관성이 지나치게 많고 나는 약한 구조입니다. 책임과 압박, 스트레스가 크다고 봅니다. 인성(공부·도움)으로 압박을 받아 넘기는 것이 해결책입니다.'],
  '식상과다(설기)': ['구조', '식상이 많아 내 기운이 지나치게 밖으로 빠져나가는 구조입니다. 재능과 말은 많지만 쉽게 지치고 소진된다고 봅니다.'],
  '군겁쟁재': ['구조', '비겁(형제·동료)이 많아 적은 재물을 여럿이 나눠 가지려 다투는 구조입니다. 동업, 보증, 형제 간 돈 문제로 손해 보지 않도록 조심하라고 봅니다.'],
  '인성과다': ['구조', '나를 돕는 인성이 지나치게 많은 구조입니다. 생각이 많고 실행이 늦으며, 남에게 기대기 쉽다고 봅니다. 재성(현실 감각)으로 인성을 눌러 주는 것이 좋습니다.'],
  '무비겁': ['구조', '사주에(숨은 글자 포함) 비겁이 없습니다. 기댈 형제나 동료가 적고 혼자 해결하는 일이 많다고 봅니다.'],
  '무식상': ['구조', '사주에(숨은 글자 포함) 식상이 없습니다. 표현이 서툴 수 있고, 운에서 식상이 들어올 때 재능이 드러나는 변화가 크다고 봅니다.'],
  '무재': ['구조', '사주에(숨은 글자 포함) 재성이 없습니다. 돈에 대한 집착이 적거나, 운에서 재성이 들어올 때 재물 기회가 온다고 봅니다.'],
  '무관': ['구조', '사주에(숨은 글자 포함) 관성이 없습니다. 조직의 틀에 얽매이지 않고 자유로운 성향으로 봅니다.'],
  '무인성': ['구조', '사주에(숨은 글자 포함) 인성이 없습니다. 도와주는 사람보다 스스로 부딪쳐 배우는 일이 많다고 봅니다.'],
  '오행 결핍': ['구조', '숨은 글자까지 포함해도 어떤 오행이 하나도 없는 상태입니다. 그 오행이 운에서 들어오면 영향이 크게 느껴진다고 봅니다. 없는 오행이 곧 용신이라는 뜻은 아닙니다.'],

  // ── 일간 (천간 글자를 누르면 열림)
  '갑목': ['일간', '갑목(甲木)은 하늘로 곧게 뻗은 큰 나무입니다. 곧고 정직하며 앞장서서 이끄는 리더 기질이 있고, 명분과 원칙을 중요하게 여깁니다. 새로운 일을 개척하는 추진력이 강한 반면, 굽히기 싫어해서 고집이 세 보일 수 있습니다.'],
  '을목': ['일간', '을목(乙木)은 풀, 꽃, 덩굴처럼 부드럽지만 질긴 식물입니다. 환경에 맞춰 유연하게 휘어지며 살아남는 적응력과 친화력이 뛰어나고 섬세하며 실속을 챙깁니다. 다만 남에게 기대려 하거나 예민해지기 쉽습니다.'],
  '병화': ['일간', '병화(丙火)는 세상을 환하게 비추는 태양입니다. 밝고 솔직하며 열정적이고, 자신을 드러내고 인정받고 싶어 합니다. 시작은 화끈하지만 급하거나 끈기가 부족하다는 말을 듣기도 합니다.'],
  '정화': ['일간', '정화(丁火)는 촛불, 등불, 별빛처럼 은은하게 오래 비추는 불입니다. 섬세하고 배려심이 깊으며 한 가지에 집중하는 힘과 속 깊은 열정이 있습니다. 감정을 속으로 삭이는 편이라 예민해지기도 합니다.'],

    '병진': '봄 들판 위의 해, 안개 낀 날의 햇빛입니다. 해가 땅을 데우며 베푸는 모양이라 여유롭고 나누기를 좋아하며 표현력이 좋은 기운입니다. 낙천적이지만 느긋해서 추진이 늦기도 합니다.',

Object.assign(GLOSSARY, {
  // ── 기초
  '자미두수': ['자미두수', '태어난 음력 날짜와 시각으로 하늘의 별 100여 개를 12칸(12궁)에 배치해 인생을 읽는 동양 점성술입니다. 사주가 "여덟 글자의 오행 균형"을 본다면, 자미두수는 "돈·배우자·직업처럼 삶의 영역마다 어떤 별이 들어 있는지"를 봅니다. 그래서 영역별 질문에 답하기가 쉽습니다. 태어난 시각을 모르면 명반을 세울 수 없습니다.'],
  '명반': ['자미두수', '자미두수의 별 배치도입니다. 가운데를 비운 4×4 칸에 12궁이 둘러서 있고, 각 칸에 별이 들어갑니다. 칸의 위치는 12지지(자·축·인…)로 고정되어 있고, 어느 칸이 명궁이 되는지는 태어난 달과 시각으로 정해집니다.'],
  '오행국': ['자미두수', '명궁 간지의 오행으로 정하는 "그릇의 종류"입니다. 수2국·목3국·금4국·토5국·화6국 다섯 가지가 있습니다. 숫자는 첫 대한이 시작되는 나이이고, 자미성의 위치를 정하는 데도 쓰입니다. 예: 화6국이면 6세부터 첫 대한이 시작됩니다.'],
  '대한': ['자미두수', '10년 단위로 바뀌는 운으로, 사주의 대운과 같은 개념입니다. 명궁에서 시작해 한 칸씩 옮겨 가며, 그 10년 동안은 해당 칸이 "그 시기의 명궁" 역할을 합니다. 양의 해에 태어난 남자·음의 해에 태어난 여자는 시계 방향, 그 반대는 시계 반대 방향으로 갑니다. 나이는 태어나자마자 1살로 세는 세는나이입니다.'],
  '유년': ['자미두수', '해마다 바뀌는 운으로, 사주의 세운과 같습니다. 그해의 띠(지지)와 같은 칸이 그해의 명궁 역할을 합니다. 예: 말띠 해(午년)에는 午 칸이 유년 명궁입니다.'],
  '신궁': ['자미두수', '"몸의 궁"입니다. 명궁이 타고난 성향이라면 신궁은 살아가며 드러나는 모습, 특히 중년 이후 중요해지는 영역을 봅니다. 신궁은 따로 칸을 차지하지 않고 12궁 중 하나에 겹쳐서 표시됩니다.'],
  '명주': ['자미두수', '명궁이 놓인 지지로 정해지는 "타고난 성향을 대표하는 별"입니다. 그 별의 성질이 나의 기본 기질에 스며 있다고 봅니다.'],
  '신주': ['자미두수', '태어난 해의 띠로 정해지는 "살아가며 드러나는 모습을 대표하는 별"입니다. 중년 이후의 모습과 관련 있다고 봅니다.'],
  '사화': ['자미두수', '태어난 해의 천간에 따라 네 개의 별이 특별한 성질을 띠게 되는 것입니다. 화록(재물·기회), 화권(힘·주도권), 화과(명예·인정), 화기(막힘·집착)가 있습니다. 어느 궁에 사화가 붙었는지가 해석의 핵심 포인트입니다.'],
  '화록': ['자미두수', '사화 중 "록(祿)"입니다. 재물, 기회, 인연, 순조로움을 뜻합니다. 화록이 붙은 궁의 영역은 잘 풀리고 이득이 생기기 쉽다고 봅니다.'],

  '화과': ['자미두수', '사화 중 "과(科)"입니다. 명예, 좋은 평판, 시험·학업, 귀인의 도움을 뜻합니다. 화과가 붙은 궁의 영역에서 인정받는다고 봅니다.'],
  '화기': ['자미두수', '사화 중 "기(忌)"입니다. 막힘, 집착, 걱정, 손실을 뜻합니다. 화기가 붙은 궁의 영역은 신경 쓸 일이 많고 마음처럼 안 되기 쉽지만, 그만큼 집중하고 매달리는 영역이기도 합니다.'],
  '삼방사정': ['자미두수', '한 궁을 볼 때 함께 봐야 하는 네 칸입니다. 그 궁 자신, 마주 보는 궁(대궁), 그리고 네 칸씩 떨어진 두 궁(삼합 자리)입니다. 예: 명궁을 볼 때는 천이궁·재백궁·관록궁을 같이 봅니다. 별의 힘은 이 네 칸이 서로 주고받는다고 봅니다.'],
  '대궁': ['자미두수', '정반대편에서 마주 보는 궁입니다. 비어 있는 궁(주성이 없는 궁)은 대궁의 주성을 빌려 와서 해석합니다.'],
  '공궁': ['자미두수', '14주성이 하나도 들어 있지 않은 궁입니다. 나쁜 뜻이 아니라, 마주 보는 대궁의 주성을 빌려 와서 해석합니다. 그 영역이 주변 환경에 영향을 많이 받는다고 봅니다.'],

  // ── 12궁
  '명궁': ['자미 12궁', '나 자신의 궁입니다. 타고난 성격, 재능, 외모, 인생 전체의 방향을 봅니다. 명반에서 가장 먼저, 가장 중요하게 보는 칸입니다.'],
  '형제궁': ['자미 12궁', '형제자매와 가까운 친구, 동료와의 관계를 봅니다. 어머니와의 관계를 함께 보기도 합니다.'],
  '부처궁': ['자미 12궁', '배우자와 연애, 결혼 생활을 봅니다. 어떤 사람과 인연이 닿는지, 부부 관계가 어떤지를 읽습니다.'],
  '자녀궁': ['자미 12궁', '자녀와의 관계, 아랫사람, 제자를 봅니다. 성생활이나 창작물을 함께 보기도 합니다.'],
  '재백궁': ['자미 12궁', '돈을 버는 방식과 쓰는 방식, 재물운을 봅니다. 월급형인지 사업형인지, 돈이 모이는지 새는지를 읽습니다.'],
  '질액궁': ['자미 12궁', '건강과 체질, 조심해야 할 질병과 사고를 봅니다.'],
  '천이궁': ['자미 12궁', '밖에 나갔을 때의 나, 이동과 여행, 해외, 사회에서 만나는 기회를 봅니다. 명궁과 마주 보고 있어 명궁 다음으로 중요하게 봅니다.'],
  '노복궁': ['자미 12궁', '친구, 동료, 부하 직원, 사회에서 만나는 사람들과의 관계를 봅니다. "교우궁"이라고도 합니다.'],
  '관록궁': ['자미 12궁', '직업과 일, 사회적 성취, 학업을 봅니다. 어떤 일이 잘 맞는지, 직장에서 어떻게 인정받는지를 읽습니다.'],
  '전택궁': ['자미 12궁', '집과 부동산, 사는 환경, 가정의 분위기를 봅니다.'],

  '부모궁': ['자미 12궁', '부모와의 관계, 윗사람·상사와의 관계, 문서와 계약 운을 봅니다.'],

  // ── 보좌성
  '좌보': ['자미 보좌성', '왼쪽에서 돕는 별로 우필과 짝을 이룹니다. 주변의 도움, 협력자, 인복을 뜻하는 좋은 별입니다.'],
  '우필': ['자미 보좌성', '오른쪽에서 돕는 별로 좌보와 짝을 이룹니다. 좌보처럼 도움과 인복을 뜻하며, 특히 뒤에서 조용히 돕는 사람을 뜻합니다.'],
  '문창': ['자미 보좌성', '글과 학문의 별로 문곡과 짝을 이룹니다. 공부, 시험, 문서, 글재주를 뜻하는 좋은 별입니다.'],
  '문곡': ['자미 보좌성', '재주와 말솜씨의 별로 문창과 짝을 이룹니다. 예술적 감각, 말재주, 손재주를 뜻하는 좋은 별입니다.'],
  '천괴': ['자미 보좌성', '낮의 귀인 별로 천월과 짝을 이룹니다. 윗사람이나 드러난 곳에서 도와주는 사람, 좋은 기회를 뜻합니다.'],
  '천월': ['자미 보좌성', '밤의 귀인 별로 천괴와 짝을 이룹니다. 보이지 않는 곳에서 도와주는 사람, 뜻밖의 도움을 뜻합니다.'],
  '녹존': ['자미 보좌성', '재물과 녹봉의 별입니다. 안정된 수입과 재물을 지키는 힘을 뜻합니다. 양옆에 경양과 타라가 늘 붙어 다녀서, 지키려는 만큼 경쟁도 따른다고 봅니다.'],
  '천마': ['자미 보좌성', '말을 타고 달리는 별입니다. 이동, 출장, 해외, 바쁘게 움직이며 기회를 잡는 것을 뜻합니다. 녹존이나 화록과 만나면 "움직여서 돈을 번다"고 봅니다.'],
  '홍란': ['자미 보좌성', '연애와 결혼의 기쁜 별로 천희와 짝을 이룹니다. 인연, 매력, 경사스러운 일을 뜻합니다.'],
  '천희': ['자미 보좌성', '기쁜 일의 별로 홍란과 짝을 이룹니다. 결혼·출산 같은 경사, 즐거운 소식을 뜻합니다.'],
  '경양': ['자미 보좌성', '날카로운 칼의 별로, 조심해야 할 여섯 살성 중 하나입니다. 경쟁, 다툼, 다침을 뜻하지만 강한 추진력이 되기도 합니다.'],
  '타라': ['자미 보좌성', '끌고 늦추는 별로, 조심해야 할 여섯 살성 중 하나입니다. 일이 지연되고 질질 끄는 것, 속으로 삭이는 고민을 뜻합니다. 대신 끈기와 인내가 됩니다.'],
  '화성': ['자미 보좌성', '불같이 급한 별로, 조심해야 할 여섯 살성 중 하나입니다. 갑작스러운 변화, 급한 성격, 충동을 뜻합니다. 탐랑과 만나면 뜻밖의 큰 행운이 되기도 합니다.'],
  '영성': ['자미 보좌성', '속에서 타는 불의 별로, 조심해야 할 여섯 살성 중 하나입니다. 속으로 끓는 불만, 은근한 스트레스를 뜻합니다.'],
  '지공': ['자미 보좌성', '"텅 빈" 별로, 조심해야 할 여섯 살성 중 하나입니다. 계획이 허공에 뜨거나 손재가 생기는 것을 뜻하지만, 기발한 발상과 정신적 깊이가 되기도 합니다.'],
  '지겁': ['자미 보좌성', '"빼앗기는" 별로, 조심해야 할 여섯 살성 중 하나입니다. 갑작스러운 손실과 좌절을 뜻하지만, 틀을 깨는 대담함이 되기도 합니다.'],

  // ── 밝기·운의 사화
  '별의 밝기': ['자미두수', '같은 별이라도 어느 칸(지지)에 있느냐에 따라 힘이 다릅니다. 가장 밝은 것부터 묘(廟, 아주 강함)·왕(旺, 강함)·득(得, 제자리를 얻음)·리(利, 조금 유리)·평(平, 보통)·불(不, 조금 약함)·함(陷, 약함, 빛이 가려짐) 순입니다. 밝은 별은 좋은 성질이 잘 드러나고, 어두운 별은 약점이 드러나기 쉽다고 봅니다. 밝기 표는 유파마다 몇 칸씩 다를 수 있습니다.'],
  '대한 사화': ['자미두수', '10년 대한 칸의 천간으로 새로 정해지는 사화입니다. 태어난 해의 사화(생년 사화)가 평생의 바탕이라면, 대한 사화는 그 10년 동안 어떤 영역에 기회(록)·힘(권)·인정(과)·막힘(기)이 생기는지를 보여줍니다. 명반에서는 "대"가 붙은 테두리 배지로 표시합니다.'],
  '유년 사화': ['자미두수', '그해 천간으로 정해지는 사화입니다. 예: 병(丙)년에는 천동 화록, 천기 화권, 문창 화과, 염정 화기가 됩니다. 그해에 어느 영역이 잘 풀리고 어디서 막히는지를 봅니다. 명반에서는 "년"이 붙은 점선 테두리 배지로 표시합니다.'],
  '잡성': ['자미두수', '14주성과 주요 보좌성 외에 명반에 들어가는 작은 별들입니다. 힘은 약하지만 연애·학업·질병·고독 같은 구체적인 분위기를 더해 줍니다. 해석할 때는 주성을 먼저 보고, 잡성은 양념처럼 참고합니다.'],

  // ── 잡성
  '천관': ['자미 잡성', '벼슬의 별입니다. 승진, 직위, 공적인 명예와 인연이 있다고 봅니다.'],
  '천복': ['자미 잡성', '복을 받는 별입니다. 먹고사는 복, 편안하게 누리는 복이 있다고 봅니다.'],
  '천주': ['자미 잡성', '부엌의 별입니다. 먹을 복, 요리 솜씨, 음식과 관련된 인연을 뜻합니다.'],
  '천재': ['자미 잡성', '재능의 별입니다. 타고난 재주와 총명함을 뜻합니다.'],
  '천수': ['자미 잡성', '장수의 별입니다. 건강하게 오래 사는 기운, 어른스러움을 뜻합니다.'],
  '용지': ['자미 잡성', '용이 사는 연못이라는 뜻으로 봉각과 짝을 이룹니다. 품위, 예술적 재능, 시험운을 뜻합니다.'],
  '봉각': ['자미 잡성', '봉황의 누각이라는 뜻으로 용지와 짝을 이룹니다. 멋과 명예, 좋은 평판을 뜻합니다.'],
  '천곡': ['자미 잡성', '우는 별로 천허와 짝을 이룹니다. 슬픔, 걱정, 눈물 흘릴 일을 뜻합니다.'],
  '천허': ['자미 잡성', '텅 빈 별로 천곡과 짝을 이룹니다. 허전함, 공허함, 실속 없음을 뜻합니다.'],
  '천덕': ['자미 잡성', '하늘의 덕이라는 뜻입니다. 나쁜 일을 누그러뜨리고 어려울 때 도움을 받게 해 준다고 봅니다.'],
  '월덕': ['자미 잡성', '달의 덕이라는 뜻입니다. 천덕처럼 흉함을 줄여 주고 성품을 온화하게 한다고 봅니다.'],
  '천공': ['자미 잡성', '하늘이 빈 별입니다. 계획이 뜻대로 안 되고 헛수고하기 쉽다고 보지만, 정신적인 깊이와 발상이 되기도 합니다.'],
  '고진': ['자미 잡성', '외로운 별로 과숙과 짝을 이룹니다. 혼자 있는 시간이 많고 독립적인 성향을 뜻합니다. 남성에게 더 강하게 작용한다고 봅니다.'],
  '과숙': ['자미 잡성', '홀로 지내는 별로 고진과 짝을 이룹니다. 외로움과 독립심을 뜻하며, 여성에게 더 강하게 작용한다고 봅니다.'],
  '비렴': ['자미 잡성', '날아다니는 벌레라는 뜻입니다. 구설수, 뒷말, 사소한 방해를 조심하라는 별입니다.'],
  '파쇄': ['자미 잡성', '깨지고 부서지는 별입니다. 일이 자잘하게 어그러지거나 물건이 망가지는 것을 뜻합니다.'],
  '화개': ['자미 잡성', '꽃을 덮는 덮개라는 뜻입니다. 학문·종교·예술에 대한 관심, 혼자 깊이 파고드는 성향을 뜻합니다.'],
  '함지': ['자미 잡성', '도화(桃花)의 별입니다. 매력, 이성 관계, 유흥을 뜻합니다. 지나치면 이성 문제를 조심하라고 봅니다.'],
  '연해': ['자미 잡성', '태어난 해 기준으로 어려움을 풀어 주는 별입니다. 막힌 일이 풀리고 걱정이 해소된다고 봅니다.'],
  '해신': ['자미 잡성', '태어난 달 기준으로 어려움을 풀어 주는 별입니다. 다툼이나 문제가 원만히 해결된다고 봅니다.'],
  '천형': ['자미 잡성', '형벌의 별입니다. 규율, 법, 수술, 엄격함을 뜻합니다. 법조·의료·군경 쪽에서는 오히려 힘이 됩니다.'],
  '천요': ['자미 잡성', '요염한 별입니다. 매력과 풍류, 예술적 감각, 이성 인연을 뜻합니다.'],
  '천무': ['자미 잡성', '무당의 별입니다. 직관, 종교·신비한 것에 대한 관심, 물려받는 유산을 뜻합니다.'],
  '음살': ['자미 잡성', '어두운 기운의 별입니다. 뒤에서 방해하는 사람, 원인 모를 불안을 조심하라는 뜻입니다.'],
  '태보': ['자미 잡성', '높은 벼슬의 별로 봉고와 짝을 이룹니다. 지위와 명예를 돕는다고 봅니다.'],
  '봉고': ['자미 잡성', '임금의 문서를 받는 별로 태보와 짝을 이룹니다. 상장·자격·명예로운 문서를 뜻합니다.'],
  '삼태': ['자미 잡성', '높은 자리의 별로 팔좌와 짝을 이룹니다. 지위가 오르고 체면이 서는 것을 뜻합니다.'],
  '팔좌': ['자미 잡성', '높은 자리의 별로 삼태와 짝을 이룹니다. 좋은 자리와 대접받는 것을 뜻합니다.'],
  '은광': ['자미 잡성', '은혜의 빛이라는 뜻으로 천귀와 짝을 이룹니다. 윗사람의 인정과 특별한 대우를 뜻합니다.'],
  '천귀': ['자미 잡성', '귀한 별로 은광과 짝을 이룹니다. 귀인의 도움과 명예를 뜻합니다.'],
  '절로': ['자미 잡성', '"길이 끊긴다"는 뜻의 절로공망 중 하나입니다. 일이 도중에 막히거나 멈추는 것을 뜻하며, 젊을 때 더 강하게 작용한다고 봅니다.'],
  '절공': ['자미 잡성', '절로공망의 다른 한 자리입니다. 절로처럼 일이 중간에 끊기거나 허사가 되는 것을 뜻합니다.'],
  '순공': ['자미 잡성', '태어난 해 간지의 공망 자리입니다. 그 칸의 기운이 비어 작용이 약해지거나 늦어진다고 봅니다. 사주의 공망과 같은 원리입니다.'],
  '천상(傷)': ['자미 잡성', '다침과 손해의 별로, 늘 노복궁에 들어갑니다. 주성 천상(天相)과는 다른 별입니다. 대한이나 유년이 이 칸에 오면 손실을 조심하라고 봅니다.'],
  '천사': ['자미 잡성', '재앙을 전하는 사자의 별로, 늘 질액궁에 들어갑니다. 대한이나 유년이 이 칸에 오면 건강과 사고를 조심하라고 봅니다.'],

  // ── 비성 사화
  '비성 사화': ['자미두수', '"날아가는 사화"라는 뜻입니다. 12궁은 저마다 천간을 갖고 있고, 그 천간으로도 사화(록·권·과·기)가 생깁니다. 예: 재백궁의 천간이 갑(甲)이면 염정 화록이 생기는데, 염정이 부처궁에 있으면 "재백궁이 부처궁으로 록을 날린다" = 돈이 배우자 쪽으로 흐른다고 풉니다. 어느 궁이 어느 궁에 영향을 주는지 보는 사화파(비성파)의 핵심 기법입니다.'],
  '자화': ['자미두수', '한 궁의 천간으로 생긴 사화가 바로 그 궁 안의 별에 붙는 것입니다. 스스로 만들어 스스로 쓰는 셈이라, 자화록은 알아서 잘 풀리되 오래 쌓이지 않고, 자화기는 스스로 문제를 만들거나 새어 나가는 것으로 봅니다.'],

  // ── 12신
  '12신': ['자미 12신', '칸마다 하나씩 붙는 작은 신(神) 네 계열입니다. 장생 12신(기운의 성장 단계), 박사 12신(녹존에서 출발하는 길흉), 장전 12신(태어난 해 삼합 기준, 사주의 12신살과 같은 체계), 세전 12신(태어난 해 지지에서 출발)이 있습니다. 주성보다 힘이 약해 참고용으로 봅니다.'],
  '장생 12신': ['자미 12신', '오행국에서 출발해 칸마다 장생·목욕·관대·임관·제왕·쇠·병·사·묘·절·태·양을 붙입니다. 사주의 12운성과 같은 단계로, 그 칸의 기운이 자라는 중인지 약해지는 중인지를 봅니다.'],
  '박사 12신': ['자미 12신', '녹존이 있는 칸에서 출발해 박사·역사·청룡·소모·장군·주서·비렴·희신·병부·대모·복병·관부를 붙입니다. 재물과 일의 길흉을 더해 봅니다.'],
  '장전 12신': ['자미 12신', '태어난 해의 삼합에 따라 장성에서 출발해 장성·반안·세역·식신·화개·겁살·재살·천살·지배·함지·월살·망신을 붙입니다. 사주의 12신살과 같은 체계라 설명도 같습니다(세역=역마살, 식신=육해살, 지배=지살, 함지=연살).'],
  '세전 12신': ['자미 12신', '태어난 해의 지지 칸에서 출발해 세건·회기·상문·관삭·관부·소모·대모·용덕·백호·천덕·조객·병부를 붙입니다. 해마다의 길흉, 특히 경조사와 관재를 볼 때 참고합니다.'],
  '임관': ['자미 12신', '장생 12신의 네 번째 단계로, 사주 12운성의 건록과 같습니다. 사회에 나가 제 힘으로 서는 단계로, 자립과 안정된 실력을 뜻합니다.'],
  '박사': ['자미 12신', '박사 12신의 첫째로, 늘 녹존과 같은 칸에 있습니다. 총명함과 지혜, 학문과 문서의 좋은 기운입니다.'],

  // ───────────── 관계·신살 ─────────────
  const memberName = (id, kind) => id === 'luck' ? '운' : M.POS_K[id] + (kind === 'stem' ? '간' : '지');
  function relList(rels) {

  function renderRel() {
    const ch = S.ch;

  // ───────────── 오행·강약 ─────────────
  // 오행 오각형: 바깥 실선 = 생(도와줌), 안쪽 점선 별 = 극(누름). 원 크기 = 비율
  function ohaengPentagon(ch) {
    const pct = ch.weights.pct, dEl = M.stemEl(ch.pillars.day.s);
    const W = 440, H = 356, cx = 220, cy = 180, R = 112;
    const pt = i => { const a = (-90 + i * 72) * Math.PI / 180; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; };
    const rad = i => 22 + Math.min(20, pct[i] * 0.4);
    const line = (i, j, cls) => {
      const [x1, y1] = pt(i), [x2, y2] = pt(j), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
      const a = rad(i) + 4, b = rad(j) + 9;
      return `<line class="${cls}" x1="${(x1 + ux * a).toFixed(1)}" y1="${(y1 + uy * a).toFixed(1)}" x2="${(x2 - ux * b).toFixed(1)}" y2="${(y2 - uy * b).toFixed(1)}" marker-end="url(#ah-${cls})"/>`;
    };
    let s = `<svg class="penta" viewBox="0 0 ${W} ${H}" role="img" aria-label="오행 생극 관계도">
      <defs>${['saeng', 'geuk'].map(c => `<marker id="ah-${c}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-${c}"/></marker>`).join('')}</defs>`;
    for (let i = 0; i < 5; i++) s += line(i, (i + 1) % 5, 'saeng');
    for (let i = 0; i < 5; i++) s += line(i, (i + 2) % 5, 'geuk');
    for (let i = 0; i < 5; i++) {
      const [x, y] = pt(i), r = rad(i), g = (i - dEl + 5) % 5;
      const [lx, ly] = [x, y + r + (i === dEl ? 20 : 15)];
      s += `<g class="${ECLS[i]}">
        ${i === dEl ? `<circle cx="${x}" cy="${y}" r="${r + 5}" class="me-ring"/>` : ''}
        <circle cx="${x}" cy="${y}" r="${r}" class="node"/>
        <text x="${x}" y="${y + 1}" text-anchor="middle" class="nh">${M.EL[i]}</text>
        <text x="${x}" y="${y + 17}" text-anchor="middle" class="np">${pct[i].toFixed(0)}%</text>
        <text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" class="nl">${i === dEl ? '나 · ' : ''}${M.EL_K[i]} · ${M.TG_GROUP[g]}</text>
      </g>`;
    }
    s += '</svg>';
    const rel = (g, t) => { const e = (dEl + g) % 5; return `<div class="li"><span class="k">${t}</span><span class="v"><b class="eltxt ${ECLS[e]}">${elLabel(e)}</b> · ${term(M.TG_GROUP[g])} <span class="muted small" style="display:inline">${pct[e].toFixed(1)}%</span></span><span></span></div>`; };
    return `<div class="penta-wrap"><div>${s}<div class="legend" style="justify-content:center"><span><i class="sw" style="background:var(--ink-3)"></i>실선 화살표: 생(도와줌)</span><span><i class="sw" style="background:var(--bad)"></i>점선 화살표: 극(누름)</span><span>원 크기 = 비율</span></div></div>
      <div class="list">${rel(0, '나와 같은 편')}${rel(4, '나를 돕는 것')}${rel(1, '내가 돕는 것')}${rel(2, '내가 누르는 것')}${rel(3, '나를 누르는 것')}
      <p class="note" style="padding-top:8px">생: 목→화→토→금→수→목 (나무는 불을 피우고, 불은 재를 남겨 흙이 되고, 흙 속에서 쇠가 나고, 쇠에 물이 맺히고, 물은 나무를 키웁니다). 극: 목→토→수→화→금→목 (나무는 흙을 뚫고, 흙은 물을 막고, 물은 불을 끄고, 불은 쇠를 녹이고, 쇠는 나무를 벱니다).</p></div></div>`;
  }
  // 한난조습 지도: 가로 = 건조↔습함, 세로 = 차가움↔더움. 가운데 점선 상자가 균형 구역
  function climateMap(c) {
    const S0 = 20, W = 260, px = h => S0 + (h + 2) / 4 * W, py = t => S0 + (2 - t) / 4 * W, cl = v => Math.max(-2, Math.min(2, v));
    const q = (x, y, w, h, cls, t, tx, ty) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${cls}"/><text x="${tx}" y="${ty}" class="cq-t" text-anchor="middle">${t}</text>`;
    const m = S0 + W / 2;
    return `<svg class="cmap" viewBox="0 0 300 300" role="img" aria-label="한난조습 지도">
      ${q(S0, S0, W / 2, W / 2, 'cq-hd', '덥고 건조', S0 + W / 4, S0 + 18)}${q(m, S0, W / 2, W / 2, 'cq-hw', '덥고 습함', m + W / 4, S0 + 18)}
      ${q(S0, m, W / 2, W / 2, 'cq-cd', '춥고 건조', S0 + W / 4, S0 + W - 8)}${q(m, m, W / 2, W / 2, 'cq-cw', '춥고 습함', m + W / 4, S0 + W - 8)}
      <rect x="${px(-0.8)}" y="${py(0.6)}" width="${px(0.8) - px(-0.8)}" height="${py(-0.6) - py(0.6)}" class="cq-bal"/><text x="${m}" y="${py(0.6) - 4}" class="cq-bt" text-anchor="middle">균형 구역</text>
      <line x1="${S0}" x2="${S0 + W}" y1="${m}" y2="${m}" class="cq-ax"/><line y1="${S0}" y2="${S0 + W}" x1="${m}" x2="${m}" class="cq-ax"/>
      <text x="${m}" y="12" class="cq-l" text-anchor="middle">暖 더움</text><text x="${m}" y="296" class="cq-l" text-anchor="middle">寒 차가움</text>
      <text x="4" y="${m + 4}" class="cq-l">燥</text><text x="296" y="${m + 4}" class="cq-l" text-anchor="end">濕</text>
      <circle cx="${px(cl(c.hum))}" cy="${py(cl(c.temp))}" r="9" class="cq-me"/><text x="${px(cl(c.hum))}" y="${py(cl(c.temp)) - 14}" class="cq-mt" text-anchor="middle">내 사주</text>
    </svg>`;
  }
  function climateWords(c) {
    const t = c.temp >= 0.6 ? 1 : c.temp <= -0.6 ? -1 : 0, h = c.hum >= 0.8 ? 1 : c.hum <= -0.8 ? -1 : 0;
    if (!t && !h) return '온도와 습도가 고른 사주';

    if (!t) return `${hum} 사주`;
    return `${t > 0 ? (h ? '덥고' : '더운') : (h ? '춥고' : '추운')}${h ? ' ' + hum : ''} 사주`;
  }
  // 조후론·억부론 중 무엇이 유리한지
  function adviceCard(ch, compact) {
    const a = M.methodAdvice(ch), st = ch.strength;
    const opts = [['억부', '억부론 유리'], ['병행', a.agree ? '같은 방향 (병행)' : '병행 필요'], ['조후', '조후론 유리']];

    return `<div class="advice">
      <div class="adv-opts">${opts.map(([k, l]) => `<span class="adv-o${k === a.verdict ? ' on' : ''}">${l}</span>`).join('')}</div>

      <div class="list">
        <div class="li"><span class="k">기후 치우침</span><span class="v small">${climateWords(ch.climate)} · 균형 기준의 <b class="num">${a.clim.toFixed(2)}배</b> ${a.clim >= 1 ? '(조후 필요)' : '(조후 불필요)'}</span><span></span></div>
        <div class="li"><span class="k">강약 치우침</span><span class="v small">${term(st.zone)} · 나를 돕는 힘 <b class="num">${st.help.toFixed(1)}%</b> (중간 50%에서 ${a.skew.toFixed(0)}%p)</span><span></span></div>

  // 운 타일: 천간·지지를 오행 색으로, 위아래에 십성, 아래에 원국과의 작용 칩
  function luckChips(x, max = 3) {
    const { rels, sinsal } = M.luckRelations(S.ch, x);
    const chips = [
      ...rels.filter(r => relTone(r.type) === 'bad').map(r => [`${relTarget(r)} ${r.type}`, 'bad']),
      ...rels.filter(r => relTone(r.type) === 'good').map(r => [`${relTarget(r)} ${r.type === '천간합' ? '합' : r.type}`, 'good']),

      ...rels.filter(r => !relTone(r.type)).map(r => [`${relTarget(r)} ${r.type}`, '']),
    ];
    const shown = chips.slice(0, max).map(([t, c]) => `<span class="chip ${c}">${esc(t)}</span>`).join('');

  // ───────────── 자미두수 ─────────────
  // 명반 배치: 4×4 칸의 가장자리에 지지를 고정 (巳午未申 / 辰·酉 / 卯·戌 / 寅丑子亥)
  const ZW_GRID = { 5: [1, 1], 6: [1, 2], 7: [1, 3], 8: [1, 4], 4: [2, 1], 9: [2, 4], 3: [3, 1], 10: [3, 4], 2: [4, 1], 1: [4, 2], 0: [4, 3], 11: [4, 4] };
  const HWA = { '록': ['화록', 'hl'], '권': ['화권', 'hg'], '과': ['화과', 'hk'], '기': ['화기', 'hj'] };
  const ZW_MAIN_SET = new Set(['자미', '천기', '태양', '무곡', '천동', '염정', '천부', '태음', '탐랑', '거문', '천상', '천량', '칠살', '파군']);
  const G12_KEY = { 장성: '장성살', 반안: '반안살', 세역: '역마살', 식신: '육해살', 화개: '화개살', 지배: '지살', 함지: '연살', 망신: '망신살' };
  const g12Term = (n, fam) => term(fam === 'jq' && G12_KEY[n] ? G12_KEY[n] : n, n.replace(/\(.*\)/, ''));
  const G12_FAM = [['cs', '장생 12신'], ['bs', '박사 12신'], ['jq', '장전 12신'], ['sq', '세전 12신']];
  function flyHTML(zw, p) {
    const out = p.fly.map(f => `<span class="chip"><span class="hw ${HWA[f.hw][1]}">${f.hw}</span> ${term(f.star)} → ${f.to === p.b ? '<b>' + term('자화', '자화') + '</b>' : term(zw.palaces[f.to].name)}</span>`).join('');
    const inn = zw.palaces.flatMap(q => q.fly.filter(f => f.to === p.b && q.b !== p.b).map(f => `<span class="chip">${term(q.name)}에서 <span class="hw ${HWA[f.hw][1]}">${f.hw}</span> ${term(f.star)}</span>`)).join('');
    return { out, inn };
  }
  const zwNowY = () => M.solarToLunar(TODAY[0], TODAY[1], TODAY[2]).y; // 지금의 음력 해
  // 별 하나: 이름, 밝기, 생년 사화(채운 배지), 보기 설정에 따라 대한 사화(대)·유년 사화(년) 배지
  function zwStar(n, cls, b, per) {
    const zw = S.ch.ziwei, hw = zw.sihwa[n], br = M.zwBright(n, b);
    const badge = (h, pre, kind) => `<button type="button" class="term hw ${HWA[h][1]}${kind ? ' ' + kind : ''}" data-term="${kind === 'o-dh' ? '대한 사화' : kind === 'o-yr' ? '유년 사화' : HWA[h][0]}" title="${pre}${HWA[h][0]}">${pre}${h}</button>`;
    const show = S.inp.zwHw || 'birth';
    return `<span class="zs ${cls}">${term(n)}${br ? `<button type="button" class="term zb" data-term="별의 밝기">${br}</button>` : ''}${hw ? badge(hw, '', '') : ''}${show !== 'birth' && per.dhSihwa[n] ? badge(per.dhSihwa[n], '대', 'o-dh') : ''}${show === 'yr' && per.liuSihwa[n] ? badge(per.liuSihwa[n], '년', 'o-yr') : ''}</span>`;
  }
  // 사화가 어느 궁의 어느 별에 붙었는지
  function sihwaWhere(map) {
    const zw = S.ch.ziwei;
    return Object.entries(map).map(([n, h]) => { const p = zw.palaces[zw.pos[n]]; return `<span class="chip"><span class="hw ${HWA[h][1]}">${h}</span> ${term(n)} → ${term(p.name)}</span>`; }).join('');
  }

  // 궁 강도 점수: 주성 밝기·길성·살성·사화를 합산해 0~100(50 = 보통)으로 만들고, 삼방사정을 섞어 최종 점수를 낸다.
  const ZW_DOM = { '명궁': '나 자신·성격', '형제궁': '형제·친구', '부처궁': '연애·결혼', '자녀궁': '자녀·후배', '재백궁': '돈·재물', '질액궁': '건강', '천이궁': '밖에서의 활동', '노복궁': '사람 인연', '관록궁': '직업·성취', '전택궁': '집·부동산', '복덕궁': '마음의 여유', '부모궁': '부모·윗사람·문서' };
  const ZW_HW_PLAIN = { '록': '잘 풀리고 이득이 생김', '권': '내가 주도하고 힘이 실림', '과': '인정받고 도움을 받음', '기': '막히기 쉽고 신경 쓸 일이 많음' };
  const ZW_BR_W = { '묘': 4, '왕': 3, '득': 2, '리': 1, '평': 0, '불': -1, '함': -2 };
  const zwGrade = v => v >= 70 ? [4, '매우 강함'] : v >= 58 ? [3, '강함'] : v >= 43 ? [2, '보통'] : v >= 32 ? [1, '약함'] : [0, '매우 약함'];
  const zwGradeCol = v => ['var(--bad)', 'var(--seal)', 'var(--ink-3)', 'var(--accent-2)', 'var(--good)'][zwGrade(v)[0]];
  function zwRaw(zw, p) {
    const mains = p.main.length ? p.main : zw.palaces[(p.b + 6) % 12].main;
    let v = 0;
    mains.forEach(n => { v += 2 * (ZW_BR_W[M.zwBright(n, p.b)] ?? 0) + 1; });
    if (!p.main.length) v *= 0.6;
    p.good.forEach(n => { v += n === '녹존' ? 1.5 : 1; });
    v -= 1.5 * p.bad.length;
    [...p.main, ...p.good, ...p.bad].forEach(n => { const h = zw.sihwa[n]; if (h) v += { '록': 3, '권': 2, '과': 2, '기': -3 }[h]; });
    return v;
  }
  function zwScores(zw) {
    const raw = zw.palaces.map(p => zwRaw(zw, p));
    const tot = zw.palaces.map(p => raw[p.b] * 0.5 + raw[(p.b + 6) % 12] * 0.25 + raw[(p.b + 4) % 12] * 0.125 + raw[(p.b + 8) % 12] * 0.125);
    const mean = tot.reduce((a, b) => a + b, 0) / 12, sd = Math.sqrt(tot.reduce((a, b) => a + (b - mean) ** 2, 0) / 12) || 1;
    const sc = {};
    zw.palaces.forEach(p => { sc[p.b] = Math.round(Math.max(8, Math.min(95, 50 + (tot[p.b] - mean) / sd * 20))); });
    return sc;
  }
  // 궁 하나를 쉬운 말로 풀어 쓴 문장
  function zwPlain(zw, p, sc) {
    const g = zwGrade(sc[p.b])[1];

    const star = mains.length ? mains.map(n => term(n)).join('·') : '뚜렷한 주성';
    const hws = [...p.main, ...p.good, ...p.bad].filter(n => zw.sihwa[n]);
    let t = `${term(p.name)}(${ZW_DOM[p.name]})은 ${p.main.length ? '' : '비어 있어 마주 보는 궁의 별을 빌리며, '}${star}의 영향을 받아 전체적으로 힘이 <b>${g}</b> 편입니다(내 명반 기준).`;
    if (hws.length) t += ' ' + hws.map(n => `${term(n)}에 화${zw.sihwa[n]}이 붙어 ${ZW_HW_PLAIN[zw.sihwa[n]]}.`).join(' ');
    if (p.bad.length) t += ` 살성(${p.bad.map(n => term(n)).join('·')})이 있어 이 영역은 한 번 더 점검하면 좋습니다.`;
    else if (p.good.length >= 2) t += ` 길성(${p.good.slice(0, 3).map(n => term(n)).join('·')})이 함께해 주변 도움이 따릅니다.`;
    return t;
  }
  function zwRadar(zw, sc, selB) {
    const W = 340, C = W / 2, R = 112, n = 12;
    const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [(C + r * Math.cos(a)).toFixed(1), (C + r * Math.sin(a)).toFixed(1)]; };

    let s = `<svg class="zg-radar" viewBox="0 0 ${W} ${W}" role="img" aria-label="12궁 강도 레이더 차트">`;
    [0.25, 0.5, 0.75, 1].forEach(k => { s += `<polygon class="zg-rg" points="${pals.map((_, i) => pt(i, R * k).join(',')).join(' ')}"/>`; });
    s += pals.map((_, i) => { const [x, y] = pt(i, R); return `<line class="zg-rg" x1="${C}" y1="${C}" x2="${x}" y2="${y}"/>`; }).join('');
    s += `<polygon class="zg-ra" points="${pals.map((p, i) => pt(i, R * sc[p.b] / 100).join(',')).join(' ')}"/>`;
    pals.forEach((p, i) => {

      s += `<text class="zg-rl${on ? ' sel' : ''}" x="${lx}" y="${+ly + 3.5}" text-anchor="middle" data-zw="${p.b}">${p.name.replace('궁', '')}</text>`;
    });

  }
  function zwDaehanChart(zw, sc, per, selB) {
    const list = [...zw.palaces].sort((a, b) => a.daehan[0] - b.daehan[0]);

  // 유년 흐름: 앞으로 10년, 해마다 유년 명궁 칸의 강도
  function zwLiuChart(zw, sc, Y0) {

  // 사화 지도: 생년·대한·유년 사화가 어느 궁(영역)에 떨어지는지 한 표로
  function zwSihwaMap(zw, per) {

  function pkSum(cats, sel) {
    const sum = {}, picked = [];
    for (const c of cats) { const o = c.opts.find(x => x[0] === sel[c.k]); if (!o) continue; picked.push([c, o]); for (const [d, v] of Object.entries(o[2])) sum[d] = (sum[d] || 0) + v; }
    return { sum, picked };
  }
  const pkPct = v => Math.max(5, Math.min(97, 50 + v * 6));
  const pkGrade = p => p >= 74 ? ['강함', 'good'] : p >= 58 ? ['좋음', 'good'] : p >= 43 ? ['보통', ''] : ['보완 필요', 'bad'];
  const pkBars = (dims, sum) => `<div class="bars pkbars">${dims.map(([d, l]) => { const p = pkPct(sum[d] || 0), [g, c] = pkGrade(p); return `<div class="bar"><span class="lab">${l}</span><div class="track"><div class="fill" style="width:${p}%;--c:var(${c === 'good' ? '--good' : c === 'bad' ? '--bad' : '--accent'})"></div></div><span class="val">${g}</span></div>`; }).join('')}</div>`;
  const effChips = (eff, dims) => dims.filter(([d]) => eff[d]).map(([d, l]) => `<span class="chip ${eff[d] > 0 ? 'good' : 'bad'}">${l} ${eff[d] > 0 ? '+' : '−'}${Math.abs(eff[d])}</span>`).join('');
  const pkRank = (dims, sum) => dims.map(([d, l]) => [d, l, sum[d] || 0]).sort((a, b) => b[2] - a[2]);
  function pkPicker(sys, cats, sel) {
    return `<div class="pko">${cats.map(c => `<div class="pkc"><div class="pkc-h"><b>${c.l}</b>${c.d ? `<span class="muted small">${c.d}</span>` : ''}</div>
      <div class="pkc-o" role="group" aria-label="${c.l}">${c.opts.map(o => `<button type="button" class="opt" data-opt="${sys}:${c.k}:${o[0]}" aria-pressed="${sel[c.k] === o[0]}">${o[1]}</button>`).join('')}</div></div>`).join('')}</div>`;
  }
  const pkHead = (title, n, total, sys) => `<div class="card-h"><h2>${title}</h2><span class="note num">${n}/${total} 선택 · 한 번 더 누르면 해제</span>${n ? `<button class="btn" data-act="pk-reset:${sys}">전부 지우기</button>` : ''}</div>`;

  function renderFace() {

      ${pkPicker('gw', GW, sel)}</section>`;
    if (!picked.length) return picker + `<section class="card"><p class="muted small">부위를 하나 이상 고르면 아래에 종합 풀이가 나타납니다.</p></section>`;

    const ph = { up: null, mid: null, low: null };

    const rk = pkRank(GW_DIMS, sum), top = rk[0], low = rk[rk.length - 1];

      for (const [d, v] of Object.entries(yEff)) sum[d] = (sum[d] || 0) + v;

        + (role === '용신' ? '타고난 사주에 필요한 기운이 집으로 들어오는 좋은 궁합입니다.' : role === '희신' ? '용신을 돕는 기운이라 무난하게 잘 맞습니다.' : role === '한신' ? '크게 돕지도 해치지도 않는 방위입니다.' : `사주에 넘치는 기운이라 오래 머무는 방은 ${FS_EL[yongEl][0]}에 두고, ${FS_EL[yongEl][1]} 계열로 균형을 맞추세요.`);

      + (low[2] < 0 ? `<b>${josa(low[1], '이', '가')}</b> 약하니 아래 보완법을 먼저 해 보세요. ` : '')

    return picker + `<section class="card">
      <div class="card-h"><h2>집 풍수 종합 풀이</h2></div>

      <p class="note">형세(形勢) 풍수와 생활 풍수의 일반 원칙을 바탕으로 한 참고용 풀이입니다. 방위는 나침반 앱으로 거실 창 앞에서 재면 정확합니다.</p>
    </section>` + yongCard;
  }

  function trDraw() {

    const W = rows.reduce((a, r) => a + r.w, 0), score = rows.reduce((a, r) => a + r.w * r.sc, 0) / W;

    else if (rows.length >= 3 && !cnt.M) notes.push('메이저 카드가 없어 운명적인 일보다 일상의 선택과 노력으로 충분히 바꿀 수 있는 문제입니다.');
    if (domS) notes.push(`${domS[1]}(${domS[2]})가 ${cnt[domS[0]]}장으로 두드러져, 이 질문의 핵심은 <b>${domS[3]}</b>에 있습니다.`);

    const key = rows.find(r => r.k === 'fut' || r.k === 'res' || r.k === 'msg') || rows[rows.length - 1];

      if (it.alt != null) { const ya = y(it.alt); s += `<rect x="${cx - bw / 2 - 4}" y="${Math.min(y0, ya)}" width="${bw + 8}" height="${Math.max(Math.abs(ya - y0), 2)}" rx="3" class="ghost"/>`; }
      const r = Math.min(4, h / 2), x0 = cx - bw / 2;
      const d = v >= 0 ? `M${x0},${y0} V${top + r} Q${x0},${top} ${x0 + r},${top} H${x0 + bw - r} Q${x0 + bw},${top} ${x0 + bw},${top + r} V${y0} Z`
        : `M${x0},${y0} V${top + h - r} Q${x0},${top + h} ${x0 + r},${top + h} H${x0 + bw - r} Q${x0 + bw},${top + h} ${x0 + bw},${top + h - r} V${y0} Z`;

      s += `<text x="${cx}" y="${H - B + 33}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${it.sub}</text>`;
      if (it.sub2) s += `<text x="${cx}" y="${H - B + 45}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${it.sub2}</text>`;
      if (it.sel) s += `<text x="${cx}" y="${v >= 0 ? top - 18 : top + h + 27}" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:700">${signed(v)}</text>`;

    if (showGhost()) s += `<polyline class="ghost-line" points="${data.map(d => `${x(d.year).toFixed(1)},${y(altOf(d)).toFixed(1)}`).join(' ')}"/>`;

    });

    const svg = el.querySelector('svg'), ov = el.querySelector('.ov'), xh = el.querySelector('.xh'), xd = el.querySelector('.xd');

  // 내용이 든 카드들을 A4 폭(714px) 스테이지에 복제한다. SVG는 CSS 변수가 풀리지 않으므로 계산된 값을 인라인으로 박아 둔다.
  function xpStage(tabLabel) {
    const stage = document.createElement('div'); stage.className = 'wrap xs';
    const tmp = document.createElement('div'); tmp.innerHTML = whoLine();
    const head = document.createElement('div'); head.className = 'xs-head';
    head.innerHTML = `<b>만트라 만세력 · ${esc(tabLabel)}</b><span>${esc(tmp.textContent)}</span><span>${new Date().toLocaleDateString('ko-KR')} 출력</span>`;
    stage.appendChild(head);
    document.querySelectorAll('main.wrap > section.card, main.wrap > p.note').forEach(el => { if (!el.classList.contains('form')) stage.appendChild(el.cloneNode(true)); });
    document.body.appendChild(stage);
    stage.querySelectorAll('svg').forEach(svg => {
      if (+svg.getAttribute('width') > 660) { svg.style.width = '100%'; svg.style.height = 'auto'; }
      svg.querySelectorAll('*').forEach(el => {
        const cs = getComputedStyle(el);
        ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'opacity', 'fill-opacity', 'font-size', 'font-weight', 'font-family', 'text-anchor'].forEach(k => { el.style.setProperty(k, cs.getPropertyValue(k)); });
