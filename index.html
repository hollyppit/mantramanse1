  }

  // ───────────── 나와 조화로운 기운 (궁합 오행·궁합 일주) ─────────────
  // 운세 흐름 점수와는 별개. 계산은 M.evaluateCompatibleElement / M.evaluateDayPillarCompatibility (COMPAT_CONFIG 한 곳에서 조절)
  const CP_TYPES = ['보완형', '활성형', '안정형', '상호자극형', '혼합형'];
  const CP_TYPE_INFO = {
    '보완형': '원국의 부족하거나 과한 곳을 채워 주는 조합입니다.',
    '활성형': '식상·재성·관성 쪽 기운이 주도해 활동성과 추진력을 더하는 조합입니다.',
    '안정형': '합의 결속이 크고 마찰이 적어 편안하게 이어지는 조합입니다.',
    '상호자극형': '충·형 같은 자극이 커서 변화와 마찰이 함께 오는 조합입니다. 나쁘다는 뜻이 아니라 서로를 크게 흔드는 관계입니다.',
    '혼합형': '보완·자극·결속이 어느 한쪽으로 뚜렷하게 기울지 않은 조합입니다.',
  };
  const CP_FILTERS = ['전체', ...CP_TYPES.slice(0, 4), '주의 요소 있음'];
  const cpTone = c => c === '조화 높음' || c === '조화' ? 'good' : c === '주의 요소 있음' ? 'bad' : '';
  const cpMark = v => { const a = Math.abs(v), m = a >= 0.6 ? 3 : a >= 0.3 ? 2 : a >= 0.1 ? 1 : 0; return m ? (v > 0 ? '+' : '−').repeat(m) : '·'; };
  const cpPts = v => { const r = Math.round(v); return r > 0 ? `+${r}` : r < 0 ? `−${-r}` : '0'; };
  const cpDisclaimer = '궁합 일주는 상대방의 일주(두 글자)만 가정한 참고 분석입니다. 실제 궁합은 두 사람의 전체 원국을 비교하면 결과가 달라질 수 있습니다.';

  function renderCompat(ch) {
    const els = [0, 1, 2, 3, 4].map(e => M.evaluateCompatibleElement(ch, e)).sort((a, b) => b.score - a.score);
    const partner = S.cpPartner || 'opposite', all = M.compatAttraction(ch, partner);
    const good = all.filter(x => x.condition !== '주의 요소 있음').slice(0, 5);
    const risky = all.filter(x => x.risk >= 0.3).sort((a, b) => b.risk - a.risk || a.score - b.score).slice(0, 5);
    const filt = S.cpFilter || 'all', fl = CP_FILTERS.includes(filt) ? filt : '전체';
    const list = all.filter(x => fl === '전체' || (fl === '주의 요소 있음' ? x.condition === fl : x.type === fl));
    const sortBy = ['to', 'from', 'mutual'].includes(S.cpSort) ? S.cpSort : 'compat';
    const val = (x, m) => m === 'to' ? x.attract.toThem.score : m === 'from' ? x.attract.toMe.score : m === 'mutual' ? x.attract.mutual : x.score;
    const topKey = (x, m) => { const cs = (m === 'from' ? x.attract.toMe : x.attract.toThem).comps.filter(c => c.key !== 'yinyang' && c.key !== 'charge'); const t = cs.slice().sort((a, b) => b.pts - a.pts)[0]; return t && t.pts > 0 ? t.label : '약한 신호'; };
    const tile = (x, m = 'compat') => `<button type="button" class="cp-gz" data-cp="gz:${x.i}"><span class="g"><span class="eltxt ${ECLS[M.stemEl(x.s)]}">${M.STEM[x.s]}</span><span class="eltxt ${ECLS[M.BR_EL[x.b]]}">${M.BR[x.b]}</span></span><span class="k">${x.ganzhiK}</span><b class="sc">${val(x, m)}</b><span class="ty">${m === 'compat' ? x.type : topKey(x, m)}</span><span class="co ${cpTone(x.condition)}">${m === 'compat' ? x.condition : '궁합 ' + x.condition}</span></button>`;
    const cfg = M.COMPAT_CONFIG;
    return `
    <div class="cp-title"><h2>나와 조화로운 기운</h2><p class="note">내 원국의 억부·조후·오행 균형·십성 구조를 기준으로, 어떤 기운이 나를 보완하고 어떤 기운이 부딪히는지 계산한 참고 분석입니다. 운세 흐름 점수와는 별개입니다.</p></div>
    <section class="card">
      <div class="card-h"><h2>궁합 오행</h2><span class="note">누르면 근거가 열립니다</span></div>
      <div class="cp-els">${els.map(r => `<button type="button" class="cp-row ${ECLS[r.element]}" data-cp="el:${r.element}">
        <span class="cp-el eltxt ${ECLS[r.element]}">${M.EL[r.element]}</span>
        <span class="cp-bar"><i style="width:${r.score}%"></i></span><b class="cp-sc">${r.score}</b><span class="cp-lab ${r.score >= 62 ? 'good' : r.label === '과잉 주의' || r.score < 38 ? 'bad' : ''}">${r.label}</span>
        <span class="cp-why">${esc(r.reasons[0])}</span></button>`).join('')}</div>
      <p class="note">용신을 그대로 옮긴 표가 아닙니다. 억부·조후·균형·십성 작용·과잉 위험을 따로 계산해 합친 값이며, 특정 오행의 사람이 무조건 좋다·나쁘다는 뜻이 아닙니다.</p>
    </section>
    <section class="card">
      <div class="card-h"><h2>궁합 일주</h2><span class="note">60일주 전체를 내 원국과 비교</span></div>
      <h3 class="cp-h3">보완도가 높은 일주</h3>
      <div class="cp-tiles">${good.map(tile).join('')}</div>
      <h3 class="cp-h3">충돌·마찰에 주의할 일주 <span class="muted small">일지 충·형 등 자극이 큰 순</span></h3>
      <div class="cp-tiles">${risky.map(tile).join('')}</div>
      <div class="cp-att">
        <div class="cp-att-h"><h3 class="cp-h3">끌림 — 마음이 움직이는 일주</h3>
          <div class="cp-filters" role="group" aria-label="상대 기준">${[['opposite', '이성 기준(전통)'], ['any', '성별 무관']].map(([k, l]) => `<button type="button" class="opt" data-act="cp-p:${k}" aria-pressed="${partner === k}">${l}</button>`).join('')}</div></div>
        <p class="note">궁합(보완도)과는 다른 축입니다. 배우자성 십성, 일간 천간합, 지지 합, 홍염·도화·천을귀인, 원진·충 같은 강한 자극을 봅니다. 끌림이 강해도 궁합 조건이 "주의 요소 있음"일 수 있습니다.</p>
        <h4 class="cp-h4">내가 끌리는 일주 <span class="muted small">내 사주가 좋아하는 타입</span></h4>
        <div class="cp-tiles">${all.slice().sort((a, b) => val(b, 'to') - val(a, 'to') || b.score - a.score).slice(0, 5).map(x => tile(x, 'to')).join('')}</div>
        <h4 class="cp-h4">나를 좋아하는 일주 <span class="muted small">상대 일주가 나를 좋아하기 쉬운 조합</span></h4>
        <div class="cp-tiles">${all.slice().sort((a, b) => val(b, 'from') - val(a, 'from') || b.score - a.score).slice(0, 5).map(x => tile(x, 'from')).join('')}</div>
        <h4 class="cp-h4">서로 끌리는 일주 <span class="muted small">양쪽 끌림이 모두 높은 조합</span></h4>
        <div class="cp-tiles">${all.slice().sort((a, b) => val(b, 'mutual') - val(a, 'mutual') || b.score - a.score).slice(0, 5).map(x => tile(x, 'mutual')).join('')}</div>
      </div>
      <div class="frow"><button class="btn" data-act="cp-all">${S.cpAll ? '전체 접기' : '60일주 전체 보기'}</button></div>
      ${S.cpAll ? `<div class="cp-filters" role="group" aria-label="정렬">${[['compat', '궁합 점수순'], ['to', '내가 끌림순'], ['from', '나를 좋아함순'], ['mutual', '서로 끌림순']].map(([k, l]) => `<button type="button" class="opt" data-act="cp-s:${k}" aria-pressed="${sortBy === k}">${l}</button>`).join('')}</div>
        <div class="cp-filters" role="group" aria-label="유형 필터">${CP_FILTERS.map(f => `<button type="button" class="opt" data-act="cp-f:${f}" aria-pressed="${fl === f}">${f}${f === '전체' ? ` ${all.length}` : ` ${all.filter(x => f === '주의 요소 있음' ? x.condition === f : x.type === f).length}`}</button>`).join('')}</div>
        <div class="cp-all">${list.slice().sort((a, b) => val(b, sortBy) - val(a, sortBy) || b.score - a.score).map(x => tile(x, sortBy)).join('') || '<p class="muted small">해당하는 일주가 없습니다.</p>'}</div>` : ''}
      <p class="note">${cpDisclaimer}</p>
    </section>
    <section class="card">
      <div class="card-h"><h2>궁합 판단 기준</h2><span class="note">눌러서 펼치기</span></div>
      <div class="acc">
        <details><summary><b>궁합 오행은 어떻게 계산하나</b><span class="small muted" style="display:block">다섯 성분을 각각 계산해 50점 기준에서 더하고 뺍니다</span></summary>
          <dl><dt>억부 보완 (최대 ±${cfg.element.eokbu})</dt><dd>신약이면 비겁·인성, 신강이면 식상·재성·관성을 채우는 정도입니다. 강약 구조가 70%, 억부 용신 역할이 30%입니다.</dd>
          <dt>조후 보완 (최대 ±${cfg.element.johu})</dt><dd>이 오행이 들어왔을 때 원국의 온도·습도 치우침이 줄어드는 정도입니다.</dd>
          <dt>균형 (최대 ±${cfg.element.balance})</dt><dd>부족한 오행을 채우거나 넘치는 오행을 눌러 주는 효과입니다.</dd>
          <dt>십성 작용 (최대 ±${cfg.element.tenGod})</dt><dd>관살혼잡·재다신약 같은 원국 구조의 약점을 키우는지 풀어 주는지, 배우자성(남 재성·여 관성)이 부족한지를 봅니다.</dd>
          <dt>과잉 위험 (최대 −${cfg.element.excessPenalty})</dt><dd>이미 많은 오행이나 십성을 더 키우는 위험입니다.</dd></dl></details>
        <details><summary><b>궁합 일주는 어떻게 계산하나</b><span class="small muted" style="display:block">상대의 일간·일지와 내 원국 전체의 관계를 봅니다</span></summary>
          <dl><dt>오행 보완 (±${cfg.elementBalance})·조후 (±${cfg.climate})·십성 (±${cfg.tenGod})</dt><dd>상대 일간(${Math.round(cfg.dayStem * 100)}%)과 일지의 지장간(${Math.round(cfg.dayBranch * 100)}%, 여기·중기·정기 일수로 가중)이 공급하는 오행을 위 오행 기준으로 평가합니다.</dd>
          <dt>일간 관계 (±${cfg.stemRelation})</dt><dd>생극·음양·천간합·천간충. 천간합이 있어도 자동으로 최고점이 되지 않습니다.</dd>
          <dt>일지 관계 (±${cfg.branchRelation})</dt><dd>육합·삼합(반합)은 결속, 충·형·원진·해·파는 변화·마찰 신호로 따로 셉니다. 충이 이미 과한 기운을 깨는 경우에는 마찰을 덜어 줍니다.</dd>
          <dt>원국 합충 (±${cfg.natalRelations})</dt><dd>내 년·월·시와 만드는 관계입니다. 일간·일지 관계보다 가볍게(월 ${cfg.posW.month}·시 ${cfg.posW.hour}·년 ${cfg.posW.year}배) 반영합니다.</dd>
          <dt>과잉 위험 (−${cfg.excessPenalty})</dt><dd>이미 많은 오행을 더 키우는 위험입니다.</dd></dl></details>
        <details><summary><b>끌림은 어떻게 계산하나</b><span class="small muted" style="display:block">배우자성·합·매력 신호를 두 방향으로 계산합니다</span></summary>
          <dl><dt>내가 끌리는 일주 (나 → 상대)</dt><dd>배우자성 십성(${cfg.attract.toThem.spouse}), 일간 천간합(${cfg.attract.toThem.stemHap}), 지지 합(${cfg.attract.toThem.branchBond}), 홍염·도화·천을귀인(${cfg.attract.toThem.charm}), 내게 필요한 기운(${cfg.attract.toThem.need}), 원진·충 같은 강한 자극(${cfg.attract.toThem.charge}), 음양 조화(${cfg.attract.toThem.yinyang}) 순으로 반영합니다.</dd>
          <dt>나를 좋아하는 일주 (상대 → 나)</dt><dd>상대 일간을 기준으로 내 일간·일지가 상대의 배우자성인지, 내 일지가 상대의 매력 신살 자리인지를 봅니다. 상대의 전체 사주를 모르므로 "상대 일간이 나를 어떻게 보는가"로 단순화한 것입니다.</dd>
          <dt>서로 끌리는 일주</dt><dd>두 방향 점수의 기하평균입니다. 한쪽만 높으면 낮게 나옵니다.</dd>
          <dt>상대 기준</dt><dd>기본은 이성 기준(남성은 재성, 여성은 관성이 배우자성)입니다. "성별 무관"을 고르면 재성·관성을 모두 배우자성으로 봅니다.</dd></dl></details>
        <details><summary><b>유형과 조건</b><span class="small muted" style="display:block">점수와 관계의 성격을 따로 판정합니다</span></summary>
          <dl>${CP_TYPES.map(t => `<dt>${t}</dt><dd>${CP_TYPE_INFO[t]}</dd>`).join('')}
          <dt>조화 높음 · 조화 · 혼합 · 주의 요소 있음</dt><dd>점수와 위험도로 정하는 종합 조건입니다. 마찰이 큰 조합은 점수가 높아도 "주의 요소 있음"으로 표시합니다.</dd></dl></details>
        <details><summary><b>한계</b></summary><dl><dd>${cpDisclaimer} 점수는 좋고 나쁨의 판정이 아니라 내 원국을 기준으로 한 상대 지표이며, 억부·조후의 단순화 모델에 기대고 있습니다.</dd></dl></details>
      </div>
    </section>`;
  }

  // 누르면 열리는 상세 시트
  function cpSheetHTML(ch, sel) {
    const bar = (label, v, w) => `<div class="cp-part"><span>${label}</span><span class="cp-mk ${v > 0.05 ? 'good' : v < -0.05 ? 'bad' : ''}">${cpMark(v)}</span></div>`;
    if (sel.k === 'el') {
      const r = M.evaluateCompatibleElement(ch, sel.i), st = ch.strength;
      const rows = [['억부 보완', r.pts.eokbu], ['조후 보완', r.pts.johu], ['오행 균형', r.pts.balance], ['십성 관계', r.pts.tenGod], ['과잉 위험', r.pts.excess]];
      return `<span class="cat">궁합 오행</span><h3>${M.EL[sel.i]} ${M.EL_K[sel.i]} · 보완도 ${r.score}</h3>
        <div class="cp-pills"><span class="pill ${r.score >= 62 ? 'good' : r.score < 38 ? 'bad' : ''}">${r.label}</span><span class="pill">${r.tenGodGroup} 기운</span></div>
        <div class="list">${rows.map(([l, v]) => `<div class="cp-line"><span>${l}</span><b class="${v > 0.4 ? 'pos' : v < -0.4 ? 'neg' : ''}">${cpPts(v)}</b></div>`).join('')}</div>
        <p class="cp-sum">${esc(r.reasons.join('. ') + '.')}</p>
        <p class="small muted">${st.zone} 사주(돕는 힘 ${st.help.toFixed(0)}%)를 기준으로 계산했습니다. 절대적으로 "${M.EL_K[sel.i]} 기운의 사람이 최고의 배우자"라는 뜻이 아니라, 지금 원국에서 ${M.EL_K[sel.i]} 기운이 들어올 때 나타나는 상대적 효과입니다.</p>
        <button class="btn x" data-act="close">닫기</button>`;
    }
    const x = M.compatAttraction(ch, S.cpPartner || 'opposite').find(q => q.i === sel.i), at = x.attract;
    return `<span class="cat">궁합 일주 · 내 일주 ${x.myDay}</span><h3>${x.ganzhi} (${x.ganzhiK}) · 궁합 분석</h3>
      <div class="cp-pills"><span class="pill">종합 보완도 <b>${x.score}</b></span><span class="pill">${x.type}</span><span class="pill ${cpTone(x.condition)}">${x.condition}</span></div>
      <p class="small muted">${CP_TYPE_INFO[x.type]}</p>
      <h4>${x.ganzhi} 일주의 특징</h4>
      <div class="facts">${gzFacts(x.ganzhiK)}</div>
      <p class="small" style="color:var(--ink-2)">${esc(GL[x.ganzhiK] ? GL[x.ganzhiK][1] : '')}</p>
      <h4>끌림 <span class="muted small">${(S.cpPartner || 'opposite') === 'any' ? '성별 무관 기준' : '이성 기준'}</span></h4>
      <div class="cp-att-box">${[['내가 끌림', at.toThem], ['나를 좋아함', at.toMe]].map(([l, r]) => `<div><div class="cp-att-r"><b>${l}</b><span class="pill ${r.score >= 60 ? 'good' : ''}">${r.score}</span></div><ul class="pos-ul small">${r.reasons.slice(0, 3).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}
        <div class="cp-att-r"><b>서로 끌림</b><span class="pill ${at.mutual >= 60 ? 'good' : ''}">${at.mutual}</span></div></div>
      <h4>내 원국과의 궁합</h4>
      <div class="cp-parts">${x.parts.map(p => `<div class="cp-part"><span>${p.label}</span><span class="cp-mk ${p.v > 0.05 ? 'good' : p.v < -0.05 ? 'bad' : ''}">${p.key === 'excess' ? (x.excessRisk >= 0.5 ? '높음' : x.excessRisk >= 0.25 ? '보통' : '낮음') : cpMark(p.v)}</span><em class="num">${cpPts(p.pts)}</em></div>`).join('')}</div>
      <h4>핵심 이유</h4><ul class="pos-ul small">${x.reasons.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <p class="small">상대 일간은 나에게 <b>${x.stemTG}</b>, 일지 정기는 <b>${x.branchTG}</b> 십성으로 작용합니다.</p>
      ${x.cautions.length ? `<h4>주의</h4><ul class="pos-ul small">${x.cautions.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      <p class="cp-disc">${cpDisclaimer}</p>
      <button class="btn x" data-act="close">닫기</button>`;
  }

  // ───────────── 직업 · 활동 적성 (원국 기반 · 운세와 별개) ─────────────
  // 계산은 M.careerProfile(원국만 읽는 별도 계층, CAREER_CONFIG 한 곳에서 조절). 이 절은 표시만 맡는다.
  const CR_DISC = '직업 적성은 원국의 구조적 성향을 해석한 참고 지표이며 실제 직업 성과는 능력, 경험, 교육, 시장 환경 등에 따라 달라질 수 있습니다.';
  const crTone = s => s >= 62 ? 'good' : s < 36 ? 'bad' : '';
  function renderCareer(ch) {
    const P = M.careerProfile(ch), ws = P.workStyle, cfg = M.CAREER_CONFIG;
    const axis = a => { const x = ws[a], [pn, pv] = M.careerPole(a, x.value);
      return `<div class="cr-ax"><span class="l${x.value >= 50 ? ' on' : ''}">${x.left}</span><span class="cr-bar2" role="img" aria-label="${x.left} ${x.value}, ${x.right} ${x.other}"><i class="a" style="width:${x.value}%"></i><i class="b" style="width:${x.other}%"></i></span><span class="r${x.value < 50 ? ' on' : ''}">${x.right}</span><span class="cr-v num">${x.value} / ${x.other}</span><span class="cr-w">${pn} 쪽 · ${M.careerLevelWord(pv)}</span></div>`; };
    const row = c => `<button type="button" class="cr-row" data-cr="cat:${c.category}"><b class="cr-n">${c.name}</b><span class="cr-b"><i style="width:${c.score}%"></i></span><b class="cr-s num">${c.score}</b><span class="cr-lab ${crTone(c.score)}">${c.band}</span><span class="cr-why">${esc(c.reasons[0] || '')}</span></button>`;
    const topRow = c => `<button type="button" class="cr-row" data-cr="cat:${c.category}"><b class="cr-n">${c.name}</b><span class="cr-b"><i style="width:${c.score}%"></i></span><b class="cr-s num">${c.score}</b><span class="cr-lab ${crTone(c.score)}">${c.band}</span><span class="cr-why">${esc(cfg.categories[c.category].what)} — ${esc(c.strengths[0] || c.reasons[0] || '')}</span><span class="cr-more">자세히 보기 ›</span></button>`;
    return `
    <div class="cp-title"><h2>직업 · 활동 적성</h2><p class="note">출생 원국의 구조를 바탕으로 "어떤 방식으로 일할 때 강점을 활용하기 쉬운가"를 살펴보는 참고 분석입니다. 특정 직업을 정해 주는 것이 아니며, 운세 흐름·재물운과는 별개입니다.</p></div>
    <section class="card">
      <div class="card-h"><h2>나에게 맞는 업무 방식</h2><span class="note">숫자는 성향의 기울기일 뿐 심리검사 결과가 아닙니다</span></div>
      <div class="cr-axes">${M.CAREER_AXIS_KEYS.map(axis).join('')}</div>
      <p class="note">양쪽 숫자의 합은 100입니다. 50에 가까울수록 어느 쪽으로도 치우치지 않은 것이고, 십성 구성·강약·조후·원국의 충형에서 계산합니다.</p>
    </section>
    <section class="card">
      <div class="card-h"><h2>강점 활용 분야</h2><span class="note">누르면 근거가 열립니다</span></div>
      <div class="cr-list">${P.top.map(topRow).join('')}</div>
      <div class="frow"><button class="btn" data-act="cr-all">${S.crAll ? '전체 접기' : '전체 분야 보기'}</button></div>
      ${S.crAll ? `<h3 class="cp-h3">활동 분야별 조화도 <span class="muted small">순위가 아니라 원국과 조화되는 정도입니다</span></h3><div class="cr-list">${P.categories.map(row).join('')}</div>` : ''}
    </section>
    <section class="card">
      <div class="card-h"><h2>추천 업무환경</h2></div>
      <div class="cr-envtags">${M.CAREER_AXIS_KEYS.map(a => { const [pn, pv] = M.careerPole(a, ws[a].value); return `<span class="pill">${pn} ${M.careerLevelWord(pv)}</span>`; }).join('')}</div>
      <p class="cp-sum">${esc(P.envSummary.text)}</p>
    </section>
    <section class="card">
      <div class="card-h"><h2>부담이 커질 수 있는 환경</h2><span class="note">특정 직업 전체를 뜻하지 않습니다</span></div>
      <div class="list">${P.burdenEnvs.map(e => `<div class="cr-env"><b>${esc(e.name)}</b> <span class="muted small">부담도 ${e.burden}</span><p class="small" style="color:var(--ink-2)">${esc(e.desc)}에서는 ${esc(e.why[0] || '뚜렷한 부담 요인은 크지 않지만 상대적으로 가장 높게 나온 환경입니다')}.</p></div>`).join('')}</div>
      <details class="cr-detail"><summary><b>왜 이렇게 나오나요?</b></summary><dl>
        <dt>1단계 · 업무 성향</dt><dd>십성 10가지의 비율(평균 10% 기준, 극단값은 포화)에 축별 가중치를 곱해 더하고, 강약·조후 치우침·원국의 충형을 보탭니다. 직업을 직접 정하지 않습니다.</dd>
        <dt>2단계 · 활동 분야 점수</dt><dd>활성도 ${Math.round(cfg.score.activity * 100)}% + 적합도 ${Math.round(cfg.score.fit * 100)}% + 지속 가능성 ${Math.round(cfg.score.sustain * 100)}% − 과부하 ${Math.round(cfg.score.overloadPenalty * 100)}%. 적합도는 십성 구조 ${Math.round(cfg.tenGodWeight * 100)}%·오행 균형 ${Math.round(cfg.elementWeight * 100)}%·억부(강약) ${Math.round(cfg.strengthWeight * 100)}%·조후 ${Math.round(cfg.climateWeight * 100)}%·성향 부합 ${Math.round(cfg.styleWeight * 100)}%입니다.</dd>
        <dt>억부·조후</dt><dd>"용신 오행과 관련된 직업이 좋다"는 방식이 아닙니다. 그 활동이 쓰는 기운이 내 원국에 부담이 되는지 보완이 되는지만 따로 셉니다. 억부와 조후가 다른 방향이어도 각각 계산합니다.</dd>
        <dt>3단계 · 직업 예시</dt><dd>점수의 원인이 아니라 결과 표시입니다. 한 직업은 여러 분야의 조합으로 정의되어 있고, 분야 점수를 합쳐 순서를 정합니다.</dd>
        <dt>재물운과의 차이</dt><dd>적성은 "이 방식을 활용하기 쉬운가"이고 재물운은 "지금 재정 흐름이 활성화되는가"입니다. 서로 다른 값이 나오는 것이 정상입니다.</dd></dl></details>
      <p class="cp-disc">${CR_DISC}</p>
    </section>`;
  }
  function crSheetHTML(ch, sel) {
    if (sel.key === 'detail') return rootSheetHTML(ch);
    const P = M.careerProfile(ch), c = P.byKey[sel.key], def = M.CAREER_CONFIG.categories[sel.key];
    if (!c) return '<p>표시할 정보가 없습니다.</p><button class="btn x" data-act="close">닫기</button>';
    const li = a => a.length ? a.map(t => `<li>${esc(t)}</li>`).join('') : '<li>뚜렷한 항목이 없습니다.</li>';
    const bars = a => a.map(([l, v]) => `<div class="cp-part"><span>${l}</span><span class="dbar"><i style="width:${v}%"></i></span><b class="num">${v}</b></div>`).join('');
    return `<span class="cat">활동 분야</span><h3>${c.name} · 적성 활용도 ${c.score}</h3>
      <div class="cp-pills"><span class="pill ${crTone(c.score)}">${c.band}</span><span class="pill">부담도 ${c.burden}</span></div>
      <p class="small muted">${def.what}</p>
      <div class="cp-parts">${bars([['활성도', c.activity], ['원국 적합도', c.fit], ['지속 가능성', c.sustainability], ['과부하', c.overload]])}</div>
      <h4>강점</h4><ul class="pos-ul small">${li(c.strengths)}</ul>
      <h4>주의</h4><ul class="pos-ul small">${li(c.cautions)}</ul>
      <h4>적합도 구성 <span class="muted small">0~100, 높을수록 원국과 조화</span></h4>
      <div class="cp-parts">${bars([['십성 구조', c.tenGodFit], ['오행 균형', c.elementFit], ['억부(강약)', c.strengthFit], ['조후', c.climateFit], ['업무 성향 부합', c.styleFit]])}</div>
      <h4>관련 활동 예시</h4><p class="small">${c.examples.map(esc).join(' · ')}</p>
      <p class="small muted">직업 예시는 이 분야를 포함하는 여러 분야 조합 중 내 원국 점수가 높은 순으로 고른 것이며, 점수의 원인이 아닙니다. 재물운과는 별개의 지표입니다.</p>
      <p class="cp-disc">${CR_DISC}</p>
      <button class="btn x" data-act="close">닫기</button>`;
  }

  // ───────────── 일간의 뿌리 · 통근 (원국 + 현재 운 · 흐름 점수와 독립) ─────────────
  // 계산은 M.analyzeNatalRoot / analyzeLuckRootSupport / evaluateCurrentRootState (ROOT_CONFIG·ROOT_LEVEL_WEIGHTS 한 곳에서 조절). 이 절은 표시만 맡는다.
  const RT_DISC = '통근은 원국 구조에서 일간이 얻는 기반을 설명하는 참고 지표입니다. 성격·의지·성패·사건과 연결해 해석하지 않으며, 흐름 점수에도 반영되지 않습니다.';
  // 현재 시점(오늘)의 대운·세운·월운·일진 간지
  function rootNowCtx(ch) {
    const curY = M.yearPillarAt(NOW).sajuYear, wm = M.wolun(ch, curY); let curM = wm[0]; wm.forEach(m => { if (m.startMs <= NOW) curM = m; });
    const il = M.ilun(ch, TODAY[0], TODAY[1])[TODAY[2] - 1];
    return { daeun: M.daeunAt(ch, NOW), seun: M.yearPillarOf(curY), wolun: curM, iljin: il };
  }
  // 상세 화면(대운·세운·월운·일진)에서 그 시점 기준으로 위쪽 운을 채운다
  function rootCtx(x, kind) {
    const ch = S.ch;
    if (kind === 'daeun') return { daeun: x };
    if (kind === 'seun') return { daeun: x.daeun || M.daeunAt(ch, x.midMs), seun: x };
    if (kind === 'wolun') { const ms = x.startMs + 12 * 864e5, Y = M.yearPillarAt(ms).sajuYear; return { daeun: M.daeunAt(ch, ms), seun: M.yearPillarOf(Y), wolun: x }; }
    const ms = Date.UTC(x.date[0], x.date[1] - 1, x.date[2], 3), Y = M.yearPillarAt(ms).sajuYear;
    return { daeun: M.daeunAt(ch, ms), seun: M.yearPillarOf(Y), wolun: M.wolun(ch, Y).filter(m => m.startMs <= ms).pop(), iljin: x };
  }
  const rtFit = v => v >= 5 ? 'pos' : v <= -5 ? 'neg' : '';
  function rtFitLines(f) { return `<div class="rt-fit"><span>억부 적합도 <b class="${rtFit(f.eokbuFit)}">${f.eokbuLabel}</b> <i class="num">${signed(f.eokbuFit)}</i></span><span>조후 적합도 <b class="${rtFit(f.johuFit)}">${f.johuLabel}</b> <i class="num">${signed(f.johuFit)}</i></span></div><p class="small muted">${esc(f.note)}</p>`; }
  function renderRoot(ch) {
    const c = rootNowCtx(ch), s = M.evaluateCurrentRootState(ch, c.daeun, c.seun, c.wolun, c.iljin), n = s.natal, dEl = n.dayElement;
    const up = s.rootSupportChange >= 5;
    const meter = (label, v, txt, arrow) => `<div class="rt-m"><span class="rt-l">${label}</span><span class="cr-bar"><i style="width:${v == null ? 0 : v}%"></i></span><b class="num">${v == null ? '—' : v}${arrow ? ' ↑' : ''}</b><span class="rt-s">${txt}</span></div>`;
    return `
    <section class="card">
      <div class="card-h"><h2>일간의 뿌리 · 통근</h2><span class="pill ${n.hasNatalRoot ? '' : 'b-평'}" style="background:var(--surface-2);color:var(--ink-2)">${n.natalRootLevel}</span></div>
      <div class="rt-dm"><span class="eltxt ${ECLS[dEl]}">${n.dayMaster} ${M.EL_K[dEl]}</span><span class="muted small">일간 · 원국 기준 고정 값과 현재 운의 보강을 따로 봅니다</span></div>
      <div class="rt-ms">
        ${meter('원국 통근', n.natalRootScore, n.hasNatalRoot ? n.natalRootLevel : '무근', false)}
        ${meter('현재 통근 환경', s.currentRootSupport, up ? s.changeLabel : '원국과 같음', up)}
        ${meter('현재 근 안정성', s.rootStability, s.rootStability == null ? '해당 없음(근이 없음)' : s.rootStabilityLabel, false)}
      </div>
      ${s.changes.length ? `<h4 class="cp-h4">현재 보강 신호</h4><div class="rt-ch">${s.changes.map(x => `<span class="chip good">${x.text.replace(' 유입', ' +')}</span>`).join('')}</div>` : '<p class="small muted">현재 대운·세운·월운·일진에서 새로 들어오는 근은 없습니다. 원국의 통근은 그대로 유지됩니다.</p>'}
      ${s.stabilitySignals.length ? `<div class="rt-ch">${s.stabilitySignals.slice(0, 2).map(g => `<span class="chip ${g.kind === 'disturb' ? 'bad' : ''}">${esc(g.text)}</span>`).join('')}</div>` : ''}
      <p class="cp-sum">${esc(M.rootSummary(s))}</p>
      ${up ? rtFitLines(s.fit) : ''}
      <div class="frow"><button class="btn" data-cr="root:detail">자세히 보기</button></div>
      <p class="note">통근 강도(0~100)는 일간 힘의 퍼센트가 아니라 앱 내부의 상대 지표입니다. 득령과는 다른 개념이며, 통근이 강하다고 신강, 무근이라고 신약으로 판정하지 않습니다.</p>
    </section>`;
  }
  // 대운·세운·월운·일진 상세의 통근 변화 박스
  function rootBox(x, kind) {
    let st; try { const c = rootCtx(x, kind); st = M.evaluateCurrentRootState(S.ch, c.daeun, c.seun, c.wolun, c.iljin); } catch (e) { return ''; }
    const own = st[kind === 'ilun' ? 'iljin' : kind], n = st.natal; if (!own) return '';
    const f = M.rootFitEffect(S.ch, own.effect, kind), names = { daeun: '대운', seun: '세운', wolun: '월운', ilun: '일진' };
    const line = (lv, p) => p ? `<li>${names[lv]} ${p.branch}: ${p.providesRoot ? `<b>${p.kind}</b> ${p.roots.map(r => `${r.hiddenStem}(${r.depthK})`).join('·')}` : '근 없음'}${lv !== kind && p.providesRoot ? ' 유지' : ''}</li>` : '';
    const lead = { daeun: own.providesRoot ? `${own.supportScore >= 55 ? '이 대운에서는 일간을 지지하는 기반이 원국보다 강화됩니다.' : '이 대운의 지지에서 일간을 지지하는 근이 ' + (own.supportScore >= 30 ? '보조적으로' : '약하게') + ' 더해집니다.'} (${own.branch}의 지장간 ${own.roots.map(r => r.hiddenStem).join('·')} → 일간 ${n.dayMaster}의 근)` : '이 대운의 지지에는 일간의 근이 없어 원국의 근 환경이 그대로 이어집니다.',
      seun: own.providesRoot ? (st.daeun && st.daeun.providesRoot ? '대운의 근이 유지되는 가운데 세운에서 근이 더해져 근 보강이 중첩됩니다.' : '이 해에 일간을 지지하는 근이 들어옵니다.') : '이 해의 지지에는 일간의 근이 없습니다. 대운과 원국의 근 환경이 그대로 이어집니다.',
      wolun: own.providesRoot ? '이 달에 일간을 지지하는 근이 단기적으로 더해집니다.' : '이 달에는 추가되는 근이 없습니다. 대운·세운의 배경이 그대로 이어집니다.',
      ilun: own.providesRoot ? '오늘 일진에서 일간을 보조하는 근이 일시적으로 들어옵니다.' : '오늘 일진에서 추가되는 근은 없습니다.' }[kind];
    return `<div class="volbox rt-box"><div class="volh"><span>통근 변화 <b>${own.providesRoot ? (kind === 'ilun' ? '약함' : own.kind) : '변화 없음'}</b> <span class="muted small">· ${{ daeun: '장기간 유지되는 근 환경', seun: '해당 연도의 근 보강', wolun: '해당 월의 단기 보강', ilun: '일시적인 보강' }[kind]}</span></span></div>
      <div class="small">${lead}</div>
      <ul class="pos-ul small">${['daeun', 'seun', 'wolun'].map(lv => lv === 'ilun' ? '' : line(lv, st[lv])).join('')}${kind === 'ilun' ? line('ilun', st.iljin) : ''}</ul>
      <div class="small">원국 통근 <b class="num">${n.natalRootScore}</b> · ${n.hasNatalRoot ? n.natalRootLevel : '무근'} → 현재 통근 환경 <b class="num">${st.currentRootSupport}</b>${st.rootStability != null ? ` · 근 안정성 <b class="num">${st.rootStability}</b> (${st.rootStabilityLabel})` : ''}</div>
      ${own.providesRoot ? rtFitLines(f) : ''}</div>`;
  }
  function rootSheetHTML(ch) {
    const c = rootNowCtx(ch), s = M.evaluateCurrentRootState(ch, c.daeun, c.seun, c.wolun, c.iljin), n = s.natal, ss = n.seasonalSupport;

      <div class="small">현재 통근 환경 <b class="num">${s.currentRootSupport}</b> (원국 ${n.natalRootScore}에서 ${signed(s.rootSupportChange)}) · 근 안정성 <b class="num">${s.rootStability == null ? '—' : s.rootStability}</b> ${s.rootStability == null ? '' : '(' + s.rootStabilityLabel + ')'}</div>
      <p class="small muted">운의 근이 들어와도 원국의 무근/유근 판정은 바뀌지 않습니다. 대운·세운·월운·일진은 지속 기간에 따라 가중(${Object.entries(M.ROOT_LEVEL_WEIGHTS).map(([k, v]) => `${{ daeun: '대운', seun: '세운', wolun: '월운', ilun: '일진' }[k]} ${v}`).join(' · ')})하고, 덧셈이 아니라 겹침으로 합쳐 100을 넘지 않습니다.</p>
      ${s.stabilitySignals.length ? `<h4>근 안정성 신호</h4><ul class="pos-ul small">${s.stabilitySignals.slice(0, 5).map(g => `<li>${esc(g.text)}</li>`).join('')}</ul><p class="small muted">충·형·파·해는 근을 없애지 않고 안정성 신호로만 반영합니다. 합은 결속인지 변화인지 판정하지 않아 작은 값만 줍니다.</p>` : ''}

      rows: [['원리', '월지가 가리키는 계절이 사주 전체의 기후를 정한다고 봅니다. 너무 더우면 수(水), 너무 추우면 화(火)를 먼저 찾습니다.'],

        ['한계', '봄·가을생처럼 기후가 치우치지 않은 사주에는 답이 약합니다. 원전은 壬水와 癸水를 구분할 만큼 천간 단위로 처방합니다.'],
        ['이 앱의 구현', '궁통보감 표를 그대로 옮긴 것이 아닙니다. 글자별 온도·습도 값을 합산하고 월지를 3배로 반영한 단순화 모델입니다. 한난 ±0.6 또는 조습 ±0.8 이상 치우칠 때만 조후 용신을 세웁니다.']] },
    tonggwan: { t: '통관 (通關)', lead: '서로 극하는 두 오행이 팽팽하면 그 사이를 이어주는 오행을 씁니다.',
      rows: [['원리', '금과 목이 싸우면 금→수→목으로 흐르게 하는 수가 다리 역할을 합니다. 싸움을 흐름으로 바꾼다는 발상입니다.'],
        ['대표 문헌', '적천수의 통관 개념.'],
        ['강점', '두 세력이 맞서는 양강(兩强) 사주를 잘 설명합니다.'],
        ['한계', '적용되는 사주가 적습니다. 대립 구도가 아닌 사주에는 쓸 수 없습니다.'],
        ['이 앱의 구현', '서로 극하는 두 오행이 모두 25% 이상일 때만 성립합니다. 해당하지 않으면 억부 결과로 대신합니다.']] },
  };
  const SCHOOL_MISSING = [['병약 (病藥)', '사주에서 가장 큰 병(과다한 오행)을 찾아 그것을 고치는 약을 용신으로 씁니다. 억부와 결과가 겹치는 경우가 많아 따로 구현하지 않았습니다.'],
    ['격국 (格局)', '월지에서 투출한 십성으로 격을 정하고, 격을 완성하는 상신(相神)을 찾습니다(자평진전). 성격·파격 판정 규칙이 많아 다음 단계 과제입니다.'],
    ['종격·전왕격', '극약이나 극왕 사주는 억제하지 않고 강한 세력을 따른다고 봅니다. 이 앱은 해당 가능성만 경고합니다.']];
  function renderSchoolInfo(ch) {
    return `<section class="card">
      <div class="card-h"><h2>학파는 무엇이 다른가</h2><span class="note">눌러서 펼치기</span></div>
      <div class="acc">${Object.entries(SCHOOL_INFO).map(([k, x]) => `<details${k === ch.school ? ' open' : ''}><summary><b>${x.t}</b>${k === ch.school ? ' <span class="pill" style="background:var(--accent);color:var(--surface)">선택됨</span>' : ''}<span class="small muted" style="display:block">${x.lead}</span></summary>
        <dl>${x.rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></details>`).join('')}
        <details><summary><b>이 앱에 없는 기준</b><span class="small muted" style="display:block">병약 · 격국 · 종격</span></summary><dl>${SCHOOL_MISSING.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></details>

  function renderYong() {

    const elOf = r => +Object.keys(y.roles).find(e => y.roles[e] === r);
    return `
    <section class="card">
      <div class="card-h"><h2>${term('용신')} · 희신 · 기신</h2>${seg('school', Object.entries(M.SCHOOLS).map(([k, l]) => [k, l.split(' ')[0]]), ch.school)}</div>

        ${Object.entries(M.SCHOOLS).map(([k, l]) => { const x = ch.yongAll[k]; const f = r => { const e = +Object.keys(x.roles).find(q => x.roles[q] === r); return `<span class="eltxt ${ECLS[e]}">${elLabel(e)}</span>`; }; return `<tr class="${k === ch.school ? 'cur' : ''}"><td>${term(l.split(' ')[0])} <span class="muted small">${l.split(' ').slice(1).join(' ')}</span></td>${x.applicable ? `<td>${f('용신')}</td><td>${f('희신')}</td><td>${f('기신')}</td><td>${f('구신')}</td>` : '<td colspan="4" class="muted small">해당 없음</td>'}</tr>`; }).join('')}
      </tbody></table></div>
      <p class="note">억부는 강약, 조후는 계절 온도, 통관은 오행 대립을 기준으로 합니다. 두 기준이 서로 다른 오행을 가리키면 해석자가 어느 쪽을 우선할지 판단해야 합니다. 이 앱은 그 판단을 대신하지 않고 근거를 보여줍니다.</p>
    </section>`;
  }

  // ───────────── 운세 흐름 ─────────────
  function luckCells(x) { return `${term(x.stemTG)} / ${term(x.branchTG)} · ${term(x.unseong)} · ${term(x.sinsal12)}`; }
  // 운 타일: 천간·지지를 오행 색으로, 위아래에 십성, 아래에 원국과의 작용 칩
  function luckChips(x, max = 3) {
    const { rels, sinsal } = M.luckRelations(S.ch, x);
    const chips = [
      ...rels.filter(r => relTone(r.type) === 'bad').map(r => [`${relTarget(r)} ${r.type}`, 'bad']),
      ...rels.filter(r => relTone(r.type) === 'good').map(r => [`${relTarget(r)} ${r.type === '천간합' ? '합' : r.type}`, 'good']),
      ...sinsal.filter(q => q.good).map(q => [q.name, 'good']),
      ...sinsal.filter(q => !q.good).map(q => [q.name, 'bad']),
      ...rels.filter(r => !relTone(r.type)).map(r => [`${relTarget(r)} ${r.type}`, '']),
    ];
    const shown = chips.slice(0, max).map(([t, c]) => `<span class="chip ${c}">${esc(t)}</span>`).join('');
    return shown + (chips.length > max ? `<span class="chip">+${chips.length - max}</span>` : '');
  }
  function luckTile(x, top, pick, on, cur) {
    const se = M.stemEl(x.s), be = M.BR_EL[x.b];
    return `<button type="button" class="lt${on ? ' sel' : ''}${cur ? ' cur' : ''}" data-pick="${pick}">
      <span class="lt-top num">${top}</span>
      <span class="lt-tg">${x.stemTG}</span>
      <span class="lt-g ${ECLS[se]}"><b>${M.STEM[x.s]}</b><i>${M.STEM_K[x.s]}${M.EL_K[se]}</i></span>
      <span class="lt-g ${ECLS[be]}"><b>${M.BR[x.b]}</b><i>${M.BR_K[x.b]}${M.EL_K[be]}</i></span>
      <span class="lt-tg">${x.branchTG}</span>
      <span class="lt-us">${x.unseong} · ${x.sinsal12}</span>
      <span class="lt-ev">${luckChips(x)}</span>
      <span class="lt-sc">${m6Tag(luckMode(x).mode)}${ovTags(x.ev, false)} ${pill(x.ev.condition)}</span>${x.year && x.ev.level === "seun" ? samjaeTag(samjaeOf(x.year)) : ""}
    </button>`;
  }
  // 이 시기에 들어오는 오행과 원국과의 작용(합·충·형·신살)을 풀어 쓴다
  function luckEffects(x, kind) {
    const ch = S.ch, y = ch.yong, [kname, when] = LUCK_AREA[kind] || ['운', '이 시기에'];
    const se = M.stemEl(x.s), be = M.BR_EL[x.b];
    const role = e => y && y.roles ? ` <span class="muted small" style="display:inline">(${y.roles[e]})</span>` : '';
    const hid = M.HIDDEN[x.b].map(([hs]) => `<span class="eltxt ${ECLS[M.stemEl(hs)]}">${M.STEM[hs]}</span>`).join('');
    const { rels, sinsal } = M.luckRelations(ch, x);
    const relLine = r => {
      const o = r.members.find(m => m !== 'luck'), where = o ? `${term(M.POS_K[o] + '주')}(${POS_AREA[o]})` : '';
      const tone = relTone(r.type);
      const what = tone === 'bad' ? '부딪쳐 변화·갈등이 생기기 쉽습니다' : tone === 'good' ? '묶여 힘을 합칩니다' : '미묘하게 어긋납니다';
      return `<div class="li"><span class="k"><span class="chip ${tone}">${term(r.type)}</span></span><span class="v"><b>${esc(r.name)}</b><span class="small" style="color:var(--ink-2)">${when} 들어온 글자가 ${where}와 ${what}</span></span><span></span></div>`;
    };
    return `<div class="fx">
      <h4>${when} 들어오는 오행</h4>
      <div class="fx-el">
        <span class="lt-g ${ECLS[se]}"><b>${M.STEM[x.s]}</b><i>${M.STEM_K[x.s]}${M.EL_K[se]}</i></span>
        <span class="small">천간 <b class="eltxt ${ECLS[se]}">${elLabel(se)}</b>${role(se)} · ${term(x.stemTG)}<br><span class="muted">${TG_KW[x.stemTG] || ''}</span></span>
        <span class="lt-g ${ECLS[be]}"><b>${M.BR[x.b]}</b><i>${M.BR_K[x.b]}${M.EL_K[be]}</i></span>
        <span class="small">지지 <b class="eltxt ${ECLS[be]}">${elLabel(be)}</b>${role(be)} · ${term(x.branchTG)} · 속 글자 ${hid}<br><span class="muted">${TG_KW[x.branchTG] || ''}</span></span>
      </div>
      <h4>원국과 만나 생기는 작용</h4>
      ${rels.length ? `<div class="list">${rels.map(relLine).join('')}</div>` : `<p class="small muted">${kname} 글자가 원국과 합·충·형을 만들지 않습니다.</p>`}
      <h4>함께 오는 신살</h4>
      <div>${[`<span class="chip">${term(x.sinsal12)}</span>`, ...sinsal.map(q => `<span class="chip ${q.good ? 'good' : 'bad'}">${term(q.name)} <span class="muted">${esc(q.basis)}</span></span>`)].join('')}</div>
      <p class="small muted">간지 ${gzBtn(x, kind)}를 누르면 이 간지의 성질과 ${kname}으로 들어올 때의 뜻을 볼 수 있습니다.</p>
    </div>`;
  }

  // ───────────── 분야별 지수(애정·재물·건강·사고수) 화면 ─────────────
  // 계산은 M.evaluateDomainLuck(기존 운 평가 결과를 읽는 별도 계층)이며, 이 절은 표시만 맡는다.
  const DOM_ORDER = ['love', 'wealth', 'health', 'accident'];
  const DOM_INFO = {
    love: { name: '애정', full: '애정운', sub: '관계 영역의 활성도·적합도·안정성을 종합한 지표', note: '애정운은 관계 영역의 활성·적합·안정·변동을 명리 모델로 계산한 참고 지표이며, 만남이나 이별 같은 사건을 예측하지 않습니다.' },
    wealth: { name: '재물', full: '재물운', sub: '재정 활동의 활성도·적합도·안정성을 종합한 지표', note: '재물운은 재정 활동·적합·안정·변동을 명리 모델로 계산한 참고 지표이며, 수입이나 손실의 금액·결과를 예측하지 않습니다.' },
    health: { name: '건강', full: '건강 지수', label: '건강 균형', sub: '오행 균형·조후·부담도를 바탕으로 한 명리적 균형 지표', note: '건강 지수는 명리 해석상의 균형·부담 지표이며 질병의 진단이나 발생 가능성을 의미하지 않습니다.' },
    accident: { name: '사고수', full: '사고수', short: '사고수는 사고 발생 확률을 의미하지 않습니다.', sub: '변동·충돌·과부하 신호의 중첩 정도를 나타내는 주의 지표', note: '사고수는 명리학적 변화·충돌·부담 신호를 수치화한 참고 지표입니다. 실제 사고 발생 여부나 확률을 예측하지 않습니다. 사고 발생 확률을 의미하지 않으며, 높을수록 주의 신호가 많이 겹쳤다는 뜻입니다.' },
  };
  // 시간 단위별 해석 범위
  const DOM_SCOPE = {
    daeun: { love: '10년 동안의 관계 환경', wealth: '10년 동안의 재정 환경', health: '10년 동안의 균형·부담 환경', accident: '10년 동안의 주의 신호 환경입니다. 10년 동안 사고가 난다는 뜻이 아닙니다' },
    seun: { love: '해당 연도의 관계 활성·부담', wealth: '해당 연도의 재정 활성·부담', health: '해당 연도의 균형·부담', accident: '해당 연도의 주의 신호 환경입니다' },
    wolun: { love: '해당 달의 구체적인 관계 흐름', wealth: '해당 달의 구체적인 재정 흐름', health: '해당 달의 균형·부담 흐름', accident: '해당 달의 주의 신호입니다' },
    ilun: { love: '해당 날짜의 단기적인 관계 흐름', wealth: '해당 날짜의 단기적인 재정 흐름', health: '해당 날짜의 단기적인 균형·부담 흐름', accident: '해당 날짜의 단기적인 주의 신호입니다' },
  };
  const DOM_LEVEL_NAME = { daeun: '대운', seun: '세운', wolun: '월운', ilun: '일진' };
  // 점수 색: 애정·재물·건강은 높을수록, 사고수는 낮을수록 좋은 쪽 색. 색만으로 뜻을 전하지 않도록 항상 숫자·단계 글자를 함께 쓴다
  function domCol(key, v) {
    const g = key === 'accident' ? 100 - v : v;
    return g >= 70 ? 'var(--good)' : g >= 55 ? 'var(--accent)' : g >= 40 ? 'var(--ink-3)' : g >= 25 ? 'var(--d-chg)' : 'var(--bad)';
  }
  const domLabel = (key, r) => key === 'health' ? `건강 균형 ${r.score}` : `${DOM_INFO[key].name} ${r.score}`;
  const domCtx = (x, kind) => kind === 'seun' ? { ms: x.midMs } : kind === 'wolun' ? { ms: x.startMs + 12 * 864e5 } : kind === 'ilun' ? { ms: Date.UTC(x.date[0], x.date[1] - 1, x.date[2], 3) } : {};
  const domOf = (x, kind) => M.evaluateDomainLuck(S.ch, x, kind, domCtx(x, kind));
  const DOM_CTX = {}; let domSeq = 0;
  // 상세 화면의 2×2 카드
  function domainBox(x, kind, title) {
    let res; try { res = domOf(x, kind); } catch (e) { return ''; }
    const id = 'd' + (++domSeq); DOM_CTX[id] = { res, kind, title };
    return `<div class="dom"><div class="dom-h"><b>분야별 지수</b><span class="muted small">${DOM_LEVEL_NAME[kind]} 기준 · 누르면 근거가 열립니다</span></div>
      <div class="dom-g">${DOM_ORDER.map(k => { const r = res[k];
        return `<button type="button" class="dcard" data-dom="${id}:${k}" aria-label="${DOM_INFO[k].full} ${r.score} ${r.band}"><span class="dn">${k === 'health' ? '건강 균형' : DOM_INFO[k].name}</span><b class="dv num" style="color:${domCol(k, r.score)}">${r.score}</b><span class="db">${r.band}</span>${r.tags.length ? `<span class="dt">${r.tags.join(' · ')}</span>` : ''}<span class="dbar"><i style="width:${r.score}%;background:${domCol(k, r.score)}"></i></span></button>`; }).join('')}</div>
      <p class="small muted dom-n">${DOM_INFO.health.note} ${DOM_INFO.accident.short}</p></div>`;
  }
  const domRow = (label, v, inverse) => `<div class="dpart"><span>${label}</span><span class="dbar"><i style="width:${Math.round(v)}%;background:${domCol('health', inverse ? 100 - v : v)}"></i></span><b class="num">${Math.round(v)}</b></div>`;
  // 상세 시트(분야 하나)
  function domSheetHTML(sel) {
    const ctx = DOM_CTX[sel.id]; if (!ctx) return '<p>표시할 정보가 없습니다.</p><button class="btn x" data-act="close">닫기</button>';
    const { res, kind, title } = ctx, k = sel.key, r = res[k], I = DOM_INFO[k], c = r.components;
    const head = k === 'health' ? `${I.full} ${r.score} · ${r.band}` : k === 'accident' ? `사고수 ${r.score} · ${r.band}` : `${I.full} ${r.score} · ${r.band}`;
    const rows = k === 'accident' ? r.parts.map(p => domRow(p.label, p.v, true)).join('')
      : k === 'health' ? r.parts.map(p => p.key === 'volatility' ? domRow(p.label, p.v, true) : domRow(p.label, p.v, p.inverse)).join('')
        : r.parts.map(p => p.key === 'volatility' ? domRow(p.label, p.v, true) : domRow(p.label, p.v, false)).join('');
    const weights = r.parts.filter(p => p.w > 0).map(p => `${p.label.replace(/\(.*\)/, '')} ${Math.round(p.w * 100)}%`).join(' · ');
    return `<span class="cat">${DOM_LEVEL_NAME[kind]} · ${esc(title || '')}</span><h3>${head}</h3>
      <div class="cp-pills">${r.tags.map(t => `<span class="pill">${t}</span>`).join('')}<span class="pill">${DOM_SCOPE[kind][k].split('입니다')[0]}</span></div>
      <p class="cp-sum">${r.summary}</p>
      <div class="dparts">${rows}</div>
      <p class="small muted">${k === 'accident' ? `구성: ${weights} (신살은 보조로만, 높은 성분이 겹칠수록 배율 ${r.synergy.mult.toFixed(2)} — 성분 ${r.synergy.nHigh}개가 기준 이상)` : `구성: ${weights}${k === 'health' ? ' (변동성은 부담도에 일부만 반영)' : ' (변동성은 점수에 넣지 않고 따로 보여 줍니다)'}`}</p>
      <h4>핵심 이유</h4><ul class="pos-ul small">${r.reasons.length ? r.reasons.map(t => `<li>${esc(t)}</li>`).join('') : '<li>뚜렷한 쏠림이 없는 무난한 시기입니다.</li>'}</ul>
      ${res.chainNote ? `<p class="small muted">${esc(res.chainNote)}</p>` : ''}
      <p class="small muted"><b>${DOM_LEVEL_NAME[kind]}에서의 의미</b> — ${DOM_SCOPE[kind][k]}</p>
      <p class="cp-disc">${I.note}</p>
      <button class="btn x" data-act="close">닫기</button>`;
  }

  // ── 지표 선택과 그래프
  const METRICS = [['flow', '전체 흐름'], ['love', '애정'], ['wealth', '재물'], ['health', '건강'], ['accident', '사고수']];
  const isDomain = () => DOM_ORDER.includes(S.metric);
  function metricBar() {
    const m = S.metric || 'flow', info = DOM_INFO[m];
    return `<section class="card"><div class="card-h"><h2>그래프 지표</h2><span class="note">아래 대운·연도·월운 그래프와 일진 달력에 적용됩니다</span></div>
      <div class="cp-filters" role="group" aria-label="그래프 지표">${METRICS.map(([k, l]) => `<button type="button" class="opt" data-act="metric:${k}" aria-pressed="${m === k}">${l}</button>`).join('')}</div>
      <p class="small" style="color:var(--ink-2)">${m === 'flow' ? '전체 흐름: 원국의 불균형을 들어오는 운이 보완하는지 심화하는지를 나타내는 −100~+100의 상대 지표입니다.' : `<b>${info.full}</b> — ${info.sub}. 0~100 눈금이며 ${m === 'accident' ? '높을수록 주의 신호가 많이 겹쳤다는 뜻입니다.' : '높을수록 그 지표의 값이 큽니다.'}`}</p>
      ${m === 'health' || m === 'accident' ? `<p class="cp-disc">${info.note}</p>` : m !== 'flow' ? `<p class="small muted">${info.note}</p>` : ''}
    </section>`;
  }
  const chartLegend = () => !isDomain() ? modeLegend() : `<div class="legend"><span>막대 높이 = ${DOM_INFO[S.metric].full} 점수(0~100)</span>${S.metric === 'accident' ? '<span><i class="sw" style="background:var(--good)"></i>낮음</span><span><i class="sw" style="background:var(--d-chg)"></i>주의</span><span><i class="sw" style="background:var(--bad)"></i>주의 높음</span>' : '<span><i class="sw" style="background:var(--good)"></i>높음</span><span><i class="sw" style="background:var(--ink-3)"></i>보통</span><span><i class="sw" style="background:var(--bad)"></i>낮음</span>'}<span>단계 글자는 누르면 나오는 상세와 툴팁에 표시됩니다</span></div>`;
  function domTip(title, res) { const k = S.metric, r = res[k]; return `<b>${esc(title)}</b><br>${DOM_INFO[k].full} <b>${r.score}</b> · ${r.band}${r.tags.length ? `<br>${r.tags.join(' · ')}` : ''}<br>${r.summary}${r.reasons.slice(0, 2).map(t => `<br>· ${esc(t)}`).join('')}`; }
  // 0~100 눈금 막대(대운·월운)
  function drawDomainDiv(el, items) {
    const k = S.metric, n = items.length, cw = el.clientWidth || 320, W = Math.max(cw, n * 40), H = 246, L = 34, R = 6, T = 30, B = 54;
    const step = (W - L - R) / n, bw = Math.min(30, step * 0.58), y = v => T + (100 - v) / 100 * (H - T - B);
    let s = svgEl(W, H);
    for (const g of [0, 25, 50, 75, 100]) s += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" style="stroke:${g === 0 ? 'var(--ink-3)' : 'var(--line)'};stroke-width:1" ${g && g !== 100 ? 'stroke-dasharray="3 3"' : ''}/><text x="${L - 6}" y="${y(g) + 3.5}" text-anchor="end" style="fill:var(--ink-3);font-size:10px">${g}</text>`;
    items.forEach((it, i) => {
      const cx = L + step * (i + 0.5), h = Math.max(2, y(0) - y(it.v)), top = y(it.v), x0 = cx - bw / 2, r = Math.min(4, h / 2);
      s += `<path d="M${x0},${y(0)} V${top + r} Q${x0},${top} ${x0 + r},${top} H${x0 + bw - r} Q${x0 + bw},${top} ${x0 + bw},${top + r} V${y(0)} Z" style="fill:${domCol(k, it.v)};${it.sel ? 'stroke:var(--ink);stroke-width:2' : ''}"/>`;
      s += `<text x="${cx}" y="${top - 5}" text-anchor="middle" style="fill:var(--ink-2);font-size:10px;font-weight:700">${it.v}</text>`;
      if (it.cur) s += `<circle cx="${cx}" cy="${T - 12}" r="3" style="fill:var(--seal)"/>`;
      s += `<text x="${cx}" y="${H - B + 18}" text-anchor="middle" style="fill:var(--ink);font-size:14px;font-weight:${it.sel ? 900 : 700};font-family:var(--f-display)">${it.label}</text>`;
      s += `<text x="${cx}" y="${H - B + 33}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${it.sub}</text>`;
      if (it.sub2) s += `<text x="${cx}" y="${H - B + 45}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${it.sub2}</text>`;
      s += `<rect class="hit" x="${cx - step / 2}" y="0" width="${step}" height="${H}" style="fill:transparent" data-pick="${it.pick}" data-tip="${esc(it.tip)}"/>`;
    });
    el.innerHTML = s + '</svg>';
  }
  // 0~100 눈금 막대(연도별 90년)
  function drawDomainLife(el) {
    const ch = S.ch, k = S.metric, y0 = ch.solar.y, y1 = Math.min(y0 + 90, M.MAX_Y - 1), data = M.seunRange(ch, y0, y1).map(x => ({ year: x.year, age: x.age, x, res: domOf(x, 'seun') }));
    const cw = el.clientWidth || 320, W = Math.max(cw, 320), H = 270, L = 34, R = 18, T = 26, B = 46;
    const x = Y => L + (Y - y0) / (y1 - y0) * (W - L - R), y = v => T + (100 - v) / 100 * (H - T - B);
    let s = svgEl(W, H);
    ch.daeun.list.forEach((d, i) => { const a = Math.max(y0, d.startYear), b = Math.min(y1, d.startYear + 10); if (b <= a) return; if (i % 2 === 0) s += `<rect x="${x(a)}" y="${T}" width="${x(b) - x(a)}" height="${H - T - B}" style="fill:var(--surface-2)"/>`; if (x(b) - x(a) > 28) s += `<text x="${(x(a) + x(b)) / 2}" y="${T - 9}" text-anchor="middle" style="fill:var(--ink-2);font-size:12px;font-weight:700;font-family:var(--f-display)">${M.gzName(d)}</text>`; });
    for (const g of [0, 25, 50, 75, 100]) s += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" style="stroke:${g === 0 ? 'var(--ink-3)' : 'var(--line)'}" ${g && g !== 100 ? 'stroke-dasharray="3 3"' : ''}/><text x="${L - 6}" y="${y(g) + 3.5}" text-anchor="end" style="fill:var(--ink-3);font-size:10px">${g}</text>`;
    for (let Y = Math.ceil(y0 / 10) * 10; Y <= y1; Y += 10) s += `<text x="${x(Y)}" y="${H - 8}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${Y}</text>`;
    const bw = Math.max(1.5, (W - L - R) / (y1 - y0 + 1) - 1.2);
    data.forEach(d => { const v = d.res[k].score, top = y(v), h = Math.max(1.5, y(0) - top); s += `<rect x="${(x(d.year) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(2, bw / 2)}" style="fill:${domCol(k, v)}"/>`; });
    const curY = M.yearPillarAt(NOW).sajuYear;
    if (curY >= y0 && curY <= y1) s += `<line x1="${x(curY)}" x2="${x(curY)}" y1="${T}" y2="${H - B}" style="stroke:var(--seal);stroke-width:1.5" stroke-dasharray="4 3"/><text x="${x(curY) + 4}" y="${T + 11}" style="fill:var(--seal);font-size:10px;font-weight:700">올해</text>`;
    const sel = S.sel && S.sel.kind === 'seun' ? S.sel.Y : null;
    if (sel && sel >= y0 && sel <= y1) { const d = data.find(q => q.year === sel); if (d) s += `<circle cx="${x(sel)}" cy="${y(d.res[k].score)}" r="4.5" style="fill:var(--ink);stroke:var(--surface);stroke-width:2"/>`; }
    s += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" style="stroke:var(--ink);stroke-width:1;opacity:0"/><circle class="xd" r="4" style="fill:var(--ink);opacity:0"/><rect class="hit ov" x="${L}" y="0" width="${W - L - R}" height="${H}" style="fill:transparent"/>`;
    el.innerHTML = s + '</svg>';
    const svg = el.querySelector('svg'), ov = el.querySelector('.ov'), xh = el.querySelector('.xh'), xd = el.querySelector('.xd');
    const nearest = ev => { const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width), Y = Math.round(y0 + (px - L) / (W - L - R) * (y1 - y0)); return data.find(d => d.year === Math.max(y0, Math.min(y1, Y))); };
    ov.addEventListener('mousemove', ev => { const d = nearest(ev); if (!d) return; xh.setAttribute('x1', x(d.year)); xh.setAttribute('x2', x(d.year)); xh.style.opacity = .35; xd.setAttribute('cx', x(d.year)); xd.setAttribute('cy', y(d.res[k].score)); xd.style.opacity = 1; showTip(ev, domTip(`${d.year}년 (만 ${d.age}세) ${M.gzName(d.x)}`, d.res)); });
    ov.addEventListener('mouseleave', () => { xh.style.opacity = 0; xd.style.opacity = 0; hideTip(); });
    ov.addEventListener('click', ev => { const d = nearest(ev); if (d) pick('seun:' + d.year); });
  }

  // 지표 선택 시 대운·연도·월운 그래프
  function drawDomainChart(el, k) {
    const ch = S.ch, m = S.metric;
    if (k === 'daeun') {
      const cur = M.daeunAt(ch, NOW);
      drawDomainDiv(el, ch.daeun.list.map((d, i) => { const r = domOf(d, 'daeun'); return { v: r[m].score, label: M.gzName(d), sub: `${d.startAge}세`, sub2: d.startYear, pick: 'daeun:' + i, sel: S.sel && S.sel.kind === 'daeun' && S.sel.i === i, cur: cur === d, tip: domTip(`${d.startAge}세 대운 ${M.gzName(d)}`, r) }; }));
    } else if (k === 'wolun') {
      const ms = M.wolun(ch, S.selYear);
      drawDomainDiv(el, ms.map((x, i) => { const nx = ms[i + 1] ? ms[i + 1].startMs : Infinity, r = domOf(x, 'wolun'); return { v: r[m].score, label: M.gzName(x), sub: x.termName, pick: 'wolun:' + i, sel: S.sel && S.sel.kind === 'wolun' && S.sel.i === i, cur: NOW >= x.startMs && NOW < nx, tip: domTip(`${x.termName}~ ${M.gzName(x)}`, r) }; }));
    } else if (k === 'life') drawDomainLife(el);
  }

  // 운의 흐름 상세: 주 흐름 4개를 모두 보여 주고(최고점이 주 흐름), 변동·방어 overlay와 흐름 적합도는 따로 보여 준다
  const FLOW_ROWS = [['opportunity', '기회', 'd-atk'], ['expansion', '확장', 'd-ext'], ['harvest', '수확', 'd-hrv'], ['accumulation', '축적', 'd-acc']];
  function flowBars(e) {
    const f = e.flow;
    return `<div class="flowbars">${FLOW_ROWS.map(([k, n, c]) => `<div class="fb${k === f.primaryFlow ? ' main' : k === f.secondaryFlow ? ' sec' : ''}"><span class="fn">${n} 활성도${k === f.primaryFlow ? ' · 주' : k === f.secondaryFlow ? ' · 동반' : ''}</span><span class="volbar" style="--v:${f.flows[k]}"><i style="background:var(--${c})"></i></span><b class="num">${f.flows[k]}</b></div>`).join('')}</div>`;
  }
  function metricsBox(e) {
    const o = e.overlays;
    return `<div class="flowbars">
      <div class="fb${o.volatility.active ? ' main' : ''}"><span class="fn">${term('변동성')}</span><span class="volbar" style="--v:${o.volatility.score}"><i style="background:var(--d-chg)"></i></span><b class="num">${o.volatility.score}</b></div>
      <div class="fb${o.defense.active ? ' main' : ''}"><span class="fn">${term('방어기', '부담도')}</span><span class="volbar" style="--v:${o.defense.score}"><i style="background:var(--d-def)"></i></span><b class="num">${o.defense.score}</b></div>
    </div>
    <div class="small">변동성 <b class="num">${o.volatility.score}</b> · ${o.volatility.band} · 부담도 <b class="num">${o.defense.score}</b> · ${o.defense.band} · 흐름 적합도 <b class="num">${signed(e.fitScore)}</b> · ${e.condition}</div>`;
  }
  // 기회 활성도의 종류·근거(활성도 값 자체는 flowBars에 있다)
  function oppBox(e) {
    const o = e.opportunityActivation, types = e.opportunityType;
    if (o < 40) return `<div class="small muted">${M.opportunityNote(e)}</div>`;
    return `<div class="volbox"><div class="small muted">${M.opportunityNote(e)}</div>
      ${types.length ? `<div class="small"><b>주요 기회</b>: ${types.map(esc).join(' · ')}</div>` : ''}
      ${e.opportunityReasons.length ? `<ul class="pos-ul small">${e.opportunityReasons.slice(0, 4).map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}</div>`;
  }
  function volBox(e) {
    const v = Math.round(e.volatilityScore), sig = e.volatilitySignals.slice(0, 4);
    return `<div class="volbox"><div class="volh"><span>${term('변동성')} <b class="num">${v}</b> / 100 · ${e.volatilityBand}</span></div>
      <div class="small muted">${M.volatilityNote(e)}</div>
      ${sig.length ? `<div class="small"><b>주요 변화 신호</b></div><ul class="pos-ul small">${sig.map(g => `<li>${esc(g.text)} <span class="muted">— ${g.means}</span></li>`).join('')}${e.volatilityOverlap >= 2 ? `<li>핵심 궁(일주·월주) 관계 ${e.volatilityOverlap}개 중첩</li>` : ''}</ul>` : '<div class="small muted">원국과 만드는 합·충·형·파·해가 거의 없습니다.</div>'}</div>`;
  }
  const DEF_PART = { fit: '흐름 적합도 저하', eokbu: '강약(억부) 불균형 심화', structure: '십성 균형 악화·구조 부담', johu: '조후(한난조습) 부담', relation: '합·충 관계 부담', volFit: '변화 신호와 부적합이 겹침' };
  function defBox(e) {
    const o = e.overlays.defense, parts = Object.entries(e.flow.defenseParts).filter(([, v]) => v >= 0.25).sort((a, b) => b[1] - a[1]).slice(0, 4);
    return `<div class="volbox"><div class="volh"><span>${term('방어기', '부담도')} <b class="num">${o.score}</b> / 100 · ${o.band}</span></div>
      ${parts.length ? `<div class="small"><b>부담이 커지는 이유</b></div><ul class="pos-ul small">${parts.map(([k, v]) => `<li>${DEF_PART[k]} <span class="muted">— ${Math.round(v * 100)}%</span></li>`).join('')}</ul>` : '<div class="small muted">부담을 키우는 뚜렷한 요인이 없습니다.</div>'}
      <div class="small muted">부담도는 이 운의 전반적인 부담 관리 필요성이며, 충돌·과부하를 따로 보는 사고수와는 다른 값입니다.</div></div>`;
  }
  const VOL_CTX = {}; let volSeq = 0;
  const volAttr = e => { if (!e) return ''; const id = 'v' + (++volSeq); VOL_CTX[id] = e; return ` data-vol="${id}"`; };
  // 운의 단위별 overlay 풀이
  const LEVEL_OV = {
    daeun: { volatility: '10년 동안 직업·환경·관계의 방향이 움직이기 쉬움', defense: '10년 중 무리한 확대보다 부채·건강 등 부담 점검이 필요' },
    seun: { volatility: '올해 조직·환경·계획의 재편 가능성에 주목', defense: '올해는 현금 보존·비용 절감·하던 일 완주가 맞음' },
    wolun: { volatility: '이번 달 일정·거래·환경 변동에 대비', defense: '이번 달은 지출 줄이기·일정 여유 두기가 맞음' },
    ilun: { volatility: '오늘 일정·환경 변동에 유연하게 대응, 큰 결정은 확인 후', defense: '오늘은 검토·유지·마무리 위주로, 새 일은 무리하지 않기' },
  };
  function ovLines(e, kind) {
    const t = LEVEL_OV[kind]; if (!t) return '';
    return ['volatility', 'defense'].filter(k => e.overlays[k].active).map(k => `<div class="small">${ovBtn(k, e)} <b>${t[k]}</b></div>`).join('');
  }
  function flowHead(p, mainBtn) {
    return `${mainBtn}${p.secondaryFlow ? `<span class="muted small">동반 ${M.flowName(p.secondaryFlow)}</span>` : ''}${ovTags(p, true)} ${condTag(p.condition)}`;
  }
  function phaseBox(x, kind) {
    const p = luckMode(x), name = p.mode, [role, texts] = LEVEL[kind], [mean, act] = texts[name];
    const alt = showGhost() ? altOf(x) : null;
    return `<div class="phbox dm-bg" style="--dm:${m6Col(name)}">
      <div class="phbox-h">${flowHead(p, m6Btn(name, p))} <b>${mean}</b> <span class="muted small">${LEVEL_ROLE[kind]}</span></div>
      <div class="small">${esc(M.flowSummary(p))}</div>
      <div class="small">할 일: <b>${act}</b></div>
      ${ovLines(p, kind)}
      ${flowBars(p)}
      ${metricsBox(p)}
      <div class="small muted">작용 강도 ${Math.round(p.intensityScore)} (${esc(p.tendency)})</div>
      <div class="small">이 시기에 주로 들어오는 기운은 ${term(p.group)}입니다 → <b>${GROUP_ACT[p.group]}</b>에 힘을 쓰는 성향입니다.</div>
      ${oppBox(p)}
      ${volBox(p)}
      ${defBox(p)}
      ${alt != null ? `<div class="small muted">${schoolName(altSchool())} 기준만 따로 보면 ${signed(alt)}점 (${M.conditionOf(alt)}) — 종합 흐름과 ${Math.sign(alt) === Math.sign(luckV(x)) ? '같은 방향' : '다른 방향'}입니다.</div>` : ''}

  function detailHTML(title, x, extra = '', kind = '', banner = '') {

  function sijinRows(dayItem, ymd) {

      <div class="list">

  const TR_BAND = [[1.2, '매우 밝음', 'good'], [0.4, '밝음', 'good'], [-0.4, '변화·조율', ''], [-1.2, '신중', 'bad'], [-Infinity, '어려움', 'bad']];

    money: ['돈이 들어오는 길이 열립니다. 준비된 계획이 있다면 실행하기 좋습니다.', '수입과 지출이 안정적입니다. 꾸준한 저축이 복을 키웁니다.', '들어오는 만큼 나가는 흐름입니다. 지출 구조를 점검하세요.', '투자나 큰 지출은 신중하게. 확인되지 않은 정보에 흔들리지 마세요.', '재정 압박이 느껴지는 시기입니다. 빚·보증·충동구매를 피하고 기반을 지키세요.'],

  };

  function pkSum(cats, sel) {
    const sum = {}, picked = [];
    for (const c of cats) { const o = c.opts.find(x => x[0] === sel[c.k]); if (!o) continue; picked.push([c, o]); for (const [d, v] of Object.entries(o[2])) sum[d] = (sum[d] || 0) + v; }
    return { sum, picked };
  }
  // 선택 항목이 12개를 넘으면 합계를 줄여 반영해 막대가 한쪽 끝에 붙지 않게 한다
  const pkPct = (v, n = 12) => Math.max(5, Math.min(97, 50 + v * 6 * Math.min(1, 12 / Math.max(n, 1))));
  const pkGrade = p => p >= 74 ? ['강함', 'good'] : p >= 58 ? ['좋음', 'good'] : p >= 43 ? ['보통', ''] : ['보완 필요', 'bad'];
  const pkBars = (dims, sum, n) => `<div class="bars pkbars">${dims.map(([d, l]) => { const p = pkPct(sum[d] || 0, n), [g, c] = pkGrade(p); return `<div class="bar"><span class="lab">${l}</span><div class="track"><div class="fill" style="width:${p}%;--c:var(${c === 'good' ? '--good' : c === 'bad' ? '--bad' : '--accent'})"></div></div><span class="val">${g}</span></div>`; }).join('')}</div>`;
  const effChips = (eff, dims) => dims.filter(([d]) => eff[d]).map(([d, l]) => `<span class="chip ${eff[d] > 0 ? 'good' : 'bad'}">${l} ${eff[d] > 0 ? '+' : '−'}${Math.abs(eff[d])}</span>`).join('');
  const pkRank = (dims, sum) => dims.map(([d, l]) => [d, l, sum[d] || 0]).sort((a, b) => b[2] - a[2]);
  // 그룹별로 접고 펼 수 있다. 펼침 상태는 PK.open에 저장하고, 기본은 "선택이 있거나 첫 그룹"만 펼친다.
  function pkPicker(sys, cats, sel) {
    const groups = []; let cur = null;
    cats.forEach(c => { if (c.g || !cur) { cur = { g: c.g || '기타', cats: [] }; groups.push(cur); } cur.cats.push(c); });

      <div class="pkc-o" role="group" aria-label="${c.l}">${c.opts.map(o => `<button type="button" class="opt" data-opt="${sys}:${c.k}:${o[0]}" aria-pressed="${sel[c.k] === o[0]}">${o[1]}</button>`).join('')}</div></div>`;
    return `<div class="pkgs">${groups.map((gr, gi) => {
      const n = gr.cats.filter(c => c.opts.some(x => x[0] === sel[c.k])).length, key = sys + ':' + gr.g;
      const open = key in (PK.open || {}) ? PK.open[key] : (gi === 0 || n > 0);
      return `<details class="pkgd" data-gk="${key}"${open ? ' open' : ''}><summary class="pkg">${gr.g} <span class="muted small num">${n}/${gr.cats.length}</span></summary><div class="pko">${gr.cats.map(cat).join('')}</div></details>`;
    }).join('')}</div>`;
  }
  const pkHead = (title, n, total, sys) => `<div class="card-h"><h2>${title}</h2><span class="note num">${n}/${total} 선택 · 한 번 더 누르면 해제</span>${n ? `<button class="btn" data-act="pk-reset:${sys}">전부 지우기</button>` : ''}</div>`;

  function renderFace() {
    const sel = PK.gw, { sum, picked } = pkSum(GW, sel);
    const picker = `<section class="card">${pkHead('관상 — 부위별로 고르기', picked.length, GW.length, 'gw')}

      ${pkPicker('gw', GW, sel)}</section>`;
    if (!picked.length) return picker + `<section class="card"><p class="muted small">부위를 하나 이상 고르면 아래에 종합 풀이가 나타납니다.</p></section>`;
    // 삼정: 각 부위 효과의 합을 그 부위가 맡은 시기에 더하고, "가장 긴 곳" 선택은 가산점으로 준다
    const ph = { up: null, mid: null, low: null }, phN = { up: 0, mid: 0, low: 0 };

      if (c.z) { ph[c.z] = (ph[c.z] || 0) + Object.values(o[2]).reduce((a, b) => a + b, 0); phN[c.z]++; }
      if (o[5]) for (const [z, v] of Object.entries(o[5])) ph[z] = (ph[z] || 0) + v;

    const phG = v => v == null ? ['선택 없음', ''] : v >= 1.2 ? ['좋음', 'good'] : v <= -0.3 ? ['조심', 'bad'] : ['무난', ''];
    const rk = pkRank(GW_DIMS, sum), top = rk[0], low = rk[rk.length - 1];
    const traits = [...new Set(picked.map(([, o]) => o[4]))].slice(0, 4);
    const phBest = GW_PH.filter(([z]) => ph[z] != null).sort((a, b) => ph[b[0]] - ph[a[0]])[0];
    const tj = traits.join('·');

      + (low[2] < 0 ? `<b>${josa(low[1], '은', '는')}</b> 표정과 생활 습관으로 보완하면 좋습니다. ` : '')
      + (phBest && ph[phBest[0]] > 0 ? `운의 무게는 <b>${phBest[1]}</b>(${phBest[2].split(' · ')[0]})에 가장 많이 실려 있습니다.` : '');

    return picker + `<section class="card">
      <div class="card-h"><h2>관상 종합 풀이</h2><span>${traits.map(t => `<span class="chip">${t}</span>`).join('')}</span></div>
      <div class="sumbox">${summary}</div>
      ${pkBars(GW_DIMS, sum, picked.length)}
      <h3>시기별 흐름 <span class="muted small">삼정(三停)</span></h3>
      <div class="phase3">${GW_PH.map(([z, l, d]) => { const [g, c] = phG(ph[z]); return `<div class="phc ${c}"><span class="lbl">${l} · ${d.split(' · ')[0]}</span><b>${g}</b><span class="muted small">${d.split(' · ')[1]}</span></div>`; }).join('')}</div>
      <h3>부위별 풀이</h3>
      <div class="list">${picked.map(([c, o]) => `<div class="li"><span class="k">${c.l}</span><span class="v"><b>${o[1]}</b> <span class="small" style="color:var(--ink-2)">${o[3]}</span>${effChips(o[2], GW_DIMS)}</span><span></span></div>`).join('')}</div>
      ${tips ? `<h3>보완하는 법</h3><ul class="pos-ul small">${tips}</ul>` : ''}
      <p class="note">전통 상법(相法)의 일반론을 바탕으로 한 참고용 풀이입니다. "관상은 마음을 따른다(相隨心生)"는 말처럼 인상은 표정과 습관으로 달라집니다.</p>
    </section>`;
  }

  function renderFs() {
    const sel = PK.fs, { sum, picked } = pkSum(FS, sel);
    const picker = `<section class="card">${pkHead('풍수 — 우리 집 살펴보기', picked.length, FS.length, 'fs')}
      <p class="small" style="color:var(--ink-2)">지금 사는 집(또는 보러 간 집)에 가장 가까운 것을 항목마다 고르세요. 사주의 용신과 함께 종합합니다.</p>
      ${pkPicker('fs', FS, sel)}</section>`;
    const y = S.ch && S.ch.yong;
    const yongEl = y ? +Object.keys(y.roles).find(k => y.roles[k] === '용신') : null;
    const heeEl = y ? +Object.keys(y.roles).find(k => y.roles[k] === '희신') : null;
    // 집의 향이 내 용신·희신 방위면 가산, 기신·구신 방위면 감산
    const dirP = picked.find(([c]) => c.k === 'dir');
    let yEff = null, yLine = '';
    if (y && dirP) {

      yEff = role === '용신' ? { w: 1, v: 1 } : role === '희신' ? { v: 1 } : role === '기신' || role === '구신' ? { s: -1 } : {};
      for (const [d, v] of Object.entries(yEff)) sum[d] = (sum[d] || 0) + v;
      yLine = `<b>${dirP[1][1]}</b>은 <b class="eltxt ${ECLS[e]}">${elLabel(e)}</b> 방위로, 내 사주에서는 ${term(role)}입니다. `
        + (role === '용신' ? '타고난 사주에 필요한 기운이 집으로 들어오는 좋은 궁합입니다.' : role === '희신' ? '용신을 돕는 기운이라 무난하게 잘 맞습니다.' : role === '한신' ? '크게 돕지도 해치지도 않는 방위입니다.' : `사주에 넘치는 기운이라 오래 머무는 방은 ${FS_EL[yongEl][0]}에 두고, ${FS_EL[yongEl][1]} 계열로 균형을 맞추세요.`);

        <div class="li"><span class="k">어울리는 색</span><span class="v"><b class="eltxt ${ECLS[yongEl]}">${FS_EL[yongEl][1]}</b><span class="small">보조로 ${elLabel(heeEl)}의 ${FS_EL[heeEl][1]}</span></span><span></span></div>
        <div class="li"><span class="k">소재·소품</span><span class="v">${FS_EL[yongEl][2]}</span><span></span></div>

    const summary = `${verdict}. `
      + (top[2] > 0 ? `가장 든든한 부분은 <b>${top[1]}</b>입니다. ` : '')
      + (low[2] < 0 ? `<b>${josa(low[1], '이', '가')}</b> 약하니 아래 보완법을 먼저 해 보세요. ` : '')
      + (fixes.length ? `손볼 곳은 ${fixes.length}군데입니다.` : '따로 손볼 곳이 보이지 않습니다.');
    return picker + `<section class="card">
      <div class="card-h"><h2>집 풍수 종합 풀이</h2></div>
      <div class="sumbox">${summary}</div>
      ${pkBars(FS_DIMS, sum, picked.length)}
      <h3>항목별 풀이</h3>
      <div class="list">${picked.map(([c, o]) => `<div class="li"><span class="k">${c.l}</span><span class="v"><b>${o[1]}</b> <span class="small" style="color:var(--ink-2)">${o[3]}</span>${effChips(o[2], FS_DIMS)}</span><span></span></div>`).join('')}
        ${yEff && Object.keys(yEff).length ? `<div class="li"><span class="k">사주 궁합</span><span class="v"><span class="small" style="color:var(--ink-2)">집의 향과 내 용신의 관계</span>${effChips(yEff, FS_DIMS)}</span><span></span></div>` : ''}</div>

    </section>` + yongCard;
  }

  function trOptions(cur) {

      + TR_SUIT.map(([k, n, e]) => `<optgroup label="${n} (${e})">${TR_RANK.map((_, i) => o(TR[k + (i + 1)])).join('')}</optgroup>`).join('');
  }
  function trDraw() {
    const ids = Object.keys(TR), used = new Set();
    PK.tr.cards = {};
    for (const [p] of TR_SPREAD[PK.tr.spread][1]) { let id; do id = ids[Math.floor(Math.random() * ids.length)]; while (used.has(id)); used.add(id); PK.tr.cards[p] = [id, Math.random() < 0.3]; }
    pkSave(); render();
  }
  function renderTarot() {
    const T = PK.tr, [spName, pos] = TR_SPREAD[T.spread] || TR_SPREAD.three, [topicName, topicSuits] = TR_TOPIC[T.topic] || TR_TOPIC.all;
    const rows = pos.map(([k, l, w, frame]) => { const c = T.cards[k], card = c && TR[c[0]]; return card ? { k, l, w, frame, card, rev: !!c[1], sc: c[1] ? card.sr : card.su, kw: c[1] ? card.rev : card.up } : null; }).filter(Boolean);
    const dup = new Set(rows.map(r => r.card.id)).size < rows.length;

    else if (rows.length >= 3 && !cnt.M) notes.push('메이저 카드가 없어 운명적인 일보다 일상의 선택과 노력으로 충분히 바꿀 수 있는 문제입니다.');
    if (domS) notes.push(`${domS[1]}(${domS[2]})가 ${cnt[domS[0]]}장으로 두드러져, 이 질문의 핵심은 <b>${domS[3]}</b>에 있습니다.`);

  // ───────────── 차트 ─────────────
  const NS = 'http://www.w3.org/2000/svg';

      s += `<text x="${L - 6}" y="${y(g) + 3.5}" text-anchor="end" style="fill:var(--ink-3);font-size:10px">${g > 0 ? '+' + g : g < 0 ? '−' + (-g) : '0'}</text>`;

      const r = Math.min(4, h / 2), x0 = cx - bw / 2;

        : `M${x0},${y0} V${top + h - r} Q${x0},${top + h} ${x0 + r},${top + h} H${x0 + bw - r} Q${x0 + bw},${top + h} ${x0 + bw},${top + h - r} V${y0} Z`;

      if (it.cond) { const by = v >= 0 ? top - 15 : top + h + 4; s += `<rect x="${cx - 8}" y="${by}" width="16" height="11" rx="5.5" style="fill:${COND_COL[it.cond]};opacity:.9"/><text x="${cx}" y="${by + 8.5}" text-anchor="middle" style="fill:#fff;font-size:8px;font-weight:700">${it.cond[0]}</text>`; }

      s += `<text x="${cx}" y="${H - B + 18}" text-anchor="middle" style="fill:var(--ink);font-size:14px;font-weight:${it.sel ? 900 : 700};font-family:var(--f-display)">${it.label}</text>`;
      s += `<text x="${cx}" y="${H - B + 33}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${it.sub}</text>`;

    s += `<rect class="hit ov" x="${L}" y="0" width="${W - L - R}" height="${H}" style="fill:transparent"/>`;
    // 삼재 배지(참고 정보): 막대·점수·색에는 영향 없음. 연도 라벨 위쪽에 작게 표시하고 누르면 용어 설명이 열린다

  const loadAny = async srcs => { let err; for (const u of srcs) { try { return await loadScript(u); } catch (e) { err = e; } } throw err; };
  async function xpLibs(needPdf) {

  // 모바일은 렌더링에 몇 초 걸려 터치 동작(user activation)이 끝나므로, 완성 후 "저장·공유" 시트를 띄워 새 터치에서 저장/공유하게 한다
  function xpSheet(files, kind) {
    const urls = files.map(f => URL.createObjectURL(f));

    const bg = document.createElement('div'); bg.className = 'sheet-bg';
    const sh = document.createElement('div'); sh.className = 'sheet'; sh.style.maxHeight = '85vh'; bg.appendChild(sh);
    const close = () => { bg.remove(); urls.forEach(u => URL.revokeObjectURL(u)); };
    const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
    const x = mk('button', 'btn x', '닫기'); x.type = 'button'; x.onclick = close; sh.appendChild(x);
    sh.appendChild(mk('h3', '', kind === 'pdf' ? 'PDF가 준비됐어요' : `이미지 ${files.length}장이 준비됐어요`));
    sh.appendChild(mk('p', '', canShare ? '아래 버튼을 눌러 파일 앱·카카오톡 등으로 저장하거나 보내세요.' : kind === 'pdf' ? '저장이 되지 않으면 "열기"를 누른 뒤 브라우저 메뉴에서 저장하세요.' : '저장이 되지 않으면 이미지를 길게 눌러 "이미지 저장"을 선택하세요.'));
    const row = mk('div'); row.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px';
    if (canShare) {

      b.onclick = async () => { try { await navigator.share({ files, title: files[0].name }); } catch (e) { if (e && e.name !== 'AbortError') { b.textContent = '공유 실패 — 아래 버튼을 이용하세요'; } } };
      row.appendChild(b);
    }

      const a = mk('a', 'btn', files.length > 1 ? `${i + 1}쪽 다운로드` : '다운로드'); a.href = urls[i]; a.download = f.name; row.appendChild(a);

  // 내용이 든 카드들을 A4 폭(714px) 스테이지에 복제한다. SVG는 CSS 변수가 풀리지 않으므로 계산된 값을 인라인으로 박아 둔다.
  function xpStage(tabLabel) {
    const stage = document.createElement('div'); stage.className = 'wrap xs';
    const tmp = document.createElement('div'); tmp.innerHTML = whoLine();
    const head = document.createElement('div'); head.className = 'xs-head';
    head.innerHTML = `<b>만트라 만세력 · ${esc(tabLabel)}</b><span>${esc(tmp.textContent)}</span><span>${new Date().toLocaleDateString('ko-KR')} 출력</span>`;
    stage.appendChild(head);
    document.querySelectorAll('main.wrap > section.card, main.wrap > p.note').forEach(el => { if (!el.classList.contains('form')) stage.appendChild(el.cloneNode(true)); });
    document.body.appendChild(stage);
    stage.querySelectorAll('svg').forEach(svg => {
      if (+svg.getAttribute('width') > 660) { svg.style.width = '100%'; svg.style.height = 'auto'; }
      svg.querySelectorAll('*').forEach(el => {
        const cs = getComputedStyle(el);
        ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'opacity', 'fill-opacity', 'font-size', 'font-weight', 'font-family', 'text-anchor'].forEach(k => { el.style.setProperty(k, cs.getPropertyValue(k)); });
      });
    });
    // html2canvas는 inset 그림자를 칠해 버리므로 같은 굵기의 테두리로 바꾼다
    stage.querySelectorAll('*').forEach(el => {
      const bs = getComputedStyle(el).boxShadow;
      if (!bs || bs === 'none' || !bs.includes('inset')) return;
      const m = bs.match(/^(rgba?\([^)]+\))\s+0px 0px 0px (\d+(?:\.\d+)?)px inset$/);
      el.style.boxShadow = 'none';
      if (m && m[1] !== 'rgba(0, 0, 0, 0)') { el.style.border = m[2] + 'px solid ' + m[1]; }
    });
    stage.querySelectorAll('.tip').forEach(e => e.remove());
    return stage;
  }
  async function xpRender(tabLabel) {
    const PW = 794, PH = 1123, MX = 40, MT = 36, MB = 44, GAP = 12, SC = XP_MOBILE ? 1.5 : 2, UH = PH - MT - MB;
    const stage = xpStage(tabLabel);
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const items = [];
      for (const el of [...stage.children]) {
        const c = await window.html2canvas(el, { scale: SC, backgroundColor: '#ffffff', useCORS: true, logging: false });
        items.push(c);
      }
      const pages = []; let cv = null, y = 0;
      const newPage = () => { cv = document.createElement('canvas'); cv.width = PW * SC; cv.height = PH * SC; const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); pages.push(cv); y = 0; };
      newPage();
      items.forEach((c, idx) => {
        const h = c.height / SC;
        if (y > 0 && y + h > UH) newPage();
        if (h <= UH) { cv.getContext('2d').drawImage(c, MX * SC, (MT + y) * SC); y += h + GAP; return; }
        let sy = 0; // 한 쪽보다 긴 카드는 여러 쪽으로 자른다
        while (sy < c.height) {
          const room = (UH - y) * SC, sh = Math.min(c.height - sy, room);
          cv.getContext('2d').drawImage(c, 0, sy, c.width, sh, MX * SC, (MT + y) * SC, c.width, sh);
          sy += sh; y += sh / SC + GAP;
          if (sy < c.height) newPage();
        }
      });
      pages.forEach((pc, i) => { const g = pc.getContext('2d'); g.fillStyle = '#8089A0'; g.font = `${11 * SC}px sans-serif`; g.textAlign = 'center'; g.fillText(`만트라 만세력 · ${tabLabel} · ${i + 1} / ${pages.length}`, PW * SC / 2, (PH - 20) * SC); });
      return pages;
    } finally { stage.remove(); }
  }

    }
    return `<div class="facts"><b>자리마다 뜻이 달라집니다</b><ul class="pos-ul">${['year', 'month', 'day', 'hour'].map(k => `<li>${term(M.POS_K[k] + '주')}에 있으면: ${POS_AREA[k]}에 이 기운이 나타납니다.</li>`).join('')}</ul>
      <span class="muted">원국 표에서 기둥 이름(간지)을 누르면 내 일간 기준으로 자세히 풀어 줍니다.</span></div>`;
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(S.inp)); } catch (e) { } }
  function pick(p) {
    const [k, v] = p.split(':');
    if (k === 'now') S.sel = { kind: 'now', k: v };
    else if (k === 'daeun') S.sel = { kind: 'daeun', i: +v };
    else if (k === 'seun') { S.sel = { kind: 'seun', Y: +v }; S.selYear = +v; }
    else if (k === 'wolun') { const m = M.wolun(S.ch, S.selYear)[+v]; const d = kstYMD(m.startMs); S.selYM = [d[0], d[1]]; S.sel = { kind: 'wolun', i: +v }; }
    else if (k === 'ilun') S.sel = { kind: 'ilun', d: +v };
    render();
  }
  document.addEventListener('click', ev => {
    const t = ev.target;
    const cpb = t.closest('[data-cp]');
    if (cpb) { const [k, i] = cpb.dataset.cp.split(':'); S.cpSheet = { k, i: +i }; S.domSheet = null; S.crSheet = null; S.sheet = null; renderSheet(); return; }
    const dmb = t.closest('[data-dom]');
    if (dmb) { const [id, key] = dmb.dataset.dom.split(':'); S.domSheet = { id, key }; S.cpSheet = null; S.crSheet = null; S.sheet = null; renderSheet(); return; }
    const crb = t.closest('[data-cr]');
    if (crb) { S.crSheet = { key: crb.dataset.cr.split(':')[1] }; S.cpSheet = null; S.domSheet = null; S.sheet = null; renderSheet(); return; }
    const tm = t.closest('.term');
    if (tm) { ev.preventDefault(); S.sheet = tm.dataset.term; S.sheetPos = tm.dataset.pos || null; S.sheetVol = tm.dataset.vol ? VOL_CTX[tm.dataset.vol] || null : null; renderSheet(); return; }
    const act = t.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'close') { if (t === act || t.classList.contains('x')) { S.sheet = null; S.cpSheet = null; S.domSheet = null; S.crSheet = null; S.sheetVol = null; renderSheet(); } return; }
      if (a.startsWith('metric:')) { S.metric = a.slice(7); render(); return; }
      if (a === 'cr-all') { S.crAll = !S.crAll; render(); return; }
      if (a === 'cp-all') { S.cpAll = !S.cpAll; render(); return; }
      if (a.startsWith('cp-p:')) { S.cpPartner = a.slice(5); render(); return; }
      if (a.startsWith('cp-s:')) { S.cpSort = a.slice(5); render(); return; }
      if (a.startsWith('cp-f:')) { S.cpFilter = a.slice(5); render(); return; }
      if (a === 'gl-save' || a === 'gl-reset') { saveTerm(a === 'gl-reset'); return; }
      if (a === 'admin-out') { adminLogout(''); return; }
      if (a.startsWith('pk-reset:')) { const k = a.slice(9); if (k === 'tr') PK.tr.cards = {}; else PK[k] = {}; pkSave(); render(); return; }
      if (a === 'tr-draw') { trDraw(); return; }
      if (a === 'edit') { if (S.editing) readForm(); S.editing = !S.editing; render(); return; }
      if (a.startsWith('year:')) { const d = +a.slice(5); S.selYear = d === 0 ? M.yearPillarAt(NOW).sajuYear : Math.max(M.MIN_Y, Math.min(M.MAX_Y - 2, S.selYear + d)); if (S.sel && S.sel.kind === 'wolun') S.sel = null; render(); return; }
      if (a.startsWith('zwy:')) { const d = +a.slice(4); S.zwY = d === 0 ? zwNowY() : Math.max(S.ch.ziwei.lunar.y, (S.zwY ?? zwNowY()) + d); render(); return; }
      if (a.startsWith('ym:')) { const d = +a.slice(3); if (d === 0) S.selYM = [TODAY[0], TODAY[1]]; else { let [y, m] = S.selYM; m += d; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.selYM = [y, m]; } if (S.sel && S.sel.kind === 'ilun') S.sel = null; render(); return; }
    }
    const tkb = t.closest('[data-tk]');
    if (tkb) { const [k, v] = tkb.dataset.tk.split(':'); const T = tkState(); T[k] = k === 'days' ? +v : v; render(); return; }
    const tb = t.closest('[data-tab]');
    if (tb) { if (S.editing) readForm(); S.tab = tb.dataset.tab; try { localStorage.setItem(STORE + '-tab', S.tab); } catch (e) { } render(); return; }
    const op = t.closest('[data-opt]');
    if (op) {
      const [sys, k, v] = op.dataset.opt.split(':');
      if (sys === 'tr') {
        if (k === 'topic' || k === 'spread') PK.tr[k] = v;
        else if (k.startsWith('rev.') && PK.tr.cards[k.slice(4)]) PK.tr.cards[k.slice(4)][1] = v === '1';
      } else if (PK[sys][k] === v) delete PK[sys][k]; else PK[sys][k] = v;
      pkSave(); render(); return;
    }
    const st = t.closest('[data-set]');
    if (st) {
      const [k, v] = st.dataset.set.split(':');
      if (S.editing) readForm();
      if (k === 'model' || k === 'school') { S.inp[k] = v; run(); save(); render(); return; }
      S.inp[k] = v; if (k === 'calendar') S.inp.leap = false; render(); return;
    }
    const pk = t.closest('[data-pick]');
    if (pk) { pick(pk.dataset.pick); return; }
    const zy = t.closest('[data-zwy]');
    if (zy) { S.zwY = +zy.dataset.zwy; render(); return; }
    const zc = t.closest('[data-zw]');
    if (zc) { S.zwSel = +zc.dataset.zw; render(); }
  });
  document.addEventListener('change', ev => {
    const id = ev.target.id;
    if (id === 'f-hu' || id === 'f-city' || id === 'f-y') { readForm(); render(); }
    if (id.startsWith('tr-c-')) { const p = id.slice(5), v = ev.target.value; if (v) PK.tr.cards[p] = [v, PK.tr.cards[p] ? PK.tr.cards[p][1] : false]; else delete PK.tr.cards[p]; pkSave(); render(); }
    if (id === 'tk-start' && ev.target.value) { tkState().start = ev.target.value; render(); }
    if (id === 'zw-adj') { S.zwAdj = ev.target.checked; render(); }
    if (id === 'zw-g12') { S.zwG12 = ev.target.checked; render(); }
  });
  document.addEventListener('submit', ev => {
    ev.preventDefault();
    if (ev.target.id === 'admin-form') { adminLogin(document.getElementById('admin-pw').value); return; }
    readForm();
    try { validate(); } catch (e) { S.err = e.message; render(); return; }
    run();
    if (!S.err) { S.isExample = false; S.editing = false; S.sel = null; S.zwSel = null; S.zwY = null; save(); }
    render();
  });
  document.addEventListener('input', ev => { if (ev.target.id === 'gl-q') { S.glq = ev.target.value; document.getElementById('gl-list').innerHTML = glList(); } });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && (S.cpSheet || S.domSheet || S.crSheet) && !S.sheet) { S.cpSheet = null; S.domSheet = null; S.crSheet = null; renderSheet(); } if (ev.key === 'Escape' && S.sheet) { const ta = document.getElementById('gl-edit'); if (!ta || ta.value === GL[S.sheet][1]) { S.sheet = null; renderSheet(); } } if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.nowc')) { ev.preventDefault(); pick(ev.target.dataset.pick); }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[data-zw]')) { ev.preventDefault(); S.zwSel = +ev.target.dataset.zw; render(); } });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });

  async function adminLogin(pw) {
    if (!pw) { S.adminMsg = '비밀번호를 입력하세요'; render(); return; }
    adminPw = pw;
    try { await api('/api/admin', { method: 'POST', body: '{}' }); try { sessionStorage.setItem(ADMIN_KEY, pw); } catch (e) { } S.adminMsg = null; S.tab = 'gl'; render(); }
    catch (e) { adminPw = null; S.adminMsg = e.message; render(); }
  }
  function adminLogout(msg) { adminPw = null; try { sessionStorage.removeItem(ADMIN_KEY); } catch (e) { } S.adminMsg = msg || null; render(); }
  async function saveTerm(reset) {
    const key = S.sheet, ta = document.getElementById('gl-edit');
    const setMsg = (t, c) => { const msg = document.getElementById('gl-msg'); if (msg) { msg.textContent = t; msg.className = 'admin-msg ' + (c || ''); } };
    const text = reset ? null : ta.value.trim();
    if (!reset && !text) { setMsg('설명을 입력하세요', 'err'); return; }
    if (reset && !confirm('기본 문구로 되돌릴까요?')) return;
    setMsg('저장 중…');
    try {
      const r = await api('/api/glossary', { method: 'PUT', body: JSON.stringify({ term: key, text }) });
      if (r.text == null) { delete OVR[key]; GL[key][1] = window.GLOSSARY_DEFAULT[key]; } else { OVR[key] = r.text; GL[key][1] = r.text; }
      render(); setMsg(reset ? '기본 문구로 되돌렸습니다' : '저장했습니다. 모든 방문자에게 반영됩니다(최대 1분).', 'ok');
    } catch (e) { if (e.status === 401) { adminLogout('로그인이 만료되었습니다. 다시 로그인하세요.'); return; } setMsg(e.message, 'err'); }
  }
  window.addEventListener('hashchange', () => render());

  run(); render();
  if (/^https?:$/.test(location.protocol)) api('/api/glossary').then(o => { applyOverrides(o); render(); }).catch(() => { });
})();

</script>
</body>
</html>
