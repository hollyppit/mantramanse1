<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>만트라 만세력</title>
<meta name="description" content="천문 계산 기반 만세력 · 원국, 합충, 신살, 오행, 용신, 대운·세운·월운·일진">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@700;800;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* 레이아웃: 밝은 단일 테마 앱 셸 — 반투명 상단바, 알약형 탭, 그림자 카드. 오방색은 파스텔 타일로 */
:root {
  --bg: #F5F6FA; --surface: #FFFFFF; --surface-2: #F0F2F7; --ink: #12151F; --ink-2: #474E5E; --ink-3: #8089A0;
  --line: #E7EAF1; --accent: #2F5BFF; --accent-2: #7B61FF; --accent-soft: #ECF0FF; --seal: #FF5B4A;
  --wood: #1F8A5B; --fire: #D8412F; --earth: #D9A520; --metal: #7A68B8; --water: #2A48A0;
  --wood-ink: #17744B; --fire-ink: #C9331F; --earth-ink: #946B00; --metal-ink: #5F4E9E; --water-ink: #2A48A0;
  --good: #2F5BFF; --bad: #F0563F; --mid: #BAC1CE; --good-soft: #E8EEFF; --bad-soft: #FFEAE6;
  --shadow: 0 1px 2px rgba(18, 21, 31, .04), 0 10px 30px -12px rgba(30, 40, 90, .12);
  --f-display: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --f-head: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 18px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); background-image: radial-gradient(1200px 420px at 85% -120px, #E6ECFF 0%, transparent 70%), radial-gradient(900px 380px at -10% -80px, #FFF0EA 0%, transparent 65%); background-repeat: no-repeat; color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; padding: 0 16px 56px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h2 { font-size: 1.12rem; font-weight: 800; }
h3 { font-size: 0.98rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 0.82rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* 상단 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 78%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); padding-block: 12px 10px; margin: 0 -16px; padding-inline: 16px; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.top-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.seal { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, var(--seal), #FF8A4C); color: #fff; font-family: var(--f-display); font-weight: 900; font-size: 13px; line-height: 1.05; display: grid; place-items: center; text-align: center; box-shadow: 0 6px 14px -6px rgba(255, 91, 74, .6); }
.brand h1 { font-size: 1.12rem; font-weight: 900; letter-spacing: -0.03em; }
.who { flex: 1 1 240px; min-width: 0; font-size: 0.84rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-size: 0.86rem; font-weight: 700; box-shadow: 0 1px 2px rgba(18, 21, 31, .05); transition: transform .12s, box-shadow .12s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; box-shadow: 0 8px 18px -8px rgba(47, 91, 255, .7); }
.btn.primary:hover { color: #fff; transform: translateY(-1px); }
.tabs { max-width: 980px; margin: 10px auto 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; background: none; border: 0; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--ink-3); border-radius: 999px; transition: background .15s, color .15s; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: #fff; background: var(--ink); }

/* 카드 */
.card { background: var(--surface); border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.note { font-size: 0.82rem; color: var(--ink-3); line-height: 1.55; }
.warn { border: 0; background: linear-gradient(135deg, #FFF1EC, #FFF7F0); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; font-size: 0.88rem; box-shadow: inset 0 0 0 1px #FFD9CF; }
.warn b { color: var(--seal); }

/* 요약 히어로 */
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 22px; color: #fff; background: radial-gradient(420px 220px at 100% 0%, rgba(255, 138, 76, .55), transparent 70%), linear-gradient(135deg, #2F5BFF 0%, #5B4DFF 55%, #7B61FF 100%); box-shadow: 0 18px 40px -20px rgba(47, 91, 255, .8); display: grid; gap: 16px; }
.hero .eyebrow { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.08em; opacity: .8; }
.hero h2 { font-size: 1.5rem; font-weight: 900; color: #fff; }
.hero .pills { display: flex; gap: 6px; flex-wrap: wrap; }
.hero .hp { background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .28); border-radius: 999px; padding: 4px 11px; font-size: 0.8rem; font-weight: 600; color: #fff; }
.hero .hp .term { color: #fff; text-decoration-color: rgba(255, 255, 255, .6); }
.hero .four { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.hero .p4 { background: rgba(255, 255, 255, .96); color: var(--ink); border-radius: 14px; padding: 10px 4px 8px; text-align: center; display: grid; gap: 2px; }
.hero .p4 .pl { font-size: 0.7rem; color: var(--ink-3); font-weight: 700; }
.hero .p4 .pg { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.3rem, 5.4vw, 1.9rem); line-height: 1.1; letter-spacing: 0.02em; }
.hero .p4.me { box-shadow: 0 0 0 3px #FFD166; }
.hero .p4 .pk { font-size: 0.7rem; color: var(--ink-3); }

/* 입력 */
.form { display: grid; gap: 14px; }
.frow { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 0.78rem; color: var(--ink-3); font-weight: 600; letter-spacing: 0.02em; }
input, select { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 9px 12px; min-width: 0; transition: border-color .15s, background .15s; }
input:focus, select:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
input[type="number"] { width: 5.2em; }
input#f-y { width: 6.2em; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 0.86rem; font-weight: 600; color: var(--ink-2); border-radius: 9px; }

.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 800; box-shadow: 0 1px 3px rgba(18, 21, 31, .12); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 0.88rem; color: var(--ink-2); padding-bottom: 7px; }
details.adv { border-top: 1px dashed var(--line); padding-top: 10px; }
details.adv summary { cursor: pointer; font-size: 0.88rem; font-weight: 600; color: var(--ink-2); }
.adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 12px; }
.err { color: var(--seal); font-size: 0.88rem; font-weight: 600; }

/* 용어 버튼 */
.term { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; text-decoration: underline dotted color-mix(in srgb, var(--ink-3) 70%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.term:hover { color: var(--accent); text-decoration-color: var(--accent); }

/* 원국표 */
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.86rem; color: var(--ink-2); }
.meta b { color: var(--ink); font-weight: 600; }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.pil { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 340px; table-layout: fixed; }
table.pil th.rl { width: 58px; text-align: left; font-size: 0.74rem; font-weight: 600; color: var(--ink-3); vertical-align: middle; }
table.pil thead th { font-size: 0.8rem; color: var(--ink-3); font-weight: 600; padding-bottom: 2px; }
table.pil thead th .gzk { display: block; font-weight: 400; font-size: 0.72rem; }
table.pil td { text-align: center; font-size: 0.8rem; vertical-align: middle; padding: 3px 2px; line-height: 1.35; }
td.glyph { border-radius: 14px; padding: 8px 0 6px !important; background: color-mix(in srgb, var(--c) 11%, var(--surface)); border: 0; }
td.glyph .g { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1; color: var(--ci); display: block; }
td.glyph .gs { font-size: 0.72rem; color: var(--ink-2); display: block; margin-top: 4px; }
td.glyph.me { box-shadow: 0 0 0 2px var(--accent), 0 8px 18px -10px rgba(47, 91, 255, .7); }
td.tg { font-weight: 600; font-size: 0.84rem; }
td.hid { font-size: 0.76rem; color: var(--ink-2); }
td.hid div { white-space: nowrap; }
.e-wood { --c: var(--wood); --ci: var(--wood-ink); } .e-fire { --c: var(--fire); --ci: var(--fire-ink); }
.e-earth { --c: var(--earth); --ci: var(--earth-ink); } .e-metal { --c: var(--metal); --ci: var(--metal-ink); }
.e-water { --c: var(--water); --ci: var(--water-ink); }
.eltxt { color: var(--ci); font-weight: 700; }
td.empty { color: var(--ink-3); background: var(--surface-2); border-radius: 14px; }
.chip { display: inline-block; font-size: 0.72rem; line-height: 1.3; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); margin: 1px; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.gm { background: var(--ink); color: var(--surface); }
.pill { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
.pill.b-길 { background: var(--good); color: var(--surface); } .pill.b-소길 { background: var(--good-soft); color: var(--good); }
.pill.b-평 { background: var(--surface-2); color: var(--ink-2); }
.pill.b-소흉 { background: var(--bad-soft); color: var(--bad); } .pill.b-흉 { background: var(--bad); color: var(--surface); }
.pill.lv-강 { background: var(--bad); color: var(--surface); } .pill.lv-약 { background: var(--bad-soft); color: var(--bad); } .pill.lv-참고 { background: var(--surface-2); color: var(--ink-2); }

/* 목록·표 */
.list { display: grid; gap: 0; }
.li { display: grid; grid-template-columns: minmax(84px, auto) 1fr auto; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .k { font-size: 0.8rem; font-weight: 600; color: var(--ink-2); }
.li .v { min-width: 0; }
.li .v .small { display: block; }
table.dt { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
table.dt th, table.dt td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
table.dt th { font-size: 0.76rem; color: var(--ink-3); font-weight: 600; }
table.dt tr.cur td { background: var(--accent-soft); }
table.dt td.gz { font-family: var(--f-display); font-weight: 700; font-size: 1rem; }

/* 차트 */
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 64px 1fr 52px; gap: 10px; align-items: center; font-size: 0.86rem; }
.bar .track { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--c, var(--accent)); border-radius: 999px; }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.bar .lab { font-weight: 600; }
.subtg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.78rem; color: var(--ink-3); padding-left: 74px; margin-top: -4px; }
svg text { font-family: var(--f-body); }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; }
.hit { cursor: pointer; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: #fff; box-shadow: 0 10px 24px -10px rgba(18,21,31,.5); font-size: 0.8rem; padding: 6px 9px; border-radius: 6px; max-width: 240px; line-height: 1.45; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.78rem; color: var(--ink-2); align-items: center; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.gauge-l { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--ink-3); }
.lamps { display: flex; gap: 8px; flex-wrap: wrap; }
.lamp { border: 0; background: var(--surface-2); border-radius: 999px; padding: 6px 10px; font-size: 0.84rem; display: flex; gap: 6px; align-items: center; }
.lamp i { width: 8px; height: 8px; border-radius: 50%; background: var(--mid); display: inline-block; }
.lamp.on i { background: var(--accent); }
.meter { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; font-size: 0.78rem; color: var(--ink-3); }
.meter .mt { position: relative; height: 8px; background: linear-gradient(90deg, var(--water), var(--mid), var(--fire)); border-radius: 4px; opacity: 0.85; }
.meter .mt.hum { background: linear-gradient(90deg, var(--earth), var(--mid), var(--water)); }
.meter .mk { position: absolute; top: -4px; width: 4px; height: 16px; background: var(--ink); border-radius: 2px; transform: translateX(-2px); box-shadow: 0 0 0 2px var(--surface); }

/* 용신 */
.roles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.role { border-radius: 16px; border: 0; background: color-mix(in srgb, var(--c) 10%, var(--surface)); padding: 10px 6px; text-align: center; display: grid; gap: 2px; }
.role .rn { font-size: 0.78rem; font-weight: 700; color: var(--ink-2); }
.role .rg { font-family: var(--f-display); font-weight: 900; font-size: 1.8rem; color: var(--ci); line-height: 1.1; }
.role .rp { font-size: 0.72rem; color: var(--ink-3); }
.role.main { box-shadow: inset 0 0 0 2px var(--c); }
ol.log { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: 0.9rem; color: var(--ink-2); }
@media (max-width: 520px) { .roles { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; } .role .rg { font-size: 1.4rem; } .role .rn { font-size: 0.7rem; } }

/* 운 */
.now { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 620px) { .now { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.nowc { border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 16px; padding: 10px 12px; display: grid; gap: 2px; cursor: pointer; text-align: left; background: var(--surface); }
.nowc:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.nowc .lbl { font-size: 0.74rem; color: var(--ink-3); font-weight: 600; }
.nowc .gzb { font-family: var(--f-display); font-weight: 900; font-size: 1.5rem; line-height: 1.15; }
.nowc .tgs { font-size: 0.76rem; color: var(--ink-2); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal .dow { font-size: 0.7rem; color: var(--ink-3); text-align: center; font-weight: 600; }
.cal button { border: 1px solid transparent; border-radius: 12px; padding: 5px 2px; min-height: 68px; cursor: pointer; display: grid; gap: 1px; justify-items: center; align-content: start; background: var(--surface-2); }
.cal button { position: relative; }
.cal .ctop { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 3px; }
.son { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: var(--seal); color: var(--surface); font-size: 9px; font-weight: 700; line-height: 1; }
.cal .sc { font-size: 0.74rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.cal .ld { font-size: 0.62rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cal .sc.strong { color: var(--ink); font-weight: 900; }
.acc { display: grid; gap: 0; }
.acc details { border-top: 1px solid var(--line); padding: 10px 0; }
.acc details:first-child { border-top: 0; }
.acc summary { cursor: pointer; list-style-position: outside; margin-left: 1em; }
.acc dl { display: grid; grid-template-columns: 96px 1fr; gap: 6px 14px; margin: 10px 0 0 1em; font-size: 0.88rem; }
.acc dt { font-weight: 700; color: var(--ink-2); font-size: 0.8rem; }
.acc dd { margin: 0; color: var(--ink-2); }
@media (max-width: 520px) { .acc dl { grid-template-columns: 1fr; gap: 2px; } .acc dd { margin-bottom: 6px; } }
.cal button .dn { font-size: 0.72rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal button .dg { font-family: var(--f-display); font-weight: 700; font-size: 0.9rem; line-height: 1.1; }
.cal button.today { border-color: var(--ink); }
.cal button.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.detail { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.parts { display: grid; gap: 4px; font-size: 0.84rem; }
.part { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
.part .pv { font-variant-numeric: tabular-nums; font-weight: 700; }
.pv.pos { color: var(--good); } .pv.neg { color: var(--bad); }
.du-strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(74px, 1fr); gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.du { border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px; text-align: center; cursor: pointer; background: var(--surface); display: grid; gap: 1px; }
.du.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.du .a { font-size: 0.72rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.du .gzs { font-family: var(--f-display); font-weight: 900; font-size: 1.15rem; line-height: 1.2; }
.du .t { font-size: 0.7rem; color: var(--ink-2); }

/* 용어 시트 */
.sheet-bg { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 35%, transparent); z-index: 50; display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--surface); width: min(640px, 100%); border-radius: 24px 24px 0 0; box-shadow: 0 -20px 50px -20px rgba(18,21,31,.35); padding: 18px 20px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; max-height: 70vh; overflow-y: auto; border: 1px solid var(--line); }
.sheet .cat { font-size: 0.74rem; color: var(--accent); font-weight: 700; letter-spacing: 0.04em; }
.sheet h3 { font-size: 1.35rem; }
.sheet p { color: var(--ink-2); line-height: 1.7; }
.sheet .x { justify-self: end; }
.gl-search { width: 100%; }
.gl-cat { display: grid; gap: 2px; }
.gl-cat h3 { font-size: 0.86rem; color: var(--accent); margin: 10px 0 4px; font-family: var(--f-body); }
.gl-item { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.88rem; }
.gl-item b { font-weight: 700; }
.gl-item p { color: var(--ink-2); }
@media (max-width: 520px) { .gl-item { grid-template-columns: 1fr; gap: 2px; } .li { grid-template-columns: 1fr auto; } .li .k { grid-column: 1 / -1; } }

  // ───────────── 운 ─────────────
  function daeun(ch) {
    const fwd = (yang(ch.pillars.year.s) && ch.gender === 'M') || (!yang(ch.pillars.year.s) && ch.gender === 'F');
    const { prev, next } = surroundingJie(ch.utc);
    const target = fwd ? next : prev;
    const diffMs = Math.abs(target.t - ch.utc);
    const days = diffMs / 86400000;
    const exact = days / 3;
    let num = Math.round(exact); if (num < 1) num = 1;
    const startMs = ch.utc + diffMs * 120;
    const list = [];
    for (let k = 1; k <= 10; k++) {
      const idx = mod(ch.pillars.month.i + (fwd ? k : -k), 60);
      const st = startMs + (k - 1) * 10 * 365.2422 * 86400000;
      list.push({ ...gz(idx), startMs: st, startAge: num + (k - 1) * 10, startYear: new Date(st).getUTCFullYear() });
    }
    return { forward: fwd, days, exact, num, startMs, jie: target, list };
  }
  function yearPillarOf(Y) { return { ...gz(mod(Y - 4, 60)), year: Y }; }
  function monthsOfYear(Y) { // 입춘 Y ~ 소한 Y+1
    const ys = gz(mod(Y - 4, 60)).s; const out = [];
    const rows = [termsOf(Y), termsOf(Y + 1)];
    for (let mIdx = 0; mIdx < 12; mIdx++) {
      const b = mod(mIdx + 2, 12);
      const s = mod((ys % 5) * 2 + 2 + mIdx, 10);
      const ti = 2 + mIdx * 2; // 입춘=2
      const t = ti < 24 ? rows[0][ti] : rows[1][ti - 24];
      out.push({ ...gz(gzIndex(s, b)), startMs: t, termName: TERM_NAMES[ti % 24] });
    }
    return out;
  }

  // 운 한 기둥의 길흉 점수 (분해 포함)
  function scoreLuck(ch, yong, p, opts = {}) {
    if (!yong || !yong.applicable) return null;
    const R = { '용신': 2, '희신': 1, '한신': 0, '구신': -1, '기신': -2 };
    const r = e => R[yong.roles[e]];
    const stemW = opts.stemW ?? 0.4;
    const stemPart = r(stemEl(p.s));
    let bp = 0; for (const [hs, dd] of HIDDEN[p.b]) bp += r(stemEl(hs)) * dd / 30;
    const base = (stemW * stemPart + (1 - stemW) * bp) / 2 * 100;
    const parts = [{ label: `오행 부합 (천간 ${STEM[p.s]}:${yong.roles[stemEl(p.s)]}, 지지 ${BR[p.b]}:지장간 가중)`, v: base }];
    // 원국과의 관계
    const natal = POS.filter(k => ch.pillars[k]).map(k => ({ id: k, s: ch.pillars[k].s, b: ch.pillars[k].b }));
    const rels = relationsAmong([...natal, { id: 'luck', s: p.s, b: p.b }]).filter(x => x.members.includes('luck'));
    const posW = { day: 1, month: 0.8, year: 0.5, hour: 0.5 };
    for (const x of rels) {
      const other = x.members.find(m => m !== 'luck');
      const w = posW[other] || 0.6;
      if (x.type === '충') {
        const tb = ch.pillars[other].b; const tr = r(BR_EL[tb]);
        const v = (-tr * 5 - 5) * w;
        parts.push({ label: `${x.name} — ${POS_K[other]}지(${yong.roles[BR_EL[tb]]}) 충돌·변동`, v });
      } else if (['육합', '삼합', '반합', '방합'].includes(x.type) && x.el != null) {
        const v = r(x.el) * 5 * w;
        parts.push({ label: `${x.name} — ${EL_K[x.el]}(${yong.roles[x.el]}) 기운 형성`, v });
      } else if (x.type === '천간합' && x.el != null && other === 'day') {
        parts.push({ label: `${x.name} — 일간이 묶임(합화 ${yong.roles[x.el]})`, v: r(x.el) * 3 });
      } else if (x.type === '천간충' && other === 'day') {
        parts.push({ label: `${x.name} — 일간 충돌`, v: -5 });
      }
    }
    if (CHEONEUL[ch.pillars.day.s].includes(p.b)) parts.push({ label: '천을귀인 운', v: 5 });
    let total = parts.reduce((a, b) => a + b.v, 0);
    total = Math.max(-100, Math.min(100, total));

  '투출': ['지장간', '지장간에 있는 글자가 천간에도 드러나 있는 것입니다. 투출한 기운은 힘이 뚜렷하다고 봅니다. 월지 지장간이 투출하면 격국을 정하는 기준이 되기도 합니다.'],

  // ── 12운성
  '12운성': ['12운성', '천간이 각 지지에서 어느 정도 힘을 받는지를 사람의 일생(태어남→성장→전성기→쇠퇴→죽음→잉태)에 빗댄 12단계입니다. 양간은 순행하고 음간은 역행합니다(음간 역행은 학파에 따라 쓰지 않기도 합니다).'],
  '봉법': ['12운성', '일간을 기준으로 네 지지 각각에 12운성을 매기는 방법입니다. 표에 크게 표시한 값입니다.'],
  '좌법': ['12운성', '각 기둥의 천간이 자기 지지 위에서 갖는 12운성입니다. 그 기둥 천간의 뿌리 상태를 봅니다. 표에 작게 표시한 값입니다.'],
  '장생': ['12운성', '막 태어나는 단계입니다. 새로운 시작, 성장 가능성, 도움을 받는 기운으로 봅니다.'],
  '목욕': ['12운성', '갓난아이를 씻기는 단계입니다. 불안정·호기심·이성 문제·변덕으로 해석합니다.'],
  '관대': ['12운성', '성인이 되어 관을 쓰는 단계입니다. 자신감·도전·과시가 강해지는 기운으로 봅니다.'],
  '건록': ['12운성', '사회에 나가 녹봉을 받는 단계입니다. 자립·안정된 힘·실무 능력으로 봅니다.'],
  '제왕': ['12운성', '힘이 절정에 이른 단계입니다. 주도권·강한 자아, 지나치면 독선으로 봅니다.'],
  '쇠': ['12운성', '절정을 지나 기운이 줄어드는 단계입니다. 노련함·보수성으로 봅니다.'],
  '병': ['12운성', '병든 단계입니다. 섬세함·감수성·약해진 추진력으로 봅니다.'],
  '사': ['12운성', '죽음의 단계입니다. 정지·몰입·정신적 활동으로 봅니다.'],
  '묘': ['12운성', '무덤에 들어간 단계입니다. 저장·수렴·보관, 창고로 봅니다.'],
  '절': ['12운성', '기운이 완전히 끊긴 단계입니다. 단절·전환·새 출발로 봅니다.'],
  '태': ['12운성', '잉태되는 단계입니다. 계획·가능성·아직 드러나지 않은 기운으로 봅니다.'],
  '양': ['12운성', '뱃속에서 길러지는 단계입니다. 보호받음·준비·양육으로 봅니다.'],

  // ── 12신살
  '12신살': ['12신살', '년지(또는 일지)가 속한 삼합을 기준으로 다른 지지에 붙이는 12가지 살입니다. 기준 지지를 무엇으로 할지는 학파마다 다르며, 이 앱은 설정에서 바꿀 수 있습니다.'],
  '겁살': ['12신살', '빼앗기거나 강제로 잃는 기운입니다. 뒤집으면 과감한 결단력으로 봅니다.'],
  '재살': ['12신살', '수옥살이라고도 합니다. 갇힘·구속·관재수를 뜻하며, 통제력으로 쓰이기도 합니다.'],
  '천살': ['12신살', '하늘에서 오는 재앙, 사람의 힘으로 어쩔 수 없는 일을 뜻합니다. 종교성·인내로도 봅니다.'],
  '지살': ['12신살', '땅을 딛고 움직이는 기운입니다. 이동·출발·변화, 새 환경으로 봅니다.'],
  '연살': ['12신살', '도화살이라고도 합니다. 매력·인기·이성 관계·예술성으로 봅니다.'],
  '월살': ['12신살', '고초살이라고도 합니다. 막힘·고갈·일이 더딤으로 봅니다.'],
  '망신살': ['12신살', '체면을 잃거나 드러나는 기운입니다. 노출·구설, 과감한 자기 표현으로도 봅니다.'],
  '장성살': ['12신살', '장수의 별입니다. 리더십·권위·강한 주관으로 봅니다.'],
  '반안살': ['12신살', '말 안장에 오르는 기운입니다. 승진·안정·출세로 봅니다.'],
  '역마살': ['12신살', '역참의 말처럼 멀리 움직이는 기운입니다. 이동·해외·출장·변동으로 봅니다.'],
  '육해살': ['12신살', '여섯 가지 해로움입니다. 질병·장애물·지연으로 보며, 헌신·봉사로도 해석합니다.'],
  '화개살': ['12신살', '꽃을 덮는 기운입니다. 학문·종교·예술·고독·반복으로 봅니다.'],

  // ── 공망
  '공망': ['공망', '60갑자를 10개씩 묶은 순(旬)마다 천간과 짝이 되지 못하고 남는 지지 두 개입니다. 공망에 해당하는 지지는 기운이 비어 작용이 약하거나 늦게 나타난다고 봅니다. 보통 일주 기준으로 봅니다.'],

  // ── 관계
  '천간합': ['관계', '갑기·을경·병신·정임·무계처럼 짝이 되는 천간이 만나 묶이는 관계입니다. 조건이 맞으면 다른 오행으로 변한다(합화)고 봅니다. 이 앱은 합화 여부를 오행 비율에 반영하지 않습니다.'],
  '천간충': ['관계', '갑경·을신·병임·정계처럼 같은 음양끼리 정면으로 극하는 관계입니다. 충돌·변동을 뜻합니다.'],
  '육합': ['관계', '자축·인해·묘술·진유·사신·오미처럼 두 지지가 짝을 이루는 관계입니다. 결합·화합·묶임을 뜻합니다.'],
  '삼합': ['관계', '생지·왕지·묘지 세 지지가 모여 한 오행의 국(局)을 이루는 관계입니다. 신자진은 수, 해묘미는 목, 인오술은 화, 사유축은 금입니다. 합 중에 가장 강합니다.'],
  '반합': ['관계', '삼합 세 글자 중 왕지(자·오·묘·유)를 포함한 두 글자만 있는 경우입니다. 삼합보다 약하지만 같은 방향의 기운을 만듭니다.'],
  '방합': ['관계', '같은 계절의 세 지지(인묘진=봄 목, 사오미=여름 화, 신유술=가을 금, 해자축=겨울 수)가 모인 관계입니다.'],
  '충': ['관계', '정반대 방향(여섯 칸 차이)의 지지가 부딪치는 관계입니다. 이동·변화·파괴·갈등을 뜻합니다. 일지 충은 배우자궁·거처, 월지 충은 직장·가정 환경의 변동으로 봅니다.'],
  '형': ['관계', '형벌의 형(刑)입니다. 인사신(무은지형), 축술미(지세지형), 자묘(무례지형), 진진·오오·유유·해해(자형)가 있습니다. 조정·수술·법적 문제·갈등으로 봅니다.'],
  '파': ['관계', '깨뜨리는 관계입니다. 자유·오묘·신사·인해·진축·술미가 있으며, 합충보다 약한 균열로 봅니다.'],
  '해': ['관계', '해치는 관계입니다. 자미·축오·인사·묘진·신해·유술이 있으며, 합을 방해하는 작용으로 봅니다.'],
  '원진': ['관계', '서로 미워하고 원망하는 관계입니다. 자미·축오·인유·묘신·진해·사술이 있습니다. 대인 관계의 불화로 해석합니다.'],
  '귀문관': ['관계', '귀신이 드나드는 문이라는 뜻입니다. 자유·축오·인미·묘신·진해·사술 조합입니다. 예민함·직관·영감으로 해석하며, 조합은 학파마다 조금 다릅니다.'],

  // ── 신살·길성
  '신살': ['신살', '특정 조합이 있을 때 붙이는 상징적 이름입니다. 길한 것은 귀인·길성, 흉한 것은 살(煞)이라 부릅니다. 원국 전체의 오행 균형보다 비중이 낮은 보조 지표입니다.'],
  '천을귀인': ['신살', '가장 강한 길성으로 꼽힙니다. 위기에 도와주는 사람이 나타난다고 봅니다. 일간 기준(갑무경→축미, 을기→자신, 병정→해유, 신→인오, 임계→사묘)으로 찾습니다.'],
  '문창귀인': ['신살', '학문·글재주·시험운의 길성입니다. 일간 기준으로 찾습니다.'],
  '금여록': ['신살', '금으로 만든 수레라는 뜻입니다. 좋은 배우자·품위·재물의 길성으로 봅니다.'],
  '암록': ['신살', '숨은 녹봉이라는 뜻입니다. 뜻밖의 도움이나 보이지 않는 재물로 봅니다.'],
  '건록': ['신살', '일간이 지지에서 녹(祿)을 얻는 자리입니다. 자립과 직업적 안정으로 봅니다. 12운성의 건록과 같은 자리입니다.'],
  '양인살': ['신살', '양간 일간이 제왕을 만나는 자리입니다. 강한 추진력과 과격함을 함께 뜻합니다. 이 앱은 양간에만 적용합니다.'],
  '홍염살': ['신살', '이성을 끄는 매력과 끼의 살입니다. 일간 기준으로 찾습니다.'],
  '천덕귀인': ['신살', '하늘의 덕이 돕는 길성입니다. 흉을 줄여 준다고 봅니다. 월지 기준으로 찾습니다.'],
  '월덕귀인': ['신살', '달의 덕이 돕는 길성입니다. 천덕귀인과 함께 흉을 줄여 준다고 봅니다. 월지의 삼합 기준으로 찾습니다.'],
  '백호대살': ['신살', '호랑이에게 물리는 흉살이라는 뜻입니다. 갑진·을미·병술·정축·무진·임술·계축 일곱 간지가 해당합니다. 사고·수술·강한 기질로 해석합니다.'],
  '괴강살': ['신살', '경진·경술·임진·임술·무술 간지입니다. 강한 리더십·극단성으로 해석합니다.'],
  '고신살': ['신살', '외로운 신하라는 뜻입니다. 홀로 지내는 경향으로 봅니다. 년지 방합 기준으로 찾습니다.'],
  '과숙살': ['신살', '과부가 사는 집이라는 뜻입니다. 고신살과 짝을 이루며, 배우자와 떨어지는 경향으로 봅니다.'],
  '천의성': ['신살', '하늘의 의사라는 뜻입니다. 의료·치유·상담에 인연이 있다고 봅니다. 월지 바로 앞 지지입니다.'],

  // ── 강약
  '신강신약': ['강약', '일간이 원국 안에서 얼마나 힘을 받는지 판단한 것입니다. 이 앱은 나를 돕는 힘(비겁+인성)의 비율로 계산하며, 기준 모델에 따라 결과가 달라지므로 모델별 값을 함께 보여줍니다.'],
  '득령': ['강약', '월지(태어난 계절)의 정기가 일간을 돕는 오행(비겁·인성)인지 여부입니다. 강약 판단에서 가장 비중이 큽니다.'],
  '득지': ['강약', '일지의 정기가 일간을 돕는 오행인지 여부입니다.'],
  '득세': ['강약', '월지·일지를 제외한 나머지 글자 가운데 일간을 돕는 글자가 절반을 넘는지 여부입니다.'],
  '월령': ['강약', '태어난 달의 지지(월지)가 가진 계절의 힘입니다. 사주 전체 기운의 방향을 정한다고 보아 다른 자리보다 무겁게 셉니다.'],
  '중화': ['강약', '일간을 돕는 힘과 소모시키는 힘이 비슷한 상태입니다. 이 앱은 돕는 힘 42~58%를 중화로 봅니다.'],
  '극약': ['강약', '돕는 힘이 20% 미만입니다. 이 정도로 약하면 억부로 돕기보다 강한 세력을 따르는 종격(從格)으로 보는 학파도 있습니다.'],
  '태약': ['강약', '돕는 힘이 20~30%인 상태입니다.'],
  '신약': ['강약', '돕는 힘이 30~42%인 상태입니다.'],
  '신강': ['강약', '돕는 힘이 58~70%인 상태입니다.'],
  '태강': ['강약', '돕는 힘이 70~80%인 상태입니다.'],
  '극왕': ['강약', '돕는 힘이 80% 이상입니다. 이 정도면 억제하기보다 강한 기운을 따르는 전왕격(專旺格)으로 보는 학파도 있습니다.'],
  '오행 비율': ['강약', '원국 글자의 오행을 점수로 합산한 비율입니다. 지장간을 어떻게 나누고 월지에 얼마나 가중치를 주는지에 따라 값이 크게 달라집니다. 앱마다 숫자가 다른 이유가 이것입니다.'],

  // ── 용신
  '용신': ['용신', '사주의 균형을 맞추는 데 가장 필요한 오행입니다. 억부·조후·통관·병약·격국 등 기준에 따라 답이 달라지므로, 이 앱은 학파를 고르고 판단 근거를 함께 보여줍니다.'],
  '희신': ['용신', '용신을 돕는 오행입니다. 용신 다음으로 반가운 기운입니다.'],
  '기신': ['용신', '용신을 극하는 오행입니다. 가장 꺼리는 기운입니다.'],
  '구신': ['용신', '기신을 생하는 오행입니다. 기신 다음으로 꺼리는 기운입니다.'],
  '한신': ['용신', '용신·희신·기신·구신 어디에도 속하지 않는 오행입니다. 영향이 중립적이라고 봅니다.'],
  '억부': ['용신', '억강부약(抑强扶弱). 일간이 약하면 돕고, 강하면 누르거나 빼내어 균형을 맞추는 방식입니다. 가장 널리 쓰이는 기준입니다.'],
  '조후': ['용신', '사주의 온도와 습도를 맞추는 방식입니다. 한여름 생은 물로 식히고, 한겨울 생은 불로 데웁니다. 궁통보감이 대표 문헌입니다. 이 앱의 조후는 궁통보감 표가 아니라 글자별 온도·습도를 합산한 단순화 모델입니다.'],
  '통관': ['용신', '서로 극하는 두 오행이 팽팽하게 대립할 때 그 사이를 이어주는 오행을 쓰는 방식입니다. 예: 금과 목이 싸우면 금→수→목으로 흐르게 하는 수가 통관 용신입니다.'],
  '한난조습': ['용신', '사주의 차갑고(寒) 따뜻하고(暖) 습하고(濕) 건조한(燥) 정도입니다. 조후 용신을 정하는 근거입니다.'],

    return `<td class="glyph ${ECLS[e]}${me ? ' me' : ''}"><span class="g">${ch}</span><span class="gs">${k} · ${yinyang(v)}${M.EL_K[e]}</span></td>`;
  }
  function renderHero() {
    const ch = S.ch, d = ch.pillars.day.s, e = M.stemEl(d), y = ch.yong;
    const yongEl = +Object.keys(y.roles).find(k => y.roles[k] === '용신');
    const cols = ['hour', 'day', 'month', 'year'];
    return `<section class="hero">
      <div><div class="eyebrow">${S.inp.name ? esc(S.inp.name) + ' · ' : ''}${S.inp.gender === 'M' ? '남' : '여'} · ${ch.solar.y}년생</div>
      <h2>${M.STEM[d]}${M.EL[e]} 일간 · ${ch.strength.zone} 사주</h2></div>
      <div class="four">${cols.map(k => { const p = ch.pillars[k]; return `<div class="p4${k === 'day' ? ' me' : ''}"><span class="pl">${M.POS_K[k]}주</span><span class="pg">${p ? `<span class="eltxt ${ECLS[M.stemEl(p.s)]}">${M.STEM[p.s]}</span><span class="eltxt ${ECLS[M.BR_EL[p.b]]}">${M.BR[p.b]}</span>` : '<span class="muted">—</span>'}</span><span class="pk">${p ? M.gzNameK(p) : '시간 미상'}</span></div>`; }).join('')}</div>
      <div class="pills"><span class="hp">${term('일간')} ${M.STEM_K[d]}${M.EL_K[e]}</span><span class="hp">${term('신강신약', '강약')} ${ch.strength.zone} ${ch.strength.help.toFixed(0)}%</span><span class="hp">${term('용신')} ${elLabel(yongEl)} · ${M.SCHOOLS[y.school].split(' ')[0]}</span><span class="hp">${term('대운수')} ${ch.daeun.num} · ${ch.daeun.forward ? '순행' : '역행'}</span></div>
    </section>`;
  }
  function renderWonguk() {
    const ch = S.ch, cols = ['hour', 'day', 'month', 'year'];
    const C = k => ch.cells[k];
    const row = (label, f) => `<tr><th class="rl" scope="row">${label}</th>${cols.map(k => C(k) ? f(C(k), k) : `<td class="empty">${label.includes('천간') || label.includes('지지') ? '미상' : '·'}</td>`).join('')}</tr>`;
    const td = (x, cls = '') => `<td class="${cls}">${x}</td>`;
    const lunar = ch.lunar ? `음력 ${ch.lunar.y}.${pad(ch.lunar.m)}.${pad(ch.lunar.d)}${ch.lunar.leap ? '(윤)' : ''}` : '';
    const jie = ch.pillars.month.jie;
    const du = ch.daeun;
    const s = ch.solar;
    const table = `<div class="tbl-wrap"><table class="pil"><thead><tr><th class="rl"></th>${cols.map(k => `<th scope="col">${M.POS_K[k]}주<span class="gzk">${ch.pillars[k] ? M.gzNameK(ch.pillars[k]) : '—'}</span></th>`).join('')}</tr></thead><tbody>
      ${row(term('십성'), (c) => td(c.stemTG === '일간' ? term('일간', '일간(나)') : term(c.stemTG), 'tg'))}
      ${row(term('천간'), (c, k) => glyphCell(true, c.stem, k === 'day'))}
      ${row(term('지지'), (c) => glyphCell(false, c.branch, false))}
      ${row(term('십성'), (c) => td(term(c.branchTG), 'tg'))}
      ${row(term('지장간'), (c) => td(c.hidden.map(h => `<div><span class="eltxt ${ECLS[M.stemEl(h.s)]}">${M.STEM[h.s]}</span> ${term(h.tg)}</div>`).join(''), 'hid'))}
      ${row(term('12운성'), (c) => td(`${term(c.unseong)}<div class="muted" style="font-size:.7rem">${term('좌법', '좌')} ${c.unseongJwa}</div>`))}
      ${row(term('12신살'), (c) => td(term(c.sinsal12)))}
      ${row(term('신살'), (c, k) => td([c.gongmang ? `<span class="chip gm">${term('공망')}</span>` : '', ...ch.sinsal[k].map(x => `<span class="chip ${x.good ? 'good' : 'bad'}">${term(x.name)}</span>`)].join('') || '<span class="muted">—</span>'))}
    </tbody></table></div>`;
    const alt = ch.alternatives;
    const altTable = `<div class="tbl-wrap"><table class="dt num"><thead><tr><th>시간 기준</th><th>보정 시각</th><th>일주</th><th>시주</th></tr></thead><tbody>
      ${alt.map(a => `<tr class="${a.mode === ch.timeMode ? 'cur' : ''}"><td>${a.label}${a.mode === ch.timeMode ? ' <span class="muted small">· 사용 중</span>' : ''}</td><td>${ch.hourKnown ? fmtHM(a.local) : '—'}</td><td class="gz">${a.day}</td><td class="gz">${a.hour || '—'}</td></tr>`).join('')}
      ${ch.alternativesJasi ? ch.alternativesJasi.map(a => `<tr class="${a.jasi === ch.jasi ? 'cur' : ''}"><td>${a.jasi === 'jeong' ? term('정자시') : term('야자시')} 처리</td><td>—</td><td class="gz">${a.day}</td><td class="gz">${a.hour}</td></tr>`).join('') : ''}
    </tbody></table></div>`;
    return `
    ${ch.warnings.length ? `<div class="warn"><b>확인 필요</b>${ch.warnings.map(w => `<span>${esc(w)}</span>`).join('')}</div>` : ''}
    ${renderHero()}
    <section class="card">
      <div class="card-h"><h2>사주 원국</h2><span class="note">밑줄 친 용어를 누르면 설명이 열립니다</span></div>
      <div class="meta num">
        <span>양력 <b>${s.y}.${pad(s.m)}.${pad(s.d)} ${ch.hourKnown ? pad(s.h) + ':' + pad(s.mi) : ''}</b></span>
        <span>${lunar}</span>
        ${ch.hourKnown ? `<span>보정 시각 <b>${fmtHM(ch.localSolarMs)}</b> <span class="muted">(${M.TIME_MODES[ch.timeMode]}, ${(+ch.lon).toFixed(2)}°)</span></span>` : '<span>시주 미상 — 시주 없이 계산</span>'}
        <span>월 기준 ${term('절입')} <b>${jie.name}</b> ${fmtKST(jie.t)}</span>
        <span>${term('대운')} <b>${du.forward ? '순행' : '역행'} · ${term('대운수')} ${du.num}</b></span>
        <span>${term('공망')} <b>${ch.gongmang.day.map(b => M.BR[b]).join('')}</b></span>
      </div>
      ${table}
    </section>
    <section class="card">
      <div class="card-h"><h2>시간 기준별 비교</h2><span class="note">기준에 따라 일주·시주가 바뀌는지 확인합니다</span></div>
      ${altTable}
      <p class="note">한국 표준시는 동경 135° 기준이라 서울의 실제 태양시는 약 32분 늦습니다. 출생 시각이 시(時) 경계 근처면 기준 선택만으로 시주가 바뀝니다. 기본값은 ${term('평균태양시', '경도 보정')}이며, 위 입력의 계산 기준 설정에서 바꿀 수 있습니다.</p>
    </section>`;
  }

  // ───────────── 관계·신살 ─────────────
  const memberName = (id, kind) => id === 'luck' ? '운' : M.POS_K[id] + (kind === 'stem' ? '간' : '지');
  function relList(rels) {
    if (!rels.length) return '<p class="muted small">원국 안에 해당 관계가 없습니다.</p>';
    return `<div class="list">${rels.map(r => `<div class="li"><span class="k">${term(r.type)}</span><span class="v"><b>${esc(r.name)}</b><span class="small muted">${r.members.map(m => memberName(m, r.kind)).join(' ↔ ')}</span></span><span></span></div>`).join('')}</div>`;
  }
  function renderRel() {
    const ch = S.ch;
    const stemR = ch.relations.filter(r => r.kind === 'stem'), brR = ch.relations.filter(r => r.kind === 'branch');
    const cols = ['year', 'month', 'day', 'hour'].filter(k => ch.pillars[k]);
    const pat = ch.patterns;
    const gmD = ch.gongmang.day, gmY = ch.gongmang.year;
    const hitD = cols.filter(k => k !== 'day' && gmD.includes(ch.pillars[k].b)).map(k => M.POS_K[k] + '지');
    const hitY = cols.filter(k => k !== 'year' && gmY.includes(ch.pillars[k].b)).map(k => M.POS_K[k] + '지');
    return `
    <div class="grid2">
      <section class="card"><h2>천간 관계</h2>${relList(stemR)}</section>
      <section class="card"><h2>지지 관계</h2>${relList(brR)}</section>
    </div>
    <section class="card">
      <div class="card-h"><h2>구조 진단</h2><span class="note">관살혼잡·상관견관 같은 구조가 성립하는지와 그 근거</span></div>
      ${pat.list.length ? `<div class="list">${pat.list.map(p => `<div class="li"><span class="k">${term(patTerm(p.name), p.name)}</span><span class="v small">${esc(p.basis)}</span><span class="pill lv-${p.level}">${p.level}</span></div>`).join('')}</div>` : '<p class="muted small">특기할 구조가 없습니다.</p>'}
      <p class="note">강: 천간에 드러나거나 비율이 뚜렷함 · 약: 지지 정기까지 포함해야 성립 · 참고: 판단 보조. 구조가 성립해도 합·제어 관계에 따라 작용이 줄어들 수 있으며, 이 앱은 그 해소 여부를 판정하지 않습니다.</p>
      ${pat.tuchul.length ? `<div><h3 style="margin-bottom:6px">${term('투출')}</h3><div>${pat.tuchul.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>` : ''}
    </section>
    <section class="card">
      <div class="card-h"><h2>신살과 길성</h2><span class="note">원국 전체 균형보다 비중이 낮은 보조 지표</span></div>
      <div class="list">${cols.map(k => `<div class="li"><span class="k">${M.POS_K[k]}주 ${M.gzName(ch.pillars[k])}</span><span class="v">${ch.sinsal[k].length ? ch.sinsal[k].map(x => `<span class="chip ${x.good ? 'good' : 'bad'}">${term(x.name)} <span style="opacity:.7">${x.basis}</span></span>`).join('') : '<span class="muted small">없음</span>'}</span><span class="small muted">${term(ch.cells[k].sinsal12)}</span></div>`).join('')}</div>
      <div class="list">
        <div class="li"><span class="k">${term('공망')} · 일주</span><span class="v"><b>${gmD.map(b => M.BR[b] + M.BR_K[b]).join(' ')}</b> <span class="small muted">${hitD.length ? hitD.join('·') + '가 공망' : '원국 지지 중 해당 없음'}</span></span><span></span></div>
        <div class="li"><span class="k">${term('공망')} · 년주</span><span class="v"><b>${gmY.map(b => M.BR[b] + M.BR_K[b]).join(' ')}</b> <span class="small muted">${hitY.length ? hitY.join('·') + '가 공망' : '원국 지지 중 해당 없음'}</span></span><span></span></div>
      </div>
      <p class="note">${term('12신살')}은 ${ch.sinsalBase === 'day' ? '일지' : '년지'} 기준입니다. 기준은 입력의 계산 기준 설정에서 바꿀 수 있습니다.</p>
    </section>`;
  }

  // ───────────── 오행·강약 ─────────────
  function renderOhaeng() {
    const ch = S.ch, w = ch.weights, st = ch.strength, dEl = M.stemEl(ch.pillars.day.s);
    const models = Object.entries(M.MODELS);
    const groupsTG = [['비견', '겁재'], ['식신', '상관'], ['편재', '정재'], ['편관', '정관'], ['편인', '정인']];
    const zones = [[0, 20, '극약'], [20, 30, '태약'], [30, 42, '신약'], [42, 58, '중화'], [58, 70, '신강'], [70, 80, '태강'], [80, 100, '극왕']];

    const mk = v => Math.max(0, Math.min(100, 50 + v / 2 * 50));
    return `
    <section class="card">
      <div class="card-h"><h2>${term('오행 비율')}</h2>${seg('model', models.map(([k, m]) => [k, m.name]), ch.model)}</div>
      <div class="bars">${w.pct.map((v, e) => `<div class="bar ${ECLS[e]}"><span class="lab eltxt">${elLabel(e)}</span><span class="track"><span class="fill" style="display:block;width:${v.toFixed(1)}%;background:var(--c)"></span></span><span class="val">${v.toFixed(1)}%</span></div>`).join('')}</div>

      <div class="tbl-wrap"><table class="dt num"><thead><tr><th>모델</th>${[0, 1, 2, 3, 4].map(e => `<th>${elLabel(e)}</th>`).join('')}<th>돕는 힘</th><th>판정</th></tr></thead><tbody>
        ${models.map(([k, m]) => `<tr class="${k === ch.model ? 'cur' : ''}"><td>${m.name}</td>${ch.weightsAll[k].pct.map(v => `<td>${v.toFixed(1)}</td>`).join('')}<td>${ch.strengthAll[k].help.toFixed(1)}%</td><td>${term(ch.strengthAll[k].zone)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="note">같은 사주라도 모델에 따라 수치가 달라집니다. 앱마다 오행 비율이 다른 이유입니다.</p>
    </section>
    <div class="grid2">
    <section class="card">
      <div class="card-h"><h2>${term('십성')} 분포</h2><span class="note">일간 자신은 제외</span></div>

    </section>
    <section class="card">
      <div class="card-h"><h2>${term('신강신약')}</h2><span class="pill" style="background:var(--accent);color:var(--surface)">${st.zone} · ${st.help.toFixed(1)}%</span></div>
      <div>
        <div style="position:relative;height:34px;display:flex;border-radius:6px;overflow:hidden">${zones.map(([a, b, n], i) => `<div style="flex:${b - a} 0 0;background:${i === 3 ? 'var(--accent-soft)' : i % 2 ? 'var(--surface-2)' : 'color-mix(in srgb, var(--surface-2) 55%, var(--surface))'};display:grid;place-items:center;font-size:.7rem;color:var(--ink-2);border-right:1px solid var(--surface)">${b - a >= 10 ? term(n) : ''}</div>`).join('')}
          ${models.filter(([k]) => k !== ch.model).map(([k]) => `<div title="${M.MODELS[k].name}" style="position:absolute;top:0;bottom:0;left:${ch.strengthAll[k].help}%;width:2px;background:var(--ink-3);opacity:.7"></div>`).join('')}
          <div style="position:absolute;top:-2px;bottom:-2px;left:calc(${st.help}% - 2px);width:4px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--surface)"></div>
        </div>
        <div class="gauge-l num"><span>0</span><span>20</span><span>42</span><span>58</span><span>80</span><span>100</span></div>
      </div>
      <p class="small" style="color:var(--ink-2)">나를 돕는 힘(${term('비겁')}+${term('인성')}) 비율입니다. 굵은 선이 현재 모델, 가는 선은 다른 모델의 값입니다.</p>
      <div class="lamps">
        <span class="lamp${st.deukryeong ? ' on' : ''}"><i></i>${term('득령')} ${st.deukryeong ? 'O' : 'X'}</span>
        <span class="lamp${st.deukji ? ' on' : ''}"><i></i>${term('득지')} ${st.deukji ? 'O' : 'X'}</span>
        <span class="lamp${st.deukse ? ' on' : ''}"><i></i>${term('득세')} ${st.deukse ? 'O' : 'X'} <span class="muted small">(${st.helpCnt}/${st.othersCnt})</span></span>
      </div>
      <p class="note">득령·득지·득세는 전통적인 세 가지 점검입니다. 비율과 방향이 다르면 판단이 애매한 사주입니다.</p>
    </section>
    </div>
    <section class="card">
      <div class="card-h"><h2>${term('한난조습')}</h2><span class="note">조후 용신의 근거 · 월지 3배 반영</span></div>
      <div class="meter"><span>寒 차가움</span><span class="mt"><span class="mk" style="left:${mk(cl.temp)}%"></span></span><span style="text-align:right">暖 더움</span></div>
      <div class="meter"><span>燥 건조</span><span class="mt hum"><span class="mk" style="left:${mk(cl.hum)}%"></span></span><span style="text-align:right">濕 습함</span></div>
      <p class="note num">한난 ${cl.temp.toFixed(2)} · 조습 ${cl.hum.toFixed(2)} (−2~+2). ±0.6 이상 치우치면 조후 용신을 세웁니다.</p>
    </section>`;
  }

  // ───────────── 용신 ─────────────
  const SCHOOL_INFO = {
    eokbu: { t: '억부 (抑扶)', lead: '일간이 약하면 돕고, 강하면 누르거나 기운을 빼서 균형을 맞춥니다.',
      rows: [['원리', '먼저 신강·신약을 판단합니다. 약하면 인성·비겁, 강하면 식상·재성·관성 가운데 가장 효과적인 것을 고릅니다.'],
        ['대표 문헌', '적천수(滴天髓) 계열. 현대 한국 명리에서 가장 널리 쓰입니다.'],
        ['강점', '기준이 명확하고 거의 모든 사주에 적용할 수 있습니다.'],

        ['이 앱의 구현', '돕는 힘 50%를 기준으로 신약·신강을 나눕니다. 신약이면 가장 강한 소모 세력(식상·재성·관성)에 따라 인성 또는 비겁을, 신강이면 인성과 비겁 중 어느 쪽이 주도하는지와 관성의 크기에 따라 재성·관성·식상을 고릅니다.']] },
    johu: { t: '조후 (調候)', lead: '태어난 계절의 온도와 습도를 맞춥니다. 여름생은 식히고, 겨울생은 데웁니다.',
      rows: [['원리', '월지가 가리키는 계절이 사주 전체의 기후를 정한다고 봅니다. 너무 더우면 수(水), 너무 추우면 화(火)를 먼저 찾습니다.'],
        ['대표 문헌', '궁통보감(窮通寶鑑, 난강망). 일간 10개 × 월 12개 = 120개 조합마다 필요한 천간을 표로 제시합니다.'],
        ['강점', '극단적인 계절에 태어난 사주에서 억부보다 설득력 있다는 평가가 많습니다.'],
        ['한계', '봄·가을생처럼 기후가 치우치지 않은 사주에는 답이 약합니다. 원전은 壬水와 癸水를 구분할 만큼 천간 단위로 처방합니다.'],
        ['이 앱의 구현', '궁통보감 표를 그대로 옮긴 것이 아닙니다. 글자별 온도·습도 값을 합산하고 월지를 3배로 반영한 단순화 모델입니다. 한난 ±0.6 또는 조습 ±0.8 이상 치우칠 때만 조후 용신을 세웁니다.']] },
    tonggwan: { t: '통관 (通關)', lead: '서로 극하는 두 오행이 팽팽하면 그 사이를 이어주는 오행을 씁니다.',
      rows: [['원리', '금과 목이 싸우면 금→수→목으로 흐르게 하는 수가 다리 역할을 합니다. 싸움을 흐름으로 바꾼다는 발상입니다.'],
        ['대표 문헌', '적천수의 통관 개념.'],
        ['강점', '두 세력이 맞서는 양강(兩强) 사주를 잘 설명합니다.'],
        ['한계', '적용되는 사주가 적습니다. 대립 구도가 아닌 사주에는 쓸 수 없습니다.'],
        ['이 앱의 구현', '서로 극하는 두 오행이 모두 25% 이상일 때만 성립합니다. 해당하지 않으면 억부 결과로 대신합니다.']] },
  };
  const SCHOOL_MISSING = [['병약 (病藥)', '사주에서 가장 큰 병(과다한 오행)을 찾아 그것을 고치는 약을 용신으로 씁니다. 억부와 결과가 겹치는 경우가 많아 따로 구현하지 않았습니다.'],
    ['격국 (格局)', '월지에서 투출한 십성으로 격을 정하고, 격을 완성하는 상신(相神)을 찾습니다(자평진전). 성격·파격 판정 규칙이 많아 다음 단계 과제입니다.'],
    ['종격·전왕격', '극약이나 극왕 사주는 억제하지 않고 강한 세력을 따른다고 봅니다. 이 앱은 해당 가능성만 경고합니다.']];
  function renderSchoolInfo(ch) {
    return `<section class="card">
      <div class="card-h"><h2>학파는 무엇이 다른가</h2><span class="note">눌러서 펼치기</span></div>
      <div class="acc">${Object.entries(SCHOOL_INFO).map(([k, x]) => `<details${k === ch.school ? ' open' : ''}><summary><b>${x.t}</b>${k === ch.school ? ' <span class="pill" style="background:var(--accent);color:var(--surface)">선택됨</span>' : ''}<span class="small muted" style="display:block">${x.lead}</span></summary>
        <dl>${x.rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></details>`).join('')}
        <details><summary><b>이 앱에 없는 기준</b><span class="small muted" style="display:block">병약 · 격국 · 종격</span></summary><dl>${SCHOOL_MISSING.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></details>
      </div></section>`;
  }

  function renderYong() {
    const ch = S.ch, dEl = M.stemEl(ch.pillars.day.s);
    const chosen = ch.yongAll[ch.school];
    const y = ch.yong;
    const order = ['용신', '희신', '한신', '구신', '기신'];
    const elOf = r => +Object.keys(y.roles).find(e => y.roles[e] === r);
    return `
    <section class="card">
      <div class="card-h"><h2>${term('용신')} · 희신 · 기신</h2>${seg('school', Object.entries(M.SCHOOLS).map(([k, l]) => [k, l.split(' ')[0]]), ch.school)}</div>
      ${!chosen.applicable ? `<div class="warn"><b>${M.SCHOOLS[ch.school]} 해당 없음</b><span>${esc(chosen.log[chosen.log.length - 1])}</span><span>아래 역할과 운세 그래프는 억부 기준으로 표시합니다.</span></div>` : ''}
      <div class="roles">${order.map(r => { const e = elOf(r); return `<div class="role ${ECLS[e]}${r === '용신' ? ' main' : ''}"><span class="rn">${term(r)}</span><span class="rg">${M.EL[e]}</span><span class="rp">${M.EL_K[e]} · ${M.TG_GROUP[(e - dEl + 5) % 5]}</span><span class="rp num">원국 ${ch.weights.pct[e].toFixed(0)}%</span></div>`; }).join('')}</div>
      <div><h3 style="margin-bottom:8px">판단 근거 · ${M.SCHOOLS[y.school]}</h3><ol class="log">${y.log.map(l => `<li>${esc(l)}</li>`).join('')}</ol></div>
      <p class="note">선택한 학파가 운세 흐름의 길흉 점수에 그대로 쓰입니다. 학파를 바꾸면 그래프도 바뀝니다.</p>
    </section>
    ${renderSchoolInfo(ch)}
    <section class="card">
      <div class="card-h"><h2>학파별 비교</h2><span class="note">같은 사주, 다른 답</span></div>
      <div class="tbl-wrap"><table class="dt"><thead><tr><th>기준</th><th>${term('용신')}</th><th>${term('희신')}</th><th>${term('기신')}</th><th>${term('구신')}</th></tr></thead><tbody>
        ${Object.entries(M.SCHOOLS).map(([k, l]) => { const x = ch.yongAll[k]; const f = r => { const e = +Object.keys(x.roles).find(q => x.roles[q] === r); return `<span class="eltxt ${ECLS[e]}">${elLabel(e)}</span>`; }; return `<tr class="${k === ch.school ? 'cur' : ''}"><td>${term(l.split(' ')[0])} <span class="muted small">${l.split(' ').slice(1).join(' ')}</span></td>${x.applicable ? `<td>${f('용신')}</td><td>${f('희신')}</td><td>${f('기신')}</td><td>${f('구신')}</td>` : '<td colspan="4" class="muted small">해당 없음</td>'}</tr>`; }).join('')}
      </tbody></table></div>
      <p class="note">억부는 강약, 조후는 계절 온도, 통관은 오행 대립을 기준으로 합니다. 두 기준이 서로 다른 오행을 가리키면 해석자가 어느 쪽을 우선할지 판단해야 합니다. 이 앱은 그 판단을 대신하지 않고 근거를 보여줍니다.</p>
    </section>`;
  }

  // ───────────── 운세 흐름 ─────────────
  function luckCells(x) { return `${term(x.stemTG)} / ${term(x.branchTG)} · ${term(x.unseong)} · ${term(x.sinsal12)}`; }
  function detailHTML(title, x, extra = '') {
    if (!x || !x.score) return '';
    return `<div class="detail"><div class="card-h"><h3>${title}</h3><span>${pill(x.score.band)} <b class="num">${signed(x.score.total)}</b></span></div>
      <div class="small" style="color:var(--ink-2)">${luckCells(x)}</div>
      <div class="parts">${x.score.parts.map(p => `<div class="part"><span>${esc(p.label)}</span><span class="pv ${p.v > 0.5 ? 'pos' : p.v < -0.5 ? 'neg' : ''}">${signed(p.v)}</span></div>`).join('')}</div>${extra}</div>`;
  }
  function sijinTable(dayItem, ymd) {
    const ch = S.ch;
    const shift = (ch.timeMode === 'lmt' || ch.timeMode === 'ast') ? Math.round(ch.lon * 4 - 540) : 0;
    const hm = m => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ':' + pad(((m % 60) + 60) % 60);
    const isToday = ymd[0] === TODAY[0] && ymd[1] === TODAY[1] && ymd[2] === TODAY[2];
    const nowMin = (() => { const t = new Date(NOW + 540 * 60000); return t.getUTCHours() * 60 + t.getUTCMinutes(); })();
    const rows = M.hourPillarsOfDay(dayItem.s).map((hp, hb) => {
      const it = M.luckItem(ch, hp, 0.5);
      const st = 23 * 60 + hb * 120 - shift, en = st + 120;
      const cur = isToday && ((nowMin - st) % 1440 + 1440) % 1440 < 120;
      const v = it.score ? it.score.total : 0;
      return `<tr class="${cur ? 'cur' : ''}"><td>${M.BR_K[hb]}시</td><td class="num">${hm(st)}~${hm(en)}</td><td class="gz">${M.gzName(hp)}</td><td class="small">${term(it.stemTG)}/${term(it.branchTG)}</td><td>${it.score ? pill(it.score.band) : ''} <span class="num small">${signed(v)}</span></td></tr>`;
    }).join('');
    return `<div><h3 style="margin:6px 0">시진 (時辰)</h3><div class="tbl-wrap"><table class="dt"><thead><tr><th>시진</th><th>시각</th><th>간지</th><th>십성</th><th>길흉</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note">시각은 ${shift ? `출생지 경도 보정(${shift}분)을 적용한 표준시입니다` : '한국 표준시 그대로입니다'}. 자시는 전날 밤부터 시작합니다${ch.jasi === 'ya' ? ' (야자시 설정: 밤 11시~자정은 다음 날 기준 천간을 씁니다)' : ''}.</p></div>`;
  }
  function renderCalendar(cy, cm, cal, firstDow, sel, ilDetail) {
    const scored = cal.map((x, i) => ({ d: i + 1, v: x.score ? x.score.total : 0, x }));
    const best = [...scored].sort((a, b) => b.v - a.v).filter(q => q.v >= 12).slice(0, 3);
    const worst = [...scored].sort((a, b) => a.v - b.v).filter(q => q.v <= -12).slice(0, 3);
    const tint = v => { const a = Math.round(Math.min(80, Math.abs(v)) / 80 * 44); return v >= 0 ? `color-mix(in srgb, var(--good) ${a}%, var(--surface-2))` : `color-mix(in srgb, var(--bad) ${a}%, var(--surface-2))`; };
    const dayBtn = q => `<button type="button" class="chip ${q.v >= 0 ? 'good' : 'bad'}" data-pick="ilun:${q.d}" style="border:0;cursor:pointer">${cm}/${q.d} ${M.gzName(q.x)} ${signed(q.v)}</button>`;
    const cells = scored.map(({ d, v, x }) => {
      const isT = cy === TODAY[0] && cm === TODAY[1] && d === TODAY[2];
      const son = M.sonOf(x.lunar.d) === '없음';
      const strong = Math.abs(v) >= 45;
      return `<button data-pick="ilun:${d}" class="${isT ? 'today' : ''}${sel.kind === 'ilun' && sel.d === d ? ' sel' : ''}" style="background:${tint(v)}" data-tip="${cy}.${pad(cm)}.${pad(d)} ${M.gzName(x)} · 음 ${x.lunar.m}.${x.lunar.d}${son ? ' · 손 없는 날' : ''} · ${x.score ? x.score.band + ' ' + signed(v) : ''}">
        <span class="ctop"><span class="dn">${d}</span>${son ? '<span class="son" title="손 없는 날">손</span>' : ''}</span>
        <span class="dg">${M.gzName(x)}</span>
        <span class="sc${strong ? ' strong' : ''}">${signed(v)}</span>
        <span class="ld">${x.lunar.d === 1 ? x.lunar.m + '월' : x.lunar.d}</span></button>`;
    }).join('');
    return `<section class="card">
      <div class="card-h"><h2>${cy}년 ${cm}월 ${term('일운', '일진')} 달력</h2><span class="seg"><button data-act="ym:-1" aria-label="이전 달">‹</button><button data-act="ym:0">이번 달</button><button data-act="ym:1" aria-label="다음 달">›</button></span></div>
      <div class="legend"><span><i class="sw" style="background:var(--good)"></i>길한 날</span><span><i class="sw" style="background:var(--bad)"></i>흉한 날</span><span><span class="son">손</span> ${term('손 없는 날')}</span><span>칸 아래 숫자 = 음력 일</span></div>
      <div class="cal">${['일', '월', '화', '수', '목', '금', '토'].map(d => `<span class="dow">${d}</span>`).join('')}${'<span></span>'.repeat(firstDow)}${cells}</div>
      <div class="list">
        <div class="li"><span class="k">이달 길일</span><span class="v">${best.length ? best.map(dayBtn).join('') : '<span class="muted small">+12 이상인 날이 없습니다</span>'}</span><span></span></div>
        <div class="li"><span class="k">이달 주의일</span><span class="v">${worst.length ? worst.map(dayBtn).join('') : '<span class="muted small">−12 이하인 날이 없습니다</span>'}</span><span></span></div>
      </div>
      ${ilDetail || '<p class="note">날짜를 누르면 그날의 점수 근거와 12시진(시간대별 간지·길흉)이 열립니다. 일진 점수는 이 사주의 용신 기준으로 그날 간지만 평가한 값이며, 대운·세운의 큰 흐름은 위 그래프에서 봅니다.</p>'}
    </section>`;
  }
  function yearSummary(curY) {
    const ch = S.ch;
    const ys = M.seunRange(ch, curY, curY + 9);
    const best = [...ys].sort((a, b) => b.combined - a.combined).filter(q => q.combined >= 12).slice(0, 3);
    const worst = [...ys].sort((a, b) => a.combined - b.combined).filter(q => q.combined <= -12).slice(0, 3);
    const btn = q => `<button type="button" class="chip ${q.combined >= 0 ? 'good' : 'bad'}" data-pick="seun:${q.year}" style="border:0;cursor:pointer">${q.year} ${M.gzName(q)} ${signed(q.combined)}</button>`;
    const strip = `<div class="yrs">${ys.map(q => `<button type="button" data-pick="seun:${q.year}" class="yr${S.sel && S.sel.kind === 'seun' && S.sel.Y === q.year ? ' sel' : ''}" data-tip="${q.year}년 ${M.gzName(q)} · 만 ${q.age}세 · 종합 ${signed(q.combined)}"><span class="yy num">${q.year}</span><span class="yg">${M.gzName(q)}</span>${pill(M.bandOf(q.combined))}<span class="ys num">${signed(q.combined)}</span></button>`).join('')}</div>`;
    return `<div><h3 style="margin-bottom:8px">앞으로 10년</h3>${strip}</div>
      <div class="list">
        <div class="li"><span class="k">길한 해</span><span class="v">${best.length ? best.map(btn).join('') : '<span class="muted small">+12 이상인 해가 없습니다</span>'}</span><span></span></div>
        <div class="li"><span class="k">주의할 해</span><span class="v">${worst.length ? worst.map(btn).join('') : '<span class="muted small">−12 이하인 해가 없습니다</span>'}</span><span></span></div>
      </div>`;
  }
  function renderLuck() {
    const ch = S.ch;
    const du = M.daeunAt(ch, NOW);
    const curY = M.yearPillarAt(NOW).sajuYear;
    const se = M.seunRange(ch, curY, curY)[0];
    const wm = M.wolun(ch, curY); let curM = wm[0]; wm.forEach(m => { if (m.startMs <= NOW) curM = m; });
    const il = M.ilun(ch, TODAY[0], TODAY[1])[TODAY[2] - 1];
    const nowCard = (k, lbl, x, sub) => `<div class="nowc" role="button" tabindex="0" data-pick="now:${k}"><span class="lbl">${lbl}</span><span class="gzb">${x ? M.gzName(x) : '—'}</span><span class="tgs">${x ? `${x.stemTG} · ${x.branchTG}` : '대운 전'}</span><span>${x && x.score ? pill(x.score.band) : ''} <span class="muted small">${sub}</span></span></div>`;
    const sel = S.sel || {};
    let nowDetail = '';
    if (sel.kind === 'now') {
      const map = { daeun: [du, `현재 대운 ${du ? M.gzName(du) : ''}`], seun: [se, `${curY}년 세운 ${M.gzName(se)}`], wolun: [curM, `이번 달 월운 ${M.gzName(curM)} (${curM.termName}부터)`], ilun: [il, `오늘 일운 ${M.gzName(il)}`] };
      const [x, t] = map[sel.k]; nowDetail = detailHTML(t, x);
    }
    const Y = S.selYear;
    const [cy, cm] = S.selYM;
    const cal = M.ilun(ch, cy, cm);
    const firstDow = new Date(Date.UTC(cy, cm - 1, 1)).getUTCDay();
    let daeunDetail = '', seunDetail = '', wolDetail = '', ilDetail = '';
    if (sel.kind === 'daeun') { const x = ch.daeun.list[sel.i]; daeunDetail = detailHTML(`${x.startAge}세 대운 ${M.gzName(x)} (${x.startYear}~${x.startYear + 9})`, x, `<p class="note">정확한 시작: ${fmtKST(x.startMs)}</p>`); }
    if (sel.kind === 'seun') { const x = M.seunRange(ch, sel.Y, sel.Y)[0]; if (x) seunDetail = detailHTML(`${sel.Y}년 세운 ${M.gzName(x)}`, x, x.daeun ? `<p class="small">대운 ${M.gzName(x.daeun)} ${signed(x.daeun.score.total)} × 40% + 세운 ${signed(x.score.total)} × 60% = 종합 <b class="num">${signed(x.combined)}</b></p>` : ''); }
    if (sel.kind === 'wolun') { const x = M.wolun(ch, Y)[sel.i]; wolDetail = detailHTML(`${Y}년 ${x.termName}부터 월운 ${M.gzName(x)}`, x, `<p class="note">시작: ${fmtKST(x.startMs)} · 대운과의 종합 ${signed(x.combined)}</p>`); }
    if (sel.kind === 'ilun') { const x = cal[sel.d - 1]; if (x) ilDetail = detailHTML(`${cy}.${pad(cm)}.${pad(sel.d)} 일진 ${M.gzName(x)}`, x, `<p class="small">음력 ${x.lunar.m}${x.lunar.leap ? '(윤)' : ''}월 ${x.lunar.d}일 · ${term('손 없는 날', '손')} ${M.sonOf(x.lunar.d) === '없음' ? '<b>없음 (손 없는 날)</b>' : M.sonOf(x.lunar.d) + '쪽'}</p>` + sijinTable(x, [cy, cm, sel.d])); }
    const tint = v => { const a = Math.min(100, Math.abs(v)) * 0.6; return v >= 0 ? `color-mix(in srgb, var(--good) ${a}%, var(--surface-2))` : `color-mix(in srgb, var(--bad) ${a}%, var(--surface-2))`; };
    return `
    ${ch.yongFallback ? `<div class="warn"><b>용신 기준</b><span>${M.SCHOOLS[ch.school]}이 이 사주에 해당하지 않아 억부 기준으로 점수를 냅니다.</span></div>` : ''}
    <section class="card">
      <div class="card-h"><h2>지금의 운</h2><span class="note">${TODAY.join('.')} 기준 · 용신 ${M.SCHOOLS[ch.yong.school].split(' ')[0]}</span></div>
      <div class="now">
        ${nowCard('daeun', term('대운'), du, du ? `${du.startAge}세~` : '')}
        ${nowCard('seun', term('세운'), se, `${curY}`)}
        ${nowCard('wolun', term('월운'), curM, curM.termName + '~')}
        ${nowCard('ilun', term('일운'), il, '오늘')}
      </div>${nowDetail}
    </section>
    <section class="card">
      <div class="card-h"><h2>${term('대운')} 흐름</h2><span class="note">${ch.daeun.forward ? term('순행') : term('역행')} · ${term('대운수')} ${ch.daeun.num} (정확히 ${ch.daeun.exact.toFixed(2)}년)</span></div>
      <div class="chart" data-chart="daeun"></div>
      ${daeunDetail || '<p class="note">막대를 누르면 점수 근거가 열립니다.</p>'}
    </section>
    <section class="card">
      <div class="card-h"><h2>연도별 길흉 · ${term('세운')}</h2><div class="legend"><span><i class="sw" style="background:var(--good)"></i>길한 해</span><span><i class="sw" style="background:var(--mid)"></i>평</span><span><i class="sw" style="background:var(--bad)"></i>흉한 해</span><span>배경 띠 = 대운</span></div></div>
      <div class="chart" data-chart="life"></div>
      ${yearSummary(curY)}
      ${seunDetail || '<p class="note">막대 하나가 한 해이며, 높이는 대운 40% + 세운 60% 종합 점수입니다. 해를 누르면 근거가 열리고 아래 월운이 그해로 바뀝니다.</p>'}
    </section>
    <section class="card">
      <div class="card-h"><h2>${Y}년 ${term('월운')}</h2><span class="seg"><button data-act="year:-1" aria-label="이전 해">‹</button><button data-act="year:0">올해</button><button data-act="year:1" aria-label="다음 해">›</button></span></div>
      <div class="chart" data-chart="wolun"></div>
      ${wolDetail || `<p class="note">입춘(${Y}.2.4 무렵)부터 다음 해 소한까지의 12개월입니다. 막대를 누르면 그 달의 ${term('일운')} 달력으로 이동합니다.</p>`}
    </section>
    ${renderCalendar(cy, cm, cal, firstDow, sel, ilDetail)}
    <p class="note">길흉 점수는 선택한 용신 기준으로 운의 오행·합충·귀인을 합산한 해석 모델입니다. 계산 방식은 ${term('길흉 점수', '길흉 점수 설명')}에 있습니다. 통계적으로 검증된 예측값이 아닙니다.</p>`;
  }

  // ───────────── 용어 ─────────────
  function glList() {
    const q = S.glq.trim();
    const cats = {};
    for (const [k, [c, t]] of Object.entries(GL)) { if (q && !k.includes(q) && !t.includes(q)) continue; (cats[c] ||= []).push([k, t]); }
    const keys = Object.keys(cats);
    if (!keys.length) return '<p class="muted small">찾는 용어가 없습니다.</p>';
    return keys.map(c => `<div class="gl-cat"><h3>${c}</h3>${cats[c].map(([k, t]) => `<div class="gl-item"><b>${esc(k)}</b><p>${esc(t)}</p></div>`).join('')}</div>`).join('');
  }
  function renderGl() {
    return `<section class="card"><div class="card-h"><h2>용어 사전</h2><span class="note num">${Object.keys(GL).length}개 항목</span></div>
      <input class="gl-search" id="gl-q" type="search" placeholder="용어나 설명으로 찾기 (예: 공망, 합)" value="${esc(S.glq)}">
      <div id="gl-list">${glList()}</div></section>`;
  }

  // ───────────── 차트 ─────────────
  const NS = 'http://www.w3.org/2000/svg';
  function svgEl(W, H) { return `<svg xmlns="${NS}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`; }
  function drawDiv(el, items, opt = {}) {
    const n = items.length; const cw = el.clientWidth || 320;
    const W = Math.max(cw, n * 40), H = 236, L = 34, R = 6, T = 12, B = 54;
    const step = (W - L - R) / n, bw = Math.min(30, step * 0.58);
    const y = v => T + (100 - v) / 200 * (H - T - B);
    let s = svgEl(W, H);
    for (const g of [100, 50, 0, -50, -100]) {
      s += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" style="stroke:${g === 0 ? 'var(--ink-3)' : 'var(--line)'};stroke-width:1" ${g && g % 100 ? 'stroke-dasharray="3 3"' : ''}/>`;
      s += `<text x="${L - 6}" y="${y(g) + 3.5}" text-anchor="end" style="fill:var(--ink-3);font-size:10px">${g > 0 ? '+' + g : g < 0 ? '−' + (-g) : '0'}</text>`;
    }
    items.forEach((it, i) => {
      const cx = L + step * (i + 0.5), v = it.v ?? 0, y0 = y(0), y1 = y(v);
      const top = Math.min(y0, y1), h = Math.max(Math.abs(y1 - y0), 2);
      const col = Math.abs(v) < 1 ? 'var(--mid)' : v > 0 ? 'var(--good)' : 'var(--bad)';
      const r = Math.min(4, h / 2), x0 = cx - bw / 2;
      const d = v >= 0 ? `M${x0},${y0} V${top + r} Q${x0},${top} ${x0 + r},${top} H${x0 + bw - r} Q${x0 + bw},${top} ${x0 + bw},${top + r} V${y0} Z`
        : `M${x0},${y0} V${top + h - r} Q${x0},${top + h} ${x0 + r},${top + h} H${x0 + bw - r} Q${x0 + bw},${top + h} ${x0 + bw},${top + h - r} V${y0} Z`;
      s += `<path d="${d}" style="fill:${col};${it.sel ? 'stroke:var(--ink);stroke-width:2' : ''}"/>`;
      if (it.cur) s += `<circle cx="${cx}" cy="${T + 2}" r="3" style="fill:var(--seal)"/>`;
      s += `<text x="${cx}" y="${H - B + 18}" text-anchor="middle" style="fill:var(--ink);font-size:14px;font-weight:${it.sel ? 900 : 700};font-family:var(--f-display)">${it.label}</text>`;
      s += `<text x="${cx}" y="${H - B + 33}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${it.sub}</text>`;
      if (it.sub2) s += `<text x="${cx}" y="${H - B + 45}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${it.sub2}</text>`;
      if (it.sel) s += `<text x="${cx}" y="${v >= 0 ? top - 5 : top + h + 12}" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:700">${signed(v)}</text>`;
      s += `<rect class="hit" x="${cx - step / 2}" y="0" width="${step}" height="${H}" style="fill:transparent" data-pick="${it.pick}" data-tip="${esc(it.tip)}"/>`;
    });
    el.innerHTML = s + '</svg>';
  }
  function drawLife(el) {
    const ch = S.ch; const y0 = ch.solar.y, y1 = Math.min(y0 + 90, M.MAX_Y - 1);
    const data = M.seunRange(ch, y0, y1);
    const cw = el.clientWidth || 320, W = Math.max(cw, 320), H = 250, L = 34, R = 18, T = 26, B = 26;
    const x = Y => L + (Y - y0) / (y1 - y0) * (W - L - R);
    const y = v => T + (100 - v) / 200 * (H - T - B);
    let s = svgEl(W, H);
    ch.daeun.list.forEach((d, i) => {
      const a = Math.max(y0, d.startYear), b = Math.min(y1, d.startYear + 10);
      if (b <= a) return;
      if (i % 2 === 0) s += `<rect x="${x(a)}" y="${T}" width="${x(b) - x(a)}" height="${H - T - B}" style="fill:var(--surface-2)"/>`;
      if (x(b) - x(a) > 28) s += `<text x="${(x(a) + x(b)) / 2}" y="${T - 9}" text-anchor="middle" style="fill:var(--ink-2);font-size:12px;font-weight:700;font-family:var(--f-display)">${M.gzName(d)}</text>`;
    });
    for (const g of [50, 0, -50]) s += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" style="stroke:${g === 0 ? 'var(--ink-3)' : 'var(--line)'}" ${g ? 'stroke-dasharray="3 3"' : ''}/><text x="${L - 6}" y="${y(g) + 3.5}" text-anchor="end" style="fill:var(--ink-3);font-size:10px">${g > 0 ? '+' + g : g < 0 ? '−' + (-g) : '0'}</text>`;
    for (let Y = Math.ceil(y0 / 10) * 10; Y <= y1; Y += 10) s += `<text x="${x(Y)}" y="${H - 8}" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">${Y}</text>`;
    const bw = Math.max(1.5, (W - L - R) / (y1 - y0 + 1) - 1.2);
    data.forEach(d => { const v = d.combined, yy = y(v), z = y(0); const h = Math.max(1.5, Math.abs(yy - z)); const col = Math.abs(v) < 12 ? 'var(--mid)' : v > 0 ? 'var(--good)' : 'var(--bad)'; s += `<rect x="${(x(d.year) - bw / 2).toFixed(1)}" y="${Math.min(yy, z).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(2, bw / 2)}" style="fill:${col}"/>`; });
    const curY = M.yearPillarAt(NOW).sajuYear;
    if (curY >= y0 && curY <= y1) s += `<line x1="${x(curY)}" x2="${x(curY)}" y1="${T}" y2="${H - B}" style="stroke:var(--seal);stroke-width:1.5" stroke-dasharray="4 3"/><text x="${x(curY) + 4}" y="${T + 11}" style="fill:var(--seal);font-size:10px;font-weight:700">올해</text>`;
    const sel = S.sel && S.sel.kind === 'seun' ? S.sel.Y : null;
    if (sel && sel >= y0 && sel <= y1) { const d = data.find(q => q.year === sel); if (d) s += `<circle cx="${x(sel)}" cy="${y(d.combined)}" r="4.5" style="fill:var(--ink);stroke:var(--surface);stroke-width:2"/>`; }
    s += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" style="stroke:var(--ink);stroke-width:1;opacity:0"/><circle class="xd" r="4" style="fill:var(--ink);opacity:0"/>`;
    s += `<rect class="hit ov" x="${L}" y="0" width="${W - L - R}" height="${H}" style="fill:transparent"/>`;
    el.innerHTML = s + '</svg>';
    const svg = el.querySelector('svg'), ov = el.querySelector('.ov'), xh = el.querySelector('.xh'), xd = el.querySelector('.xd');
    const nearest = ev => { const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * (W / r.width); const Y = Math.round(y0 + (px - L) / (W - L - R) * (y1 - y0)); return data.find(d => d.year === Math.max(y0, Math.min(y1, Y))); };
    ov.addEventListener('mousemove', ev => {
      const d = nearest(ev); if (!d) return;
      xh.setAttribute('x1', x(d.year)); xh.setAttribute('x2', x(d.year)); xh.style.opacity = .35;
      xd.setAttribute('cx', x(d.year)); xd.setAttribute('cy', y(d.combined)); xd.style.opacity = 1;
      showTip(ev, `${d.year}년 (만 ${d.age}세) ${M.gzName(d)} 세운 ${signed(d.score.total)}<br>대운 ${d.daeun ? M.gzName(d.daeun) + ' ' + signed(d.daeun.score.total) : '시작 전'}<br>종합 <b>${signed(d.combined)}</b> · ${M.bandOf(d.combined)}`);
    });
    ov.addEventListener('mouseleave', () => { xh.style.opacity = 0; xd.style.opacity = 0; hideTip(); });
    ov.addEventListener('click', ev => { const d = nearest(ev); if (d) pick('seun:' + d.year); });
  }
  function drawCharts() {
    const ch = S.ch; if (!ch) return;
    const curMs = NOW;
    document.querySelectorAll('[data-chart]').forEach(el => {
      const k = el.dataset.chart;
      if (k === 'daeun') {
        const cur = M.daeunAt(ch, curMs);
        drawDiv(el, ch.daeun.list.map((d, i) => ({ v: d.score.total, label: M.gzName(d), sub: `${d.startAge}세`, sub2: d.startYear, pick: 'daeun:' + i, sel: S.sel && S.sel.kind === 'daeun' && S.sel.i === i, cur: cur === d, tip: `${d.startAge}세 대운 ${M.gzName(d)} · ${d.stemTG}/${d.branchTG} · ${d.score.band} ${signed(d.score.total)}` })));
      } else if (k === 'wolun') {
        const ms = M.wolun(ch, S.selYear);
        drawDiv(el, ms.map((m, i) => { const nx = ms[i + 1] ? ms[i + 1].startMs : Infinity; return { v: m.combined, label: M.gzName(m), sub: m.termName, pick: 'wolun:' + i, sel: S.sel && S.sel.kind === 'wolun' && S.sel.i === i, cur: curMs >= m.startMs && curMs < nx, tip: `${m.termName}~ ${M.gzName(m)} · ${m.stemTG}/${m.branchTG} · 월운 ${signed(m.score.total)} · 대운 합산 ${signed(m.combined)}` }; }));
      } else if (k === 'life') drawLife(el);
    });
  }

  // ───────────── 툴팁 ─────────────
  let tipEl = null;
  function showTip(ev, html) {
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); }
    tipEl.innerHTML = html; tipEl.hidden = false;
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let x = ev.clientX + 12, y = ev.clientY - h - 10;
    if (x + w > window.innerWidth - 8) x = ev.clientX - w - 12;
    if (y < 8) y = ev.clientY + 16;
    tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
  }
  function hideTip() { if (tipEl) tipEl.hidden = true; }
  document.addEventListener('mousemove', ev => {
    const t = ev.target.closest && ev.target.closest('[data-tip]');
    if (t) showTip(ev, esc(t.getAttribute('data-tip'))); else if (!ev.target.closest || !ev.target.closest('.ov')) hideTip();
  });

  // ───────────── 렌더 ─────────────
  const root = document.getElementById('app');
  function render() {
    let body = '';
    if (!S.ch) body = `<section class="card"><p class="err">${esc(S.err || '입력값을 확인하세요')}</p></section>`;
    else if (S.tab === 'wonguk') body = renderWonguk();
    else if (S.tab === 'rel') body = renderRel();
    else if (S.tab === 'ohaeng') body = renderOhaeng();
    else if (S.tab === 'yong') body = renderYong();
    else if (S.tab === 'luck') body = renderLuck();
    else body = renderGl();
    root.innerHTML = renderTop() + `<main class="wrap" style="padding-top:16px">${renderForm()}${body}</main>`;
    drawCharts();
    renderSheet();
  }
  function renderSheet() {
    let sh = document.getElementById('sheet');
    if (!S.sheet) { if (sh) sh.remove(); return; }
    if (!sh) { sh = document.createElement('div'); sh.id = 'sheet'; document.body.appendChild(sh); }
    const [c, t] = GL[S.sheet];
    sh.innerHTML = `<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(S.sheet)}"><span class="cat">${esc(c)}</span><h3>${esc(S.sheet)}</h3><p>${esc(t)}</p><button class="btn x" data-act="close">닫기</button></div></div>`;
    sh.querySelector('.x').focus();
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(S.inp)); } catch (e) { } }
  function pick(p) {
    const [k, v] = p.split(':');
    if (k === 'now') S.sel = { kind: 'now', k: v };
    else if (k === 'daeun') S.sel = { kind: 'daeun', i: +v };
    else if (k === 'seun') { S.sel = { kind: 'seun', Y: +v }; S.selYear = +v; }
    else if (k === 'wolun') { const m = M.wolun(S.ch, S.selYear)[+v]; const d = kstYMD(m.startMs); S.selYM = [d[0], d[1]]; S.sel = { kind: 'wolun', i: +v }; }
    else if (k === 'ilun') S.sel = { kind: 'ilun', d: +v };
    render();
  }
  document.addEventListener('click', ev => {
    const t = ev.target;
    const tm = t.closest('.term');
    if (tm) { ev.preventDefault(); S.sheet = tm.dataset.term; renderSheet(); return; }
    const act = t.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'close') { if (t === act || t.classList.contains('x')) { S.sheet = null; renderSheet(); } return; }
      if (a === 'edit') { if (S.editing) readForm(); S.editing = !S.editing; render(); return; }
      if (a.startsWith('year:')) { const d = +a.slice(5); S.selYear = d === 0 ? M.yearPillarAt(NOW).sajuYear : Math.max(M.MIN_Y, Math.min(M.MAX_Y - 2, S.selYear + d)); if (S.sel && S.sel.kind === 'wolun') S.sel = null; render(); return; }
      if (a.startsWith('ym:')) { const d = +a.slice(3); if (d === 0) S.selYM = [TODAY[0], TODAY[1]]; else { let [y, m] = S.selYM; m += d; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.selYM = [y, m]; } if (S.sel && S.sel.kind === 'ilun') S.sel = null; render(); return; }
    }
    const tb = t.closest('[data-tab]');
    if (tb) { if (S.editing) readForm(); S.tab = tb.dataset.tab; try { localStorage.setItem(STORE + '-tab', S.tab); } catch (e) { } render(); return; }
    const st = t.closest('[data-set]');
    if (st) {
      const [k, v] = st.dataset.set.split(':');
      if (S.editing) readForm();
      if (k === 'model' || k === 'school') { S.inp[k] = v; run(); save(); render(); return; }
      S.inp[k] = v; if (k === 'calendar') S.inp.leap = false; render(); return;
    }
    const pk = t.closest('[data-pick]');
    if (pk) { pick(pk.dataset.pick); }
  });
  document.addEventListener('change', ev => {
    const id = ev.target.id;
    if (id === 'f-hu' || id === 'f-city' || id === 'f-y') { readForm(); render(); }
  });
  document.addEventListener('submit', ev => {
    ev.preventDefault(); readForm();
    try { validate(); } catch (e) { S.err = e.message; render(); return; }
    run();
    if (!S.err) { S.isExample = false; S.editing = false; S.sel = null; save(); }
    render();
  });
  document.addEventListener('input', ev => { if (ev.target.id === 'gl-q') { S.glq = ev.target.value; document.getElementById('gl-list').innerHTML = glList(); } });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.sheet) { S.sheet = null; renderSheet(); } if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.nowc')) { ev.preventDefault(); pick(ev.target.dataset.pick); } });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });

  run(); render();
})();

</script>
</body>
</html>
